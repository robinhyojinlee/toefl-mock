 assigned station. Your partner's name is taped to the drawer.", "questions": [{"stem": "What is the main purpose of the announcement?", "options": ["To review the results of an earlier experiment", "To explain safety and work rules before the lab begins", "To assign topics for a final research project", "To describe how lab reports will be graded"], "answer": 1, "explain_ko": "화자는 장비를 만지기 전에 지켜야 할 세 가지 규칙을 설명한다. 실험 결과나 보고서 채점은 다루지 않는다."}, {"stem": "What should students do if they spill a substance?", "options": ["Wipe it up with paper from the shelf", "Move to a different station immediately", "Write the incident in their notebook", "Report it to the instructor"], "answer": 3, "explain_ko": "화자는 무엇이든 흘리면 직접 치우지 말고 자신에게 알리라고 지시한다. 처리 방법은 강사가 결정한다고 말한다."}]}, {"id": "an2", "speaker": "W", "context": "Announcement to visitors before a guided museum tour", "text": "Hello everyone, and thank you for joining the two o'clock tour of the textile gallery. A few notes before we start. Photography is allowed, but please switch off your flash, since the dyes in these fabrics fade under bright light. The tour runs about fifty minutes and covers three rooms. Bags larger than a notebook have to go in the lockers by the entrance, and the lockers are free today. Finally, the last room is being rearranged, so if you hear drilling, now you know why. Please stay together, and stop me any time you have a question.", "questions": [{"stem": "Why does the speaker ask visitors to turn off their flash?", "options": ["Bright light damages the colors in the fabrics.", "The flash disturbs other tour groups nearby.", "Photographs of the textiles are sold in the shop.", "The gallery lighting is already too strong."], "answer": 0, "explain_ko": "화자는 강한 빛에 직물의 염료가 바래기 때문이라고 이유를 밝힌다. 다른 관람객이나 상점 판매는 언급되지 않는다."}, {"stem": "What does the speaker say about large bags?", "options": ["They may be carried through the first room only.", "They must be left in lockers, which cost nothing today.", "They should be checked at the end of the tour.", "They are allowed if they are smaller than a notebook."], "answer": 1, "explain_ko": "노트보다 큰 가방은 입구 사물함에 넣어야 하며 오늘은 사물함이 무료라고 안내한다. 노트보다 작은 가방만 허용된다는 조건은 반대로 설명된 것이다."}]}, {"id": "an3", "speaker": "M", "context": "Announcement about a temporary closure in the university library", "text": "Attention, students. This is a reminder that the third floor reading room closes for renovation this Friday at six. It should reopen in late March with new wiring and, finally, more power outlets. Until then, the quiet study seats move down to the basement, room B twelve. Group study rooms are not affected. If you have books checked out to a carrel on the third floor, please empty that carrel before Friday, because anything left behind will be sent to the lost and found desk. Construction noise will be limited to weekday mornings.", "questions": [{"stem": "What is the announcement mainly about?", "options": ["A new policy for borrowing library books", "The closing of a study area and where to study instead", "An increase in the number of group study rooms", "A change in the library's daily opening hours"], "answer": 1, "explain_ko": "공지는 삼층 열람실이 공사로 닫히고 조용한 좌석이 지하 비십이호실로 이동한다는 내용이다. 대출 규정이나 개관 시간 변경은 언급되지 않는다."}, {"stem": "What will happen to items left in a third floor carrel after Friday?", "options": ["They will be moved to the basement study area.", "They will be returned to the students by mail.", "They will be taken to the lost and found desk.", "They will be shelved with the rest of the collection."], "answer": 2, "explain_ko": "금요일 전에 캐럴을 비우지 않으면 남은 물건은 분실물 보관소로 옮겨진다고 안내한다. 지하로 옮겨지는 것은 조용한 좌석이다."}]}, {"id": "ang0_1", "speaker": "F", "context": "Announcement about a change to a psychology experiment participation requirement", "text": "Before we go on, a quick update about the research participation requirement. As you know, intro psychology students have to complete four hours of experiment credit by the end of the term. Starting this semester, the department is letting you substitute written article summaries for up to two of those hours. One summary of a peer reviewed study equals one hour of credit. I'd still encourage you to sign up for at least one live study, because reading about a procedure and sitting through one are genuinely different experiences. The sign up portal opens Thursday at noon, and popular time slots fill within a day. Don't wait until finals week.", "questions": [{"stem": "What is the speaker mainly announcing?", "options": ["A new option for meeting the research credit requirement", "A decision to cancel all live experiments this term", "An increase in the total number of required credit hours", "A change in the deadline for submitting article summaries"], "answer": 0, "explain_ko": "화자는 실험 참여 시간 중 최대 두 시간을 논문 요약으로 대체할 수 있게 됐다고 알려. 전체 요구 시간이 바뀐 건 아니야.", "tips_ko": "Starting this semester 같은 표현 뒤에 핵심 변경 사항이 나오니까 거기서 집중해.", "explanation_en": "The speaker says the department now allows written article summaries to replace up to two of the four required hours. The total requirement stays at four hours, and live studies continue."}, {"stem": "Why does the speaker recommend joining at least one live study?", "options": ["Because written summaries will not be accepted after finals week", "Because summaries earn less credit than live sessions", "Because the portal gives priority to early sign ups", "Because experiencing a procedure differs from reading about one"], "answer": 3, "explain_ko": "절차를 읽는 것과 실제로 참여하는 건 완전히 다른 경험이라서 권한다고 말해. 학점 차이 얘기는 안 나와.", "tips_ko": "because 뒤에 이유가 바로 붙는 문장은 질문으로 나올 확률이 높아.", "explanation_en": "The speaker explains that reading about a procedure and sitting through one are genuinely different experiences. Credit value is equal, one summary for one hour."}]}, {"id": "ang0_2", "speaker": "M", "context": "Announcement to students about a flu vaccination clinic at the campus health center", "text": "Attention, everyone. The health center is running its annual flu clinic next week, Monday through Friday, in the main lobby rather than upstairs in the exam rooms. That's the change from last year, so don't go to the third floor. Bring your student ID and your insurance card if you have one. If you don't, the shot is still free, we just need you to fill out a short form at the desk. The whole thing takes about ten minutes, including the fifteen minute wait afterward, which is standard. One more thing. If you're currently running a fever, please come back another week.", "questions": [{"stem": "What change does the speaker emphasize?", "options": ["The clinic will be held in the lobby instead of upstairs", "The clinic will run for two weeks this year", "The clinic will require appointments in advance", "The clinic will charge a fee for uninsured students"], "answer": 0, "explain_ko": "작년과 달리 3층 진료실이 아니라 1층 로비에서 한다고 강조해. 보험 없어도 무료야.", "tips_ko": "That's the change from last year 처럼 변경을 콕 집어주는 문장은 바로 정답 단서야.", "explanation_en": "The speaker states the clinic moves to the main lobby rather than the upstairs exam rooms and warns students not to go to the third floor."}, {"stem": "What does the speaker tell students who do not have insurance?", "options": ["They must pay a reduced fee at the desk", "They should visit an off campus provider", "They can only come on Friday", "They need to complete a short form"], "answer": 3, "explain_ko": "보험이 없으면 접수 데스크에서 짧은 양식만 작성하면 된다고 해. 비용은 여전히 무료야.", "tips_ko": "If you don't 로 시작하는 조건문은 예외 상황을 설명하니까 끝까지 들어.", "explanation_en": "Uninsured students still get the shot free but must fill out a short form at the desk."}]}, {"id": "ang0_3", "speaker": "F", "context": "Announcement about a guest lecture on behavioral economics replacing a regular class", "text": "A scheduling note for next Tuesday. Instead of our usual lecture, we're all going to the auditorium to hear Professor Okafor, who studies how people make decisions under financial pressure. Her work on why households save less when income becomes unpredictable is directly relevant to the chapter we just finished. This counts as a regular class meeting, so attendance is expected, and yes, there will be a question from the talk on the midterm. Doors open at one forty, and seating is first come. Afterward, she's agreed to stay for twenty minutes of questions, so bring something to ask. Vague praise is not a question.", "questions": [{"stem": "What is the main purpose of the announcement?", "options": ["To ask for volunteers to introduce a visiting researcher", "To explain why a chapter reading has been postponed", "To inform students that a guest lecture will replace a class", "To describe the topics covered on the upcoming midterm"], "answer": 2, "explain_ko": "다음 화요일 평소 강의 대신 초청 강연에 간다고 알리는 공지야. 중간고사 범위 설명이 목적은 아니야.", "tips_ko": "Instead of our usual 같은 말이 나오면 일정 변경 공지라고 바로 잡아내.", "explanation_en": "The speaker announces that the regular lecture is replaced by Professor Okafor's talk in the auditorium, and it counts as a class meeting."}, {"stem": "What does the speaker ask students to prepare?", "options": ["A written summary of the guest speaker's research", "A short response to the chapter they just finished", "A seat reservation through the department office", "A question to ask during the session after the talk"], "answer": 3, "explain_ko": "강연 뒤 20분 질의응답이 있으니 질문을 준비해 오라고 해. 막연한 칭찬은 질문이 아니라고 덧붙여.", "tips_ko": "bring something to 로 시작하는 요청은 과제처럼 출제되니까 메모해.", "explanation_en": "The speaker says the guest will stay for twenty minutes of questions and asks students to bring something to ask."}]}, {"id": "ang0_4", "speaker": "M", "context": "Announcement about new procedures for a greenhouse used in a plant biology course", "text": "Quick word about the greenhouse before you head over. We've had three trays of seedlings die in the last month, and the cause wasn't disease, it was inconsistent watering by people who weren't assigned to those trays. So from today, only the student whose name is on the tag waters that tray. If you walk past something that looks dry and it isn't yours, write it on the clipboard by the door instead of reaching for the hose. Also, the door latch sticks. Push it until you hear it click, because a greenhouse door left open overnight in October will cost us the whole back bench.", "questions": [{"stem": "Why is the speaker introducing a new rule?", "options": ["Because seedlings died from inconsistent watering", "Because a plant disease spread through several trays", "Because the greenhouse is running short on equipment", "Because students have been arriving late to the greenhouse"], "answer": 0, "explain_ko": "병이 아니라 담당이 아닌 사람들이 물을 들쭉날쭉 줘서 모가 죽었다고 설명해. 그래서 담당자만 물을 주게 바꿨어.", "tips_ko": "the cause wasn't A, it was B 구조는 오답 함정을 만드니까 B를 놓치지 마.", "explanation_en": "The speaker explicitly rules out disease and identifies inconsistent watering by unassigned students as the cause."}, {"stem": "What should students do if they notice a dry tray that is not theirs?", "options": ["Note it on the clipboard near the door", "Replace the name tag on the tray", "Move the tray to the back bench", "Water it lightly and tell the instructor later"], "answer": 0, "explain_ko": "자기 트레이가 아니면 호스를 잡지 말고 문 옆 클립보드에 적어두라고 해.", "tips_ko": "instead of 뒤에 하지 말아야 할 행동이 나오고 앞에 해야 할 행동이 나올 때가 많아.", "explanation_en": "The speaker instructs students to write it on the clipboard by the door rather than watering a tray assigned to someone else."}]}, {"id": "ang0_5", "speaker": "F", "context": "Announcement about revised group project requirements in a sociology course", "text": "I want to address something before you form groups. Last term, several teams ran into the same problem. One person did most of the work and everyone received the same grade. So this year, each group submits a one page work log along with the final paper, listing who handled which section. I'm not asking you to grade each other. I'm asking you to document. If the log and the paper tell different stories, I'll follow up individually. Groups are three or four people, no fives, and you choose your own members by Friday. After Friday, I assign whoever is left, and I assign without sympathy.", "questions": [{"stem": "What new requirement is the speaker introducing?", "options": ["Each student must write an individual final paper", "Each group must submit a record of members' contributions", "Each group must present its findings to the class", "Each student must grade the other members of the group"], "answer": 1, "explain_ko": "최종 보고서와 함께 누가 어느 부분을 했는지 적은 한 장짜리 작업 기록을 내야 해. 서로 점수를 주는 건 아니야.", "tips_ko": "I'm not asking X, I'm asking Y 패턴은 오답 선택지가 X로 나와서 헷갈리게 해.", "explanation_en": "The speaker requires a one page work log listing who handled which section, and clarifies that students are documenting, not grading each other."}, {"stem": "What will happen to students who have not joined a group by Friday?", "options": ["They will lose points on the final paper", "They will need to meet with the instructor individually", "They will work alone on a shorter paper", "They will be placed in groups by the instructor"], "answer": 3, "explain_ko": "금요일까지 조를 못 정하면 남은 사람들을 교수가 배정한다고 말해. 점수 감점 얘기는 없어.", "tips_ko": "After 날짜 뒤에 나오는 결과는 거의 항상 문제로 나온다고 생각해.", "explanation_en": "The speaker says that after Friday she assigns whoever is left to groups, with no mention of penalties or solo work."}]}, {"id": "ang0_6", "speaker": "M", "context": "Announcement about a paid research assistant position in a neuroscience lab", "text": "One opportunity before you pack up. Our lab has funding for two undergraduate research assistants starting in January. The work is sleep and memory, which means some sessions run at six in the morning and some run at eleven at night, and I want to be honest about that upfront. You do not need prior lab experience. What you need is reliability, because a participant who shows up to an empty room doesn't come back. Ten hours a week, paid hourly. Send me a short email, not a formal cover letter, explaining why the topic interests you. I'll read them in the order they arrive.", "questions": [{"stem": "What does the speaker emphasize about the position?", "options": ["The position is unpaid during the first month", "The schedule includes very early and very late sessions", "Only graduate students are eligible to apply", "Applicants must have previous laboratory experience"], "answer": 1, "explain_ko": "수면과 기억 연구라서 새벽 여섯 시나 밤 열한 시 세션이 있다고 솔직히 밝혀. 경험은 필요 없고 시급도 나와.", "tips_ko": "I want to be honest about that 같은 표현 앞 내용이 강조 포인트야.", "explanation_en": "The speaker states that sessions run at six in the morning and eleven at night, and says he wants to be honest about that upfront."}, {"stem": "What does the speaker ask interested students to do?", "options": ["Sign up on a list at the end of class", "Send a brief email about their interest", "Schedule an interview with the lab manager", "Submit a formal cover letter and resume"], "answer": 1, "explain_ko": "정식 커버레터가 아니라 주제에 관심 있는 이유를 쓴 짧은 이메일을 보내라고 해.", "tips_ko": "not A 가 붙은 지시문은 A를 고르게 유도하는 함정이 같이 나와.", "explanation_en": "The speaker asks for a short email, explicitly not a formal cover letter, explaining why the topic interests the student."}]}, {"id": "ang0_7", "speaker": "F", "context": "Announcement about a new online booking system for statistics tutoring sessions", "text": "A logistics announcement about tutoring. The walk in system in the economics building is gone. Too many students waited forty minutes and then left. Beginning Monday, you book a thirty minute slot online, up to five days ahead. Each student gets two slots per week, which should be plenty if you come with specific questions. Here's the part people miss. If you book and don't show, the system blocks you for the following week. It's automatic, and I can't override it, so cancel if your plans change. Cancellation takes one click. Finally, tutors handle problem sets, not graded exams. For exam questions, come to my office hours.", "questions": [{"stem": "Why was the walk in system discontinued?", "options": ["Students faced long waits and often gave up", "The economics building needed the space for classes", "Too few students used the service to justify it", "Tutors were unable to answer advanced questions"], "answer": 0, "explain_ko": "학생들이 사십 분씩 기다리다 그냥 돌아가는 일이 많아서 없앴다고 해. 이용자가 적어서가 아니야.", "tips_ko": "제도를 없앤 이유는 보통 바로 다음 문장에 나오니까 그 한 문장만 잡으면 돼.", "explanation_en": "The speaker says too many students waited forty minutes and then left, which is why the walk in system was replaced."}, {"stem": "What is the consequence of missing a booked session?", "options": ["The student loses one slot the same week", "The student is charged a small fee", "The student cannot book for the next week", "The student must email the tutoring coordinator"], "answer": 2, "explain_ko": "예약하고 안 오면 다음 주 예약이 자동으로 차단되고 교수도 풀어줄 수 없다고 해.", "tips_ko": "Here's the part people miss 라고 운을 떼면 그 뒤는 반드시 문제로 나와.", "explanation_en": "The speaker explains that a no show results in an automatic block for the following week, which she cannot override."}]}, {"id": "ang0_8", "speaker": "M", "context": "Announcement before a field trip to observe animal behavior at a wildlife reserve", "text": "Everyone listen up, because Saturday's trip has a few hard constraints. The van leaves from the north lot at five fifteen in the morning. Not five thirty. If you're late, we go without you, because the birds we're observing are active for about ninety minutes after sunrise and then they're done. Wear layers and boots you don't mind ruining. The observation blind is a twenty minute walk through wet grass. Leave the coffee behind, no food or drink inside the blind, since the smell carries further than you'd think. Bring your data sheets already filled in with the date and site code. You won't want to be writing in the dark.", "questions": [{"stem": "Why does the speaker stress the departure time?", "options": ["Because the van must return in time for an afternoon class", "Because the reserve closes its gates early in the day", "Because the birds are only active briefly after sunrise", "Because the walk to the observation site takes over an hour"], "answer": 2, "explain_ko": "관찰할 새들이 해 뜬 뒤 약 90분만 활동해서 늦으면 두고 간다고 해. 보호구역 개방 시간 얘기는 안 나와.", "tips_ko": "숫자가 두 개 연달아 나오면 Not 뒤에 부정되는 쪽이 함정 선택지로 쓰여.", "explanation_en": "The speaker says the birds are active for about ninety minutes after sunrise, so the group cannot wait for latecomers."}, {"stem": "What are students told not to bring into the observation blind?", "options": ["Boots that are not waterproof", "Extra layers of clothing", "Anything to eat or drink", "Blank data sheets"], "answer": 2, "explain_ko": "냄새가 멀리 퍼지니까 관찰 은폐물 안에는 음식이나 음료를 가져가지 말라고 해.", "tips_ko": "no food or drink 처럼 금지 항목이 나열되면 바로 선택지로 옮겨 적어두면 편해.", "explanation_en": "The speaker tells students to leave the coffee behind and allows no food or drink inside the blind because the smell carries."}]}, {"id": "ang1_1", "speaker": "F", "context": "Announcement about a change to a coastal geology field trip", "text": "Before you leave today, I need to update you on Saturday's coastal geology field trip. Heavy rain is expected Friday night, so the trail near Eagle Cliff may be unstable. We're not canceling the trip, but we'll examine the southern beach instead, where the rock exposures are accessible from a paved walkway. Meet outside the science building at 7:30, as originally planned. Wear waterproof boots and bring your field notebook, but leave the sample hammers here. The beach is part of a protected area, so we may photograph the rock layers, but we aren't permitted to remove anything.", "questions": [{"stem": "What is the main purpose of the announcement?", "options": ["To cancel a field trip because of severe weather", "To demonstrate how to collect geological samples", "To recruit students for a coastal research project", "To explain a change in the field trip location"], "answer": 3, "explain_ko": "비 때문에 답사 장소가 절벽에서 남쪽 해변으로 바뀌었다고 안내해. 답사 자체는 취소되지 않았어."}, {"stem": "Why should students leave their sample hammers behind?", "options": ["The instructor will provide different tools", "The hammers could damage the paved walkway", "Students will only be studying photographs", "Removing material from the beach is prohibited"], "answer": 3, "explain_ko": "남쪽 해변은 보호 구역이라 암석을 가져갈 수 없어. 사진 촬영만 허용돼."}]}, {"id": "ang1_2", "speaker": "M", "context": "Announcement about an alternative program for a cloudy observatory night", "text": "For those registered for tonight's observatory program, the forecast isn't cooperating. A thick cloud layer will prevent us from using the rooftop telescopes, but the event will still take place at eight. Instead of observing Jupiter directly, we'll meet in the planetarium for a live demonstration using images collected by our telescope last month. I'll show you how astronomers identify changes in Jupiter's atmosphere over time. You don't need to change your reservation, and your original confirmation email will still admit you. However, please enter through the planetarium's east doors because the observatory entrance will remain locked.", "questions": [{"stem": "What will participants do instead of using the rooftop telescopes?", "options": ["Visit an outdoor exhibit about Jupiter", "Analyze previously collected images in the planetarium", "Reschedule their observations for the following month", "Watch a recorded lecture about telescope design"], "answer": 1, "explain_ko": "구름 때문에 직접 관측하는 대신 지난달에 수집한 목성 이미지를 활용한 시연을 봐. 장소는 천문관이야."}, {"stem": "What are participants instructed to do?", "options": ["Request a new confirmation email", "Bring images from a previous observation", "Use the east entrance of the planetarium", "Arrive earlier than the scheduled time"], "answer": 2, "explain_ko": "관측소 입구는 잠겨 있으니 천문관 동쪽 문으로 들어가야 해. 기존 예약 확인 이메일은 그대로 쓸 수 있어."}]}, {"id": "ang1_3", "speaker": "F", "context": "Announcement about a relocated guest lecture on atmospheric chemistry", "text": "A quick update about tomorrow's guest lecture on atmospheric chemistry. Dr. Lena Ortiz has agreed to discuss how wildfire smoke alters urban air quality. We expected about forty people, but more than a hundred have registered, so the lecture has been moved from Chemistry 204 to the West Campus Auditorium. The starting time remains 4:15. If you're attending for extra credit, pick up a blue attendance card by the auditorium entrance and submit it to your course instructor afterward. Please don't ask Dr. Ortiz to sign it. She'll stay briefly for questions, but she has to leave campus by six.", "questions": [{"stem": "Why has the guest lecture been moved?", "options": ["The speaker requested better equipment", "Another lecture was already scheduled in the original room", "The chemistry building will close early", "Attendance is expected to exceed the original room's capacity"], "answer": 3, "explain_ko": "예상보다 훨씬 많은 사람이 등록해서 더 큰 강당으로 옮겼어. 시작 시간은 바뀌지 않아."}, {"stem": "What should students seeking extra credit do with the blue card?", "options": ["Complete it before attending the lecture", "Leave it at the auditorium entrance", "Give it to their course instructor", "Have the guest speaker sign it"], "answer": 2, "explain_ko": "추가 점수를 원하는 학생은 파란 출석 카드를 받아 수업 담당 강사에게 제출해야 해. 초청 강사에게 서명을 부탁하면 안 돼."}]}, {"id": "ang1_4", "speaker": "M", "context": "Announcement for volunteers joining a local archaeological survey", "text": "Thanks for volunteering for the archaeological survey at Mill Creek Farm this weekend. This is a surface survey, not an excavation, so no one will be digging. Working in teams, you'll walk along marked lines and record any pottery or stone fragments visible on the ground. Please resist the temptation to pick them up. Their exact location is valuable evidence, and a team supervisor must document each object before it is moved. We'll provide measuring tapes, flags, and tablets. You should bring lunch, sunscreen, and a pencil as a backup. The university van leaves the anthropology building at 6:45 sharp.", "questions": [{"stem": "What does the speaker emphasize about the archaeological survey?", "options": ["Most objects have already been documented", "Volunteers will excavate several marked areas", "Objects should remain in place until a supervisor records them", "Participants must provide their own measuring equipment"], "answer": 2, "explain_ko": "유물의 정확한 위치가 중요한 증거라서 감독자가 기록하기 전에는 옮기면 안 돼. 이번 활동은 발굴이 아니라 지표 조사야."}, {"stem": "What will be provided to the volunteers?", "options": ["Tablets and measuring tapes", "Pencils and field notebooks", "Lunch and sunscreen", "Transportation from their homes"], "answer": 0, "explain_ko": "주최 측은 줄자와 깃발, 태블릿을 제공해. 점심과 자외선 차단제는 각자 준비해야 해."}]}, {"id": "ang1_5", "speaker": "F", "context": "Announcement before a workshop using nineteenth-century letters", "text": "Before today's history workshop begins, let me explain how we'll handle the nineteenth-century letters on your tables. These are original documents, not reproductions, so use only the pencils we've provided. Pens, food, and drinks must remain in your bags. You'll notice that each letter rests inside a transparent sleeve. You may open the sleeve, but don't remove the letter completely or flatten its folded edges. First, your group will examine the handwriting and paper for ten minutes. Then you'll receive a typed transcript to help with unfamiliar words. Please form your initial interpretation before looking at the transcript.", "questions": [{"stem": "Why does the speaker give these instructions?", "options": ["The workshop will be assessed through a written exam", "The documents are original and require careful handling", "The students will reproduce the letters by hand", "The handwriting has already been translated"], "answer": 1, "explain_ko": "탁자 위 편지는 복제품이 아니라 실제 역사 자료라 조심히 다뤄야 해. 그래서 필기구와 취급 방법을 제한해."}, {"stem": "What should students do before receiving the transcript?", "options": ["Copy every unfamiliar word with a pencil", "Develop a preliminary interpretation of the letter", "Flatten the folded sections of the paper", "Remove each letter from its protective sleeve"], "answer": 1, "explain_ko": "학생들은 먼저 필체와 종이를 살펴보고 자체적인 초기 해석을 해야 해. 그다음에 낯선 단어를 돕는 인쇄본을 받아."}]}, {"id": "ang1_6", "speaker": "M", "context": "Announcement about submitting proposals for a student satellite project", "text": "The astronomy department is accepting proposals for next year's student satellite project. The satellite can carry only one small instrument, so proposals should focus on a single, measurable question about Earth's upper atmosphere. You don't need engineering experience to apply. Teams selected in December will work with engineering students to refine their designs. For the first round, submit a two-page scientific proposal through the department website by November 8. Please don't include a detailed budget yet. On Tuesday, Professor Banerjee will hold an optional brainstorming session in Science 310 for anyone who has an idea but hasn't formed a team.", "questions": [{"stem": "What should the initial proposal primarily contain?", "options": ["A focused scientific question for one instrument", "A detailed estimate of the project's cost", "A list of experienced engineering team members", "A complete engineering design for the satellite"], "answer": 0, "explain_ko": "첫 제안서는 하나의 장비로 측정할 수 있는 명확한 과학 질문에 집중해야 해. 자세한 예산이나 완성된 설계는 아직 필요 없어."}, {"stem": "Who would most likely benefit from Tuesday's session?", "options": ["Engineering students who have completed a satellite design", "Teams that have already been selected for the project", "Applicants who missed the November deadline", "Students who need help developing an idea or finding teammates"], "answer": 3, "explain_ko": "아이디어는 있지만 팀을 아직 만들지 못한 학생에게 화요일 모임이 유용해. 참여는 선택 사항이야."}]}, {"id": "ang1_7", "speaker": "F", "context": "Announcement about missing data from a campus seismograph", "text": "I have an update for everyone working on the earthquake-data assignment. Our campus seismograph stopped recording Tuesday afternoon because moisture entered an outdoor cable connection. The instrument itself wasn't damaged, but we lost approximately nine hours of local data. If your assigned earthquake occurred during that interval, don't choose a different event. I've uploaded records from a monitoring station thirty kilometers north of campus, and you may use those instead. Be sure to identify that station in your report because its readings will differ slightly from ours. The repaired campus instrument has been operating normally since Wednesday morning.", "questions": [{"stem": "What problem does the speaker describe?", "options": ["An earthquake damaged the campus instrument", "A nearby monitoring station produced inaccurate readings", "Several hours of campus earthquake data were not recorded", "Students selected events outside the assigned period"], "answer": 2, "explain_ko": "케이블 연결부에 습기가 들어가 교내 지진계가 약 아홉 시간 동안 기록하지 못했어. 장비 자체는 손상되지 않았어."}, {"stem": "What should students do if their earthquake occurred during the missing interval?", "options": ["Use data from another station and identify its location", "Wait for the campus data to be recovered", "Select an earthquake from Wednesday morning", "Estimate the missing readings from earlier records"], "answer": 0, "explain_ko": "해당 시간대의 과제라면 북쪽 관측소 자료를 대신 사용하면 돼. 보고서에는 그 관측소를 사용했다고 밝혀야 해."}]}, {"id": "ang1_8", "speaker": "M", "context": "Announcement about conserving a bronze artifact in an archaeology seminar", "text": "For Thursday's archaeology seminar, our conservator will demonstrate how corrosion is removed from an ancient bronze mirror. Because the treatment involves a fragile object and specialized chemicals, we'll meet in the conservation studio rather than our regular classroom. Space there is limited, so the class will attend in two groups. Students whose last names begin with A through L should come at 1:00, and everyone else should come at 2:30. Both sessions cover identical material and last about an hour. Bring the condition report you drafted last week, but leave backpacks in the hallway lockers before entering the studio.", "questions": [{"stem": "Why will the seminar meet in two groups?", "options": ["The chemical treatment requires two separate days", "Students prepared two different condition reports", "The conservation studio cannot accommodate the entire class", "The bronze mirror must be moved between sessions"], "answer": 2, "explain_ko": "보존 처리실의 공간이 좁아서 학급을 두 그룹으로 나눠. 두 시간대의 수업 내용은 같아."}, {"stem": "What are students asked to bring to the seminar?", "options": ["A chemical treatment kit", "The condition report from the previous week", "The key to a hallway locker", "A protective case for the mirror"], "answer": 1, "explain_ko": "학생들은 지난주에 작성한 상태 보고서를 가져와야 해. 배낭은 처리실 밖 사물함에 두면 돼."}]}], "talks": [{"id": "tk1", "subject": "Astronomy", "speaker": "W", "text": "Now, when you look up at the Moon, you always see the same face. The near side, with its dark plains, never turns away from us. Students often take that to mean the Moon doesn't rotate at all. That isn't right. The Moon does rotate, but its rotation period matches its orbital period almost exactly. Both take about twenty seven days. We call this synchronous rotation, or tidal locking. So how does a moon get locked this way? Think about gravity. Earth pulls a little harder on the near side of the Moon than on the far side, and that difference in pull stretches the Moon slightly. It becomes very slightly egg shaped, with the long axis pointing toward us. Now, if the Moon were spinning faster than it orbited, that bulge would be dragged out of alignment, and Earth's gravity would keep tugging it back. Over millions of years, that tugging acts like a brake. The spin slows down until the bulge stays pointed at Earth, and then the braking stops. Let me give you an example from farther out. Most of Jupiter's large moons are tidally locked to Jupiter. So is Pluto's moon Charon, and in that case the locking went both ways, because Charon is unusually large compared with Pluto. The two now keep the same faces toward each other permanently. Here is what I want you to take away. Tidal locking is not some rare accident. It is the expected end state for a small body orbiting close to a much larger one, given enough time.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why the Moon has dark plains on one side", "How the length of a day on Jupiter was measured", "Why a small orbiting body ends up showing one face", "How astronomers calculate the age of the Moon"], "answer": 2, "explain_ko": "강의는 조석 고정이 어떻게 생기며 왜 작은 천체가 큰 천체에 한쪽 면만 보이게 되는지를 설명한다. 어두운 평원이나 나이 측정은 주제가 아니다."}, {"type": "detail", "stem": "According to the professor, what is true about the Moon's rotation?", "options": ["It stopped completely millions of years ago.", "It takes about the same time as one orbit.", "It is gradually speeding up over time.", "It changes direction every twenty seven days."], "answer": 1, "explain_ko": "교수는 달이 자전을 하며 그 주기가 공전 주기와 거의 같아 둘 다 약 이십칠일이라고 말한다. 자전이 멈췄다는 것은 학생들이 흔히 하는 오해로 제시된다."}, {"type": "detail", "stem": "What does the professor say Earth's gravity does to the shape of the Moon?", "options": ["It flattens the Moon at the poles.", "It stretches the Moon slightly into an egg shape.", "It pulls the dark plains toward the far side.", "It has no measurable effect on the Moon's shape."], "answer": 1, "explain_ko": "지구가 달의 가까운 쪽을 더 강하게 당겨 달이 약간 달걀 모양으로 늘어난다고 설명한다. 이 돌출부가 조석 고정의 핵심 원인이다."}, {"type": "function", "stem": "Why does the professor mention Pluto and Charon?", "options": ["To show that tidal locking can work in both directions", "To argue that Charon is not really a moon", "To explain why Pluto was reclassified as a dwarf planet", "To compare the age of Charon with that of the Moon"], "answer": 0, "explain_ko": "샤론이 명왕성에 비해 크기 때문에 두 천체가 서로에게 같은 면을 향하는 양방향 고정 사례로 제시된다. 명왕성의 분류 변경은 언급되지 않는다."}, {"type": "inference", "stem": "What does the professor imply about tidally locked moons in the solar system?", "options": ["They are unusual and hard to explain.", "They must all have formed at the same time.", "They are likely to be common rather than exceptional.", "They will eventually begin to rotate faster again."], "answer": 2, "explain_ko": "마지막에 조석 고정은 드문 우연이 아니라 충분한 시간이 주어지면 예상되는 결과라고 말한다. 따라서 그러한 위성이 흔할 것이라고 추론할 수 있다."}]}, {"id": "tk2", "subject": "Economics", "speaker": "M", "text": "So far we've talked about markets where serving more customers means higher costs. Today I want to look at the opposite situation. Some products become more valuable to each user as more people use them. Economists call this a network effect. Now, the classic example is the telephone. One telephone is a paperweight. Two telephones give you exactly one connection. But add a third, and suddenly you have three possible connections, and the number of possible connections grows much faster than the number of phones. So each new subscriber makes the service better for everyone already on it, and the company doesn't have to do anything at all. Let me give you an example that's a little less obvious. Think about a language. Nobody owns English, but the more speakers it has, the more useful it is to learn, and that usefulness attracts more learners. That's a network effect too. Here's why this matters for competition. In an ordinary market, the better product usually wins. In a market with strong network effects, the product that gets big first can win even if it isn't the best one, because switching would mean leaving your contacts behind. Economists call that lock in. And notice the flip side. These markets can tip very suddenly. A small early lead grows into an enormous one. That is why firms in these industries so often give the product away at the beginning. They are not being generous. They are buying the network.", "questions": [{"type": "main_idea", "stem": "What is the main idea of the lecture?", "options": ["Costs always rise as a company serves more customers.", "A product can gain value for users as its user base grows.", "Languages spread mainly because governments promote them.", "Companies lose money whenever they give products away."], "answer": 1, "explain_ko": "강의는 사용자가 늘수록 각 사용자에게 제품 가치가 커지는 네트워크 효과를 중심으로 전개된다. 비용 증가는 도입부에서 대비를 위해 언급된 개념이다."}, {"type": "detail", "stem": "What point does the professor make with the telephone example?", "options": ["Possible connections increase faster than the number of users.", "Early telephones were too expensive for most households.", "Telephone companies needed government support to grow.", "Two users are enough to make a network profitable."], "answer": 0, "explain_ko": "전화기 수보다 가능한 연결 수가 훨씬 빠르게 늘어난다는 점을 강조한다. 가격이나 정부 지원은 언급되지 않는다."}, {"type": "detail", "stem": "According to the professor, why do firms in these industries often give their product away at first?", "options": ["To meet legal requirements in new markets", "To test the product before charging for it", "To build up a user base quickly", "To reduce the cost of customer service"], "answer": 2, "explain_ko": "교수는 기업이 관대해서가 아니라 네트워크를 사기 위해 초기에 제품을 무료로 준다고 말한다. 즉 사용자 기반을 빨리 확보하려는 전략이다."}, {"type": "function", "stem": "Why does the professor say that one telephone is a paperweight?", "options": ["To show that early technology was poorly designed", "To emphasize that the device is useless without other users", "To suggest that telephones were once luxury objects", "To explain why manufacturing costs were so high"], "answer": 1, "explain_ko": "혼자 쓰는 전화기는 아무 소용이 없다는 점을 과장해 표현하여 사용자 수가 가치를 만든다는 개념을 강조한다. 설계 결함이나 제조 비용과는 무관하다."}, {"type": "inference", "stem": "What can be inferred about markets with strong network effects?", "options": ["Competitors with better products may still fail.", "Prices in them stay stable over long periods.", "They usually contain many equally sized firms.", "Customers switch providers more easily than elsewhere."], "answer": 0, "explain_ko": "먼저 규모를 키운 제품이 최고가 아니어도 승리할 수 있고 이용자는 잠김 현상 때문에 옮기기 어렵다고 설명한다. 따라서 더 좋은 제품도 실패할 수 있다고 추론된다."}]}, {"id": "tk3", "subject": "Art History", "speaker": "W", "text": "Now, let's turn to a change in materials that changed what paintings could look like. Before the fifteenth century, most panel paintings in Europe used egg tempera. You grind your pigment, you mix it with egg yolk, and you paint. Tempera has one big problem. It dries in minutes. So you cannot blend two colors together on the panel. Instead you build up tone with thousands of tiny parallel strokes, which is one reason tempera figures often look crisp and a little flat. Then painters in the Netherlands, and Jan van Eyck is the name you will see most often, developed oil as their main medium. Pigment ground in linseed oil dries slowly, over hours or even days. So now you can blend edges directly on the surface. And here is the more important part. Oil is more transparent than egg, so you can lay down thin translucent layers, called glazes, one over another. Light passes through those layers, bounces off the pale ground underneath, and comes back out to your eye. That is why the reds in a van Eyck robe seem to glow from inside rather than sit on the surface. Now, let me be careful about one thing. Van Eyck did not invent oil paint. Oil binders show up in European recipes centuries earlier. What he and his contemporaries worked out was how to control the material, how many layers, how thin, how long to wait. So the story here is not a single invention. It is the slow mastery of a difficult medium.", "questions": [{"type": "main_idea", "stem": "What does the lecture mainly discuss?", "options": ["How a shift in painting materials changed visual effects", "How panel paintings were restored in the Netherlands", "Why religious subjects dominated fifteenth century art", "How pigments were transported across medieval Europe"], "answer": 0, "explain_ko": "강의는 계란 템페라에서 유화로 재료가 바뀌면서 그림의 표현 방식이 달라진 과정을 설명한다. 복원이나 주제 선택은 다루지 않는다."}, {"type": "detail", "stem": "Why did tempera painters use many small parallel strokes?", "options": ["Egg yolk was too expensive to apply thickly.", "The paint dried too quickly to blend on the panel.", "Wooden panels absorbed thick layers of paint.", "Patrons preferred a highly detailed surface."], "answer": 1, "explain_ko": "템페라는 몇 분 안에 마르기 때문에 화판 위에서 색을 섞을 수 없어 잔선을 겹쳐 명암을 만든다고 설명한다. 재료 가격이나 후원자의 취향은 이유로 제시되지 않는다."}, {"type": "detail", "stem": "According to the professor, what makes colors in an oil painting appear to glow?", "options": ["The pigments are ground much more finely than in tempera.", "Light reflects off the pale ground through translucent layers.", "The panel is polished before any paint is applied.", "Bright colors are painted directly over dark ones."], "answer": 1, "explain_ko": "빛이 얇고 반투명한 글레이즈 층을 통과해 밝은 바탕에서 반사되어 나오기 때문에 색이 안에서 빛나는 것처럼 보인다고 말한다. 안료의 입자 크기는 언급되지 않는다."}, {"type": "function", "stem": "Why does the professor point out that van Eyck did not invent oil paint?", "options": ["To correct a common but inaccurate belief", "To question whether van Eyck painted the works himself", "To argue that tempera remained the superior medium", "To show that recipes for paint were kept secret"], "answer": 0, "explain_ko": "교수는 유성 전색제가 수세기 전 기록에도 나온다고 지적하며 발명가라는 통념을 바로잡는다. 템페라가 더 우수하다는 주장은 하지 않는다."}, {"type": "inference", "stem": "What does the professor suggest about technical progress in painting?", "options": ["It usually depends on the discovery of new pigments.", "It advances through gradual refinement of technique rather than sudden invention.", "It has little effect on how finished paintings look.", "It happens fastest when artists work in isolation."], "answer": 1, "explain_ko": "마지막에 이 이야기는 단일한 발명이 아니라 어려운 재료를 천천히 숙달한 과정이라고 정리한다. 따라서 기술 발전은 점진적인 숙련을 통해 이루어진다고 추론된다."}]}, {"id": "tkg0_1", "subject": "Biology", "speaker": "M", "text": "Now, when we talk about how a plant feeds itself, most people picture roots pulling water and minerals out of the soil on their own. For the vast majority of land plants, that picture is incomplete. Their roots are wrapped in, or even penetrated by, fungal threads called hyphae, and the partnership is called a mycorrhiza. So what does each side get out of it? The fungus is extremely good at scavenging phosphorus and nitrogen, because its threads are far thinner than any root and can reach into tiny pores in the soil. The plant, in return, hands over sugar it made through photosynthesis. Roughly a fifth of what the plant produces can go straight to its fungal partner. Let me give you an example from the lab. If you grow seedlings in sterilized soil, with no fungi present, and compare them with seedlings grown in soil that contains mycorrhizal fungi, the second group is usually taller and greener, even when the two soils have identical mineral content. However, this is not pure cooperation. When phosphorus is abundant, some plants cut back on the sugar they send, and the fungi may withhold nutrients in response. Researchers now describe the arrangement as a kind of market, with both partners adjusting what they trade. Here is the implication I want you to carry away. When you read that a forest is growing on poor soil, remember that the trees are not working alone. Much of what we credit to roots is actually the work of fungi we never see.", "questions": [{"type": "main_idea", "stem": "What is the talk mainly about?", "options": ["How sterilized soil is prepared for laboratory work", "How photosynthesis produces sugar inside plant leaves", "Why some forests grow faster than others at high altitude", "A trading relationship between plant roots and soil fungi"], "answer": 3, "explain_ko": "강의 전체가 식물 뿌리와 균류가 서로 영양분과 당을 주고받는 관계를 설명해. 멸균 토양이나 광합성은 그걸 보여주는 예시일 뿐이야.", "tips_ko": "주제 문제는 첫 두세 문장과 마지막 정리 문장을 묶어서 보면 거의 잡혀."}, {"type": "detail", "stem": "According to the professor, what does the fungus contribute to the partnership?", "options": ["Sugar produced by photosynthesis", "Access to phosphorus and nitrogen in small soil pores", "Water stored inside its thick threads", "Protection from insects that feed on roots"], "answer": 1, "explain_ko": "균류의 실은 뿌리보다 훨씬 얇아서 흙의 작은 틈까지 들어가 인과 질소를 긇어온다고 했어. 당은 반대로 식물이 주는 쪽이야.", "tips_ko": "교환 관계가 나오면 누가 무엇을 주는지 화살표로 메모해 두면 헷갈리지 않아."}, {"type": "detail", "stem": "What does the professor say about the sugar a plant sends to its fungal partner?", "options": ["It is sent only when the soil is sterilized.", "It is produced inside the fungal threads themselves.", "It is returned to the plant later in the season.", "It can amount to about a fifth of what the plant makes."], "answer": 3, "explain_ko": "식물이 광합성으로 만든 것의 약 오분의 일이 균류로 바로 간다고 수치를 들었어. 양이 꽤 크다는 점이 핵심이야.", "tips_ko": "숫자나 비율이 나오면 바로 적어 둬. 세부 문제로 거의 다시 나와."}, {"type": "function", "stem": "Why does the professor describe seedlings grown in sterilized soil?", "options": ["To argue that fungi can damage young seedlings", "To suggest that soil testing is usually inaccurate", "To show that minerals alone do not account for plant growth", "To explain how laboratories avoid contamination"], "answer": 2, "explain_ko": "미네랄이 같아도 균류가 있는 쪽이 더 잘 자란다는 비교라서 성장의 원인이 흙 성분만은 아니라는 걸 보여줘. 오염 방지 기술 얘기가 아니야.", "tips_ko": "두 집단을 비교하는 예시가 나오면 무엇을 똑같이 맞춰 놨는지에 밑줄을 그어 봐."}, {"type": "inference", "stem": "What does the professor imply by comparing the relationship to a market?", "options": ["Plants and fungi compete for the same nutrients.", "The exchange rate between the partners is fixed by soil type.", "Each partner adjusts its contribution according to conditions.", "Only one of the two partners actually benefits."], "answer": 2, "explain_ko": "인이 풍부하면 식물은 당을 줄이고 균류는 영양분을 덜 내놓는다고 했어. 그러니까 조건에 따라 서로 거래량을 조절한다는 뜻이야.", "tips_ko": "However 뒤에 나오는 내용이 추론 문제의 근거가 되는 경우가 많아."}]}, {"id": "tkg0_2", "subject": "Medicine", "speaker": "W", "text": "Now, here is a question that sounds too simple to be interesting. Does the time of day you take a drug change how well it works? For most of the last century, the working assumption in medicine was that it does not. A dose is a dose. However, research on circadian rhythms has forced a revision. Your body is not chemically identical at eight in the morning and eight at night. Hormone levels, blood pressure, stomach acidity, even the activity of the liver enzymes that break drugs down all rise and fall on a daily cycle. So consider blood pressure medication. In most people, blood pressure dips during sleep and then climbs steeply in the early morning, and heart attacks cluster in that morning window. Several trials have tested giving certain blood pressure drugs at bedtime rather than at breakfast, and the bedtime groups showed better overnight control. Let me give you one more example. Inflammatory arthritis is typically worst in the early morning, because the molecules driving the inflammation peak overnight. A pill timed for late evening can reach its highest concentration in the blood right when it is most needed. Now, I want to be careful here. The effect sizes are generally modest, and not every finding has held up when studies were repeated in larger populations. This is a promising area, not a settled one. Still, the implication is worth sitting with. When we design a treatment, the clock may be as much a variable as the dose, and ignoring it may mean leaving real benefit unused.", "questions": [{"type": "main_idea", "stem": "What is the main point of the lecture?", "options": ["Heart attacks are the most common cause of morning symptoms.", "Liver enzymes determine the safety of every drug.", "Timing a dose to the body clock may affect how well it works.", "Most medications should be taken at bedtime."], "answer": 2, "explain_ko": "하루 주기에 따라 몸이 달라지니 복용 시각이 약효에 영향을 줄 수 있다는 게 중심 생각이야. 모든 약을 밤에 먹으라는 말은 하지 않았어.", "tips_ko": "교수가 던진 첫 질문이 주제문인 경우가 많으니 그 질문을 붙잡고 들어."}, {"type": "detail", "stem": "What does the professor say happens to blood pressure in most people?", "options": ["It falls during sleep and rises sharply in the early morning.", "It changes only in patients taking medication.", "It peaks in the late evening before bedtime.", "It stays level throughout the day and night."], "answer": 0, "explain_ko": "수면 중에는 내려가고 이른 아침에 급하게 올라간다고 했어. 그래서 심장마비가 아침에 몰린다는 설명이 이어져.", "tips_ko": "올라간다 내려간다 같은 방향 표현은 화살표로 적어 두면 선택지 비교가 빨라져."}, {"type": "function", "stem": "Why does the professor mention inflammatory arthritis?", "options": ["To show that arthritis is harder to treat than high blood pressure", "To question whether inflammation follows a daily cycle at all", "To explain why some patients forget their evening medication", "To give a second case where dose timing can match symptom timing"], "answer": 3, "explain_ko": "염증이 밤에 최고가 되니 저녁에 먹으면 필요한 때에 약 농도가 맞는다는 두번째 사례야. 질병 간 난이도 비교가 아니야.", "tips_ko": "Let me give you one more example 다음에는 앞 논점을 보강하는 같은 종류의 근거가 나와."}, {"type": "attitude", "stem": "What is the professor's attitude toward research on drug timing?", "options": ["She considers the evidence conclusive.", "She believes it has already changed standard practice.", "She doubts that circadian rhythms exist in humans.", "She thinks it is interesting but not yet established."], "answer": 3, "explain_ko": "효과 크기가 크지 않고 반복 연구에서 다 재현되지는 않았다며 유망하지만 확정된 분야는 아니라고 선을 그었어.", "tips_ko": "I want to be careful here 같은 표현 뒤에는 태도 문제의 정답 근거가 숨어 있어."}, {"type": "inference", "stem": "What can be inferred about the traditional view that a dose is a dose?", "options": ["It overlooked daily variation in how the body handles drugs.", "It applies only to drugs taken with food.", "It was never taken seriously by pharmacologists.", "It was based on studies of patients with arthritis."], "answer": 0, "explain_ko": "몸의 호르몬과 간 효소 활동이 하루 주기로 변한다는 점을 그 관점이 놓쳤다는 흐름이야. 그래서 수정이 필요해졌다고 했어.", "tips_ko": "과거의 가정을 소개한 뒤 However가 나오면 그 가정의 약점이 정답이 돼."}]}, {"id": "tkg0_3", "subject": "Psychology", "speaker": "M", "text": "Now, suppose you have two hours to prepare for an exam. Most students spend those two hours rereading. Highlight the chapter, read it through again, feel the material becoming familiar. It feels productive, and that feeling is exactly the problem. Familiarity is not the same thing as retrieval. So let me describe a standard kind of study. Two groups read the same passage. The first group rereads it several times. The second group reads it once, then closes the passage and tries to write down as much as possible from memory. Immediately afterward, the rereaders usually feel more confident, and they may even score slightly higher. But test both groups a week later, and the recall group generally wins, sometimes by a wide margin. We call this the testing effect, or retrieval practice. So why would struggling to remember beat smooth reading? The leading explanation is that pulling information out of memory strengthens the route back to it. Rereading mainly strengthens recognition, which is a weaker form of access. Let me give you an example you can use tonight. Close your notebook and write down everything you remember from this lecture, then check what you left out. The gaps are the useful information. However, there is a catch for your study planning. Retrieval practice feels harder and less rewarding in the moment, so students abandon it early. That mismatch between what feels effective and what is actually effective is, in my view, the most expensive mistake in the way people study.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["How confidence predicts performance on tests", "How long students should study before an exam", "Why recalling material works better than rereading it", "Why highlighting a textbook damages comprehension"], "answer": 2, "explain_ko": "기억에서 꺼내는 연습이 다시 읽기보다 장기 기억에 효과적이라는 게 핵심이야. 형광펜 자체를 비판한 건 아니야.", "tips_ko": "강의에 전문 용어가 등장하면 그 용어가 주제와 바로 연결되는지 확인해 봐."}, {"type": "detail", "stem": "According to the professor, what happens on a test given a week later?", "options": ["Neither group remembers the passage at all.", "The rereading group keeps its early advantage.", "Both groups score about the same.", "The recall group usually performs better."], "answer": 3, "explain_ko": "직후에는 다시 읽은 쪽이 조금 나을 수 있지만 일주일 뒤에는 회상 연습한 쪽이 보통 앞선다고 했어.", "tips_ko": "직후와 일주일 뒤처럼 시점이 갈리는 결과는 반드시 따로 적어 둬."}, {"type": "organization", "stem": "How does the professor support his claim about rereading?", "options": ["By quoting students about their exam scores", "By describing an experiment that compares two study methods", "By tracing the history of memory research", "By listing the subjects in which rereading fails"], "answer": 1, "explain_ko": "같은 글을 두 방식으로 공부한 두 집단을 비교하는 실험으로 주장을 받쳐 줬어. 역사나 과목별 목록은 안 나와.", "tips_ko": "구성 문제는 내용보다 전개 방식을 묻는 거라 비교 설명 예시 중 어느 틀인지만 골라."}, {"type": "function", "stem": "Why does the professor tell students to close their notebooks tonight?", "options": ["To show that the lecture material is easy to remember", "To warn them against taking notes during lectures", "To turn the research finding into a concrete study habit", "To suggest that lecture notes are often inaccurate"], "answer": 2, "explain_ko": "연구 결과를 오늘 바로 해 볼 수 있는 공부 방법으로 바꿔 준 거야. 필기를 하지 말라는 뜻은 아니야.", "tips_ko": "교수가 you로 직접 지시하면 이론을 실천으로 옮기는 기능일 가능성이 높아."}, {"type": "inference", "stem": "What does the professor imply about why students keep rereading?", "options": ["They are usually short of time before exams.", "They lack access to practice questions.", "They judge their studying by how smooth it feels.", "They have been told that recall is unreliable."], "answer": 2, "explain_ko": "익숙해지는 느낌을 효과로 착각하고 회상 연습은 힘들어서 포기한다고 했어. 그래서 체감으로 공부를 평가한다는 추론이 맞아.", "tips_ko": "느낌과 실제가 어긋난다는 지적이 나오면 그 괴리가 추론 정답이 되기 쉬워."}]}, {"id": "tkg0_4", "subject": "Sociology", "speaker": "W", "text": "Now, think about how people actually find jobs. If you ask them, most will say they applied online or sent in an application. But when sociologists trace how a hire really happened, a surprisingly large share of positions turn out to be filled through someone the new employee already knew. That part is not the interesting finding. The interesting part is which connections do the work. You would expect your closest contacts to matter most. Close friends, family, the people you see every week. However, studies going back decades keep finding that job information more often arrives through acquaintances. A former classmate, a neighbor, someone you worked with briefly years ago. Researchers call these weak ties. So why would a distant acquaintance be more useful than a close friend? Think about overlap. Your close friends tend to know the same people you know, read the same things, and hear about the same openings. The information they carry is information you probably already have. A weak tie sits in a different circle, so the news reaching you through that person is genuinely new. Let me give you an example from our own department. A graduate student here heard about a research position not from her advisor but from someone she met once at a conference dinner. Here is the broader implication. If you treat networking as deepening a handful of close relationships, you may be investing in the least informative part of your network. Breadth, not just closeness, is what moves new information across a social structure.", "questions": [{"type": "main_idea", "stem": "What is the talk mainly about?", "options": ["How companies decide which positions to advertise", "Why distant acquaintances often carry more useful job information", "How graduate students choose research advisors", "Why online applications rarely lead to interviews"], "answer": 1, "explain_ko": "약한 연결이 왜 새로운 정보를 더 많이 전달하는지가 강의의 중심이야. 온라인 지원이나 지도교수 선택은 주제가 아니야.", "tips_ko": "교수가 that is not the interesting part라고 하면 바로 뒤에 진짜 주제가 나와."}, {"type": "detail", "stem": "What does the professor say researchers have found about job information?", "options": ["It is most reliable when it comes from employers directly.", "It often comes through acquaintances rather than close friends.", "It rarely reaches people outside large cities.", "It usually comes from close family members."], "answer": 1, "explain_ko": "수십 년에 걸친 연구가 가까운 친구보다 아는 사람 쪽에서 일자리 정보가 더 자주 온다고 밝혔다고 했어.", "tips_ko": "예상과 실제가 다르다는 패턴이 나오면 실제 쪽이 세부 문제의 정답이야."}, {"type": "detail", "stem": "According to the professor, why is a close friend's information often less useful?", "options": ["Close friends change jobs less frequently.", "Close friends are usually unwilling to discuss work.", "Close friends live too far away to help.", "Close friends tend to share the same social circle as you."], "answer": 3, "explain_ko": "가까운 친구는 나와 아는 사람과 보는 것이 겹쳐서 이미 내가 가진 정보를 전해 준다고 설명했어.", "tips_ko": "overlap 같은 핵심어 하나가 이유를 통째로 담고 있을 때가 많아."}, {"type": "attitude", "stem": "What is the professor's view of advice to focus on a few close relationships?", "options": ["She believes it works only for graduate students.", "She regards it as impossible to test.", "She thinks it misses where new information comes from.", "She considers it the most efficient use of time."], "answer": 2, "explain_ko": "가까운 관계만 깊게 다지면 네트워크에서 정보가 가장 적은 부분에 투자하는 셈이라고 지적했어. 비판적인 입장이야.", "tips_ko": "마지막 정리 문장에 교수의 평가가 드러나니 끝까지 집중해서 들어."}, {"type": "inference", "stem": "What can be inferred about the graduate student in the example?", "options": ["She knew the conference contact for many years.", "She was advised to attend more conferences by her advisor.", "She received information her close contacts did not have.", "She had applied for the position online first."], "answer": 2, "explain_ko": "지도교수가 아니라 학회에서 한 번 만난 사람에게서 소식을 들었으니 가까운 사람들에게는 없던 정보였다는 뜻이야.", "tips_ko": "예시 속 인물이 누구에게서 정보를 받았는지 따라가면 추론이 쉬워져."}]}, {"id": "tkg0_5", "subject": "Behavioral Economics", "speaker": "M", "text": "Now, standard models of choice assume that if an option is valuable enough, people will go and take it. Enrolling in a workplace retirement savings plan is a useful test of that assumption. The money stays yours, employers often match part of what you put in, and the tax treatment is favorable. By that logic, participation should be close to universal. It is not. So here is what researchers noticed. In many plans, a new employee has to actively sign up, complete a form, and decide how much to save. Participation in those plans often sits well below half. Then some companies flipped the arrangement. New hires were enrolled automatically at a modest contribution rate, and anyone who preferred not to participate could opt out with a single form. Participation jumped, in some cases above ninety percent. Nothing about the financial value of the plan had changed. Only the default had changed. However, I want to flag something uncomfortable in that result. If a small administrative detail can move behavior that far, then the original low participation was probably not a considered judgment about saving. It was inertia. Let me state the implication plainly. Whoever sets the default exercises real influence over outcomes, whether they intend to or not. That is a powerful tool for improving retirement security, and it is also a reason to ask who is choosing the defaults and what interest they might have in the answer.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why tax rules discourage retirement saving", "Why young workers save less than older workers", "How employers calculate matching contributions", "How the default arrangement shapes whether people enroll"], "answer": 3, "explain_ko": "같은 제도라도 기본 설정이 자동 가입이냐 아니냐에 따라 참여율이 크게 달라진다는 게 핵심이야.", "tips_ko": "같은 조건에서 하나만 바뀌었다는 설명이 나오면 그 하나가 주제어야."}, {"type": "detail", "stem": "What happened when companies enrolled new hires automatically?", "options": ["Participation rose, in some cases above ninety percent.", "Employees began contributing much larger amounts.", "Employers reduced their matching contributions.", "Most new hires immediately filed to opt out."], "answer": 0, "explain_ko": "자동 가입으로 바꾸자 참여율이 급등해 어떤 경우에는 구십 퍼센트를 넘었다고 했어.", "tips_ko": "퍼센트 수치는 선택지에서 그대로 쓰이니 들리는 즉시 적어 둬."}, {"type": "function", "stem": "Why does the professor point out that the financial value of the plan did not change?", "options": ["To argue that employer matching is unnecessary", "To explain why some workers prefer higher wages", "To isolate the default as the cause of the difference", "To suggest that the plans were poorly designed financially"], "answer": 2, "explain_ko": "금전적 가치는 그대로였고 기본 설정만 달랐다는 점을 짚어 원인을 하나로 좁힌 거야.", "tips_ko": "무엇이 바뀌지 않았다는 말은 보통 원인을 가려내려는 장치야."}, {"type": "organization", "stem": "How does the professor develop the discussion of enrollment?", "options": ["By describing one company in extended detail", "By tracing the history of retirement plans over time", "By contrasting participation under two enrollment procedures", "By listing the forms employees must complete"], "answer": 2, "explain_ko": "직접 신청하는 방식과 자동 가입 방식의 참여율을 나란히 비교하면서 논점을 전개했어.", "tips_ko": "구성 문제는 before와 after처럼 두 상황을 붙여 놨는지 먼저 확인해."}, {"type": "inference", "stem": "What does the professor imply is uncomfortable about the finding?", "options": ["Automatic enrollment makes saving more expensive.", "Researchers cannot measure participation rates accurately.", "Earlier low participation may have reflected inertia, not choice.", "Employers may stop offering savings plans entirely."], "answer": 2, "explain_ko": "작은 행정 절차가 행동을 그만큼 바꾼다면 원래의 낮은 참여는 숙고한 결정이 아니라 관성이었다는 뜻이야.", "tips_ko": "uncomfortable이나 however 뒤 문장은 추론 문제의 핵심 근거로 자주 쓰여."}]}, {"id": "tkg1_1", "subject": "Earth Science", "speaker": "W", "text": "Now, imagine placing a heavy book on a foam cushion. The cushion sinks, but after you remove the book, it slowly rises again. Something similar happens to Earth's crust when a massive ice sheet disappears. During the last ice age, thick ice covered much of northern Europe and North America. Its weight pushed the crust downward into the softer mantle beneath it. When the climate warmed and the ice melted, that weight was removed. However, the land did not immediately return to its former elevation. The mantle flows extremely slowly, so the recovery, called glacial isostatic rebound, continues for thousands of years. Let me give you an example. Parts of Sweden are currently rising by nearly a centimeter each year. Old fishing villages that once stood beside the sea are now located inland because the ground beneath them has risen. So, does that mean local sea level is rising everywhere at the same rate? No. Global sea level may be increasing as oceans warm and land ice melts, but vertical movement of the crust can strengthen or offset the local effect. In some northern regions, the land is rising faster than the nearby water. In other places, the crust is still sinking in response to changes caused by the former ice sheet. The important implication is that researchers cannot interpret a coastal water-level record without also measuring how the land itself is moving.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why ancient fishing villages were usually built inland", "How ocean temperatures are measured near coastlines", "How land continues to respond after the removal of an ice sheet", "Why ice sheets melt more quickly in northern Europe"], "answer": 2, "explain_ko": "빙상이 사라진 뒤에도 지각이 천천히 원래 높이로 돌아가는 과정을 설명해. 해안 수위 기록을 해석할 때 이 움직임을 고려해야 한다는 게 핵심이야."}, {"type": "detail", "stem": "Why does glacial isostatic rebound continue for thousands of years?", "options": ["Ocean water prevents the crust from rising.", "The crust becomes heavier after the ice disappears.", "Material in the mantle moves very slowly.", "The remaining ice melts at a constant rate."], "answer": 2, "explain_ko": "맨틀 물질이 매우 느리게 흐르기 때문에 지각의 회복도 오랜 시간이 걸려. 얼음이 계속 같은 속도로 녹기 때문은 아니야."}, {"type": "function", "stem": "Why does the professor mention old fishing villages in Sweden?", "options": ["To show where the last ice age began", "To illustrate visible evidence that the land has risen", "To explain why fishing declined in northern Europe", "To identify regions threatened by warmer ocean water"], "answer": 1, "explain_ko": "예전에 바닷가였던 마을이 지금은 내륙에 있다는 사례로 땅의 융기를 구체적으로 보여 줘. 어업의 쇠퇴를 설명하려는 사례는 아니야."}, {"type": "inference", "stem": "What can be inferred about a coastline where the land is rising faster than the nearby ocean?", "options": ["The local water level may appear to fall.", "Global sea level cannot be increasing.", "A new ice sheet will probably form there.", "The mantle beneath it has stopped moving."], "answer": 0, "explain_ko": "땅이 물보다 더 빠르게 상승하면 해안에서 관찰되는 상대적 수위는 낮아질 수 있어. 이것이 전 지구 해수면 상승이 없다는 뜻은 아니야."}, {"type": "organization", "stem": "How does the professor organize the lecture?", "options": ["By describing the history of a village in chronological order", "By listing several methods for measuring ocean temperature", "By comparing two competing explanations for ice ages", "By introducing a process, giving an example, and explaining its significance"], "answer": 3, "explain_ko": "먼저 빙하성 지각 반동의 원리를 설명하고 스웨덴 사례를 든 뒤 해수면 측정에 주는 의미를 밝혀. 하나의 과정을 사례와 함의로 확장하는 구조야."}]}, {"id": "tkg1_2", "subject": "Chemistry", "speaker": "M", "text": "Now, aluminum is highly reactive, yet an aluminum bicycle frame can remain outdoors for years without crumbling away. That sounds contradictory. The explanation is a process called passivation. When fresh aluminum meets oxygen, its surface reacts almost immediately and forms an extremely thin layer of aluminum oxide. This coating is tightly attached and prevents oxygen and water from reaching the metal underneath. So, the initial reaction actually protects the material from further reaction. Iron behaves differently. Rust usually forms a loose, flaky layer. As pieces of rust fall away, fresh iron is exposed, and corrosion continues deeper into the object. Let me give you an example involving a scratch. If the oxide film on aluminum is lightly scratched in air, exposed aluminum reacts with oxygen and quickly produces a new protective layer. In that sense, the surface can partly repair itself. However, passivation is not perfect protection. Chloride ions, which are abundant in salt water, can penetrate weak points in the oxide coating. Corrosion may then become concentrated in tiny pits that are difficult to detect. This is why an aluminum component that performs well in a dry environment may fail near the ocean. So, when engineers select a metal, they cannot simply ask whether that metal reacts with oxygen. They must consider whether its reaction products form a stable barrier and whether the surrounding environment can damage that barrier.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why iron is stronger than aluminum in salt water", "Why aluminum can resist corrosion despite being reactive", "How engineers manufacture aluminum bicycle frames", "How oxygen is removed from metal surfaces"], "answer": 1, "explain_ko": "반응성이 큰 알루미늄이 산화막 덕분에 부식에 저항하는 원리를 설명해. 금속 자체의 반응성보다 표면층의 성질이 중요하다는 내용이야."}, {"type": "detail", "stem": "How does rust on iron differ from aluminum oxide?", "options": ["It reacts with chloride ions to form aluminum.", "It produces a tightly attached protective barrier.", "It forms only when iron is completely underwater.", "It tends to flake away and expose more metal."], "answer": 3, "explain_ko": "철의 녹은 느슨하게 생겨 떨어져 나가고 새로운 철 표면을 노출해. 알루미늄 산화막처럼 단단한 보호 장벽을 만들지 못해."}, {"type": "function", "stem": "Why does the professor discuss a scratch on an aluminum surface?", "options": ["To demonstrate that the protective film can form again", "To compare two methods of polishing metal", "To explain how scratches remove chloride ions", "To show why aluminum cannot be used for vehicles"], "answer": 0, "explain_ko": "산화막이 긁혀도 공기 중에서 새 보호막이 빠르게 생긴다는 점을 보여 주는 사례야. 알루미늄 표면의 부분적인 자기 회복 성질을 설명해."}, {"type": "inference", "stem": "What can be inferred about an aluminum object used near the ocean?", "options": ["It may develop serious corrosion in small, localized areas.", "It will become less reactive when scratched.", "It will turn into iron oxide over time.", "It requires no inspection because its oxide layer is permanent."], "answer": 0, "explain_ko": "바닷물의 염화 이온이 산화막의 약한 지점을 뚫으면 작은 구멍 형태의 부식이 생길 수 있어. 겉으로 잘 안 보여도 심각한 손상이 진행될 수 있다는 뜻이야."}, {"type": "attitude", "stem": "What is the professor's attitude toward using passivation as the only basis for selecting a metal?", "options": ["He believes environmental conditions must also be evaluated.", "He considers it unnecessary in modern engineering.", "He is uncertain whether passivation occurs in aluminum.", "He believes it guarantees protection in every environment."], "answer": 0, "explain_ko": "교수는 보호막이 있어도 주변 환경이 그 막을 손상시킬 수 있다고 강조해. 따라서 부동태화만 보고 금속을 선택하면 안 된다는 태도야."}]}, {"id": "tkg1_3", "subject": "Archaeology", "speaker": "W", "text": "Now, archaeologists are often excited by temples, tools, and decorated pottery. But an ancient garbage pile can reveal just as much about daily life. Such a deposit is called a midden. Middens may contain animal bones, shells, broken containers, ash, and plant remains. Because these materials were discarded during ordinary activities, they can provide evidence about what people ate, where they obtained resources, and even when they occupied a site. Let me give you an example from a coastal settlement. Suppose archaeologists recover thousands of fish bones but want to know whether people lived there throughout the year or visited only during one season. Certain fish ear bones, called otoliths, develop visible growth bands. The spacing and chemical composition of the outermost band can indicate the season in which a fish died. If nearly all the fish were caught in late spring, the site may have been a seasonal fishing camp. However, researchers must be cautious. A midden is not a perfect record of everything people consumed. Soft foods may leave little trace, some bones decay more easily than others, and residents may have disposed of waste in several locations. So archaeologists compare midden evidence with hearths, storage structures, tools, and environmental data. The broader implication is that discarded material is valuable not because every object is impressive, but because repeated, ordinary behavior creates patterns that can be tested against other evidence.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["How archaeologists reconstruct complete fish skeletons", "Why coastal settlements were usually abandoned in spring", "How ordinary refuse can provide evidence about past behavior", "Why decorated pottery is rare in ancient settlements"], "answer": 2, "explain_ko": "고대 쓰레기 더미인 패총과 폐기물이 과거 사람들의 식생활과 거주 방식에 대한 증거를 준다고 설명해. 화려한 유물보다 일상적 행동의 반복 패턴에 초점을 둬."}, {"type": "detail", "stem": "What can the outermost growth band of a fish otolith help researchers determine?", "options": ["The season when the fish died", "The tool used to catch the fish", "The exact location where the fish hatched", "The number of people at the settlement"], "answer": 0, "explain_ko": "이석의 가장 바깥쪽 성장 띠는 물고기가 죽은 계절을 알려 줄 수 있어. 이를 통해 유적이 특정 계절에 이용됐는지 판단할 수 있어."}, {"type": "function", "stem": "Why does the professor mention soft foods?", "options": ["To identify the main cause of damage to pottery", "To argue that ancient people avoided storing food", "To show that some foods may not be preserved in a midden", "To explain why coastal diets contained little fish"], "answer": 2, "explain_ko": "부드러운 음식은 흔적을 거의 남기지 않을 수 있어서 폐기물 기록이 완전하지 않다는 점을 보여 줘. 패총의 한계를 설명하기 위한 예시야."}, {"type": "inference", "stem": "What would most strongly support the conclusion that the coastal site was occupied year-round?", "options": ["Evidence that all animal bones decayed at the same rate", "A single decorated container found near the midden", "A large number of fish caught during one spring month", "Fish remains indicating catches in several different seasons"], "answer": 3, "explain_ko": "여러 계절에 잡힌 물고기 흔적이 함께 나오면 사람들이 일 년 내내 머물렀다는 해석이 강해져. 한 계절의 자료만 많으면 계절 캠프일 가능성이 더 커."}, {"type": "organization", "stem": "How does the professor develop the discussion of middens?", "options": ["By tracing the design of fishing tools through time", "By contrasting written records from several coastal societies", "By describing their value, presenting a method of analysis, and noting limitations", "By ranking ancient foods according to nutritional value"], "answer": 2, "explain_ko": "먼저 폐기물의 연구 가치를 설명하고 이석 분석 사례를 제시한 뒤 기록의 한계를 다뤄. 가치와 분석법, 주의점 순서로 전개해."}]}, {"id": "tkg1_4", "subject": "History", "speaker": "M", "text": "Now, before the late nineteenth century, towns commonly set their clocks according to local solar time. Noon occurred when the sun reached its highest point in that town. This worked reasonably well when most journeys were slow. However, it created a serious problem for railroads. Because solar noon shifts slightly as one travels east or west, neighboring towns could have clocks that differed by several minutes. A railroad serving many communities therefore had to publish complicated schedules based on numerous local times. Small misunderstandings could cause missed connections or, more dangerously, put trains on the same track at the wrong moment. So railroad companies pushed for a more uniform system. Let me give you an example. In 1883, major North American railroads divided the continent into broad time zones and began operating according to the new standard on the same day. Many city governments and businesses soon adjusted their public clocks as well. Yet the change was not simply imposed by a national law. In the United States, federal recognition came decades later. The railroads and communities had already made standardized time part of everyday life. This distinction matters. We often assume that governments create standards and the public then follows them. In this case, the practical demands of a new transportation network encouraged private organizations and local communities to coordinate first. The implication is that technological systems can reshape social conventions even before formal legislation catches up.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why towns refused to use clocks before the twentieth century", "Why nineteenth-century trains traveled more slowly at noon", "How federal law created the first North American railroads", "How railroad needs encouraged the adoption of standardized time"], "answer": 3, "explain_ko": "철도 운행의 필요가 지역별 태양시를 표준 시간대로 바꾸는 데 어떤 역할을 했는지 설명해. 기술 체계가 법보다 먼저 사회 관습을 바꿀 수 있다는 내용이야."}, {"type": "detail", "stem": "Why did local solar time create difficulties for railroads?", "options": ["Passengers preferred traveling only during daylight.", "The position of the sun could not be observed from trains.", "Railroad clocks stopped working when trains moved west.", "Nearby towns could follow slightly different times."], "answer": 3, "explain_ko": "경도에 따라 태양 정오가 달라서 가까운 도시끼리도 시각이 몇 분씩 차이 났어. 이 차이가 철도 시간표와 안전 관리에 문제를 만들었어."}, {"type": "function", "stem": "Why does the professor mention the year 1883?", "options": ["To identify when federal regulation of railroads ended", "To provide an example of coordinated adoption by railroad companies", "To show when local solar time was first calculated", "To indicate when trains began traveling between towns"], "answer": 1, "explain_ko": "1883년은 주요 철도 회사들이 같은 날 표준 시간대를 사용하기 시작한 사례로 제시돼. 연방 법률보다 민간의 조정이 먼저였다는 점을 보여 줘."}, {"type": "inference", "stem": "What does the professor imply about federal recognition of standardized time in the United States?", "options": ["It required every town to return to solar time.", "It occurred before railroad companies changed their schedules.", "It formalized a system that was already widely used.", "It was rejected by most city governments."], "answer": 2, "explain_ko": "연방 정부가 인정하기 전에 철도와 지역 사회가 이미 표준 시간을 일상적으로 쓰고 있었어. 따라서 법은 기존 관행을 나중에 공식화한 셈이야."}, {"type": "attitude", "stem": "What is the professor's attitude toward the idea that governments always create social standards first?", "options": ["He believes it applies only to local governments.", "He considers it irrelevant to transportation history.", "He treats it as an assumption that this case challenges.", "He presents it as a rule with no known exceptions."], "answer": 2, "explain_ko": "교수는 정부가 항상 기준을 먼저 만든다는 생각을 이 사례가 뒤집는다고 봐. 철도와 지역 공동체의 실질적 필요가 변화를 먼저 이끌었다고 강조해."}]}, {"id": "tkg1_5", "subject": "Oceanography", "speaker": "W", "text": "Now, the sunlit surface of the ocean is full of microscopic organisms that absorb carbon dioxide as they grow. But what happens to that carbon afterward? Some of it travels downward through a process known as the biological carbon pump. When plankton die, or when animals produce waste, the resulting particles begin to sink. These particles, together with bits of mucus and mineral material, are often called marine snow because they drift through the water like snowflakes. As marine snow descends, bacteria and other organisms consume much of it, returning carbon to the water as carbon dioxide. However, a small fraction reaches the deep ocean, where its carbon may remain isolated from the atmosphere for centuries. Let me give you an example of why sinking speed matters. A dense particle containing mineral fragments may fall rapidly and pass through upper waters before bacteria can completely break it down. A light particle may remain suspended longer and be consumed near the surface. So researchers study not only how much marine snow forms but also its size, density, and composition. This has an important implication for climate models. If warming changes plankton communities, the particles they produce may sink at different rates. Even if surface organisms absorb the same amount of carbon, less of that carbon might reach deep water. Therefore, measuring carbon uptake at the surface alone does not reveal how effectively the ocean stores carbon over long periods.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["How deep-ocean bacteria obtain energy from sunlight", "Why mineral fragments prevent plankton from growing", "Why marine snow increases the salt content of seawater", "How sinking organic particles help transport carbon into the deep ocean"], "answer": 3, "explain_ko": "해양 눈이라 불리는 입자가 탄소를 심해로 운반하는 생물학적 탄소 펌프를 설명해. 입자의 침강 특성이 장기 탄소 저장에 영향을 준다는 게 핵심이야."}, {"type": "detail", "stem": "What happens to most marine snow as it sinks?", "options": ["It returns to the surface as mineral fragments.", "It is consumed by bacteria and other organisms.", "It immediately reaches the ocean floor.", "It absorbs additional carbon from the atmosphere."], "answer": 1, "explain_ko": "대부분의 해양 눈은 가라앉는 동안 박테리아와 다른 생물에게 소비돼. 일부만 심해까지 도달해 탄소를 오래 격리해."}, {"type": "function", "stem": "Why does the professor compare a dense particle with a light particle?", "options": ["To compare two methods for collecting plankton", "To explain why all particles contain the same minerals", "To demonstrate that light cannot reach deep water", "To show how sinking speed affects where carbon is released"], "answer": 3, "explain_ko": "밀도가 높은 입자와 가벼운 입자를 비교해 침강 속도가 분해 위치와 심해 탄소 전달량을 바꾼다는 점을 보여 줘. 입자의 양만으로는 저장 효과를 판단할 수 없어."}, {"type": "inference", "stem": "What can be inferred if warming causes marine snow to sink more slowly?", "options": ["Surface plankton will stop absorbing carbon dioxide.", "More carbon may be recycled near the ocean surface.", "All bacteria in the upper ocean will disappear.", "The deep ocean will release all its stored carbon immediately."], "answer": 1, "explain_ko": "입자가 천천히 가라앉으면 표층 근처에서 분해될 시간이 늘어나 탄소가 더 많이 재순환될 수 있어. 그 결과 심해에 도달하는 탄소가 줄어들 가능성이 있어."}, {"t
