s prepared by students in the Nutrition Science program, and the sodium content of each item is posted beside the pan. One meal plan swipe covers a single entree plus a drink. Cash is not accepted, so please use a card or your student account.", "questions": [{"stem": "How can a student order the squash salad without nuts?", "options": ["Ask for it without the walnut topping", "Trade the squash for brown rice", "Pay one dollar for avocado instead", "Order it on Wednesday only"], "answer": 0, "explain_ko": "호두 토핑을 빼 달라고 말하면 된다고 적혀 있어. 수요일 조건은 파르페에만 해당돼."}, {"stem": "What does the menu say about paying?", "options": ["Sodium content is charged separately", "One swipe covers two entrees", "Cash is accepted only at lunch", "A card or student account must be used"], "answer": 3, "explain_ko": "현금은 받지 않고 카드나 학생 계정을 쓰라고 했어. 스와이프 한 번은 메인 하나와 음료야."}, {"stem": "A student who avoids dairy comes in on Thursday. What should she expect?", "options": ["The soup will contain no gluten", "The parfait will be made with oat milk", "The parfait is not a safe choice that day", "The sodium content will not be posted"], "answer": 2, "explain_ko": "오트 밀크는 수요일만이라 목요일 파르페는 유제품이 들어가. 수프에는 글루텐이 있다고 했어."}]}, {"id": "dlg0_5", "kind": "schedule", "title": "Cognitive Neuroscience Seminar Series, Fall Thursdays", "text": "All sessions: 4:00 p.m., Burnett 210\n\nSept 11, Dr. Aline Okafor, How infants track speech sounds\nSept 18, no seminar (department retreat)\nSept 25, Dr. Petra Vance, Stress hormones and decision making\nOct 2, graduate student talks, five presentations of ten minutes each\nOct 9, Dr. Samuel Yi, Imaging methods in small animal studies\n\nTalks are open to everyone and no registration is required. Graduate students in the program must attend at least four sessions this term and sign the roster at the door. Recordings are posted for the invited faculty talks only.", "questions": [{"stem": "What is scheduled for October 2?", "options": ["A talk on stress hormones", "An imaging workshop for faculty", "A department retreat", "Five short graduate student talks"], "answer": 3, "explain_ko": "10월 2일은 대학원생 발표 다섯 개가 열리는 날이야. 스트레스 호르몬 강연은 9월 25일이지."}, {"stem": "What must a graduate student in the program do to satisfy the attendance rule?", "options": ["Attend every session that actually takes place", "Give a ten minute talk during the fall", "Register online before every talk", "Watch a recording of any missed session"], "answer": 0, "explain_ko": "세미나가 실제로 열리는 날은 네 번뿐이라 하나라도 빠지면 네 번을 못 채워. 사전 등록은 필요 없어."}, {"stem": "Which session will not be available as a recording?", "options": ["October 9", "September 11", "October 2", "September 25"], "answer": 2, "explain_ko": "초청 교수 강연만 녹화를 올린다고 했으니 대학원생 발표날은 빠져. 나머지 세 날은 교수 강연이야."}]}, {"id": "dlg0_6", "kind": "flyer", "title": "Free Workshop: Writing a Survey Question That Works", "text": "Thursday, October 16, 5:30 to 7:00 p.m., Social Sciences Building, Room 4\n\nA small change in wording can move survey results by double digits. In this hands on session, two researchers from the Public Opinion Lab will rewrite your draft questions with you and show how question order and leading words bend the answers you get.\n\nBring a laptop and at least three questions from a project you are working on. Anyone without a project will be paired with a partner.\n\nPizza at 5:15. Space is limited to 25 people, so sign up at the lab front desk. We cannot hold seats by email.", "questions": [{"stem": "Why does the flyer ask students to bring three draft questions?", "options": ["So the researchers can revise them during the session", "To prove they work in the Public Opinion Lab", "To qualify for the free pizza", "To fill all 25 available seats"], "answer": 0, "explain_ko": "연구자들이 네 초안 질문을 같이 고쳐 준다고 했어. 피자는 조건이 아니라 그냥 제공되는 거야."}, {"stem": "How does a student reserve a place?", "options": ["By arriving at 5:15 for pizza", "By signing up at the lab front desk", "By emailing the Public Opinion Lab", "By bringing a partner from the same project"], "answer": 1, "explain_ko": "랩 프런트 데스크에서 직접 신청해야 해. 이메일로는 자리를 못 잡아."}, {"stem": "What point does the flyer make about survey wording?", "options": ["Question order matters only in political polls", "Wording can shift results by a wide margin", "Short questions are always clearer than long ones", "Leading words are acceptable in small samples"], "answer": 1, "explain_ko": "표현을 조금만 바꿔도 결과가 크게 움직인다고 했어. 길이나 정치 조사 얘기는 안 나와."}]}, {"id": "dlg0_7", "kind": "webpage", "title": "Student Health Services: Fall Flu Clinic", "text": "Walk in hours: Monday through Friday, 9:00 a.m. to 4:00 p.m., through November 21. No appointment is needed for the standard vaccine.\n\nCost: free with the student insurance plan. Students on an outside plan pay 25 dollars at the desk and may request a receipt for reimbursement.\n\nBring your student ID, and your insurance card if you carry one.\n\nThe high dose vaccine is reserved for patients referred by a campus physician, so raise the question at your next appointment if you think you need it.\n\nPlease stay in the building for fifteen minutes after your shot before you head out.", "questions": [{"stem": "What must a student on an outside insurance plan do?", "options": ["Make an appointment with a campus physician", "Come during the last week of November", "Bring a referral letter to the clinic", "Pay 25 dollars and ask for a receipt if needed"], "answer": 3, "explain_ko": "외부 보험이면 25달러를 내고 환급용 영수증을 요청할 수 있어. 예약은 필요 없다고 했지."}, {"stem": "How can a student get the high dose vaccine?", "options": ["By arriving during walk in hours with an ID", "By paying an extra fee at the desk", "By getting a referral from a campus doctor", "By waiting fifteen minutes after a standard shot"], "answer": 2, "explain_ko": "고용량 백신은 캠퍼스 의사의 의뢰가 있어야 받을 수 있어. 돈을 더 내는 방식은 아니야."}, {"stem": "Why are patients asked to stay in the building for fifteen minutes?", "options": ["Because ID numbers are recorded slowly", "So the insurance claim can be processed", "So staff can watch for an immediate reaction", "Because the vaccine takes that long to work"], "answer": 2, "explain_ko": "접종 직후 이상 반응을 지켜보려고 머물게 하는 거야. 보험 처리나 효과 발생 시간과는 상관없어."}]}, {"id": "dlg0_8", "kind": "notice", "title": "Teaching Greenhouse Access and Sampling Rules", "text": "The teaching greenhouse is open for coursework from 7:00 a.m. to 6:00 p.m. Your student ID will unlock the north door, but only after your instructor adds your name to the access list.\n\nDo not remove leaves, seeds or soil without a signed collection slip. Several long running growth experiments are under way, and one missing leaf can end a semester of measurements.\n\nHumidity in Bay 3 is held above 80 percent. Laptops and phones are better left in the entry room.\n\nReport cracked pots or insect outbreaks to the greenhouse manager instead of cleaning them up yourself.", "questions": [{"stem": "Why does the notice warn against removing leaves?", "options": ["The north door is locked before 7:00 a.m.", "Soil is in short supply this semester", "The manager counts the leaves every week", "Long running experiments depend on every plant"], "answer": 3, "explain_ko": "장기 실험 때문에 잎 하나만 없어져도 한 학기 데이터가 날아간다고 했어. 토양 부족 얘기는 없어."}, {"stem": "Why does the notice suggest leaving phones in the entry room?", "options": ["The very damp air in Bay 3 can damage them", "Photographs of the experiments are not permitted", "Phones interfere with the growth lights", "Students need both hands for collection slips"], "answer": 0, "explain_ko": "습도가 80퍼센트가 넘으니 기기가 상할 수 있다는 뜻이야. 촬영 금지라는 말은 안 나와."}, {"stem": "What should a student do after noticing insects on a plant?", "options": ["Write the problem on a collection slip", "Wash the leaves with water", "Move the plant to the entry room", "Tell the greenhouse manager"], "answer": 3, "explain_ko": "직접 처리하지 말고 온실 관리자에게 알리라고 했어. 채집 신청서는 표본을 가져갈 때 쓰는 거야."}]}, {"id": "dlg0_9", "kind": "email", "title": "Ethics Training Due Before Interviews Begin", "text": "Hello everyone,\n\nYour interview project starts in two weeks, so the human subjects training certificate is due by Friday, February 7. Upload the PDF to the course site. I cannot accept a screenshot of the final quiz.\n\nThe module takes about ninety minutes and can be paused as often as you like. Most people lose points on the consent section, so read those pages slowly.\n\nOnce your certificate is approved, I will send you the recruitment script and the recorder sign out form.\n\nStudents who miss the deadline will interview a classmate rather than a community member, which caps the project at a B.\n\nProfessor Lindqvist", "questions": [{"stem": "What is the main purpose of the email?", "options": ["To move the interview project deadline", "To summarize the consent section of the module", "To remind students that a required certificate is due", "To explain how to operate the recorders"], "answer": 2, "explain_ko": "인터뷰 전에 제출해야 하는 수료증 마감을 알리는 메일이야. 녹음기 사용법 설명은 아니야."}, {"stem": "What will the professor not accept?", "options": ["A screenshot of the final quiz", "A module that took more than ninety minutes", "A module that was paused partway through", "A certificate uploaded as a PDF"], "answer": 0, "explain_ko": "퀴즈 화면 캡처는 안 받는다고 분명히 적었어. 중간에 멈추는 건 괜찮다고 했지."}, {"stem": "What can be inferred about a student who submits the certificate late?", "options": ["He must interview two community members", "He will be dropped from the course", "He cannot earn the top grade on the project", "He will never receive the recruitment script"], "answer": 2, "explain_ko": "최고 점수가 B로 제한되니까 A는 못 받는다는 뜻이야. 수강 취소 얘기는 없어."}]}, {"id": "dlg0_10", "kind": "webpage", "title": "Student Money Lab: Drop In Advising", "text": "Got a question about a loan letter, a credit card offer, or your first paycheck? Trained peer advisors sit in the Union lobby on Tuesdays and Fridays, 11:00 a.m. to 2:00 p.m.\n\nWhat we do: read a document with you, build a monthly plan, and explain interest in plain language.\n\nWhat we cannot do: recommend a particular investment, or speak to a lender on your behalf.\n\nNo sign up is needed, and the line is usually shortest right at 11:00. Bring the actual paperwork if you have it, since advice based on memory is often wrong.\n\nComplex cases are handled by staff advisors at the Financial Aid office, by appointment.", "questions": [{"stem": "What is one thing the peer advisors will not do?", "options": ["Explain how interest works", "Read a loan letter with a student", "Help build a monthly plan", "Contact a lender for a student"], "answer": 3, "explain_ko": "학생 대신 대출 기관과 연락하는 일은 못 한다고 했어. 서류 함께 읽기나 이자 설명은 해 주는 일이야."}, {"stem": "Why does the page mention arriving right at 11:00 a.m.?", "options": ["The wait is likely to be shorter then", "Sign up sheets are collected at noon", "Advisors leave early on Fridays", "Paperwork is reviewed only in the first hour"], "answer": 0, "explain_ko": "11시 정각이 줄이 가장 짧다고 했어. 신청서를 걷는다는 내용은 없고 예약 자체가 필요 없어."}, {"stem": "Where should a student with a complicated case go?", "options": ["An outside lender suggested by the staff", "A peer advisor during drop in hours", "The Union lobby on a Tuesday", "The Financial Aid office by appointment"], "answer": 3, "explain_ko": "복잡한 사안은 재정 지원 사무실에서 예약제로 다룬다고 했어. 또래 상담은 간단한 질문용이야."}]}, {"id": "dlg1_1", "kind": "notice", "title": "Detour on the Creekside Geology Trail", "text": "A short section of the Creekside Geology Trail is closed after heavy rain exposed loose rock above the path. Until inspectors stabilize the slope, visitors should follow the blue detour signs near Marker 6. The alternate route adds about ten minutes and rejoins the main trail before the footbridge. The fossil bed at Marker 8 remains accessible, but collecting rocks or fossils is prohibited throughout the preserve. Guided walks will depart from the visitor center at their usual times.", "questions": [{"stem": "Where does the alternate route return to the main trail?", "options": ["Near Marker 6", "Before the footbridge", "Behind the visitor center", "At the fossil bed"], "answer": 1, "explain_ko": "우회로는 보행교 전에 본래 산책로와 다시 만난다고 해. Marker 6은 우회가 시작되는 곳이야."}, {"stem": "What can be inferred about the guided walks?", "options": ["They will use a different departure point", "They will allow visitors to collect fossils", "They are continuing despite the trail closure", "They have been shortened by ten minutes"], "answer": 2, "explain_ko": "가이드 산책이 평소 시간에 출발한다고 하므로 계속 운영되는 거야. 출발 장소 변경은 언급되지 않아."}]}, {"id": "dlg1_2", "kind": "email", "title": "Change to Thursday's Exoplanet Observation", "text": "To: Astronomy Club Members\nFrom: Professor Elena Ruiz\nSubject: Thursday observation update\n\nCloud cover is expected during our original 8:00 p.m. session, so we will meet Friday at 9:30 p.m. instead. The later start is necessary because our target star will not rise above the science building until then. Please enter through the east stairwell; the main observatory doors lock at 9:00. Students who borrowed red flashlights should bring them, but the department will provide star charts and telescope filters. Reply by noon Friday only if you cannot attend.", "questions": [{"stem": "Why will the observation begin at 9:30 p.m. on Friday?", "options": ["The main observatory doors open late", "The target star will not be visible earlier", "The telescope filters require darkness", "The professor must distribute flashlights"], "answer": 1, "explain_ko": "관측 대상 별이 그 시간 전에는 과학관 위로 떠오르지 않아. 문이 잠기는 시간은 늦게 시작하는 이유가 아니야."}, {"stem": "What is the main purpose of the email?", "options": ["To announce a rescheduled observation session", "To recruit members for the astronomy club", "To explain how telescope filters work", "To request the return of department equipment"], "answer": 0, "explain_ko": "날씨 때문에 관측 날짜와 시간이 바뀌었다는 안내가 핵심이야. 장비 반환은 일부 참석자에게만 해당해."}, {"stem": "Who should reply to Professor Ruiz?", "options": ["Students who need a star chart", "Members entering through the east stairwell", "Anyone unable to attend on Friday", "Everyone who plans to attend"], "answer": 2, "explain_ko": "금요일에 참석할 수 없는 사람만 정오까지 답장하라고 해. 참석 가능한 사람은 답장할 필요가 없어."}]}, {"id": "dlg1_3", "kind": "text_message", "title": "Spectrometer Reservation", "text": "Maya: Did you see that our flame-test samples must be analyzed before tomorrow's lab?\nJon: Yes. I reserved the spectrometer for 4:20, but the booking is only twenty minutes.\nMaya: I'll label the sodium and potassium samples now so we don't waste time there.\nJon: Great. Meet me outside Chemistry 214 at 4:10. Bring your safety glasses because Dr. Patel said the instrument room follows normal lab rules.\nMaya: Got it. I'll also download the results template before I come.", "questions": [{"stem": "Why will Maya label the samples in advance?", "options": ["To avoid using reservation time for labeling", "To satisfy a new safety rule", "To distinguish the results template", "To return them to Dr. Patel"], "answer": 0, "explain_ko": "기기 예약 시간이 20분뿐이라 미리 라벨을 붙여 시간을 아끼려는 거야. 안전 규칙 때문은 아니야."}, {"stem": "What should Maya bring to the instrument room?", "options": ["Safety glasses", "A spectrometer", "Sodium results from tomorrow", "A lab reservation form"], "answer": 0, "explain_ko": "기기실에도 일반 실험실 규칙이 적용되므로 보안경을 가져오라고 해. 분광기는 이미 기기실에 있어."}]}, {"id": "dlg1_4", "kind": "menu", "title": "Riverside Excavation Lunch Orders", "text": "Field lunches include one main item, fruit, and bottled water.\n\nDig-Site Wrap: roasted vegetables, hummus, and spinach, $9\nSurveyor Sandwich: turkey, cheddar, and apple chutney, $10\nCeramic Bowl: quinoa, chickpeas, cucumber, and feta, $11\n\nGluten-free bread is available for the Surveyor Sandwich at no extra charge. The Ceramic Bowl is already gluten-free. To reduce waste at the archaeological site, disposable utensils are provided only on request. Place orders at the field office by 3:00 p.m. for next-day pickup.", "questions": [{"stem": "Which main item is prepared without gluten by default?", "options": ["The Surveyor Sandwich", "The Dig-Site Wrap", "The Ceramic Bowl", "The turkey and cheddar plate"], "answer": 2, "explain_ko": "Ceramic Bowl은 원래부터 글루텐이 없다고 명시돼 있어. Surveyor Sandwich는 빵을 따로 변경해야 해."}, {"stem": "Why are utensils available only upon request?", "options": ["The field office closes at 3:00 p.m.", "The archaeological site prohibits metal objects", "The lunch price does not include utensils", "The excavation team wants to reduce waste"], "answer": 3, "explain_ko": "발굴 현장에서 쓰레기를 줄이기 위해 요청한 사람에게만 일회용 식기를 줘. 가격이나 금속 제한 때문이 아니야."}]}, {"id": "dlg1_5", "kind": "schedule", "title": "Maritime Archive Research Morning", "text": "9:00 Library lobby: Check-in and temporary researcher cards\n9:20 Seminar Room B: Handling fragile maps and ship logs\n10:00 Reading Room: Catalog search demonstration\n10:30 Break\n10:45 Reading Room: Supervised examination of nineteenth-century harbor records\n11:45 Seminar Room B: Questions and document request procedures\n12:15 Program ends\n\nParticipants must leave coats, food, pens, and personal scanners in the lobby lockers. Pencils and foam supports will be supplied. Anyone wishing to examine a particular ship log should email its catalog number to the archive by Wednesday.", "questions": [{"stem": "What happens immediately after the break?", "options": ["Participants examine harbor records", "A catalog search is demonstrated", "Staff explain document request procedures", "Participants receive researcher cards"], "answer": 0, "explain_ko": "10시 30분 휴식 뒤 10시 45분에 항구 기록을 살펴봐. 문서 요청 절차는 마지막 순서야."}, {"stem": "Why should a participant email the archive by Wednesday?", "options": ["To receive foam supports", "To request a specific ship log", "To obtain permission for a personal scanner", "To reserve a lobby locker"], "answer": 1, "explain_ko": "특정 선박 일지를 보고 싶다면 목록 번호를 미리 보내야 해. 사물함과 받침대는 별도 예약이 필요 없어."}]}, {"id": "dlg1_6", "kind": "flyer", "title": "Meteorite or Ordinary Rock?", "text": "Found an unusual stone? Bring it to the Planetary Science Society's identification clinic on November 14, from 1:00 to 4:00 p.m. in Mason Hall 105. Volunteers will measure density, examine surface features, and test magnetic response. These tests can eliminate many common Earth rocks, although final meteorite certification requires analysis at a professional laboratory. Each visitor may bring two dry, fist-sized specimens. Do not clean, polish, or cut them beforehand. Admission is free, and appointments are not required.", "questions": [{"stem": "What are visitors advised not to do before the clinic?", "options": ["Clean or alter their specimens", "Carry two fist-sized stones", "Test magnetic response", "Measure their specimens"], "answer": 0, "explain_ko": "표본을 미리 씻거나 광택 내거나 자르지 말라고 해. 자기 반응 검사는 현장에서 자원봉사자가 해."}, {"stem": "What limitation of the clinic is mentioned?", "options": ["It cannot provide final certification", "It cannot examine surface features", "It accepts only certified meteorites", "It charges for laboratory analysis"], "answer": 0, "explain_ko": "현장 검사는 흔한 암석을 걸러낼 수 있지만 최종 인증은 전문 실험실에서 해야 해. 따라서 확정 판정은 제공하지 못해."}, {"stem": "What is the flyer's main purpose?", "options": ["To announce a planetary science course", "To request volunteers for a professional laboratory", "To advertise a rock identification event", "To sell equipment for measuring density"], "answer": 2, "explain_ko": "특이한 돌을 가져와 확인받는 행사의 시간과 장소를 홍보하는 전단이야. 장비 판매나 수업 안내가 아니야."}]}, {"id": "dlg1_7", "kind": "webpage", "title": "Community Well-Water Testing Kits", "text": "Residents using private wells may reserve a free water-testing kit through the County Chemistry Center. The kit screens for nitrate, iron, and water hardness; it does not test for bacteria. Collect the sample on the same morning you return it, using the sterile bottle provided. Samples left at the center after 2:00 p.m. cannot be processed that day because the nitrate analysis must begin promptly. Results are posted to a secure account within five business days. One kit is available per household each calendar year.", "questions": [{"stem": "Which substance is included in the screening?", "options": ["Bacteria", "Sterile material", "Household chemicals", "Nitrate"], "answer": 3, "explain_ko": "검사 항목에는 질산염, 철분, 물의 경도가 포함돼. 박테리아는 검사하지 않는다고 분명히 밝혀."}, {"stem": "Why should samples arrive by 2:00 p.m.?", "options": ["Results are posted that afternoon", "Sterile bottles are collected at 2:00", "Secure accounts close after that time", "The nitrate test must be started quickly"], "answer": 3, "explain_ko": "질산염 분석을 신속히 시작해야 해서 오후 2시 이후 표본은 당일 처리할 수 없어. 결과는 영업일 기준 5일 안에 나와."}]}, {"id": "dlg1_8", "kind": "notice", "title": "Reduced Lighting in the Ancient Writing Gallery", "text": "Beginning October 12, lighting in the Ancient Writing Gallery will be reduced to protect several newly displayed papyrus fragments from fading. The gallery will remain open during regular museum hours. Visitors may borrow small filtered flashlights from the information desk, but phone flashlights and flash photography are not permitted. Large-print transcriptions of the documents are available beside each display case. The cuneiform tablet room is unaffected because clay objects are less sensitive to light. A curator talk about preserving ancient texts will be held Friday at 2:00 p.m.", "questions": [{"stem": "Why will the gallery lighting be reduced?", "options": ["To encourage visitors to use phone flashlights", "To make the cuneiform tablets easier to see", "To prepare for a curator talk", "To prevent papyrus fragments from fading"], "answer": 3, "explain_ko": "새로 전시된 파피루스 조각이 빛 때문에 바래는 것을 막으려는 조치야. 큐레이터 강연 준비와는 관계없어."}, {"stem": "What can visitors obtain from the information desk?", "options": ["Cuneiform tablets", "Large-print transcriptions", "Photography permits", "Filtered flashlights"], "answer": 3, "explain_ko": "안내 데스크에서 필터가 달린 작은 손전등을 빌릴 수 있어. 큰 글자 자료는 각 전시함 옆에 있어."}, {"stem": "Why is the cuneiform tablet room unaffected?", "options": ["Its objects are less vulnerable to light", "It contains large-print documents", "It is closed during regular hours", "Its lighting was already reduced"], "answer": 0, "explain_ko": "점토 유물은 빛에 덜 민감해서 설형문자 점토판 전시실은 영향을 받지 않아. 이미 조명을 낮췄다는 내용은 없어."}]}, {"id": "dlg1_9", "kind": "email", "title": "Oral History Interview Assignment", "text": "To: Local History Project Team\nFrom: Marcus Lee\nSubject: Saturday interview\n\nMrs. Alvarez has agreed to discuss her family's grocery store, which operated downtown from 1952 to 1987. Since her apartment is beside a busy avenue, we will conduct the interview in Library Room 3 rather than at her home. Priya, please collect the audio recorder from the media desk at 10:30. I will bring the consent form and a scanned street map to help prompt memories. Everyone else should arrive by 10:45 so we can review our questions before Mrs. Alvarez comes at 11:00.", "questions": [{"stem": "Why will the interview take place at the library?", "options": ["The media desk requires interviews to occur there", "Her apartment may have too much traffic noise", "Mrs. Alvarez requested a scanned map", "The grocery store is inside the library"], "answer": 1, "explain_ko": "아파트가 교통량이 많은 도로 옆이라 소음이 클 수 있어 도서관에서 진행해. 미디어 데스크 규정 때문은 아니야."}, {"stem": "What is Priya responsible for doing?", "options": ["Meeting Mrs. Alvarez at her apartment", "Scanning the street map", "Picking up the audio recorder", "Bringing the consent form"], "answer": 2, "explain_ko": "Priya는 10시 30분에 미디어 데스크에서 녹음기를 찾아와야 해. 동의서와 지도는 Marcus가 준비해."}]}, {"id": "dlg1_10", "kind": "schedule", "title": "Fossil Quarry Field Day", "text": "7:45 a.m. Meet behind Earth Sciences Building\n8:00 Bus departs\n9:15 Safety briefing at quarry entrance\n9:30 Fossil mapping in assigned teams\n11:30 Lunch at the covered shelter\n12:15 p.m. Sediment layer demonstration\n1:00 Independent sketching and photography\n2:15 Equipment check and site cleanup\n2:45 Bus departs for campus\n\nWear sturdy closed-toe shoes and bring a notebook, lunch, and at least one liter of water. Hammers and fossil collecting are prohibited because the quarry is a protected research site. The trip proceeds in light rain but will be canceled if lightning is forecast.", "questions": [{"stem": "What activity is scheduled immediately before independent sketching?", "options": ["Fossil mapping", "The equipment check", "The safety briefing", "The sediment layer demonstration"], "answer": 3, "explain_ko": "독립 스케치와 촬영 직전에는 퇴적층 시연이 진행돼. 장비 점검은 그 뒤에 있어."}, {"stem": "Why are participants not allowed to collect fossils?", "options": ["The quarry is a protected research location", "The bus cannot carry hammers", "They will not have enough water", "Fossils can be mapped only in light rain"], "answer": 0, "explain_ko": "이 채석장은 보호받는 연구 장소라 화석 채집과 망치 사용이 금지돼. 버스 공간이나 날씨 때문이 아니야."}, {"stem": "Under what condition will the trip be canceled?", "options": ["If lightning is expected", "If the covered shelter is occupied", "If the bus leaves after 8:00", "If light rain begins"], "answer": 0, "explain_ko": "약한 비에는 진행하지만 번개가 예보되면 취소해. 따라서 일반적인 비 자체는 취소 조건이 아니야."}]}], "academic": [{"id": "ac1", "title": "Seed Dispersal by Ants", "text": "Many plants rely on animals to move their seeds, and in dry woodlands a surprising share of that work is done by ants. Thousands of plant species produce seeds bearing a small, fleshy appendage called an elaiosome, which is rich in fats and amino acids. Foraging ants carry these seeds back to their nests, feed the appendage to their larvae, and then discard the seed itself, usually undamaged, in a refuse chamber or just outside the entrance.\n\nThe arrangement appears to benefit the plant in several ways. Seeds left on the surface are exposed to rodents and to fire, whereas seeds buried a few centimetres below ground survive both. Nest soil is also unusually loose and enriched with nitrogen from discarded food and waste, so seedlings that germinate there often grow faster than their neighbours. Because individual ants travel only a metre or two, however, dispersal distances are short, and populations of ant dispersed plants tend to spread slowly across a landscape.\n\nThat limitation has become important in fragmented habitats. Where forests are divided by roads and farmland, plants that depend on ants cannot readily colonize new patches, and botanists have documented local declines even where suitable soil remains. Invasive ants complicate the picture further: some aggressive species drive out native dispersers but handle seeds carelessly, stripping the elaiosome where the seed lies rather than carrying it away. The seed then receives no burial and no fertile soil. Studies of such invasions provide a useful reminder that a mutualism is not simply a service performed by any available partner, but a relationship tuned to the behaviour of particular species.", "questions": [{"type": "vocabulary", "stem": "The word \"discard\" in the passage is closest in meaning to", "options": ["examine closely", "throw away", "break open", "carry off"], "answer": 1, "explain_ko": "discard는 필요 없는 것을 버린다는 뜻이므로 throw away가 가장 가깝다."}, {"type": "factual", "stem": "According to the passage, what do foraging ants do with the elaiosome?", "options": ["They use it to line the walls of the refuse chamber.", "They leave it attached to the buried seed.", "They feed it to their larvae.", "They mix it into the soil at the nest entrance."], "answer": 2, "explain_ko": "개미는 씨앗의 부속물을 애벌레에게 먹이고 씨앗 자체는 버린다고 설명한다."}, {"type": "negative_factual", "stem": "According to the passage, all of the following are benefits that ant dispersal provides to plants EXCEPT", "options": ["protection of seeds from fire", "shelter from seed eating rodents", "soil that has been enriched with nitrogen", "movement of seeds over long distances"], "answer": 3, "explain_ko": "개미는 한두 미터만 이동하므로 장거리 운반은 이점이 아니라 한계로 제시된다."}, {"type": "inference", "stem": "It can be inferred from the passage that in a woodland where aggressive invasive ants have replaced native ants, seeds bearing elaiosomes are most likely to", "options": ["remain on the ground surface with their appendages removed", "be carried farther from the parent plant than before", "germinate in soil that is unusually rich in nitrogen", "stop producing appendages within a few generations"], "answer": 0, "explain_ko": "침입성 개미는 씨앗을 옮기지 않고 그 자리에서 부속물만 떼어내므로 씨앗은 지표에 그대로 남는다."}, {"type": "purpose", "stem": "Why does the author mention roads and farmland?", "options": ["To explain why elaiosomes contain fats and amino acids", "To show that native ants prefer recently disturbed ground", "To illustrate the kind of barrier that short distance dispersal cannot easily overcome", "To argue that agriculture is the main cause of invasive ant spread"], "answer": 2, "explain_ko": "도로와 농지는 짧은 산포 거리로는 넘기 어려운 장벽의 예로 제시된다."}]}, {"id": "ac2", "title": "Railways and the Making of Standard Time", "text": "Until the late nineteenth century, most towns kept their own local time, set by the moment the sun stood highest overhead. A clock in one city might differ from a clock a hundred kilometres to the east by several minutes, and nobody found this inconvenient. Travel was slow enough that such differences never had to be reconciled.\n\nRailways changed the calculation. A single line could pass through dozens of towns in a day, and a timetable printed in local times was both confusing and dangerous, since trains sharing a track relied on scheduled positions to avoid collisions. British companies solved the problem early by running their services on Greenwich time, coordinated through the Railway Clearing House from 1847, decades before Parliament made that time legal for civil purposes. In North America, where distances were far greater, the railways agreed among themselves in 1883 to divide the continent into broad zones, each differing from its neighbour by exactly one hour. Cities adjusted their public clocks over the following days, sometimes with protest from clergy and newspaper editors who regarded solar noon as a natural fact rather than a convention.\n\nThe reform is often described as a triumph of scientific reasoning, but it was mainly a commercial decision, taken by private firms and only later ratified by governments. Its lasting significance lies in what it accustomed people to accept: a measure of time that came from an institution rather than from the sky. Later standards, from international shipping schedules to the electrical frequency of national power grids, depended on the same habit of trusting a distant authority.", "questions": [{"type": "vocabulary", "stem": "The word \"ratified\" in the passage is closest in meaning to", "options": ["formally approved", "quietly ignored", "sharply limited", "publicly explained"], "answer": 0, "explain_ko": "ratified는 정부가 공식적으로 승인했다는 의미이다."}, {"type": "factual", "stem": "According to the passage, why were timetables printed in local times dangerous?", "options": ["Printers frequently made errors when setting local times.", "Passengers had no way of knowing when the sun was highest.", "Clocks in different towns ran at slightly different speeds.", "Trains sharing one track depended on being where the schedule said they were."], "answer": 3, "explain_ko": "같은 선로를 쓰는 열차가 예정된 위치에 의존해 충돌을 피했기 때문에 위험했다."}, {"type": "negative_factual", "stem": "The passage mentions all of the following as part of the move toward standard time EXCEPT", "options": ["the use of Greenwich time by British railway companies", "the division of North America into zones one hour apart", "objections raised by clergy and newspaper editors", "a plan drawn up by national governments before the railways acted"], "answer": 3, "explain_ko": "표준 시간대는 철도 회사들이 먼저 합의했고 정부는 나중에 승인했다."}, {"type": "inference", "stem": "What can be inferred about the decision of Parliament to make Greenwich time legal for civil purposes?", "options": ["It was intended mainly to help the Railway Clearing House expand.", "It confirmed a practice that private companies had already adopted.", "It was resisted by railway companies that preferred local time.", "It was a response to the North American agreement of 1883."], "answer": 1, "explain_ko": "영국 철도는 1847년부터 그리니치 시간을 사용했고 의회의 법제화는 수십 년 뒤였다."}, {"type": "purpose", "stem": "Why does the author mention the electrical frequency of national power grids?", "options": ["To show that railways eventually lost their influence over technology", "To offer a later example of the public accepting a standard set by a remote institution", "To explain how electricity made accurate public clocks possible", "To suggest that time zones should follow the boundaries of power grids"], "answer": 1, "explain_ko": "전력망 주파수는 멀리 있는 기관이 정한 기준을 사람들이 받아들인 후대의 사례로 언급된다."}]}, {"id": "ac3", "title": "From Tempera to Oil in European Painting", "text": "Before the fifteenth century, most European panel paintings were made with egg tempera, a paint in which ground pigment is bound in egg yolk thinned with water. Tempera dries within minutes, so colours cannot be blended on the panel; a painter builds up flesh or drapery from hundreds of fine parallel strokes, each laid beside the last. The result is luminous and precise, but transitions of light are necessarily somewhat abrupt.\n\nOil paint behaves differently. Pigment mixed with linseed or walnut oil stays workable for hours or days, which allows edges to be softened and one tone to be pulled gradually into another. Oil is also more transparent, so a painter can lay thin glazes over a dried layer and produce deep shadows that still seem to contain light. Netherlandish artists of the early fifteenth century, Jan van Eyck among them, did not invent the medium, as an older story held, but they refined its preparation to the point where it could carry the fine detail previously reserved for tempera.\n\nItalian workshops took up oil during the second half of the century, and the change altered more than surface texture. Because oil films remain flexible, they can be applied to canvas, which is lighter and can be made far larger than a wooden panel; Venetian painters exploited this freedom in enormous canvases for churches and government halls. Slow drying also made revision possible, and X-ray examination of such paintings frequently reveals arms, heads, and whole figures shifted or removed while the work was under way, a practice that a tempera painter could scarcely have attempted.", "questions": [{"type": "vocabulary", "stem": "The word \"workable\" in the passage is closest in meaning to", "options": ["safe to handle", "soft enough to be manipulated", "inexpensive to prepare", "resistant to fading"], "answer": 1, "explain_ko": "workable은 아직 굳지 않아 다룰 수 있는 상태를 뜻한다."}, {"type": "factual", "stem": "According to the passage, why does a tempera painter build up a form from many fine parallel strokes?", "options": ["The paint dries too quickly for colours to be blended on the panel.", "Egg yolk is too thick to be spread over broad areas.", "Thin strokes keep the wooden support from cracking.", "Pigments were costly and had to be used sparingly."], "answer": 0, "explain_ko": "템페라는 몇 분 안에 말라 패널 위에서 색을 섞을 수 없기 때문이다."}, {"type": "negative_factual", "stem": "According to the passage, oil paint has all of the following characteristics EXCEPT", "options": ["It stays usable for hours or days.", "It can be applied as a thin transparent glaze.", "It forms a flexible film suited to canvas.", "It hardens quickly enough to prevent later changes."], "answer": 3, "explain_ko": "유화는 천천히 말라 나중에 수정이 가능했으므로 변경을 막는다는 설명은 본문과 반대이다."}, {"type": "inference", "stem": "What can be inferred about the older claim that Jan van Eyck invented oil painting?", "options": ["It rested on X-ray evidence that was later misread.", "It is true of Italy but not of the Netherlands.", "It overstates his role, since his achievement was to improve an existing medium.", "It was spread by Venetian painters who wanted to promote canvas."], "answer": 2, "explain_ko": "본문은 그가 매체를 발명한 것이 아니라 준비 방식을 개선했다고 밝힌다."}, {"type": "purpose", "stem": "Why does the author mention X-ray examination of Italian paintings?", "options": ["To provide evidence that painters altered their compositions while working", "To show that oil paintings are more fragile than tempera panels", "To explain how large canvases were attached to wooden frames", "To date the arrival of oil painting in Venice"], "answer": 0, "explain_ko": "엑스레이 조사는 작업 중에 구도를 고쳤다는 증거로 제시된다."}]}, {"id": "acg0_1", "title": "Brown Fat and Adult Metabolism", "text": "Most of the fat in an adult human body stores energy, but a small amount does something closer to the opposite: it burns calories to produce heat. This tissue, known as brown fat, is packed with mitochondria, whose iron-containing proteins give it its colour. When nerves signal that the body is cooling, brown fat cells allow energy to leak across the mitochondrial membrane as warmth rather than capturing it in a usable chemical form. Newborns depend on this mechanism because they cannot yet shiver effectively.\n\nFor decades physiologists assumed that brown fat disappeared in childhood. Imaging studies changed that view. Patients scanned for unrelated reasons turned out to have small, metabolically active deposits in the neck and along the spine, and the deposits showed up more often in scans taken during winter. Follow-up work confirmed that adults who spend several hours a day in mildly cool rooms gradually increase both the volume and the activity of the tissue.\n\nThe findings drew immediate attention from researchers studying obesity and diabetes, since a tissue that consumes glucose and fat for heat might help offset a surplus of calories. Enthusiasm has since been tempered. Even a generous estimate puts adult brown fat at a few dozen grams, enough to account for only a modest share of daily energy use, and the people who carry the most of it tend to be young and lean already. Whether activating the tissue can reverse weight gain, rather than merely accompany leanness, remains unsettled.", "questions": [{"type": "vocabulary", "stem": "The word \"tempered\" in the passage is closest in meaning to", "options": ["restored", "moderated", "divided", "misdirected"], "answer": 1, "explain_ko": "tempered는 기세를 누그러뜨린다는 뜻이라 moderated가 제일 가까워."}, {"type": "factual", "stem": "According to the passage, why do newborns rely on brown fat?", "options": ["They are unable to shiver effectively yet.", "They cannot digest glucose during the first weeks.", "They store very little energy in ordinary fat.", "Their mitochondria contain extra iron at birth."], "answer": 0, "explain_ko": "신생아는 아직 제대로 떨 수 없어서 갈색지방의 열 생산에 의존한다고 나와 있어."}, {"type": "negative_factual", "stem": "According to the passage, all of the following are true of brown fat in adults EXCEPT", "options": ["It is detected more often in scans made in winter.", "It grows more active with repeated exposure to cool air.", "It makes up several kilograms of body mass in lean people.", "It occurs in the neck and along the spine."], "answer": 2, "explain_ko": "성인 갈색지방은 수십 그램 정도라고 했으니 몇 킬로그램이라는 건 틀렸어."}, {"type": "inference", "stem": "It can be inferred from the final paragraph that the link between brown fat and leanness", "options": ["may reflect something other than an effect of the tissue on body weight", "appears only in patients treated for diabetes", "proves that the tissue prevents weight gain", "disappears when adults are kept in cool rooms"], "answer": 0, "explain_ko": "갈색지방이 많은 사람은 이미 젊고 마른 편이라 인과관계가 입증된 건 아니야."}, {"type": "purpose", "stem": "Why does the author mention patients who were scanned for unrelated reasons?", "options": ["To criticize physiologists for ignoring newborn physiology", "To argue that winter scans are more accurate than summer ones", "To show how evidence that adults retain the tissue first came to light", "To explain why brown fat appears dark in medical images"], "answer": 2, "explain_ko": "다른 이유로 촬영된 환자 영상이 성인에게도 갈색지방이 남아 있다는 증거가 된 과정을 보여줘."}]}, {"id": "acg0_2", "title": "Placebos That Patients Know About", "text": "A placebo is usually described as a deception: a patient believes a capsule contains active medicine, and the belief itself relieves symptoms. That definition has been hard to square with a line of clinical trials in which patients were told outright that what they were taking was inert. In studies of irritable bowel syndrome, chronic back pain, and migraine, groups given these open-label placebos reported less discomfort than groups given no treatment at all, even though no one had been misled.\n\nThe results suggest that expectation is not the only ingredient. Swallowing a capsule on a fixed schedule, keeping a daily record of symptoms, and meeting regularly with a clinician who explains that the body can respond to ritual may all contribute. Some researchers emphasize conditioning instead: patients who have felt better after taking medication in the past may have learned an automatic response to the act of treatment, much as a laboratory animal comes to respond to a tone once paired with food.\n\nSkeptics raise a practical objection. Participants in such trials know they are being studied and are asked to describe their own pain, and the improvements reported are largest for exactly the symptoms that are hardest to measure from the outside. Swelling and blood pressure shift far less reliably than ratings of nausea or fatigue. The debate matters for ethics as much as for therapy, since a treatment that worked without deception would remove the main objection to prescribing placebos in the first place.", "questions": [{"type": "vocabulary", "stem": "The word \"inert\" in the passage is closest in meaning to", "options": ["unpleasant to swallow", "available without a prescription", "recently developed", "producing no active effect"], "answer": 3, "explain_ko": "inert는 약리 작용이 없다는 뜻이야."}, {"type": "main_idea", "stem": "Which of the following best expresses the main idea of the passage?", "options": ["Irritable bowel syndrome responds to placebos better than any other condition does.", "Trials using placebos that patients know about challenge the view that deception is necessary, though the evidence is disputed.", "Most physicians now prescribe placebos rather than active drugs for chronic pain.", "Placebos relieve symptoms only when patients do not know what they are taking."], "answer": 1, "explain_ko": "속이지 않고도 효과가 나타난 실험들이 기존 플라세보 설명을 흔든다는 게 핵심이야."}, {"type": "factual", "stem": "According to the passage, what do researchers who emphasize conditioning claim?", "options": ["Patients respond only if a clinician describes the capsule as powerful.", "Keeping symptom records weakens the effect of an inert capsule.", "Earlier relief from real medication can train an automatic response to being treated.", "Animals and humans respond to placebos at similar rates."], "answer": 2, "explain_ko": "과거에 약으로 나아진 경험이 치료 행위 자체에 대한 자동 반응을 학습시켰다고 설명해."}, {"type": "negative_factual", "stem": "According to the passage, all of the following may contribute to the effects of open-label placebos EXCEPT", "options": ["taking a capsule on a fixed schedule", "raising the dose as treatment continues", "writing down one's symptoms each day", "regular contact with a clinician"], "answer": 1, "explain_ko": "복용량을 점점 늘린다는 내용은 지문에 전혀 없어."}, {"type": "inference", "stem": "It can be inferred from the passage that measurements of swelling and blood pressure", "options": ["are rarely collected in pain research", "respond to conditioning more quickly than ratings of nausea do", "provide a stricter test of whether open-label placebos work", "explain why patients agree to join placebo trials"], "answer": 2, "explain_ko": "부기나 혈압은 환자 본인의 보고에 덜 좌우되니까 더 엄격한 검증 수단이 돼."}]}, {"id": "acg0_3", "title": "Rotating Savings Clubs", "text": "In cities and villages across much of the world, small groups of neighbours, co-workers, or relatives meet on a fixed schedule and each contribute an agreed sum to a common pot. At every meeting the entire pot is handed to one member, and the cycle continues until everyone has received it once. Economists call these arrangements rotating savings and credit associations; the people who use them have dozens of local names for them. No interest is paid, no property is pledged, and in most cases nothing is written down.\n\nThe appeal is easiest to see for a household that needs a lump sum. Saving alone for a sewing machine or a year of school fees means resisting daily temptations as well as requests from relatives, and a formal bank account may require fees or documents that a street vendor cannot produce. A club turns a private struggle into a public commitment: a missed payment is visible to everyone in the room, and the social cost of that visibility enforces repayment more cheaply than any court could.\n\nThe same design explains the system's limits. Because the pot can never exceed the sum of the contributions, a club cannot finance anything beyond the group's combined capacity, and members who collect late are in effect lending to those who collect early without being paid for it. Clubs therefore tend to form among people of similar income who expect to live alongside one another for years, which leaves out the most mobile and the poorest.", "questions": [{"type": "vocabulary", "stem": "The word \"pledged\" in the passage is closest in meaning to", "options": ["returned with interest", "divided among members", "offered as a guarantee", "recorded in writing"], "answer": 2, "explain_ko": "pledge는 담보로 내건다는 뜻이라 보증으로 제공한다가 맞아."}, {"type": "factual", "stem": "According to the passage, what happens at each meeting of a club?", "options": ["Interest is divided equally among the contributors.", "Members vote on how much to contribute next time.", "The whole pot is given to a single member.", "A written record of the balance is signed by everyone."], "answer": 2, "explain_ko": "매 모임마다 모인 돈 전체를 한 사람이 받아 간다고 했어."}, {"type": "purpose", "stem": "Why does the author mention a sewing machine and a year of school fees?", "options": ["To show that club members usually run small businesses", "To give examples of expenses that call for a lump sum rather than small savings", "To explain why banks refuse to lend in poor neighbourhoods", "To suggest that clubs are used mainly for emergencies"], "answer": 1, "explain_ko": "재봉틀이나 학비는 한 번에 큰돈이 필요한 지출의 예시야."}, {"type": "inference", "stem": "It can be inferred from the passage that a member who collects the pot in the final round", "options": ["has supplied credit to other members without earning a return", "receives a pot larger than the total contributions", "is usually the person who organized the club", "contributes less than the other members do"], "answer": 0, "explain_ko": "늦게 받는 사람은 먼저 받은 사람들에게 이자 없이 돈을 빌려준 셈이야."}, {"type": "negative_factual", "stem": "According to the passage, all of the following help a club function EXCEPT", "options": ["members who expect a long relationship with one another", "payments that the whole group can observe", "a bank that covers the pot when a member fails to pay", "members whose incomes are broadly similar"], "answer": 2, "explain_ko": "은행이 대신 메워 준다는 말은 없고 오히려 계약서조차 없다고 했어."}]}, {"id": "acg0_4", "title": "Acquaintances and the Job Search", "text": "When sociologists began asking professionals how they had found their current jobs, the answers were not the ones labour economists expected. Instead of scanning advertisements or filing applications, most respondents had heard about the opening from another person, and that person was rarely a close friend or a family member. More often it was someone they saw only occasionally: a former classmate, a neighbour, a colleague from a job two moves earlier.\n\nThe explanation offered was that close contacts are redundant. The people we spend our time with tend to know the same employers, read the same notices, and hear the same rumours, so what they can pass along is largely what we already know. An acquaintance, by contrast, moves in a different circle and acts as a bridge between social worlds that would otherwise have no link at all. What makes such a tie valuable is not the warmth of the relationship but its reach.\n\nThe argument has been tested many times, and not every study supports it. Which contacts turn out to be useful seems to depend on the market: where hiring is informal and employers worry about reliability, a strong tie willing to vouch for a candidate may count for more than a distant one with fresh news. Weak ties also appear to serve the already advantaged best, since an acquaintance helps only if the acquaintance is placed to hear about desirable work. Where openings are few, a wider network merely spreads the same scarcity more thinly.", "questions": [{"type": "vocabulary", "stem": "The word \"redundant\" in the passage is closest in meaning to", "options": ["excessively demanding", "unreliable", "repeating what is already available", "difficult to reach"], "answer": 2, "explain_ko": "redundant는 이미 있는 걸 되풀이해서 쓸모가 겹친다는 뜻이야."}, {"type": "main_idea", "stem": "Which of the following best expresses the main idea of the passage?", "options": ["Casual acquaintances often carry job information that close contacts cannot, but the advantage depends on circumstances.", "Close friends supply better job information than acquaintances in every labour market.", "Sociologists and labour economists have reached agreement about how hiring works.", "Job seekers succeed most often by answering advertisements carefully."], "answer": 0, "explain_ko": "느슨한 지인이 새 정보를 가져다주지만 조건에 따라 달라진다는 게 요지야."}, {"type": "factual", "stem": "According to the passage, how did most professionals in the early studies learn about their jobs?", "options": ["From applications they had filed months earlier", "From relatives working in the same industry", "From published notices in their field", "From a person they saw only now and then"], "answer": 3, "explain_ko": "대부분은 자주 보지 않는 지인에게서 일자리 소식을 들었다고 했어."}, {"type": "purpose", "stem": "Why does the author mention employers who worry about reliability?", "options": ["To argue that acquaintances cannot judge a worker's skill", "To show that most candidates exaggerate their experience", "To explain why advertisements are rare in informal markets", "To identify a situation in which a strong tie may be more useful than a weak one"], "answer": 3, "explain_ko": "신뢰를 걱정하는 고용주 얘기는 강한 연결이 더 유용해지는 조건을 보여줘."}, {"type": "inference", "stem": "It can be inferred from the passage that in a market with very few openings, enlarging one's circle of acquaintances would", "options": ["make close ties useless for finding work", "do little to improve an individual's chances", "reduce the number of applications employers receive", "convert weak ties into strong ones over time"], "answer": 1, "explain_ko": "일자리가 적으면 인맥이 넓어도 같은 부족분을 나눠 갖는 것뿐이라고 했어."}]}, {"id": "acg0_5", "title": "Measuring What Babies Notice", "text": "Infants cannot report what they are thinking, which once left the first year of life nearly invisible to psychology. The method that opened it up is disarmingly simple. Babies look longer at something new than at something familiar, so when an image is shown over and over, the time spent staring at it falls; when a different image replaces it, looking time rises again. By recording these shifts, researchers can ask whether an infant treats two things as the same or as different.\n\nThe technique has produced claims that would be hard to obtain any other way. Four-month-olds look longer when a screen is lifted to reveal a ball resting in midair than when the same ball rests on a surface, a result read as evidence that expectations about physical support form very early. Related designs suggest that young infants tell apart small numbers of objects and recognize the rhythm of the language spoken around them.\n\nInterpretation is where the trouble begins. A rise in looking time shows that the infant noticed a change; it does not show what the infant made of it. Surprise, uncertainty, and a plain taste for novelty can all lengthen a gaze, and tired or fussy babies produce noisy data, so researchers often discard a large share of their sessions. Attempts to repeat several celebrated findings with much larger samples have yielded weaker effects, a reminder that an elegant measure can still carry a heavy load of assumption.", "questions": [{"type": "vocabulary", "stem": "The word \"yielded\" in the passage is closest in meaning to", "options": ["predicted", "repeated", "concealed", "produced"], "answer": 3, "explain_ko": "yield는 결과를 내놓는다는 뜻이라 produced가 가까워."}, {"type": "factual", "stem": "According to the passage, what happens when the same image is shown to an infant repeatedly?", "options": ["The infant begins to prefer sounds over images.", "The time the infant spends looking at it decreases.", "Looking time stays constant until a new image appears.", "The infant becomes fussy within a few seconds."], "answer": 1, "explain_ko": "같은 그림을 반복해 보여주면 응시 시간이 줄어든다고 했어."}, {"type": "purpose", "stem": "Why does the author describe the ball resting in midair?", "options": ["To give an example of a finding that the looking-time method made possible", "To show that infants are confused by moving objects", "To explain why screens are used in infant laboratories", "To demonstrate that four-month-olds can count objects"], "answer": 0, "explain_ko": "공중에 떠 있는 공 실험은 이 방법으로 알아낼 수 있었던 발견의 예야."}, {"type": "negative_factual", "stem": "According to the passage, all of the following are offered as reasons an infant might look at something longer EXCEPT", "options": ["recognition of a familiar face", "uncertainty about what is being seen", "a general attraction to what is new", "surprise at an unexpected event"], "answer": 0, "explain_ko": "익숙한 얼굴을 알아본다는 건 응시 시간이 길어지는 이유로 제시되지 않았어."}, {"type": "inference", "stem": "It can be inferred from the passage that the attempts to repeat famous findings with larger samples suggest that", "options": ["infants lose interest in novelty after the first year", "some conclusions based on looking time are less secure than they first appeared", "looking time cannot be measured accurately in any laboratory", "larger studies always use fussier babies"], "answer": 1, "explain_ko": "표본을 늘린 재현 실험에서 효과가 약해졌으니 결론을 덜 확신해야 해."}]}, {"id": "acg1_1", "title": "Lightning Inside Volcanic Plumes", "text": "When a volcano erupts explosively, its ash plume may flash with lightning even when no ordinary storm is nearby. Early observers often treated these flashes as thunderstorms triggered by the eruption. Modern measurements, however, show that much of the electrical charge is generated within the plume itself. Ash grains of different sizes and compositions collide violently as hot material rises and expands. During those collisions, electrons can pass from one particle to another, leaving separate regions with opposite charges.\n\nParticle sorting helps maintain this separation. Small grains tend to remain aloft, while larger ones fall more rapidly toward the ground. If differently charged particles follow these separate paths, the electrical difference between parts of the plume grows until a discharge occurs. Ice formation can strengthen the process in tall, water-rich plumes, but it is not always required. Close to a volcanic vent, ash collisions alone can produce numerous short flashes.\n\nVolcanic lightning has practical value because radio instruments can detect electrical discharges through clouds that obscure the eruption from satellites or human observers. Networks of such instruments may therefore provide rapid notice that a remote volcano has begun producing ash. Nevertheless, lightning frequency is an imperfect measure of eruption size. It also depends on the amount of water, the fineness of the ash, and the way wind sorts particles. Scientists consequently use lightning data alongside seismic and satellite observations rather than as a replacement for them.", "questions": [{"type": "vocabulary", "stem": "The word \"obscure\" in the passage is closest in meaning to", "options": ["hide from view", "carry away", "cool rapidly", "divide into layers"], "answer": 0, "explain_ko": "obscure는 구름이 분화를 보이지 않게 가린다는 뜻이야. hide from view가 가장 가까워."}, {"type": "detail", "stem": "According to the passage, what generally happens to smaller ash grains within a volcanic plume?", "options": ["They fall faster than larger grains.", "They lose all their electrical charge near the vent.", "They combine with water to form larger rocks.", "They remain in the air longer than larger grains."], "answer": 3, "explain_ko": "작은 재 입자는 위쪽 공기 중에 더 오래 머무는 경향이 있다고 설명해."}, {"type": "inference", "stem": "What can be inferred about an eruption that produces a dry ash plume with little ice?", "options": ["It will be invisible to radio instruments.", "It may still produce lightning through collisions among ash grains.", "It must contain unusually large amounts of water.", "It cannot produce lightning under any conditions."], "answer": 1, "explain_ko": "얼음은 전기 발생을 강화하지만 필수는 아니야. 재 입자의 충돌만으로도 번개가 생길 수 있어."}, {"type": "purpose", "stem": "Why does the author mention early observers' explanation of volcanic lightning?", "options": ["To explain why early observers avoided active volcanoes", "To contrast an older interpretation with evidence from modern research", "To show that thunderstorms cause most explosive eruptions", "To argue that historical reports are more reliable than satellite data"], "answer": 1, "explain_ko": "과거에는 일반 뇌우로 해석했지만 현대 연구는 화산재 구름 내부에서 전하가 생긴다고 밝혔어."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Electrical activity in ash plumes has identifiable causes and can aid monitoring, although its interpretation has limits.", "Large ash grains are the only particles responsible for electrical discharges near volcanoes.", "Satellite observations have made ground-based volcano monitoring unnecessary.", "Volcanic lightning forms only in water-rich plumes and accurately measures eruption size."], "answer": 0, "explain_ko": "글은 화산 번개의 생성 원리와 관측 가치를 설명하면서 자료 해석의 한계도 함께 다뤄."}]}, {"id": "acg1_2", "title": "Starlight and Exoplanet Atmospheres", "text": "When an exoplanet passes in front of its star, it blocks a small fraction of the star's light. If the planet has an atmosphere, some starlight also passes through the gases surrounding it. Molecules absorb particular wavelengths, so astronomers can compare the spectrum recorded during the transit with the spectrum observed at other times. A slightly deeper transit at selected wavelengths may indicate water vapor, methane, or another atmospheric substance.\n\nThe method appears straightforward, but the star itself can complicate the measurement. A star's visible surface is not uniform. Dark starspots are cooler than their surroundings, while bright regions called faculae are hotter. The planet crosses only a narrow strip of this varied surface, yet astronomers measure light from the entire stellar disk. Consequently, unobserved spots or faculae elsewhere on the star can change the average spectrum and imitate a planetary absorption signal.\n\nResearchers use several strategies to disentangle stellar and planetary effects. They observe multiple transits, monitor changes in the star's brightness, and construct models of its surface. High-resolution instruments can also exploit motion: as the planet travels in its orbit, its spectral features shift in wavelength relative to features produced by the star. Even so, active red dwarf stars remain difficult targets because their surfaces change rapidly and their planets often have thin atmospheres. Transit spectroscopy is therefore powerful, but detecting a feature is only the beginning of the argument that it belongs to a planet.", "questions": [{"type": "detail", "stem": "According to the passage, how may atmospheric molecules affect observations during a transit?", "options": ["They absorb specific wavelengths of starlight.", "They cause the planet to move more rapidly.", "They prevent astronomers from measuring the star's spectrum.", "They make the entire surface of the star cooler."], "answer": 0, "explain_ko": "행성 대기의 분자는 특정 파장의 별빛을 흡수해 통과 깊이에 차이를 만들어."}, {"type": "negative_fact", "stem": "According to the passage, all of the following are used to separate stellar effects from planetary effects EXCEPT", "options": ["measuring the planet's internal temperature directly", "observing several transits", "tracking variations in stellar brightness", "modeling the surface of the star"], "answer": 0, "explain_ko": "행성 내부 온도를 직접 측정하는 방법은 제시되지 않아. 나머지 세 가지는 모두 연구 전략으로 언급돼."}, {"type": "vocabulary", "stem": "The word \"disentangle\" in the passage is closest in meaning to", "options": ["strengthen", "separate", "repeat", "conceal"], "answer": 1, "explain_ko": "disentangle은 서로 섞인 별과 행성의 효과를 분리한다는 뜻이야."}, {"type": "inference", "stem": "Why are observations of a single transit generally insufficient to confirm the presence of an atmospheric molecule?", "options": ["Features on the star may produce a signal resembling atmospheric absorption.", "Molecules absorb all wavelengths equally during a transit.", "The instrument cannot record more than one wavelength at a time.", "A planet has no atmosphere during its first observed transit."], "answer": 0, "explain_ko": "별 표면의 반점이나 밝은 영역이 행성 대기의 흡수 신호처럼 보일 수 있어. 한 번의 관측만으로는 원인을 확정하기 어려워."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Starspots provide the most reliable evidence for water on distant planets.", "Red dwarf stars are unsuitable for every form of astronomical observation.", "Transit spectroscopy can reveal exoplanet atmospheres, but stellar activity makes the evidence difficult to interpret.", "Astronomers can identify an exoplanet's atmosphere by measuring its size alone."], "answer": 2, "explain_ko": "통과 분광법은 대기 성분을 찾는 강력한 방법이지만 별 자체의 변화가 해석을 어렵게 한다는 내용이야."}]}, {"id": "acg1_3", "title": "The Durability of Maya Blue", "text": "Murals, pottery, and ritual objects from ancient Mesoamerica sometimes retain a brilliant blue color despite centuries of heat and humidity. Many natural blue substances fade or dissolve under such conditions, but the pigment known as Maya blue is remarkably stable. Chemical analysis shows that it combines indigo, an organic dye obtained from plants, with palygorskite, a clay whose crystals contain narrow internal channels.\n\nThe pigment's durability results from more than simply mixing the two ingredients. When indigo and palygorskite are heated together, some water leaves the clay's channels. Indigo molecules can then enter or attach closely to these spaces, where the mineral structure restricts their movement. This association makes the dye less vulnerable to oxidation and less soluble in water. Laboratory experiments support this explanation: heated mixtures resist acids and moisture much better than otherwise similar mixtures prepared at room temperature.\n\nArchaeological evidence also suggests that making the pigment was connected with specialized knowledge and ritual activity. Blue material has been discovered on incense burners and at locations where offerings were deposited. Researchers once proposed that burning incense provided the heat needed to produce the pigment during ceremonies. That may have occurred in some cases, but analyses of artifacts from different regions reveal variations in clay sources, heating temperatures, and proportions of indigo. Such differences imply that Maya blue was not made everywhere according to one fixed formula. Instead, communities probably adapted a shared chemical principle to local materials and practices.", "questions": [{"type": "vocabulary", "stem": "The word \"stable\" in the passage is closest in meaning to", "options": ["rarely used in ceremonies", "difficult to identify", "easy to manufacture", "unlikely to change or decay"], "answer": 3, "explain_ko": "stable은 오랜 시간이 지나도 색이 변하거나 분해되지 않는다는 뜻이야."}, {"type": "detail", "stem": "According to the passage, what happens when indigo and palygorskite are heated together?", "options": ["The indigo changes into a different plant species.", "Water leaves channels in the clay, allowing a close association with indigo.", "The ingredients become more vulnerable to acids and moisture.", "The clay dissolves and releases blue minerals."], "answer": 1, "explain_ko": "가열하면 점토 통로에서 물이 빠지고 인디고 분자가 그 공간에 들어가거나 밀착할 수 있어."}, {"type": "inference", "stem": "What can be inferred about a mixture of indigo and palygorskite prepared without heating?", "options": ["It would remain unchanged in strong acids.", "It would necessarily be brighter than Maya blue.", "It would probably be less resistant to moisture.", "It would contain no organic material."], "answer": 2, "explain_ko": "실온에서 만든 혼합물은 가열한 혼합물보다 산과 습기에 약하다고 했어."}, {"type": "purpose", "stem": "Why does the author discuss variations in clay sources, temperatures, and ingredient proportions?", "options": ["To prove that incense was never involved in making the pigment", "To show that different communities used variations of the pigment-making process", "To explain why palygorskite disappeared from Mesoamerica", "To demonstrate that the pigment was imported from a single production center"], "answer": 1, "explain_ko": "지역별 차이는 하나의 고정된 제조법이 아니라 공동체마다 공정을 조정했다는 근거야."}, {"type": "negative_fact", "stem": "According to the passage, all of the following contributed to the durability of Maya blue EXCEPT", "options": ["the narrow channels within palygorskite", "the close association between the dye and the clay", "keeping the indigo completely separate from the mineral", "heating the ingredients during preparation"], "answer": 2, "explain_ko": "내구성은 인디고와 점토가 밀접하게 결합해서 생겨. 둘을 완전히 분리하는 것은 설명과 반대야."}]}, {"id": "acg1_4", "title": "Seasonal Evidence in Shell Middens", "text": "Coastal archaeological sites often contain large accumulations of discarded shells known as shell middens. Although these deposits may initially resemble undifferentiated piles of refuse, their layers can preserve detailed evidence about when people visited a location. Many shellfish add material to their shells in regular growth increments. Changes in food supply, reproduction, and water temperature can alter the width or chemical composition of each increment.\n\nArchaeologists use these patterns to estimate the season in which an animal was collected. For example, the ratio of certain oxygen isotopes in shell material varies with seawater temperature. By sampling successive points near a shell's outer edge, researchers can reconstruct the temperature trend immediately before the animal died. A shell ending during a cooling trend may have been gathered in autumn, whereas one ending at the coldest part of the cycle may indicate winter collection. Investigators must examine many shells because a single specimen may not represent the entire period when a site was occupied.\n\nIf shells from one layer consistently indicate a narrow part of the year, the site may have served as a seasonal fishing camp. A broad distribution of collection seasons could instead suggest repeated visits or longer residence. Such conclusions remain provisional. Shellfish might have been stored before consumption, traded from another coast, or moved between layers after burial. Different species also respond differently to temperature. Researchers therefore establish a local environmental baseline and compare shell evidence with animal bones, hearths, and tools before drawing conclusions about past mobility.", "questions": [{"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Shell middens can provide evidence of seasonal activity, but multiple samples and other evidence are needed for reliable interpretation.", "Shell middens mainly demonstrate that shellfish were traded over long distances.", "Ancient coastal communities occupied every archaeological site throughout the year.", "Oxygen isotopes reveal the exact age and identity of every shellfish specimen."], "answer": 0, "explain_ko": "조개더미는 계절별 이용 시기를 알려 주지만 여러 표본과 다른 유물을 함께 살펴야 한다는 글이야."}, {"type": "detail", "stem": "According to the passage, why do researchers sample points near the outer edge of a shell?", "options": ["To identify the tools used to open it", "To measure the depth of the archaeological layer", "To determine how far the shell traveled after burial", "To reconstruct temperature changes shortly before the animal died"], "answer": 3, "explain_ko": "껍데기 바깥쪽의 연속 지점을 분석하면 동물이 죽기 직전의 수온 변화를 복원할 수 있어."}, {"type": "vocabulary", "stem": "The word \"provisional\" in the passage is closest in meaning to", "options": ["temporary and subject to revision", "accepted without further testing", "supported by written records", "unrelated to the available evidence"], "answer": 0, "explain_ko": "provisional은 추가 증거에 따라 바뀔 수 있는 잠정적인 결론이라는 뜻이야."}, {"type": "inference", "stem": "What would a broad distribution of shellfish collection seasons most likely indicate?", "options": ["Temperature had no effect on the shellfish.", "People visited repeatedly or remained at the site for an extended period.", "The shellfish all came from one autumn harvest.", "The site was certainly abandoned after a single day."], "answer": 1, "explain_ko": "여러 계절의 조개가 함께 나오면 사람들이 반복해서 방문했거나 더 오래 머물렀을 가능성이 커."}, {"type": "purpose", "stem": "Why does the author mention storage, trade, and movement between archaeological layers?", "options": ["To show that shell middens contain no useful information", "To identify processes that can complicate seasonal interpretations", "To argue that shell growth increments do not exist", "To explain how ancient people measured seawater temperature"], "answer": 1, "explain_ko": "저장과 교역 같은 요인은 채집 시기와 발견 위치의 관계를 흐릴 수 있어. 계절 해석의 한계를 보여 주는 예야."}]}, {"id": "acg1_5", "title": "How One River Captures Another", "text": "River networks may appear permanent, but erosion can reorganize them dramatically. One important process is river capture, in which a stream diverts water that previously flowed through a neighboring drainage basin. Capture often begins when the headwaters of one stream erode backward toward a drainage divide. If erosion eventually breaches the divide, the advancing stream may intercept the neighboring river and redirect its upper waters into a new channel.\n\nSeveral landscape features can indicate that capture occurred. The diverted river may contain an abrupt bend, sometimes called an elbow of capture, near the point where its former course was interrupted. A dry valley or an unusually small stream may remain along the abandoned route. Geologists also compare sediment grains on opposite sides of the divide. Minerals carried from a distant rock formation can reveal that water once followed a path different from the modern one. Even populations of freshwater fish may preserve evidence, since closely related species in separate basins can indicate a past connection.\n\nRiver capture affects both landscapes and ecosystems. The capturing stream gains water and may cut more rapidly into its bed, producing steep valleys or waterfalls. The captured stream loses discharge, which can reduce its ability to transport sediment and support aquatic habitats. Capture may proceed gradually through ordinary erosion, or it may be accelerated by tectonic uplift that steepens one river's course. Because no single feature proves that diversion occurred, researchers combine landforms, sediments, biological patterns, and regional geology to reconstruct the history of a drainage network.", "questions": [{"type": "vocabulary", "stem": "The word \"breaches\" in the passage is closest in meaning to", "options": ["builds above", "measures precisely", "moves away from", "breaks through"], "answer": 3, "explain_ko": "breaches는 침식이 분수계를 뚫고 지나간다는 뜻이므로 breaks through가 맞아."}, {"type": "detail", "stem": "According to the passage, what may remain along a river's abandoned route after capture?", "options": ["A dry valley or an unusually small stream", "A newly formed ocean basin", "A layer containing no sediment", "A large active volcano"], "answer": 0, "explain_ko": "물이 다른 길로 바뀐 뒤 옛 경로에는 마른 계곡이나 규모가 매우 작은 하천이 남을 수 있어."}, {"type": "inference", "stem": "What is most likely to happen to a stream after it captures water from a neighboring basin?", "options": ["Its fish populations will necessarily become extinct.", "Its ability to erode its bed will disappear.", "Its discharge will increase.", "Its channel will immediately become dry."], "answer": 2, "explain_ko": "다른 유역의 물을 빼앗은 하천은 유량이 늘어나고 바닥을 더 빠르게 깎을 수 있어."}, {"type": "purpose", "stem": "Why does the author mention closely related freshwater fish in separate basins?", "options": ["To argue that geology cannot reveal changes in river networks", "To explain why captured streams always contain more species", "To show that fish cause drainage divides to erode", "To illustrate biological evidence of a former connection between rivers"], "answer": 3, "explain_ko": "서로 다른 유역의 가까운 종은 두 강이 과거에 연결되어 있었을 가능성을 보여 주는 생물학적 증거야."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Dry valleys are formed exclusively by changes in regional climate.", "Freshwater fish provide complete proof of every ancient river connection.", "Tectonic uplift is the only process capable of changing a river's course.", "River capture reorganizes drainage systems, leaves several kinds of evidence, and affects landscapes and ecosystems."], "answer": 3, "explain_ko": "글은 하천 쟁탈의 과정과 증거, 그리고 지형과 생태계에 미치는 영향을 종합적으로 설명해."}]}, {"id": "acg2_1", "title": "The Flying Buttress", "text": "The great cathedrals of northern France owe their height and their glass to a structural problem that medieval masons never described in writing. A stone vault pushes outward as well as downward, and if nothing resists that lateral thrust, the walls carrying the vault will slowly lean until they fail. Early builders answered by making walls massive, which left little room for windows. By the middle of the twelfth century a different solution had appeared: a half arch of stone springing from a freestanding pier outside the building and leaning against the wall exactly where the thrust was concentrated.\n\nThe flying buttress transferred that force across empty air to a pier that could be thickened without darkening the interior. Walls were thus relieved of much of their structural duty, and masons replaced them with tracery and colored glass. The change was not planned in advance. Surveys of Notre Dame in Paris suggest that flyers were added during construction, probably after cracks revealed where the vault was pressing hardest, and later cathedrals simply inherited the device as standard practice.\n\nBecause the system worked by balance rather than rigidity, it also set limits. Each flyer had to meet the wall at the right height; too low and it did nothing, too high and it pushed the wall inward. Builders had no mathematics for calculating thrust and relied instead on proportional rules passed between workshops, which is why the collapse at Beauvais in 1284, where the choir reached nearly forty eight meters, marked the practical ceiling of the tradition.", "questions": [{"type": "vocabulary", "stem": "The word \"lateral\" in the passage is closest in meaning to", "options": ["sideways", "hidden", "downward", "gradual"], "answer": 0, "explain_ko": "lateral은 옆으로 작용하는 방향을 뜻해서 sideways가 제일 가까워. 바로 앞 문장에 outward라는 단서도 있어."}, {"type": "detail", "stem": "According to the passage, how did builders before the twelfth century deal with the outward push of a stone vault?", "options": ["They lowered the height of the vault itself.", "They built very thick walls.", "They added piers outside the building.", "They filled the windows with tracery."], "answer": 1, "explain_ko": "초기 건축가들은 벽을 두껍게 만들어서 버텼고 그래서 창을 낼 자리가 거의 없었어."}, {"type": "negative_fact", "stem": "According to the passage, all of the following resulted from the adoption of the flying buttress EXCEPT", "options": ["larger areas of glass and tracery", "piers that could be thickened without reducing interior light", "walls that carried less of the vault's load", "a numerical method for calculating thrust"], "answer": 3, "explain_ko": "석공들은 추력을 계산하는 수학이 없어서 경험적인 비례 규칙에 의존했다고 나와 있어."}, {"type": "inference", "stem": "It can be inferred from the passage that a flying buttress built to meet the wall above the point of greatest thrust would", "options": ["press the wall toward the inside of the building", "carry the thrust downward more efficiently", "allow the vault to be raised still higher", "require a thinner supporting pier"], "answer": 0, "explain_ko": "너무 높게 닿으면 벽을 안쪽으로 밀어버린다고 직접 설명하고 있어."}, {"type": "purpose", "stem": "Why does the author mention the collapse at Beauvais in 1284?", "options": ["To explain why masons began recording their techniques in writing", "To show that flying buttresses were abandoned after the thirteenth century", "To indicate the limit that rule of thumb methods could not safely pass", "To argue that colored glass weakened cathedral walls"], "answer": 2, "explain_ko": "보베 붕괴는 계산 없이 경험 규칙만 쓰던 전통의 실질적 한계를 보여주는 예야."}]}, {"id": "acg2_2", "title": "Fiction by Installment", "text": "When Charles Dickens published The Pickwick Papers in monthly parts in 1836, he was not inventing a format so much as borrowing one from the cheap periodicals of the day. Issuing a novel in installments of about thirty two pages, each priced at a shilling, put long fiction within reach of readers who could never have afforded a three volume edition, and it spread the publisher's risk across many months rather than staking everything on a single print run.\n\nSerialization reshaped the novels themselves. A writer who had already sold the opening numbers could not revise the beginning, so plots had to be built forward, and each part needed its own small climax to secure the next purchase. Chapters grew more uniform in length, minor characters returned at regular intervals so that readers would not lose track of them, and recapitulation became a routine courtesy. Dickens also read his sales figures as a kind of audience survey, enlarging roles that proved popular and quietly shortening those that did not.\n\nCritics then and since have treated these pressures as a cost, arguing that serial fiction rewards incident over design. The evidence is mixed. Some installments show visible padding, yet the discipline of the monthly deadline also produced the dense, interlocking structures that modern readers admire, and the gaps between parts gave audiences time to argue about characters as though they were acquaintances. Television drama later rediscovered nearly every one of these effects, which suggests that the serial is less a Victorian accident than a durable response to the economics of storytelling.", "questions": [{"type": "main_idea", "stem": "Which of the following best expresses the main idea of the passage?", "options": ["Dickens invented the serial format and used it better than his imitators.", "Publishing novels in parts widened their audience and changed how they were written.", "Three volume editions failed because they were printed too slowly.", "Serial fiction was rejected by critics until television revived the form."], "answer": 1, "explain_ko": "독자층 확대와 소설 작법의 변화라는 두 축이 글 전체를 이끌고 있어."}, {"type": "vocabulary", "stem": "The word \"staking\" in the passage is closest in meaning to", "options": ["dividing", "announcing", "risking", "saving"], "answer": 2, "explain_ko": "여기서 staking은 돈을 전부 걸어서 위험을 감수한다는 뜻이야."}, {"type": "detail", "stem": "According to the passage, why could serial novelists not revise the opening of a novel?", "options": ["Critics reviewed the first installment before the rest was
