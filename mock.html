<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFL 110 Mock Test</title>
<style>
:root{
  --navy:#0b2a4a; --navy2:#123d6b; --blue:#1f6feb; --sky:#e8f1fc; --ink:#1b2430; --mute:#5b6875;
  --line:#dbe2ea; --bg:#f4f6f9; --card:#ffffff; --ok:#1a7f4b; --okbg:#e6f6ec; --bad:#c0392b; --badbg:#fdecea;
  --warn:#b7791f; --warnbg:#fff7e6; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hwrap{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand small{font-weight:500;opacity:.75;margin-left:8px;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
nav button.active{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
nav button:disabled{opacity:.35;cursor:not-allowed}
main{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:20px}
.card h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{background:var(--sky);border-radius:10px;padding:14px 16px}
.tile .big{font-size:28px;font-weight:800;color:var(--navy)}
.tile .lab{font-size:12px;color:var(--mute)}
button.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
button.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.btn.ghost{background:transparent;color:var(--blue);border:0;padding:6px 8px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.danger{background:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sky);color:var(--navy2);font-weight:700;letter-spacing:.2px;vertical-align:middle}
.tag.gray{background:#eef1f4;color:var(--mute)}
.passage{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.7;white-space:pre-wrap}
.passage.sans{font-family:inherit;font-size:15px}
.q{border-top:1px dashed var(--line);padding:14px 0 6px;margin-top:10px}
.q .stem{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:#f6f8fb}
.opt input{margin-top:4px}
.opt.correct{background:var(--okbg);border-color:#9ad4b3}
.opt.wrong{background:var(--badbg);border-color:#f0b4ad}
.explain{margin-top:8px;font-size:13px;color:var(--navy2);background:var(--sky);padding:8px 12px;border-radius:8px}
.gap{display:inline-block;white-space:nowrap}
.gap input{font-family:inherit;font-size:16px;border:0;border-bottom:2px solid var(--blue);background:#fff;padding:0 2px;outline:none;letter-spacing:.5px}
.gap input.ok{border-bottom-color:var(--ok);color:var(--ok)}
.gap input.ng{border-bottom-color:var(--bad);color:var(--bad)}
.gap .ans{color:var(--ok);font-size:12px;margin-left:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 12px;border-radius:8px;background:#fff;color:var(--navy);border:1px solid var(--line)}
.timer.low{background:var(--badbg);color:var(--bad);border-color:#f0b4ad}
.audio{display:flex;gap:12px;align-items:center;background:#0f2238;color:#fff;border-radius:10px;padding:12px 16px;margin:10px 0}
.audio .st{font-size:13px;opacity:.8}
.wave{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.wave i{display:block;height:100%;width:0;background:#6cc4ff;transition:width .3s linear}
.transcript{margin-top:10px;background:#fbfcfe;border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.65}
.transcript b{color:var(--navy2)}
.chunks{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:10px;border-radius:10px;border:1px dashed var(--line);background:#fbfcfe}
.chunks.answer{border-style:solid;border-color:var(--blue);background:#fff}
.chunk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px;user-select:none}
.chunk:hover{border-color:var(--blue)}
.chunks.answer .chunk{background:var(--sky);border-color:#bcd3f2}
textarea.write{width:100%;min-height:220px;font-family:inherit;font-size:15px;line-height:1.6;padding:12px 14px;border:1px solid var(--line);border-radius:10px;resize:vertical}
.wc{font-size:13px;color:var(--mute);text-align:right;margin-top:4px}
.wc.ok{color:var(--ok);font-weight:600}
.result{padding:12px 14px;border-radius:10px;font-weight:600;margin-top:12px}
.result.good{background:var(--okbg);color:var(--ok)}

.rubric label{display:block;padding:5px 0;cursor:pointer}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--bad)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:#f6f8fb;font-weight:700;color:var(--navy2)}
.band{font-size:30px;font-weight:900;color:var(--navy)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.menu button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px}
.menu button:hover{border-color:var(--blue);background:var(--sky)}
.menu button b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:3px}
.menu button.done{border-color:#9ad4b3;background:var(--okbg)}
.notice{background:var(--warnbg);border:1px solid #f1d9a5;color:#7a5410;padding:10px 14px;border-radius:8px;font-size:13px;margin:10px 0}
.progress{height:8px;background:#e6ebf1;border-radius:4px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--blue)}
.small{font-size:12px;color:var(--mute)}
.center{text-align:center}
.mt{margin-top:14px}
.hidden{display:none!important}
select,input[type=date],input[type=range]{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.guide h1{font-size:24px;margin:0 0 6px}
.guide h2{font-size:19px;margin:28px 0 10px;padding-top:14px;border-top:1px solid var(--line);color:var(--navy)}
.guide h3{font-size:16px;margin:20px 0 8px;color:var(--navy2)}
.guide blockquote{margin:0 0 14px;padding:10px 14px;background:var(--sky);border-left:4px solid var(--blue);border-radius:6px;color:var(--navy2);font-size:14px}
.guide p,.guide li{font-size:15px;line-height:1.7}
.guide ul,.guide ol{padding-left:22px}
.guide li{margin:4px 0}
.guide table{margin:10px 0 14px;font-size:13.5px}
.guide td,.guide th{vertical-align:top;line-height:1.5}
.guide .tablewrap{overflow-x:auto}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:13px}
.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--navy2);text-decoration:none}
.toc a:hover{background:var(--sky)}
.guidewrap{display:grid;grid-template-columns:220px 1fr;gap:16px}

/* vocab */
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;color:var(--navy2)}
.subtabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.flash{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .word{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-.5px;font-family:Georgia,"Times New Roman",serif}
.flash .pos{font-size:13px;color:var(--mute)}
.flash .ko{font-size:22px;font-weight:700;color:var(--ink)}
.flash .forms{font-size:14px;color:var(--navy2)}
.flash .ex{font-size:15px;color:var(--ink);line-height:1.6;font-family:Georgia,serif;max-width:560px;margin:0 auto}
.flash .ex b{color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--navy2)}
.chip.active{background:var(--sky);border-color:#bcd3f2;font-weight:700}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:10px}
.wl div{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:14px;cursor:pointer}
.wl div b{color:var(--navy)}
.wl div span{color:var(--mute);font-size:12.5px;margin-left:auto;text-align:right}
.wl div.b0{border-left:4px solid #e2e8f0}.wl div.b1{border-left:4px solid #f6c453}.wl div.b2{border-left:4px solid #9ad4b3}.wl div.b3{border-left:4px solid #4fb37f}.wl div.b4{border-left:4px solid #1a7f4b}.wl div.b5{border-left:4px solid var(--navy)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--sky);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div i{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute);font-style:normal}
.bars div em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute);font-style:normal}
footer{max-width:1080px;margin:0 auto;padding:10px 18px 40px;font-size:12px;color:var(--mute)}
@media (max-width:640px){.card{padding:16px}main{padding:14px 12px 60px}.passage{font-size:15px}}
</style>

<header>
  <div class="hwrap">
    <div class="brand"><a href="./" style="color:inherit;text-decoration:none">&larr; Coach</a> &middot; TOEFL 110 Mock Test <small>2026 신형식 · 밴드 5.5 목표</small></div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"></main>
<footer>이 모의고사는 ETS 공식 시험이 아니며 문항은 신형식 구조를 본떠 새로 작성한 연습용이다. 밴드 추정은 참고값. 듣기는 브라우저 음성 합성, 말하기 녹음은 이 기기의 마이크를 사용하고 서버로 전송되지 않는다.</footer>

<template id="guide"><h1>TOEFL 2026 신형식 완전 가이드</h1>
<blockquote>2026-01-21부터 시행된 신형식 TOEFL iBT의 구조, 점수 체계, 적응형 원리, 12개 문항 유형별 채점 기준과 공략법, 시험 당일 수칙, 유형·주제별 답안 템플릿을 웹 자료 30여 건과 자체 작성 예시로 정리한 페이지. 2026-09-05 조사 기준. 실행 계획은 <i>toefl-110-plan</i>, 연습 도구는 <i>toefl-mock-test.html</i>.</blockquote>
<h2>결론</h2>
<ul><li>시험은 약 2시간(실질 90분 안팎)으로 줄었고, 순서는 Reading → Listening → Writing → Speaking 고정, 쉬는 시간 없음.</li><li>점수는 영역별 1~6 밴드(0.5 단위), 총점은 네 영역 평균을 0.5 단위로 반올림. 구 110 = 밴드 5.5. 성적표에는 2028년 1월까지 0~120 환산이 함께 찍힌다.</li><li>Reading과 Listening은 2단계 적응형이다. 1단계 성적이 2단계 난이도를 정하고, 쉬운 경로는 밴드 상한이 낮다는 분석이 있다. 초반 정확도가 영역 점수를 결정한다.</li><li>Speaking은 준비시간 0초짜리 두 유형(Listen and Repeat 7문장, Interview 4문항)만 남았다. 논리보다 즉시 반응과 발음 명료도가 점수다.</li><li>Writing에서 통합형 에세이가 사라지고 Build a Sentence(문장 조립)와 Write an Email(이메일)이 들어왔다. 템플릿이 통하는 유일한 영역이다.</li><li>시중 자료 간에 문항 수와 시간이 조금씩 다르다. 이 페이지는 ETS 공식 페이지 수치를 기준으로 하고, 다른 값은 §11에 적었다.</li></ul>
<h2>1. 무엇이 바뀌었나</h2>
<table><thead><tr><th>항목</th><th>구형식 (2025년까지)</th><th>신형식 (2026-01-21부터)</th></tr></thead><tbody><tr><td>총 시간</td><td>약 116분 + 10분 휴식</td><td>약 90분, 휴식 없음</td></tr><tr><td>점수</td><td>영역 0~30, 총점 0~120 합산</td><td>영역 1~6 (0.5 단위), 총점 = 평균 반올림. 0~120 환산 병기</td></tr><tr><td>순서</td><td>R → L → 휴식 → S → W</td><td>R → L → W → S</td></tr><tr><td>Reading</td><td>600~700단어 지문 2개, 20문항, 35분</td><td>50문항 30분. Complete the Words · Read in Daily Life · Read an Academic Passage(약 200단어, 5문항). 2단계 적응형</td></tr><tr><td>Listening</td><td>강의 3~5분, 대화 3분, 28문항, 36분</td><td>47문항 29분. Choose a Response · Conversation(20~30초) · Announcement · Academic Talk(약 90초). 2단계 적응형, 재생 1회</td></tr><tr><td>Writing</td><td>통합형 20분 + 학술 토론 10분</td><td>12문항 23분. Build a Sentence 10 · Email 1 · Academic Discussion 1</td></tr><tr><td>Speaking</td><td>독립형 1 + 통합형 3, 준비시간 있음, 17분</td><td>11문항 8분. Listen and Repeat 7 · Interview 4, 준비시간 없음</td></tr><tr><td>성적 발표</td><td>4~8일</td><td>최대 72시간</td></tr><tr><td>소재</td><td>학술 중심</td><td>학술 + 캠퍼스·일상·업무(공지, 이메일, 문자, 안내방송)</td></tr><tr><td>헤드셋</td><td>센터별 상이</td><td>Koss 공동 개발 신형으로 통일</td></tr><tr><td>채점</td><td>사람 + 자동</td><td>Speaking·Writing은 AI 채점 엔진 + 사람 감독(ETS 설명). Reading·Listening·Build a Sentence·Complete the Words는 기계 채점</td></tr></tbody></table>
<p>문항 수는 ETS 공식 시험 구성 페이지 기준(R 50 · L 47 · W 12 · S 11). 적응형이라 실제 응시자가 보는 수는 경로에 따라 35~48개로 달라진다는 분석 사이트 수치도 있다.</p>
<h2>2. 점수 체계</h2>
<p><b>밴드와 CEFR.</b> 영역 점수 1.0~6.0, 0.5 단위. 대략 밴드 4 = B2, 밴드 5 = C1 진입, 밴드 6 = C2. 총점은 네 영역 평균을 0.5 단위로 반올림한다. 평균 5.125는 5.0, 5.25는 5.5가 된다. 즉 네 영역 합계 21.0이 5.5의 문턱이다.</p>
<p><b>구 점수 환산(ETS 콘코던스).</b></p>
<table><thead><tr><th>구 총점</th><th>신 밴드</th></tr></thead><tbody><tr><td>115~120</td><td>6.0</td></tr><tr><td>107~114</td><td>5.5</td></tr><tr><td>95~106</td><td>5.0</td></tr><tr><td>85~94</td><td>4.5</td></tr><tr><td>75~84</td><td>4.0</td></tr><tr><td>65~74</td><td>3.5</td></tr></tbody></table>
<p>구 100을 요구하던 기관은 밴드 5를 요구하도록 안내됐다. 구 110 요구는 5.5.</p>
<p><b>영역별 산출 방식(분석 사이트 종합, ETS 미공개).</b></p>
<ul><li>Reading·Listening: 정답 수를 밴드로 변환. 2단계 어려운 경로의 문항은 가중치가 크다.</li><li>Speaking: 11문항 각 0~5점, 합계 50점 만점(Listen and Repeat 35 + Interview 20)을 밴드로 변환.</li><li>Writing: Build a Sentence 10문항 정답 수를 0~5 환산 + Email 0~5 + Discussion 0~5의 평균을 밴드로. 한 분석은 대략 과제 평균 + 1이 영역 밴드라고 추정한다(10/10, 4.5, 4.5 → 5.5).</li></ul>
<p><b>성적표.</b> CEFR 등급, 1~6 영역·총점, 0~120 환산 총점이 함께 표기된다. 병기는 2028년 1월까지. MyBest 점수 정책과 2년 유효기간은 유지.</p>
<h2>3. 적응형 구조와 전략</h2>
<p>Reading과 Listening은 2단계(multistage adaptive)다.</p>
<ul><li>1단계(모듈 1)는 모든 응시자가 같은 난이도의 문항을 푼다. 여기서의 정답률이 2단계 경로를 정한다.</li><li>2단계(모듈 2)는 어려운 경로 또는 쉬운 경로로 갈린다. 어려운 경로는 밴드 6.0까지 열려 있고, 쉬운 경로는 전부 맞아도 밴드 4.0 근처에서 막힌다는 분석이 있다(ETS 미공개, 분석 사이트 추정).</li><li>Speaking과 Writing은 적응형이 아니다. 루브릭에 따라 직선적으로 채점된다.</li></ul>
<p><b>전략.</b></p>
<ol><li>1단계 첫 10문항은 시간을 더 써도 된다. 여기서 두세 개 틀리면 그 영역의 상한이 내려간다.</li><li>2단계가 어렵게 느껴지면 좋은 신호다. 당황하지 않는다.</li><li>되돌아가기가 없다. Listening은 답을 제출하면 수정 불가. 빈칸은 0점이고 오답 감점은 없으니 반드시 찍는다.</li><li>Reading에서는 Complete the Words(입력형)에 시간을 뺏기지 않도록 빈칸 하나에 10초 이상 쓰지 않는다.</li></ol>
<h2>4. Reading (50문항 · 30분 · 3유형)</h2>
<p>ETS 안내: 텍스트는 짧고 집중적이며, 필요한 정보는 모두 지문 안에 있고 배경지식은 필요 없다.</p>
<h3>4-1. Complete the Words</h3>
<p><b>형식.</b> 학술 문단 70~100단어. 첫 문장은 온전하고, 둘째 문장부터 매 두 번째 단어의 뒷부분이 잘려 있다(C-test 방식). 문단당 빈칸 10개. 시험 전체에서 약 30개, 기계 채점, 부분 점수 없음. 난이도 B1~C1.</p>
<p><b>채점의 함정.</b> 뜻이 맞아도 형태가 틀리면 0점이다. studied와 studying은 다른 답이고, 철자 한 글자가 틀려도 0점이다. 이중 자음, ie/ei, 어미(-ance/-ence, -able/-ible)가 실점 1순위.</p>
<p><b>전략.</b></p>
<ol><li>빈칸을 보기 전에 문단을 한 번 훑어 주제와 논리 흐름(대조, 원인, 결과, 추가)을 잡는다.</li><li>빈칸마다 품사 자리를 먼저 정한다. 관사 뒤는 명사, be 뒤는 형용사나 분사, 조동사 뒤는 동사 원형, 명사 앞은 형용사.</li><li>보이는 앞 글자 + 품사 + 문맥으로 후보를 세운다. 앞 글자가 2~3개면 후보가 여럿이니 문맥이 결정한다.</li><li>기능어(however, although, because, despite, while, therefore)와 흔한 연어(contribute to, associated with, in the absence of)가 자주 잘린다. 짧은 기능어부터 채우고 어려운 내용어는 표시해 두고 넘어간다.</li><li>채운 뒤 문장을 다시 읽어 시제·수·철자를 확인한다. 빈칸은 절대 비우지 않는다. 그럴듯한 추측이 공백보다 낫다.</li></ol>
<p><b>연습법.</b> Academic Word List 570 단어족을 접미사별로 묶어 외운다(-tion/-sion, -ment, -ity, -ical, -ously, -ive). 하루 한 문단을 90초 안에 채우는 훈련. 틀린 이유를 뜻·형태·철자 셋 중 하나로 분류한다.</p>
<h3>4-2. Read in Daily Life</h3>
<p><b>형식.</b> 이메일, 공지, 일정표, 메뉴, 문자 메시지 같은 실용 텍스트. 짧은 것은 40~50단어에 2문항, 긴 것은 100~140단어에 3문항. 기계 채점. 난이도 A1~C1.</p>
<p><b>묻는 것.</b> 글의 목적, 대상 독자, 세부 정보(날짜·조건·예외), 독자가 해야 할 행동.</p>
<p><b>함정.</b> 정답처럼 보이지만 작은 단어 하나가 다른 선택지. not/no, may와 must, optional과 required, 동사 형태 변화. 분석 사이트들은 이것이 가장 흔한 실점 경로라고 지적한다.</p>
<p><b>전략.</b></p>
<ol><li>질문을 먼저 읽고 텍스트로 간다.</li><li>목적과 대상을 먼저 확정한 뒤 세부 문항을 푼다.</li><li>선택지의 패러프레이즈가 원문 의미와 정확히 같은지 확인한다. 원문과 모순되는 선택지를 먼저 지운다.</li><li>이메일은 마지막 문단에 요청 사항이, 공지는 마지막 문장에 행동 지시가 있다.</li><li>텍스트 근거로만 답한다. 캠퍼스 상식으로 풀면 틀린다.</li></ol>
<h3>4-3. Read an Academic Passage</h3>
<p><b>형식.</b> 약 200~250단어의 대학 교재 수준 지문에 5문항. 구형식(600~700단어, 10문항)의 3분의 1 길이. 어려운 적응 경로에서만 나온다는 분석이 있다. 문항 유형은 주제, 세부 사실, 부정 사실, 추론, 어휘, 저자 의도.</p>
<p><b>전략.</b></p>
<ol><li>첫 문장과 마지막 문장을 먼저 읽어 주제를 잡고, 문단마다 한 문장 요약을 머릿속으로 만든다.</li><li>전환어(however, therefore, in contrast, for instance)를 따라 논리를 추적한다. 저자 의도 문항은 바로 앞 문장과의 관계(예시·대조·근거)를 묻는다.</li><li>어휘 문항은 선택지를 원문 자리에 대입해 문장이 성립하는지 본다.</li><li>과장, 반전, 원문에 없는 인과를 넣은 선택지를 지운다. 그럴듯하지만 지문이 지지하지 않는 답이 오답의 전형이다.</li><li>지문이 짧으니 통독 후 문항별로 해당 부분만 다시 본다. 한 문항에 1분 이상 쓰지 않는다.</li></ol>
<h2>5. Listening (47문항 · 29분 · 4유형)</h2>
<p>공통 규칙: 재생은 1회, 화면에 스크립트 없음, 답 제출 후 수정 불가, 되돌아가기 불가. 억양은 북미·영국·호주·뉴질랜드가 섞인다(ETS 안내). Koss 헤드셋으로 시험 전 볼륨 확인.</p>
<h3>5-1. Listen and Choose a Response</h3>
<p><b>형식.</b> 5초 안팎의 한 문장(요청, 질문, 제안, 불만, 사과, 확인)을 듣고 가장 자연스러운 응답을 네 개 중 고른다. 가장 문항 수가 많은 유형(약 15~19개). 난이도 A1~B2, 기계 채점.</p>
<p><b>전략.</b></p>
<ol><li>들으면서 발화의 기능을 분류한다. 요청이면 수락·거절, 질문이면 답, 제안이면 동의·대안, 사과면 괜찮다는 말.</li><li>선택지를 읽기 전에 자연스러운 답을 머릿속으로 예측한다.</li><li>발화의 단어를 그대로 재사용한 선택지는 함정일 확률이 높다. 정답은 의미와 기능에 맞고 어휘는 다르다.</li><li>의문사와 부정어를 놓치지 않는다. Would you mind는 Not at all이 수락이다.</li><li>확신이 없으면 중립적이고 협조적인 응답을 고른다. 한 문항에 오래 머물지 않는다.</li></ol>
<h3>5-2. Listen to a Conversation</h3>
<p><b>형식.</b> 두 화자(학생과 교수, 사서, 행정 직원, 학생 간)의 20~30초 대화에 2문항. 첫 문항은 대개 목적, 둘째는 세부나 추론.</p>
<p><b>전략.</b></p>
<ol><li>첫 5초에 화자 역할을, 첫 10~15초에 대화 목적을 잡는다.</li><li>문제 하나와 해결책 둘의 구조가 흔하다. 어떤 해결책이 채택됐고 다음 행동이 무엇인지 기억한다.</li><li>짧아서 노트는 최소로. 화자 표시(S, P)와 행동 항목만.</li></ol>
<h3>5-3. Listen to an Announcement</h3>
<p><b>형식.</b> 한 화자의 20~30초 안내(도서관, 박물관, 교통, 매장, 수업). 2문항. 목적과 세부(시간, 장소, 예외, 해야 할 행동).</p>
<p><b>전략.</b></p>
<ol><li>목적은 첫 문장에, 시험에 나오는 지시는 마지막 문장에 있다. 첫 문장을 듣고 긴장을 풀다가 마지막 지시를 놓치는 것이 대표적 실수다.</li><li>변경 신호어(instead, no longer, except, now, moved to)를 잡는다.</li><li>너무 짧아 노트를 쓰면 놓친다. 듣고 나서 답한다.</li></ol>
<h3>5-4. Listen to an Academic Talk</h3>
<p><b>형식.</b> 한 강사의 약 60~120초 강의 발췌에 4~5문항. 주제, 세부, 기능(왜 이 예를 들었나), 추론, 태도. 어려운 적응 경로에서만 나온다는 분석이 있다.</p>
<p><b>전략.</b></p>
<ol><li>주제와 정의는 첫 15~30초에 나온다. 노트 첫 줄에 MAIN을 적고 바로 채운다.</li><li>신호어(Now, So, Let me give you an example, However, What this means is)가 나오면 문항 자리다.</li><li>구조는 주장 1 + 예시 1~2 + 함의 1이 대부분이다. 예시가 무엇을 증명하는지 한 단어로 적는다.</li><li>노트는 5개 기호로: → 인과·순서, ~ 예시, − 대조, : 정의, ? 미해결 문제. 문장을 적지 않는다. 1분 음성에 4~5줄.</li><li>끝나면 10초 동안 머릿속으로 구조를 되짚고 문항으로 간다.</li></ol>
<p><b>연습법.</b> 60-Second Science, TED-Ed(5분 이하), 학술 팟캐스트를 스크립트 없이 1회 듣고 3줄 요약 → 스크립트 대조. 매일 30분(듣기 10 + 응답 예측 10 + 신형식 문항 10).</p>
<h2>6. Writing (12문항 · 23분 · 3유형)</h2>
<p>세 과제가 한 영역 타이머를 공유한다는 설명과 과제별 타이머(약 7 + 7 + 10)라는 설명이 갈린다. 어느 쪽이든 배분은 Build a Sentence 6~7분, Email 7분, Discussion 10분으로 잡는다.</p>
<h3>6-1. Build a Sentence</h3>
<p><b>형식.</b> 대화 한 줄(맥락)이 주어지고, 그에 대한 답 문장의 단어 5~8개가 흩어져 있다. 끌어다 순서를 맞춘다. 10문항, 약 6분 50초(문항당 약 40초). 일부 문항에는 쓰지 않는 단어(distractor)가 섞이거나 몇 단어가 고정돼 있다. 기계 채점, 전부 맞아야 1점.</p>
<p><b>전략(6단계).</b></p>
<ol><li>답 칸 끝의 문장부호를 본다. 마침표면 진술, 물음표면 의문문. 어순이 달라지니 먼저 정한다.</li><li>주어와 본동사를 찍어 뼈대를 세운다.</li><li>수 일치를 확인한다(The list of items is).</li><li>관계절은 수식하는 명사 바로 뒤, 관사·형용사는 명사 앞, 빈도부사는 본동사 앞, 시간·장소 표현은 문장 끝.</li><li>남은 단어를 배치하며 안 쓰이는 단어를 찾는다.</li><li>완성 문장을 속으로 읽고 넘어간다. 40초 안에.</li></ol>
<p><b>자주 틀리는 것.</b> 직접 의문문(Where is the office?)과 간접 의문문(Could you tell me where the office is?)의 어순 혼동. 시간 표현을 문장 가운데 넣기. 긴 주어 뒤 동사의 수 일치.</p>
<h3>6-2. Write an Email</h3>
<p><b>형식.</b> 상황 2~3문장 + 요구 요소 3개가 화면에 뜬다. 7분 안에 이메일을 쓴다. 밴드 5~6 답안은 보통 110~140단어. 톤은 상대(교수, 학장, 조교, 동료)에 따라 formal·semi-formal·casual. 채점은 내용 충실(3요소), 구성, 언어 정확성, 톤 적합성 네 축.</p>
<p><b>밴드 구분.</b></p>
<ul><li>6: 세 요소를 모두 충실히, 자연스러운 톤, 문장 구조 다양, 의미를 해치는 오류 없음.</li><li>5: 세 요소 모두 다룸, 적절한 톤, 독자를 혼란시키지 않는 사소한 오류.</li><li>4: 대부분 다룸, 톤이 약간 어긋남, 눈에 띄는 문법 오류.</li><li>4와 5를 가르는 것은 요소 누락과 톤이다.</li></ul>
<p><b>4문단 템플릿.</b></p>
<ol><li>인사 + 목적 한 문장(Dear Professor Kim, I am writing to ...).</li><li>상황 설명(요소 1). 구체적으로. I had a problem이 아니라 The projector I reserved arrived with a cracked lens.</li><li>요청 또는 제안(요소 2, 3). 정중한 조동사(could, would, may I).</li><li>마무리 한 문장 + 서명(Thank you for your time. Sincerely, 이름).</li></ol>
<p><b>시간 배분.</b> 0~1분 프롬프트 두 번 읽고 상대와 세 요소 표시 → 1~6분 작성 → 6~7분 오탈자·요소 누락 확인.</p>
<p><b>실수.</b> 요소 하나 빼먹기. 5문단 에세이 구조로 쓰기. 외운 도입문(In today's fast-paced world). 서명 생략. 사과 반복(톤을 해치고 단어 수만 늘린다). 딱딱한 템플릿을 그대로 붙이면 채점자가 알아본다는 지적도 있다. 뼈대만 외우고 살은 프롬프트 어휘로 채운다.</p>
<h3>6-3. Write for an Academic Discussion</h3>
<p><b>형식.</b> 교수의 게시글(질문으로 끝남) + 학생 두 명의 짧은 의견. 10분 안에 100~150단어. 구형식과 구조가 같다. 채점은 입장 명확성, 이유 전개, 동료 게시글과의 연결, 문법·어휘 정확성과 다양성.</p>
<p><b>5단계 구조.</b></p>
<ol><li>첫 문장에 입장(I believe that ... / While both views have merit, I side with ...).</li><li>동료 한 명을 이름으로 언급하며 동의 또는 반박(I agree with Claire that ..., but ...).</li><li>이유 하나를 2~3문장으로 전개.</li><li>구체적 예시 하나(For example, when my team ...).</li><li>한 문장 마무리(Therefore, ...).</li></ol>
<p><b>원칙.</b> 명료함이 복잡함을 이긴다. 짧고 정확한 100단어가 오류 많은 180단어보다 높다. 이유 두 개를 얕게보다 하나를 깊게. 첫 1분은 계획, 마지막 1분은 재검토. 개인 신념과 무관하게 가장 빨리 방어할 수 있는 입장을 고른다.</p>
<p><b>실수.</b> 입장을 숨기기, 동료 글 무시, 질문과 다른 답, 장황함.</p>
<h2>7. Speaking (11문항 · 8분 · 2유형)</h2>
<p>전 문항 준비시간 0초. 채점은 AI 엔진(음성을 텍스트로 전사한 뒤 루브릭 평가) + 사람 감독으로 알려져 있다. 그래서 마이크 품질과 발음 명료도가 곧 점수다. 전사가 안 되는 말은 채점되지 않는다. 억양(accent) 자체는 감점 요인이 아니다.</p>
<h3>7-1. Listen and Repeat</h3>
<p><b>형식.</b> 문장 7개를 한 번 듣고 삐 소리 뒤 그대로 따라 말한다. 화면에 텍스트 없음. 응답 시간은 1~2번 8초, 3~5번 10초, 6~7번 12초. 문장은 5~7단어에서 시작해 14~20단어(종속절, 수동태, 수식어 다수)까지 길어진다. 소재는 공항, 도서관, 호텔, 캠퍼스 같은 공공 상황. 문항당 0~5점, 합계 35점.</p>
<p><b>루브릭.</b></p>
<ul><li>5: 단어 누락·변경 없이 정확히 재생, 완전한 명료도, 자연스러운 리듬.</li><li>4: 기능어나 어미 정도의 사소한 변경, 의미 유지. 한 단어 실수가 4점이다.</li><li>3: 대체로 완성했지만 내용어 일부 누락·변경, 의미가 약간 바뀜.</li><li>2: 문장 조각, 핵심 내용 누락, 더듬거림.</li><li>1~0: 거의 알아들을 수 없음 또는 무응답.</li></ul>
<p><b>전략.</b></p>
<ol><li>단어가 아니라 의미 단위 2~4개로 듣는다. The library will close // two hours early // on Friday는 세 덩어리다. 내용어(명사, 동사, 숫자)를 붙잡고 기능어는 리듬에 태운다.</li><li>화자의 강세와 억양을 흉내낸다. 리듬을 복사하면 기억이 붙는다.</li><li>다 듣기 전에 답을 준비하지 않는다. 듣는 동안 말할 생각을 하면 뒷부분을 놓친다.</li><li>속도를 따라가려 하지 않는다. 또박또박 보통 속도로. 빠르면 오류가 늘고 전사가 깨진다.</li><li>단어 하나를 잊었으면 문법에 맞는 대체어를 넣고 끝까지 말한다. 침묵과 중단이 최악의 결과다. 불완전하지만 명료한 완성이 점수를 받는다.</li><li>늦게 시작해서 시간 안에 못 끝내는 것(truncation)이 흔한 실패다. 삐 소리 직후 바로 시작한다.</li></ol>
<p><b>연습법.</b> 매일 쉐도잉(듣고 즉시 따라 말하기). 1회 재생만으로 연습한다. 녹음 → 원문 대조 → 같은 문장 재녹음. 음성 인식(Google 음성 입력 등)으로 전사해 보면 발음이 통하는지 바로 안다. 이 vault의 모의고사와 매일 텔레그램 드릴이 이 루프다.</p>
<h3>7-2. Take an Interview</h3>
<p><b>형식.</b> 가상 면접자가 짧은 소개 뒤 질문 4개를 던진다. 질문마다 45초, 준비시간 없음. 질문은 음성으로 나오고(화면 텍스트 여부는 자료가 갈림), 주제는 일상·캠퍼스(공부 습관, 여행, 기술, 음식, 일과 삶). 문항당 0~5점, 합계 20점.</p>
<p><b>질문 4유형(순서대로 나오는 경향).</b></p>
<ol><li>경험 회상: Describe a time when ... / Tell me about a memorable ...</li><li>선호·감정: Do you prefer X or Y, and why? / How do you feel about ...</li><li>의견과 근거: Some people think ..., others ... What is your view?</li><li>정책·예측: What might happen if ... / Should governments ... / How will X change in ten years? 가장 어렵고 추상적이다.</li></ol>
<p><b>채점 4축(각 0~5, 평균).</b></p>
<ul><li>Delivery: 발음, 억양, 명료도. 중얼거림, 단조로운 톤, 어미 삼킴이 실점.</li><li>Language Use: 문법 정확성, 어휘 범위. 시제 오류, thing·good·very 반복이 실점.</li><li>Task Completion: 질문에 답했는가, 발전시켰는가. 25초에 멈추기, 질문 비켜가기가 실점.</li><li>Fluency: 속도, 리듬, 긴 멈춤 없음. 2초 이상 침묵, 다시 시작 반복이 실점.</li></ul>
<p><b>45초 골격.</b></p>
<table><thead><tr><th>구간</th><th>초</th><th>할 일</th></tr></thead><tbody><tr><td>오프너</td><td>0~5</td><td>생각할 시간을 사는 한 마디</td></tr><tr><td>입장</td><td>5~12</td><td>답을 한 문장으로. 12초 안에</td></tr><tr><td>이유·예시 1</td><td>12~25</td><td>구체적 장면 하나(누가, 언제, 어디서)</td></tr><tr><td>확장</td><td>25~38</td><td>두 번째 근거, 대조, 뉘앙스</td></tr><tr><td>마무리</td><td>38~45</td><td>입장을 한 문장으로 다시</td></tr></tbody></table>
<p>목표 42초 이상, 100~110단어. 30초 미만은 미발전으로 읽혀 밴드 3 근처에 갇힌다.</p>
<p><b>유형별 오프너(하나씩 몸에 붙이기).</b></p>
<ul><li>경험: That actually reminds me of something that happened last year, when ...</li><li>감정: My honest reaction would have to be that I really ...</li><li>의견: I think the most reasonable position here is that ...</li><li>정책·예측: There are a couple of angles worth considering here, but ...</li></ul>
<p><b>밴드 3에 갇히는 8가지 실수.</b></p>
<ol><li>첫 4초 침묵. 2. 25~30초에 멈춤. 3. 질문을 되풀이하며 8초 소모. 4. 외운 학술 표현(In contemporary society, it is widely acknowledged)으로 시작. AI가 암기로 판정한다. 5. 더 많이 말하려고 속도를 올림. 6. 말이 꼬였을 때 처음부터 다시 시작. 7. 4번 질문을 위해 힘을 아낌. 8. 4번이 무너졌을 때 패닉.</li></ol>
<p><b>팁.</b> 자연스러운 필러(well, actually, you know what)는 침묵보다 낫지만 um·uh는 3회 이하. 질문 일부를 놓쳤으면 들은 부분에 답한다. 채점은 루브릭 준수를 보지 질문 완벽 이해를 보지 않는다. 대화 톤으로 말한다. 발표 톤은 감점이다. 손을 움직이면 단어가 더 잘 떠오른다는 연구 인용도 있다.</p>
<p><b>연습법.</b> 하루 한 질문 45초 소리 내어 답하기. 글로 쓰지 않는다. 녹음 → 전사 → 문법 오류 표시 → 같은 질문 재녹음. 1주차 오프너+입장 5초 조각 반복, 2주차 유형별 8개 완성 답변, 3주차 헤드셋 끼고 4문항 연속 모의.</p>
<h2>8. 시험 당일</h2>
<ul><li>30분 전 도착. 여권 이름이 등록 이름과 철자 하나까지 같아야 한다. 다르면 입장 불가, 환불 없음.</li><li>휴대폰, 스마트워치, 메모, 음식 반입 불가. 연필과 메모지는 센터가 준다. 메모지는 시험 중에만 쓰고 반납한다. Home Edition은 지울 수 있는 화이트보드 사용, 시계 착용 금지, 마이크 내장 헤드셋 필수.</li><li>순서 고정(R → L → W → S), 휴식 없음. 화장실은 시작 전에. 비공식 휴식은 감시 아래 가능하지만 시계는 멈추지 않는다.</li><li>헤드셋과 마이크 점검 시간에 실제 목소리로 크게 확인한다. Speaking 전사가 마이크에 달렸다.</li><li>Reading·Listening에서 2단계가 어렵다고 느껴지면 잘 가고 있다는 뜻이다. 빈칸은 항상 채운다.</li><li>Speaking 인터뷰 전에 자세를 고쳐 앉고 숨을 고른다. 타이머는 곁눈으로만 본다.</li><li>성적은 최대 72시간 안에 ETS 계정에 뜬다.</li></ul>

<h2>11. 자료 간 불일치 메모</h2>
<ul><li>Reading·Listening 문항 수: ETS 공식 50·47 vs 분석 사이트 35~48·35~45(적응 경로별 실제 노출 수로 보임).</li><li>Reading 시간: ETS 30분 vs 일부 20~27분.</li><li>Academic Passage 길이: 200단어 5문항(다수) vs 600~700단어(한 사이트, 구형식 정보 혼입으로 보임).</li><li>Academic Talk 길이: 45~120초(다수) vs 2~3분(한 사이트).</li><li>Writing 타이머: 영역 공유 vs 과제별.</li><li>Interview 질문 텍스트 화면 표시 여부: 표시된다 vs 음성만.</li><li>Speaking·Writing 채점자: AI + 사람 감독(다수) vs 사람 전담(한 사이트).</li><li>어려운 경로·쉬운 경로의 밴드 상한(4.0)은 분석 사이트 추정이며 ETS는 공개하지 않았다.</li></ul>
<p>응시 직전 ETS 계정의 최신 안내와 TestReady 샘플로 확정한다.</p>
<h2>12. 유형·주제별 템플릿</h2>
<p>템플릿은 뼈대다. 문장은 프롬프트의 어휘로 채우고, 외운 문장을 그대로 붙이지 않는다. Speaking과 Writing 채점 엔진은 프롬프트와 무관한 암기 문장을 낮게 본다.</p>
<h3>12-1. Take an Interview: 질문 4유형 템플릿</h3>
<p><b>공통 골격(45초, 약 100단어).</b> 오프너 1문장 → 입장 1문장(12초 안) → 이유 + 구체적 장면 2~3문장 → 확장 1문장 → 마무리 1문장.</p>
<p><b>유형 1. 경험 회상 (Tell me about a time when ... / Describe a memorable ...)</b></p>
<ul><li>뼈대: That reminds me of [때] when I [상황]. What happened was [사건 1~2문장]. So I [행동]. In the end, [결과]. Looking back, [배운 점 한 문장].</li><li>예시(질문: Tell me about a time you had to learn a new skill quickly): That actually reminds me of last spring, when my team switched to a new analytics tool two weeks before a big client report. I had never used it, so every evening I followed one tutorial and then rebuilt one of our old charts in the new tool. By the second week I could produce the report on my own, and it went out on time. Looking back, the trick was practicing on real work instead of watching videos, because I remembered what I actually built.</li></ul>
<p><b>유형 2. 선호·비교 (Do you prefer X or Y? / How do you feel about ...)</b></p>
<ul><li>뼈대: Personally, I would go with [선택] most of the time. The main reason is [이유]. For instance, [구체 장면]. I can see why some people choose [반대편], especially when [조건], but for me [한 문장 결론].</li><li>예시(Do you prefer working from home or in an office?): Personally, I would go with the office most of the time. The main reason is that I make decisions faster when I can just turn around and ask someone. For instance, last month a pricing question that would have taken a day over chat got settled in a five-minute conversation at my desk. I can see why people prefer home, especially for deep focused writing, but for the kind of work I do, being in the same room saves more time than it costs.</li><li>피할 것: It depends로 시작하기. 시간을 쓰고 확신이 약해 보인다.</li></ul>
<p><b>유형 3. 의견과 근거 (Some people think ... others ... What is your view?)</b></p>
<ul><li>뼈대: I think the most reasonable position is that [입장]. The strongest reason is [이유]. Take [예시]: [장면]. Some would argue [반론], and that is fair, but [반박 한 문장]. So overall, [결론].</li><li>예시(Should universities require students to take courses outside their major?): I think the most reasonable position is that yes, they should require at least a few. The strongest reason is that the problems people face at work rarely stay inside one field. Take my own case: I studied business, but the most useful course I took was an introductory statistics class that I never would have chosen on my own. Some would argue students should decide for themselves, and that is fair, but at eighteen most of us do not know what we will need. So overall, a small requirement is worth it.</li></ul>
<p><b>유형 4. 정책·예측 (What might happen if ... / How will X change in ten years?)</b></p>
<ul><li>뼈대: There are a couple of angles here, but I would predict that [예측]. The reason is [추세나 원인]. We can already see this in [현재 증거]. One risk is [부작용], so [조건이나 대응]. Overall, [한 문장 결론].</li><li>예시(How will the way people travel change in the next ten years?): There are a couple of angles here, but I would predict that people will travel less often but stay longer. The reason is that remote work makes it possible to spend a month somewhere instead of a weekend. We can already see this in cities like Lisbon, where short-term rentals are full of people working during the day. One risk is that locals get priced out, so cities will probably add rules on rentals. Overall, travel will become slower and more like living somewhere for a while.</li></ul>
<p><b>주제별 소재 뱅크(미리 한 장면씩 준비).</b> 각 주제에 실제 있었던 일 하나를 30초 분량으로 정리해 둔다. 어떤 유형의 질문이 와도 같은 장면을 꺼내 쓸 수 있다.</p>
<table><thead><tr><th>주제</th><th>준비할 장면 하나</th><th>쓸 수 있는 어휘</th></tr></thead><tbody><tr><td>여행</td><td>계획이 틀어졌던 여행 한 번</td><td>itinerary, detour, off the beaten path, worth the hassle</td></tr><tr><td>기술·습관</td><td>앱 하나를 끊거나 들인 경험</td><td>notification, screen time, streamline, distraction</td></tr><tr><td>음식</td><td>직접 요리했거나 실패한 한 끼</td><td>from scratch, comfort food, portion, seasonal</td></tr><tr><td>일과 삶</td><td>야근이나 마감의 한 장면</td><td>deadline, trade-off, burnout, boundaries</td></tr><tr><td>학습</td><td>새 도구나 언어를 익힌 2주</td><td>hands-on, trial and error, consistent, plateau</td></tr><tr><td>도시 생활</td><td>출퇴근이나 동네의 변화</td><td>commute, walkable, gentrification, public transit</td></tr><tr><td>건강</td><td>운동 습관을 만든 계기</td><td>routine, stick to, energy level, recovery</td></tr><tr><td>돈</td><td>큰 소비나 절약 결정</td><td>budget, splurge, long-term value, impulse</td></tr><tr><td>사람</td><td>팀에서 갈등을 푼 경험</td><td>perspective, compromise, give credit, follow up</td></tr><tr><td>환경</td><td>일상에서 바꾼 소비 하나</td><td>single-use, footprint, incentive, convenience</td></tr></tbody></table>
<h3>12-2. Write an Email: 상황 5유형 템플릿</h3>
<p><b>공통 4문단.</b> ① 인사 + 목적 한 문장 ② 상황(요소 1) ③ 요청·제안(요소 2, 3) ④ 마무리 + 서명. 110~140단어. 요구 요소 3개를 순서대로, 문단을 나눠 다룬다.</p>
<p><b>톤 표.</b></p>
<table><thead><tr><th>상대</th><th>인사</th><th>요청 표현</th><th>마무리</th></tr></thead><tbody><tr><td>교수, 학장, 회사 (formal)</td><td>Dear Professor Lee, / Dear Ms. Park,</td><td>I would be grateful if you could ... / Would it be possible to ...</td><td>Thank you for your time and consideration. Sincerely, 성명</td></tr><tr><td>조교, 어드바이저, 담당자 (semi-formal)</td><td>Hi Dr. Chen, / Hello Mr. Ortiz,</td><td>Could you ... / I was wondering if ...</td><td>Thanks so much, 이름</td></tr><tr><td>동료, 친구 (casual)</td><td>Hi Jordan,</td><td>Can you ... / Would you mind ...</td><td>Thanks, see you Monday, 이름</td></tr></tbody></table>
<p><b>유형 A. 요청 (일정 변경, 추천서, 자료, 허가)</b></p>
<ul><li>뼈대: I am writing to ask whether [요청]. [상황과 이유 2문장]. Specifically, I would like to request [구체 내용]. If that is not possible, [대안]. Thank you for considering this.</li><li>예시(교수에게 시험 일정 변경 요청, 요소: 이유 설명, 대안 제시, 필요 서류 언급): Dear Professor Alvarez, I am writing to ask whether I could take the midterm on a different day. On March 12 I am scheduled to represent the department at the regional case competition, which was confirmed only last week. If possible, I would like to sit the exam during your office hours on March 10 or 11, whichever is more convenient for you. I can provide the invitation letter from the competition organizers if that would help. I understand this is an unusual request, and I am happy to take a different version of the paper. Thank you for your time and consideration. Sincerely, Minji Park</li></ul>
<p><b>유형 B. 문제 보고·항의 (파손, 오류, 서비스 불만)</b></p>
<ul><li>뼈대: I am writing regarding [주문·서비스 식별]. Unfortunately, [문제를 구체적으로]. This matters because [영향]. I would appreciate it if you could [해결책 1] or [해결책 2] by [기한]. Please let me know [확인 요청].</li><li>예시(공급업체에 파손 장비 보고, 요소: 무엇을 주문했고 무엇이 파손됐나, 행사에 미치는 영향, 해결 요청): Dear Customer Service Manager, I am writing regarding order 48213, two portable speakers delivered to the campus film club on Tuesday. When we opened the boxes, one speaker had a cracked casing and does not power on. This is a serious problem for us because the speakers are for our outdoor screening this Saturday, which more than a hundred students have registered for. I would appreciate it if you could send a replacement by Friday, or authorize a refund so that we can rent a unit locally. Could you also confirm how to return the damaged item? Thank you for your prompt attention. Sincerely, Daniel Cho, Treasurer, Campus Film Club</li><li>피할 것: 화난 어조, 사과 반복, 감정 표현. 사실과 요청만.</li></ul>
<p><b>유형 C. 사과·설명 (결석, 지연 제출, 실수)</b></p>
<ul><li>뼈대: I am writing to apologize for [무엇]. [이유 1~2문장, 변명이 아니라 사실]. I take responsibility for [책임]. To make up for it, I would like to [제안]. Please let me know if [상대의 조건].</li><li>예시(회의 불참 사과, 요소: 사유, 책임 인정, 보완 제안): Hi Dr. Chen, I am writing to apologize for missing our project meeting this morning. My train was stopped for forty minutes because of a signal failure, and by the time I had phone service the meeting was already over. I should have sent a message earlier, and I am sorry for the inconvenience to you and the team. To catch up, I have read the notes Priya posted and drafted the survey questions we were going to discuss. Could I stop by your office tomorrow afternoon for ten minutes to confirm the plan? Thanks so much, Robin</li></ul>
<p><b>유형 D. 제안 (행사, 개선, 협업)</b></p>
<ul><li>뼈대: I am writing to propose [제안]. Currently, [현황과 문제]. My suggestion is [구체 내용], which would [기대 효과]. I would be glad to [내가 할 일]. Would you be open to [다음 단계]?</li><li>예시(학생회에 스터디룸 예약 제도 개선 제안, 요소: 현재 문제, 제안, 본인 역할): Dear Student Council, I am writing to propose a change to the library study room booking system. Currently, rooms can be reserved a week in advance for the whole day, so many rooms sit empty while students search for a place to work. My suggestion is to limit each booking to three hours and to release rooms automatically if no one checks in within fifteen minutes. This would roughly double the number of students who can use the rooms during exam weeks. I would be glad to help draft the new rules and to survey students about their preferences. Would you be open to discussing this at the next council meeting? Best regards, Hana Kim</li></ul>
<p><b>유형 E. 문의·확인 (조건, 절차, 가능 여부)</b></p>
<ul><li>뼈대: I am writing to ask about [주제]. [내 상황 1~2문장]. Could you let me know [질문 1], [질문 2], and [질문 3]? [관련 정보 제공]. Thank you in advance.</li><li>예시(인턴십 담당자에게 조건 문의, 요소: 지원 자격, 근무 일정, 지원 서류): Dear Ms. Romero, I am writing to ask about the summer research internship advertised on the department website. I am a second-year economics student and I completed the introductory econometrics sequence last term. Could you let me know whether second-year students are eligible, what the expected weekly hours are, and which documents should be included in the application? I would also appreciate knowing whether the position can be combined with a part-time job on campus. Thank you in advance for your help. Sincerely, Jiho Lee</li></ul>
<h3>12-3. Write for an Academic Discussion: 입장 3유형 템플릿</h3>
<p><b>공통 5단계.</b> 입장 → 동료 언급 → 이유 → 예시 → 마무리. 100~150단어.</p>
<p><b>유형 A. 한쪽 전면 지지</b></p>
<ul><li>뼈대: I agree with [이름] that [입장]. In my view, the key reason is [이유]. For example, [구체 예]. [이름 2] raises a fair point about [반론], but [반박]. Therefore, [결론].</li></ul>
<p><b>유형 B. 반대 입장</b></p>
<ul><li>뼈대: While I understand [이름]'s point about [상대 논거], I disagree with the overall conclusion. [입장]. The main issue is [이유]. Consider [예시]. For that reason, [결론].</li></ul>
<p><b>유형 C. 조건부 입장 (가장 안전, 가장 흔함)</b></p>
<ul><li>뼈대: Both [이름 1] and [이름 2] make valid points, but I believe the answer depends on [조건]. When [조건 1], [입장 1]. However, when [조건 2], [입장 2]. In my experience, [예시]. So the best approach is [결론].</li></ul>
<p><b>예시(교수 질문: Should companies allow employees to choose their own working hours? 학생 Claire 찬성, Paul 반대).</b> Both Claire and Paul make valid points, but I believe the answer depends on the type of work. For roles that require constant coordination, such as customer support, fixed hours make sense, and Paul is right that a team cannot function if half of it is unavailable. However, for analytical or creative work, flexible hours tend to raise output rather than lower it. When my previous team was allowed to shift its hours, the people who did deep data work moved to early mornings and reported far fewer interruptions, and our delivery times actually improved. So the best approach is to set a few required overlap hours each day and leave the rest to the employee. That captures Claire's benefits without the coordination problems Paul describes.</p>
<p><b>표현 뱅크.</b></p>
<table><thead><tr><th>기능</th><th>표현</th></tr></thead><tbody><tr><td>입장</td><td>I side with ... / I am inclined to agree with ... / My position is that ...</td></tr><tr><td>동료 언급</td><td>Claire makes a strong point about ... / As Paul notes, ... / I see the appeal of Claire's view, but ...</td></tr><tr><td>이유</td><td>The key reason is ... / What matters most here is ...</td></tr><tr><td>예시</td><td>Consider ... / A case in point is ... / In my experience, ...</td></tr><tr><td>양보</td><td>Admittedly, ... / That said, ... / This is not to say that ...</td></tr><tr><td>마무리</td><td>For these reasons, ... / On balance, ... / That is why ...</td></tr></tbody></table>
<p><b>주제 뱅크와 준비 논거.</b> 교육(온라인 vs 대면, 필수 과목, 시험 폐지), 기술(SNS 규제, AI 과제 사용, 자동화와 고용), 환경(개인 vs 정부 책임, 탄소세, 도시 녹지), 경제(재택근무, 최저임금, 창업 지원), 사회(투표 연령, 공공 교통 무료화, 도시 집중). 주제마다 찬성 근거 하나, 반대 근거 하나, 개인 예시 하나를 미리 적어 둔다.</p>
<h3>12-4. Listen and Choose a Response: 기능별 발화와 자연스러운 응답</h3>
<table><thead><tr><th>발화 기능</th><th>발화 예</th><th>자연스러운 응답</th><th>함정 응답의 특징</th></tr></thead><tbody><tr><td>요청</td><td>Would you mind covering my shift on Thursday?</td><td>Not at all, what time does it start?</td><td>Thursday를 반복하지만 수락도 거절도 아닌 정보</td></tr><tr><td>제안</td><td>How about we split the reading before Monday?</td><td>Good idea, I will take the first half.</td><td>reading 단어를 쓴 무관한 진술</td></tr><tr><td>사과</td><td>I am so sorry I missed our meeting.</td><td>Do not worry about it, we can catch up tomorrow.</td><td>사과에 대한 질책이나 무관한 일정</td></tr><tr><td>확인 질문</td><td>The lab report is due Friday, right?</td><td>Actually, the professor moved it to Monday.</td><td>Friday를 반복하는 감탄문</td></tr><tr><td>거절</td><td>I am afraid I cannot make it to the review session.</td><td>That is too bad, I will send you my notes.</td><td>억지로 수락시키는 응답</td></tr><tr><td>불만</td><td>The printer on the second floor is out of order again.</td><td>Try the one in the library, it was working this morning.</td><td>프린터 사용법 설명</td></tr><tr><td>칭찬</td><td>Your presentation was really clear.</td><td>Thanks, I practiced it a few times last night.</td><td>겸손이 아닌 부정이나 무관한 화제</td></tr><tr><td>제의</td><td>Can I give you a ride to the station?</td><td>That would be great, if it is not out of your way.</td><td>역 위치 설명</td></tr><tr><td>도움 요청</td><td>Do you know where the registrar's office is?</td><td>It is on the first floor of the admin building, next to the cafe.</td><td>등록 절차 설명</td></tr><tr><td>의견 요청</td><td>What did you think of the guest lecture?</td><td>Honestly, the second half was much stronger than the first.</td><td>강사 이름 언급만</td></tr></tbody></table>
<p>원칙: 정답은 기능에 맞고(수락·거절·답·위로·정보), 어휘는 발화와 다르다. 발화 단어가 그대로 들어간 선택지부터 의심한다.</p>
<h3>12-5. Build a Sentence: 어순 패턴 8개</h3>
<table><thead><tr><th>패턴</th><th>규칙</th><th>예</th></tr></thead><tbody><tr><td>기본 진술</td><td>주어 + 동사 + 목적어 + 장소 + 시간</td><td>She submitted the report to the dean yesterday.</td></tr><tr><td>의문문</td><td>조동사 + 주어 + 본동사</td><td>Did you finish the assignment before class?</td></tr><tr><td>간접 의문문</td><td>의문사 뒤는 다시 평서 어순</td><td>Could you tell me where the office is?</td></tr><tr><td>관계절</td><td>수식받는 명사 바로 뒤</td><td>The tour guides who showed us around were fantastic.</td></tr><tr><td>빈도부사</td><td>be 뒤, 일반동사 앞</td><td>He is always late. / He always arrives late.</td></tr><tr><td>형용사 순서</td><td>의견 → 크기 → 나이 → 색 → 재료 + 명사</td><td>a beautiful small old wooden table</td></tr><tr><td>부정</td><td>do not / did not + 원형</td><td>I did not expect the exam to be that hard.</td></tr><tr><td>조건절</td><td>if절, 콤마, 주절 (또는 반대)</td><td>If the shuttle is late, we will miss the lecture.</td></tr></tbody></table>
<p>절차: 문장부호 → 주어·동사 → 수 일치 → 관계절과 수식어 → 시간·장소는 끝 → 남는 단어는 distractor → 속으로 읽기.</p>
<h3>12-6. Listen and Repeat: 청킹 예시</h3>
<table><thead><tr><th>문장</th><th>덩어리 3~4개</th></tr></thead><tbody><tr><td>The library will close two hours early on Friday.</td><td>The library will close // two hours early // on Friday</td></tr><tr><td>Could you save me a seat near the front of the auditorium?</td><td>Could you save me a seat // near the front // of the auditorium</td></tr><tr><td>Unless the shuttle comes soon, we will miss the first half of the lecture.</td><td>Unless the shuttle comes soon // we will miss // the first half // of the lecture</td></tr><tr><td>The advisor suggested that I take statistics before enrolling in research methods.</td><td>The advisor suggested // that I take statistics // before enrolling // in research methods</td></tr><tr><td>Although the cafeteria extended its hours, most students still eat off campus on weekends.</td><td>Although the cafeteria // extended its hours // most students still eat off campus // on weekends</td></tr></tbody></table>
<p>내용어(밑줄 칠 것)는 명사·동사·숫자·부정어다. 기능어는 리듬에 실려 따라온다. 첫 덩어리와 마지막 덩어리를 가장 강하게 기억한다. 가운데를 놓쳤으면 문법에 맞는 대체어로 채우고 끝까지 말한다.</p>
<h3>12-7. Complete the Words: 접미사와 품사 자리</h3>
<table><thead><tr><th>자리 신호</th><th>예상 품사</th><th>흔한 어미</th><th>예</th></tr></thead><tbody><tr><td>the, a, this, 형용사 뒤</td><td>명사</td><td>-tion, -sion, -ment, -ity, -ness, -ance, -ence, -ism</td><td>popu(lation), devel(opment), signif(icance)</td></tr><tr><td>be, become, seem 뒤 / 명사 앞</td><td>형용사</td><td>-al, -ical, -ive, -ous, -able, -ible, -ful, -less</td><td>signif(icant), conven(tional), consid(erable)</td></tr><tr><td>동사·형용사·문장 앞</td><td>부사</td><td>-ly, -ally, -ously</td><td>rig(orously), increa(singly)</td></tr><tr><td>조동사, to 뒤</td><td>동사 원형</td><td>-ate, -ize, -ify, -en</td><td>consol(idate), elimi(nate), clar(ify)</td></tr><tr><td>have, has 뒤 / 명사 뒤 수식</td><td>과거분사</td><td>-ed, -en</td><td>ado(pted), wri(tten)</td></tr><tr><td>be 뒤 능동 진행 / 전치사 뒤</td><td>현재분사·동명사</td><td>-ing</td><td>sacri(ficing), enrol(ling)</td></tr><tr><td>문장 앞, 콤마 앞뒤</td><td>연결어</td><td>고정형</td><td>how(ever), there(fore), alth(ough), desp(ite)</td></tr></tbody></table>
<p>절차: 빈칸 앞뒤 두 단어로 품사 자리 판단 → 보이는 글자로 어근 추정 → 어미 결정 → 시제·수 확인 → 철자 재확인(이중 자음, -ance/-ence, -able/-ible). 10초 넘게 막히면 가장 그럴듯한 형태를 쓰고 넘어간다.</p>

<script id="bank" type="application/json">{"reading": {"complete_the_words": [{"id": "ctw1", "topic": "Coral reefs and algae", "text": "Coral reefs depend on a partnership between animals and algae. The algae live inside coral tissue and sup{ply} most of the energy the polyps req{uire}. When water temperatures rise, this relati{onship} breaks down and the algae are expe{lled}, leaving the coral pale. Bleached colonies can rec{over} if cooler conditions ret{urn} quickly, but prol{onged} heat usually proves fatal. Because reefs shelter thou{sands} of species, their coll{apse} would reduce marine biodiv{ersity} across entire ocean basins and weaken coastal protection."}, {"id": "ctw2", "topic": "Printing and literacy in Europe", "text": "The spread of printing in fifteenth century Europe changed how knowledge circulated. Manuscripts had been copied by hand, so each volume was expe{nsive} and often contained errors intro{duced} by tired scribes. Printed editions were cheaper and more unif{orm}, which allowed schol{ars} in distant cities to disc{uss} the same page of the same text. Demand for books in local lang{uages} grew steadily, and printers respo{nded} by publishing gram{mars}, almanacs and pamphlets. Within two gener{ations}, literacy had beco{me} an ordinary expectation among urban merchants."}, {"id": "ctw3", "topic": "Ice cores as climate records", "text": "Ice sheets preserve a detailed record of the atmosphere. Snow that falls on Greenland traps tiny bub{bles} of air, and each annual layer is comp{ressed} by the weight of later snowfall. Drilling a core there allows resear{chers} to meas{ure} carbon dioxide concen{trations} from thousands of years ago. Volcanic erup{tions} appear as thin bands of sulfate, which help scientists assign accu{rate} dates to deeper sect{ions}. Because the deepest layers are stret{ched} and folded, however, the oldest part of the record remains diffi{cult} to interpret."}, {"id": "ctwg0_1", "topic": "Medicine: the placebo effect and double-blind clinical trials", "text": "Clinical trials must separate a drug's real effects from the mind's expectations. Patients who believe they are receiving medicine often report genuine impro{vement} even when given an inert pill. To control for this, researchers assign treat{ments} randomly and keep both doctors and subjects una{ware} of who gets what. This double-blind des{ign} reduces the chance that enthusiasm will dis{tort} the results. Critics note that the placebo response itself is biolog{ically} real, since expectation can al{ter} hormone release. Modern protocols ther{efore} treat it as a measurable vari{able} rather than a nuis{ance} to be ignored."}, {"id": "ctwg0_2", "topic": "Social science: the bystander effect and diffusion of responsibility", "text": "Why people fail to help a stranger in a crowd has puzzled psychologists for decades. Early experiments suggested that the larger the group, the less likely any witness is to inte{rvene}. Responsibility seems to be spread thinly across everyone present, so each onlooker waits for som{eone} else to act. Ambiguity deepens the diff{usion} of duty, since observers scan one another for confir{mation} that the trouble is real. Later work has qual{ified} this picture: when a threat is obv{ious} and helping costs little, witnesses move qui{ckly} and often act collec{tively}. Training that names the seve{rity} aloud breaks the spell of pass{ivity}."}, {"id": "ctwg0_3", "topic": "Economics: inflation expectations and central bank credibility", "text": "Central banks care as much about beliefs as about prices. If firms and households expect prices to rise, they antic{ipate} the increase by raising wa{ges} and contracts today, which helps the forecast come true. A bank with a strong reputation can therefore cool an economy with an announ{cement} rather than a painful recession. Once credi{bility} is lost, however, restoring it is slow and cos{tly}: interest rates must stay high until expect{ations} adj{ust}. Economists describe this as a wage-price spi{ral} that only a visible commi{tment} to price stab{ility} can interrupt."}, {"id": "ctwg0_4", "topic": "Psychology: working memory limits, chunking and cognitive load in teaching", "text": "Working memory is the mental workspace where we hold information for a few seconds. Its capa{city} is strictly limited, so most adults can juggle only a handful of items simulta{neously}. Anything held there decays within seconds unless we refresh it through silent rehe{arsal}. Learners cope by grouping details into larger units, a stra{tegy} called chun{king} that turns seven digits into two or three blocks. When a lesson presents unfam{iliar} terms and complex diagrams at once, the resulting over{load} damages perfo{rmance}. Good instr{uction} therefore sequences material so that each step feels almost effor{tless}."}, {"id": "ctwg0_5", "topic": "Life science and medicine: the gut microbiome and immune development", "text": "The human gut houses trillions of microbes that outnumber our own cells. These resident bact{eria} assist with dige{stion}, manufacture certain vita{mins}, and help train the imm{une} system during inf{ancy}. A diet rich in fiber tends to raise microbial dive{rsity}, while repeated courses of antib{iotics} can flatten it for months. Researchers link an unbalanced compo{sition} to chronic inflam{mation} and metabolic disease, though most evidence so far shows corre{lation} rather than causation. Transplanting stool from healthy donors has cured some stubborn infections, which suggests the community itself can be treated."}, {"id": "ctwg0_6", "topic": "Economics: network effects, switching costs and platform dominance", "text": "Some products become more useful as the number of users grows. A messaging app with few partic{ipants} is nearly worthless, whereas one with millions offers an enor{mous} adva{ntage} over any rival. Early leaders can lock in that lead because users face high swit{ching} costs once their contacts are already there. This creates a bar{rier} that even a better-designed service struggles to cross, and newc{omers} often fail to attract a crowd. Econo{mists} warn that such domi{nance} may eventually slow innov{ation}, so regul{ators} now study whether platforms should be forced to share data."}, {"id": "ctwg0_7", "topic": "Social science: survey sampling, nonresponse bias and statistical weighting", "text": "A good survey tries to describe a whole population by questioning only a small slice of it. Selecting respondents rand{omly} is supposed to make the sample represe{ntative}, but random selection is only the first step. If the people who refuse to res{pond} differ systema{tically} from those who agree, the results carry a hidden disto{rtion}. Busy workers and those unwi{lling} to discuss money are especially likely to disappear from the data. Statisticians try to repair the gap by weig{hting} answers, yet no adjus{tment} can fully restore lost opin{ions}, so claims of high confi{dence} deserve caution."}, {"id": "ctwg0_8", "topic": "Life science and medicine: sleep stages, memory consolidation and school start times", "text": "Sleep is not simply a pause in mental activity but an active period of brain maintenance. During deep stages the hippocampus appears to rep{lay} the day's experiences, which stren{gthens} the neural patt{erns} that support later recall. Dream sleep seems to handle emotional material, blunting the sting of upsetting memories grad{ually}. Experiments show that students who study and then sleep outperform those who stay awake, even when total practice time is identical. Chronic depri{vation} disrupts horm{ones} that regulate appetite and makes atte{ntion} unreliable. Because teenage body clocks shift later, early school sche{dules} may seri{ously} limit consol{idation}."}, {"id": "ctwg1_1", "topic": "Lightning in volcanic ash clouds", "text": "Explosive volcanic eruptions can generate lightning within towering ash clouds. As magma fragments viol{ently}, hot gas carries ash part{icles} upward at different speeds. Frequent colli{sions} cause electri{fication} as electrons move between grains, creating posi{tive} and nega{tive} regions. When voltage becomes suffic{iently} large, the cloud disch{arges} energy through a luminous channel. These flashes momen{tarily} illuminate the plume and allow observers to estimate how vigor{ously} material is rising. This electrical activity may continue long after sunset."}, {"id": "ctwg1_2", "topic": "Water-bearing minerals on asteroids", "text": "Some asteroids contain minerals that formed through contact with liquid water. Astron{omers} analyze refl{ected} sunlight to identify subtle absor{ption} bands in an asteroid's spectrum. Hydr{ated} compounds absorb parti{cular} wavelengths because their molecules vibrate at charact{eristic} frequencies. By comparing laboratory measurements with telescope data, researchers can clas{sify} surface materials and infer whether chemical alter{ation} occurred early in the solar system. Such evidence is valu{able} because many small bodies preserve ancient conditions that planets later erased through heating and geolo{gical} activity."}, {"id": "ctwg1_3", "topic": "Zeolite catalysts in petroleum refining", "text": "Zeolites are crystalline minerals whose tiny pores can accelerate chemical reactions. Their fram{ework} cont{ains} channels of uni{form} size, so only suit{ably} shaped mole{cules} can enter. Inside these conf{ined} spaces, aci{dic} sites rear{range} hydro{carbon} chains without being cons{umed}. This selectivity reduces unwanted by-products and allows refineries to obtain more gasoline from heavy oil. However, carbon deposits gradually block the pores, so operators must regenerate the catalyst by burning the residue under controlled conditions."}, {"id": "ctwg1_4", "topic": "Ancient pollen and landscape reconstruction", "text": "Archaeologists often study ancient pollen to reconstruct landscapes surrounding human settlements. Because each plant prod{uces} grains with a disti{nctive} shape, speci{alists} can iden{tify} many taxa under a micro{scope}. Layers of lake mud pres{erve} these grains chronologically, creating a sequ{ence} of veget{ation} change. If cereal pollen and char{coal} sudd{enly} increase, researchers may infer land clearance, farming, or repeated burning. Yet wind can carry pollen far from its source, so conclusions remain probabilistic rather than exact."}, {"id": "ctwg1_5", "topic": "Durability of ancient Roman marine concrete", "text": "Ancient Roman builders sometimes used volcanic ash in concrete exposed to seawater. When seaw{ater} ent{ered} micro{scopic} cracks, it rea{cted} with ash and prod{uced} new min{eral} crys{tals}. These crystals grew through the mate{rial}, streng{thening} bound{aries} that would otherwise remain weak. Modern concrete is usually designed to resist chemical change, but the ancient mixture could benefit from slow reactions. Researchers study this process to develop durable marine structures, although reproducing the original ingredients and curing conditions remains difficult."}, {"id": "ctwg1_6", "topic": "Identifying elements in stellar spectra", "text": "A star's spectrum reveals which chemical elements are present in its atmosphere. Each ele{ment} abs{orbs} light at a uni{que} set of wavel{engths}, leaving a pat{tern} of dark lines. Because the lines shift with tempe{rature} and pres{sure}, astron{omers} compare observ{ations} with care{fully} calibrated laboratory spectra. The method can estimate composition even when a star is too distant to image directly. However, motion, magnetic fields, and overlapping lines can complicate interpretation, so several independent measurements are normally combined."}, {"id": "ctwg1_7", "topic": "Tracing prehistoric obsidian trade", "text": "Obsidian tools can reveal how goods moved across prehistoric trade networks. Volc{anic} glass from each sou{rce} has a disti{nctive} chem{ical} sign{ature} cre{ated} by trace elem{ents}. Resea{rchers} measure these elements with portable instr{uments} and compare the results to geolo{gical} samples. If a blade matches a quarry hundreds of kilometers away, the connection indicates exchange, migration, or indirect transfer between communities. Yet sourcing cannot show who carried the object or why it changed hands, so archaeological context remains essential."}, {"id": "ctwg1_8", "topic": "Geomagnetic reversals recorded in lava", "text": "Cooling lava can preserve the direction of Earth's magnetic field. Iron-bearing mine{rals} al{ign} with the field while the rock rem{ains} mol{ten}, then bec{ome} fixed as it solid{ifies}. When geolo{gists} sample succe{ssive} flows, they some{times} find that older rocks point oppo{site} to the modern field. These reversals occurred irregularly, but matching their sequence with dated layers helps correlate volcanic deposits across broad regions. The record also supports the idea that Earth's liquid outer core generates a dynamic field rather than a permanent one."}, {"id": "ctwg2_1", "topic": "Arts and architecture: Brutalism, exposed concrete as honest structure, civic housing ideals, hostility to pedestrians, preservation versus demolition", "text": "Brutalist buildings have long divided critics and the public alike. Their exposed concrete surfaces were meant to express stru{cture} honestly rather than hide it behind decor{ation}. Architects in the 1950s saw the material as democ{ratic}, cheap enough to build housing and civic centers at scale. Critics comp{lain} that the gray slabs weather badly and feel hos{tile} to pedes{trians}. Preservationists respond that demol{ishing} these landmarks erases a serious exper{iment} in social design. Recent renov{ations} suggest the style can be softened with planting and bright inte{riors} without betraying its origins."}, {"id": "ctwg2_2", "topic": "Technology and computing: compiler optimization, dead code elimination, loop hoisting, inlining, provable safety and benchmarking real workloads", "text": "Compilers do far more than translate source code into machine instructions. A modern compiler analyzes a program and rewrites it for speed without changing its beha{vior}. It may remove calcul{ations} whose results are never used, move repeated work outside a loop, or replace a function call by inse{rting} the body dire{ctly}. These transfo{rmations} must be prov{ably} safe, since a faster program that produces wrong answers is use{less}. Optimization also involves tradeoffs: aggressive inlining can swell the binary and hurt cache perfo{rmance}. Engineers therefore mea{sure} real workloads instead of trusting intu{ition}."}, {"id": "ctwg2_3", "topic": "Literature: the unreliable narrator, distorted reporting, textual clues and inconsistencies, reader reconstruction of the truth", "text": "Some novels invite readers to doubt the very voice telling the story. An unreliable narrator reports events with gaps, excuses, or outright disto{rtions} that the attentive reader must correct. The technique creates a second, silent conver{sation} between author and audi{ence}. Clues often appear as small inconsi{stencies} in dates or names, or as a tone that feels too defe{nsive}. Because the reader must actively recon{struct} the truth, the story becomes an exer{cise} in judg{ment} rather than passive consu{mption}. Writers who use it well leave just enough evidence for the deception to be dete{cted} eventually."}, {"id": "ctwg2_4", "topic": "Engineering: wind-induced torsion in long suspension bridges, the Tacoma Narrows failure, wind tunnel testing, slotted decks and tuned mass dampers", "text": "Long suspension bridges must resist wind as well as weight. A flexible deck hung from cables can twist when steady airflow feeds energy into its natural vibr{ation}. The 1940 collapse of the Tacoma Narrows Bridge made this dan{ger} famous and changed engineering prac{tice}. Designers now test scale models in wind tunnels before granting final appr{oval}. Open trusses and slotted decks let air pass through, lowering the pres{sure} difference that drives the motion. Tuned mass dampers add contr{olled} resistance, conve{rting} sway into heat. Such measures add cost, but the alter{native} is a stru{cture} whose stab{ility} depends on luck."}, {"id": "ctwg2_5", "topic": "Arts: film editing, compression and expansion of time, continuity editing versus montage, sound bridges across visual cuts", "text": "Film editing shapes how an audience experiences time. By cutting between shots, an editor can compress hours into sec{onds} or stretch a single gesture into an unbea{rable} pause. Continuity editing hides these joins so the story feels conti{nuous}, while montage makes the cuts visible to force a compa{rison}. Early directors disco{vered} that two neutral images placed together produce a mea{ning} neither carries alone. Sound adds another layer: a line of dialogue can bridge a visual break so smoothly that viewers never not{ice} it. Because the choices are usu{ally} invisible, editing remains the least recog{nized} of the major cine{matic} crafts."}, {"id": "ctwg2_6", "topic": "Computing: error-correcting codes, parity bits, interleaving on compact discs, matching code strength to expected noise", "text": "Every digital message risks corruption on its way to a reader. Error-correcting codes add carefully chosen redun{dancy} so that a damaged block can be rest{ored} without being resent. A simple parity bit only rev{eals} that something went wrong; stronger codes locate the faulty bits and flip them automa{tically}. Compact discs survive scratches because their data is inter{leaved} across the surface, spreading physical dam{age} thinly. Satellite links and hard drives rely on the same mathe{matics}. The cost is extra storage and compu{tation}, so designers choose a code whose stre{ngth} matches the expected noise rather than the worst case imagi{nable}."}, {"id": "ctwg2_7", "topic": "Arts and technology: typeface design, letterform rhythm and spacing, pixel grids and hinting on early screens, return to questions of proportion", "text": "Typeface design balances personal expression against the demands of reading. A letterform that looks striking in a logo may become tiring when repe{ated} across hund{reds} of pages. Designers adj{ust} the height of lowercase letters, the weight of each str{oke}, and the spacing between pairs to keep the rhythm even. Screens introduced new const{raints}, since early displays rend{ered} curves on a coarse grid of pixels. Hinting instructions told the machine which outlines to snap to whole pixels, a ted{ious} compr{omise}. Higher resol{utions} have largely removed that burden, so attention has shifted back to subtle matters of propo{rtion}."}, {"id": "ctwg2_8", "topic": "Technology: open-source software maintenance, unpaid maintainers and burnout, corporate free riding, funding and shared governance", "text": "Most widely used software depends on code written by volunteers. A single library may be inst{alled} millions of times while its upkeep rests on one or two unpaid maint{ainers}. When those volunteers burn out or walk away, projects stag{nate} and security patches arrive late. Companies that profit from this work often contr{ibute} nothing back. Recent grants aim to pay for this invi{sible} labor dire{ctly}. Money alone cannot settle disputes over a project's goals or the respons{ibility} for breaking changes. Healthy ecosystems therefore need shared gover{nance}, clear docume{ntation}, and enough contributors that no single depa{rture} is fatal."}, {"id": "ctwg3_1", "topic": "Contour hedgerows and soil conservation", "text": "Contour hedgerows can protect sloping farmland during intense rain. Dense veget{ation} red{uces} runoff speed and traps soil that would otherwise move downhill. This controlled move{ment} of sediment grad{ually} builds small terraces that preserve fert{ility}. The roots also create habitat for benef{icial} orga{nisms} and stabilize the slope during storms. However, far{mers} must prune the hedges carefully, because unmanaged growth can compete with crops for sunlight and water. When local species are chosen, the method prevents dang{erous} erosion while supporting susta{inable} production with little machinery."}, {"id": "ctwg3_2", "topic": "Language nests and revitalization", "text": "Language nests immerse young children in a community's endangered language. Flu{ent} elders lead games, meals, and outdoor activ{ities}, so children hear the language used natu{rally} rather than as a classroom exercise. Repeated interaction improves pronun{ciation} while stories transmit tradi{tional} ecological know{ledge}. The approach also encou{rages} a close relati{onship} between generations and gives families confidence to speak at home. Although language devel{opment} requires long-term funding, programs are most succe{ssful} when parents participate and local communities control the curriculum."}, {"id": "ctwg3_3", "topic": "Food residues in ancient pottery", "text": "Ancient cooking pots can preserve chemical traces of meals for thousands of years. Resea{rchers} extract fat mole{cules} from porous clay and compare their disti{nctive} chemical patterns with modern reference materials. Certain compounds can iden{tify} dairy prod{ucts}, fish, or plant oils, revealing food choices that bones alone may miss. Yet interpr{etation} is difficult because soil, handling, and museum treatments can cause contam{ination}. Scholars therefore test nearby sediment and replicate results care{fully}. Combined with vessel shape and settl{ement} evidence, lipid analysis provides a richer account of cult{ural} practices and the emergence of specialized cuisine."}, {"id": "ctwg3_4", "topic": "Wildflower corridors on farmland", "text": "Wildflower corridors connect patches of habitat across intensively managed farmland. By supplying conti{nuous} nectar from spring through autumn, these strips help ins{ects} disp{erse} between fields and reproduce more succes{sfully}. Greater gen{etic} dive{rsity} can make an isol{ated} popul{ation} less vulnerable to disease or sudden weather shifts. Corridors may also support predators that suppress crop pests. However, their value depends on flower selection, pesticide timing, and placement within the agricu{ltural} landscape. Farmers must plan care{fully} so the habitat complements production instead of obstructing machinery."}, {"id": "ctwg3_5", "topic": "Evidentiality in grammar", "text": "Some languages require speakers to indicate how they obtained particular information. Gramm{atical} mar{kers} may disti{nguish} what was witnessed dire{ctly} from what was inferred, repo{rted}, or merely unce{rtain}. These categories do not determine whether a stat{ement} is trut{hful}. Instead, they direct attention to the source of knowledge and can automa{tically} signal a speaker's degree of commitment. In conversation, choosing one form over another may sound cautious, confident, or evasive. Linguists study such systems because they reveal how grammar organizes evidence and assigns respons{ibility} during social interaction."}, {"id": "ctwg3_6", "topic": "Seasonal mobility among pastoralists", "text": "Mobile pastoralists move livestock between seasonal grazing areas rather than settling permanently. Their annual schedule resp{onds} to vari{able} rainfall and the seasonal availa{bility} of water. By leaving a pasture before plants are exhausted, herders may prevent dang{erous} land degra{dation} and preserve future forage. This flexi{bility} depends on tradi{tional} agreements that grant temporary access to wells and routes. Modern borders, private farms, and conservation zones increa{singly} rest{rict} those arrang{ements}. Anthropologists therefore view mobility not as aimless wandering but as a carefully coordinated adaptation to environments where resources shift across space and time."}, {"id": "ctwg3_7", "topic": "Water management in rice cultivation", "text": "Flooded rice fields create oxygen-poor soils where methane-producing microbes thrive. Period{ically} drai{ning} paddies intro{duces} oxy{gen} into the soil and inter{rupts} this micr{obial} acti{vity}, reducing emissions substa{ntially}. The manag{ement} technique, often called alternate wetting and drying, can also conserve irrig{ation} water without lowering yields. However, fields must not remain dry during sensitive stages of plant growth. Farmers need reliable water control and careful coordination with neighboring farms. Where those conditions exist, the method can reduce agriculture's climate impact while maintaining an essential food supply."}, {"id": "ctwg3_8", "topic": "Kinship vocabulary and social organization", "text": "Kinship vocabularies classify relatives differently across languages and societies. One system may make a sharp disti{nction} between mate{rnal} and pate{rnal} uncles, while another applies one term to both relatives. Such termi{nology} often refl{ects} social oblig{ations}, residence patterns, or rules of inher{itance}. It does not automa{tically} describe emotional closeness or a fixed biolo{gical} relati{onship}. To understand a category, anthropologists observe how people address relatives, request assistance, and discuss family duties. The words matter because classification can guide expectations about care, authority, and cooperation."}], "daily_life": [{"id": "dl1", "kind": "notice", "title": "Temporary Closure of the Third Floor Reading Room", "text": "The third floor reading room will be closed from Monday, March 9 to Friday, March 20 for ceiling repairs.\nStudy carrels on the second floor will remain open until midnight during this period.\nReserved textbooks normally shelved on the third floor may be collected at the ground floor service desk.\nGroup study rooms must be booked online.", "questions": [{"stem": "Why will the reading room be closed?", "options": ["To install new shelving", "To repair the ceiling", "To add more seats", "To replace the computers"], "answer": 1, "explain_ko": "첫 문장에서 천장 수리 때문에 폐쇄한다고 명시한다. 서가 교체나 좌석 확장은 언급되지 않는다."}, {"stem": "Where can students pick up reserved textbooks during the closure?", "options": ["From the second floor study carrels", "By reserving a group study room online", "At the service desk on the ground floor", "From a cart outside the reading room"], "answer": 2, "explain_ko": "지정 도서는 1층 서비스 데스크에서 받으라고 안내한다. 2층은 열람석만 이용할 수 있다."}]}, {"id": "dl2", "kind": "email", "title": "Water shutoff and laundry room relocation", "text": "From: Daniel Ortiz, Housing Office\nTo: All residents of Maple Hall\nSubject: Water shutoff and laundry room relocation\n\nDear residents,\n\nWater will be shut off in Maple Hall on Thursday, April 16, between 8:00 a.m. and 4:00 p.m. so that the building's aging pipes can be replaced. Please fill a container with drinking water the night before, as no water will be available on any floor during those hours.\n\nThe basement laundry room will stay closed for an additional day while the machines are reconnected. Residents may use the laundry facilities in Birch Hall free of charge on Thursday and Friday; simply show your student card at the entrance.\n\nIf the work finishes early, I will post an update on the lobby bulletin board rather than sending a second email.\n\nDaniel", "questions": [{"stem": "What is the main purpose of this email?", "options": ["To announce a water shutoff and explain temporary laundry arrangements", "To ask residents to help pay for the new pipes", "To tell Maple Hall residents that they must move to Birch Hall", "To remind residents of the rules for using washing machines"], "answer": 0, "explain_ko": "단수 공사 안내와 임시 세탁 시설 이용 방법이 본문의 핵심이다. 비용 부담이나 이사 요구는 없다."}, {"stem": "What does the writer ask residents to do before Thursday?", "options": ["Turn off the taps in their rooms", "Move their laundry to the basement", "Store some drinking water", "Collect a free pass for Birch Hall"], "answer": 2, "explain_ko": "전날 밤에 마실 물을 미리 받아 두라고 요청한다. 공사 시간에는 어느 층에서도 물이 나오지 않는다."}, {"stem": "How will residents find out if the repairs finish ahead of schedule?", "options": ["They will receive a second email from the housing office.", "They will see a notice on the lobby bulletin board.", "They will be told by staff at the Birch Hall entrance.", "They will have to telephone Daniel Ortiz."], "answer": 1, "explain_ko": "작업이 일찍 끝나면 추가 이메일 대신 로비 게시판에 알린다고 했다."}]}, {"id": "dl3", "kind": "message", "title": "Career fair tomorrow", "text": "Jisoo: Are you going to the career fair tomorrow? I heard the engineering firms only stay until noon.\nMarco: I have a lab report due at two, so I was planning to skip it.\nJisoo: Bring your resume anyway. Two companies are taking applications on the spot.\nMarco: Fine. Meet me at the north entrance at nine.", "questions": [{"stem": "Why did Marco plan not to attend the career fair?", "options": ["He has already sent his resume to the firms.", "He believes the engineering firms will not come.", "He has to work at his part time job in the morning.", "He must finish a lab report due that afternoon."], "answer": 3, "explain_ko": "마르코는 두 시에 제출할 실험 보고서 때문에 가지 않을 계획이었다고 말한다."}, {"stem": "What do the two speakers finally agree to do?", "options": ["Apply online instead of attending the fair", "Meet after Marco submits his report", "Meet at the north entrance at nine o'clock", "Print copies of Marco's resume together"], "answer": 2, "explain_ko": "마지막 줄에서 아홉 시에 북쪽 입구에서 만나기로 정한다."}]}, {"id": "dl4", "kind": "schedule", "title": "Volunteer Orientation Schedule, Saturday, October 4", "text": "9:00 Check in at Room 214 and collect a name badge\n9:30 Introduction to the food bank's sorting system\n10:15 Safety training, required before any warehouse shift\n11:00 Choose a weekly time slot with the coordinator\n11:30 Optional tour of the delivery center\nLunch is not provided; the cafeteria closes at eleven on Saturdays.", "questions": [{"stem": "Which part of the orientation is optional?", "options": ["Collecting a name badge", "The safety training", "Choosing a weekly time slot", "The tour of the delivery center"], "answer": 3, "explain_ko": "배송 센터 견학만 선택 사항으로 표시되어 있다. 안전 교육은 필수라고 명시된다."}, {"stem": "What must volunteers do before taking a shift in the warehouse?", "options": ["Buy lunch in the cafeteria", "Complete the safety training", "Visit the delivery center", "Sign in with the coordinator at eleven thirty"], "answer": 1, "explain_ko": "창고 근무 전에 안전 교육을 반드시 이수해야 한다고 적혀 있다."}]}, {"id": "dlg0_1", "kind": "notice", "title": "Paid Participants Needed: Sleep and Word Recall Study", "text": "The Department of Psychology is recruiting participants for a study on sleep and word recall.\nSessions run on two consecutive evenings, 8:00 p.m. to 10:00 p.m., in Hale Hall 112.\nParticipants must avoid caffeine after twelve noon on both days. Anyone who forgets will be rescheduled rather than turned away.\nPayment is forty dollars, added to your campus card within three weeks of the second session.\nStudents currently enrolled in Psychology 210 may not take part, since the design of this study is covered in that course.", "questions": [{"stem": "What are participants required to do on the days of the study?", "options": ["Eat dinner in Hale Hall before the session", "Arrive three weeks before the first evening", "Take a word recall quiz in Psychology 210", "Skip caffeine after twelve noon"], "answer": 3, "explain_ko": "두 날 모두 정오 이후 카페인을 피하라고 분명히 나와 있어. 저녁 식사나 사전 퀴즈 얘기는 없어."}, {"stem": "What does the notice suggest about students enrolled in Psychology 210?", "options": ["They are paid more than other participants", "They already know how the study works", "They must attend both evening sessions", "They get campus card credit automatically"], "answer": 1, "explain_ko": "그 수업에서 연구 설계를 다룬다고 했으니 이미 알고 있다는 뜻이야. 돈을 더 받는다는 말은 전혀 없어."}, {"stem": "How will participants be paid?", "options": ["Through a refund on their course fees", "As credit added to their campus card", "With a check mailed to their home", "In cash at the end of the second evening"], "answer": 1, "explain_ko": "캠퍼스 카드에 적립되는 방식이라고 했어. 현금이나 수표는 언급되지 않아."}]}, {"id": "dlg0_2", "kind": "email", "title": "Before Thursday: Biosafety Module and Lab Dress Code", "text": "Dear Biology 240 students,\n\nYour first microbiology session meets this Thursday. Before you come, finish the online biosafety module in the course portal. The door code for the teaching lab will not be released to anyone whose module still shows as incomplete.\n\nBring a buttoned lab coat and closed shoes. The department lends coats, but we own only ten, so plan accordingly.\n\nFood and drinks, water bottles included, stay outside the lab.\n\nIf you are pregnant or immunocompromised, email me privately this week and I will arrange a different bench assignment.\n\nDr. Reyes, teaching lab coordinator", "questions": [{"stem": "Why did the coordinator send this email?", "options": ["To offer free lab coats to anyone who asks", "To announce that the first lab has been moved", "To recruit volunteers for a biosafety research project", "To explain what students must finish and bring before the lab"], "answer": 3, "explain_ko": "실험 전에 끝내야 할 모듈과 준비물을 알려주는 메일이야. 일정 변경이나 모집 내용은 아니야."}, {"stem": "Where should students leave water bottles?", "options": ["In the teaching lab refrigerator", "Outside the lab, not inside it", "On the bench beside their lab coat", "At the front desk of the department"], "answer": 1, "explain_ko": "물병까지 포함해서 음식물은 실험실 밖에 두라고 했어. 냉장고에 넣으라는 말은 없어."}, {"stem": "What can be inferred about borrowing a lab coat?", "options": ["Students who ask late may find none available", "Coats are free only for students who finish the module", "Only pregnant students may borrow one", "Coats must be returned the same afternoon"], "answer": 0, "explain_ko": "열 벌뿐이라 미리 준비하라고 했으니 늦으면 못 빌릴 수 있다는 뜻이야. 반납 시간은 안 나와."}]}, {"id": "dlg0_3", "kind": "text_message", "title": "Econ Problem Set, Question 4", "text": "Mina: Did anyone else get a negative value for question 4 on the econ set?\n\nJae: Mine went negative too, until I noticed the tax is per unit, not a percentage.\n\nMina: Oh. That explains the weird graph I drew.\n\nJae: Also, office hours moved to 3:00 today. Professor Ruiz has a faculty meeting at 4:00.\n\nMina: I have lab until 3:30. Can you ask her whether we upload one file or two?\n\nJae: Sure. And the tutoring center is open until 8:00 if you still need help after lab.\n\nMina: Perfect. I will head straight there.", "questions": [{"stem": "Why did Jae get a negative value at first?", "options": ["The tutoring center gave incorrect advice", "The graph in the textbook was printed wrong", "Question 4 asked for two separate files", "The tax was treated as a percentage"], "answer": 3, "explain_ko": "단위당 세금인데 퍼센트로 봤다가 음수가 나왔다고 했어. 인쇄 오류 얘기는 없어."}, {"stem": "Why will Mina miss office hours?", "options": ["She plans to visit the tutoring center instead", "Professor Ruiz canceled them for a faculty meeting", "Her lab ends after the new starting time", "She has already solved question 4"], "answer": 2, "explain_ko": "3시로 옮겨졌는데 실험이 3시 30분에 끝나서 못 가는 거야. 교수님이 취소한 건 아니야."}, {"stem": "What will Jae ask the professor?", "options": ["Whether the work is submitted as one file or two", "Whether office hours can return to the usual time", "Whether the tutoring center closes at eight", "Whether the tax is per unit or a percentage"], "answer": 0, "explain_ko": "미나가 제출 파일 개수를 물어봐 달라고 부탁했어. 세금 문제는 둘이 이미 해결했지."}]}, {"id": "dlg0_4", "kind": "menu", "title": "Hollis Hall Teaching Kitchen, Lunch for the Week of April 6", "text": "Lentil and barley soup, 4.25. Vegan; contains gluten.\nGrilled chicken bowl with brown rice, 7.50. Add avocado for 1.00.\nRoasted squash salad, 6.00. Contains tree nuts; ask for it without the walnut topping.\nYogurt parfait, 3.75. Made with oat milk on Wednesdays only.\n\nEvery dish i
