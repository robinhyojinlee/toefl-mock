ype": "organization", "stem": "How does the professor organize the lecture?", "options": ["By describing a carbon-transport process, examining one controlling factor, and discussing a climate implication", "By presenting several historical theories about the origin of plankton", "By listing ocean organisms from largest to smallest", "By comparing carbon storage in oceans, forests, and deserts"], "answer": 0, "explain_ko": "탄소가 심해로 이동하는 과정을 소개하고 침강 속도의 영향을 설명한 뒤 기후 모델에 주는 의미를 다뤄. 과정과 조절 요인, 함의 순서로 구성돼."}]}, {"id": "tkg2_1", "subject": "Architecture", "speaker": "W", "text": "Now, long before mechanical air conditioning, builders in hot dry regions still managed to keep interiors comfortable. How? They used the walls themselves as a kind of battery for heat. Here is the claim I want to defend today. Thick masonry walls work not because they block heat, but because they delay it. Think about a heavy adobe or stone wall. During the day, sunlight warms the outer surface, and that heat starts moving inward. But masonry conducts heat slowly. By the time the heat reaches the inner face, the sun has already gone down. And at night, when the desert air turns cold, the wall releases the stored heat back into the room and back outside. Engineers call this time lag, or thermal mass. Let me give you an example. In the traditional courtyard houses of southern Spain and North Africa, walls can be nearly a meter thick. Measurements show indoor temperatures swinging only a few degrees while outdoor temperatures swing by twenty or more. However, and this is important, thermal mass only helps where day and night temperatures differ sharply. In a humid tropical climate, where nights stay warm, a heavy wall never gets a chance to discharge. It just stays hot, and the building turns into an oven. So the implication for modern design is this. There is no universally good wall. The right envelope depends on the daily temperature cycle of the site, which is why copying a design from one climate into another so often fails.", "questions": [{"type": "main_idea", "stem": "What is the talk mainly about?", "options": ["How mechanical air conditioning reshaped house design", "Why courtyards became common in southern Spain", "Why early builders preferred stone over timber", "How thick walls delay the movement of heat into a building"], "answer": 3, "explain_ko": "두꺼운 벽이 열을 막는 게 아니라 늦춘다는 게 핵심이야. 냉방 장치나 중정 자체는 주제가 아니야."}, {"type": "detail", "stem": "According to the professor, what happens at night in a building with thick masonry walls?", "options": ["The walls begin absorbing heat from the interior.", "The walls keep cold air from entering the rooms.", "The walls release the heat they stored during the day.", "The walls contract and develop small cracks."], "answer": 2, "explain_ko": "밤이 되면 낮에 저장한 열을 실내와 외부로 다시 내보낸다고 했어. 저장하고 방출하는 흐름이 포인트야."}, {"type": "detail", "stem": "What does the professor say about traditional courtyard houses in southern Spain and North Africa?", "options": ["They depend mainly on shaded gardens for cooling.", "Their walls are kept thin to allow airflow.", "They were later rebuilt using much lighter materials.", "Their indoor temperatures vary far less than outdoor ones."], "answer": 3, "explain_ko": "실외가 이십도 넘게 흔들려도 실내는 몇 도만 움직인다고 측정됐다고 했어. 벽 두께가 거의 한 미터라는 설명도 같이 나와."}, {"type": "function", "stem": "Why does the professor mention humid tropical climates?", "options": ["To describe where courtyard houses first appeared", "To identify a condition under which thermal mass fails to help", "To explain why adobe costs less than concrete", "To argue that night ventilation is always enough"], "answer": 1, "explain_ko": "밤에도 더운 기후에서는 벽이 열을 비울 틈이 없어서 효과가 사라진다는 한계를 보여주려고 든 예야. 재료 가격 얘기는 안 나와."}, {"type": "inference", "stem": "What does the professor imply about copying a building design from one region to another?", "options": ["It can perform badly because daily temperature cycles differ.", "It usually saves the builder a great deal of money.", "It is the main reason modern buildings rely on glass.", "It works fine as long as the materials are sourced locally."], "answer": 0, "explain_ko": "보편적으로 좋은 벽은 없고 그 지역 하루 온도 변화에 달려 있다고 했어. 그러니까 다른 기후 설계를 그대로 가져오면 실패하기 쉬워."}]}, {"id": "tkg2_2", "subject": "Literature", "speaker": "W", "text": "Now, when we talk about a narrator, students often assume the narrator is just a neutral window onto the story. Someone tells us what happened, and we believe it. But a great deal of modern fiction is built on the opposite assumption. The narrator is a character too, with interests, blind spots, and sometimes outright motives to mislead us. We call that figure an unreliable narrator. So how does a reader detect unreliability? Rarely by being told directly. Instead, the author plants small contradictions. The narrator insists he is perfectly calm while his sentences grow short and repetitive. He reports a conversation, and the other speaker's actual words do not match his summary of them. Over time, the gap between what the narrator claims and what the text shows becomes the real story. Let me give you an example. In Kazuo Ishiguro's novel about an English butler looking back on his career, the narrator keeps assuring us that his former employer was a man of great judgment. However, the episodes he chooses to recount suggest something much darker, and his constant qualifying tells us he half knows it. The reader finishes the book understanding more than the narrator will admit. Here is the implication. Unreliable narration shifts work onto the reader. You are no longer receiving a report. You are assembling evidence, weighing testimony, deciding what to discount. That is why these novels reward rereading, and why summarizing one in a single sentence almost always flattens exactly what makes it interesting.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why first person narration became popular in the nineteenth century", "How novelists research the historical settings of their books", "How narrators who cannot be fully trusted change the reader's task", "Why English servants appear so often in modern fiction"], "answer": 2, "explain_ko": "믿을 수 없는 화자가 어떻게 작동하고 독자에게 무엇을 요구하는지가 중심이야. 역사 고증이나 인물 유형 얘기가 아니야."}, {"type": "detail", "stem": "According to the professor, how do readers usually detect an unreliable narrator?", "options": ["The narration suddenly switches to the third person.", "Another character corrects the narrator at the end.", "Small contradictions appear between claims and details.", "The author states it directly in a preface."], "answer": 2, "explain_ko": "직접 알려주는 경우는 드물고 작은 모순들이 쌓여서 드러난다고 했어. 화자의 말과 본문이 보여주는 게 어긋나는 지점이 단서야."}, {"type": "function", "stem": "Why does the professor describe the novel about the English butler?", "options": ["To criticize the author's handling of dialogue", "To explain how the novel was adapted for film", "To compare British and American narrative styles", "To show a narrator whose own stories undercut his praise"], "answer": 3, "explain_ko": "화자가 고용주를 칭찬하는데 정작 그가 고른 일화들이 반대를 암시하는 사례로 든 거야. 영화화나 문체 비교는 언급되지 않았어."}, {"type": "attitude", "stem": "What is the professor's attitude toward one sentence summaries of such novels?", "options": ["She thinks they are the best way to start studying them.", "She thinks they matter only for extremely long books.", "She thinks they are useful but very hard to write.", "She thinks they lose what makes the novels interesting."], "answer": 3, "explain_ko": "한 문장 요약은 재미있는 부분을 납작하게 만든다고 부정적으로 말해. 다시 읽을 때 보상이 있다는 설명과 이어져."}, {"type": "inference", "stem": "What does the professor imply about the reader of an unreliable narration?", "options": ["The reader should trust the narrator's final judgment.", "The reader must actively weigh and sort the evidence.", "The reader needs historical background to follow the plot.", "The reader will usually find the ending predictable."], "answer": 1, "explain_ko": "독자가 증언을 저울질하고 무엇을 버릴지 결정한다고 했어. 그러니까 수동적 수용자가 아니라 판단하는 쪽이야."}]}, {"id": "tkg2_3", "subject": "Computer Science", "speaker": "M", "text": "Now, there is a problem at the heart of every computer. Processors have gotten dramatically faster over the decades, but memory has not kept up. A modern processor can perform hundreds of operations in the time it takes to pull a single value out of main memory. So waiting on memory would waste most of that speed. The standard fix is a cache. A cache is a small, fast block of memory sitting close to the processor, holding copies of data that was used recently. When the processor asks for something, the hardware checks the cache first. If the data is there, we call it a hit, and the request is satisfied in a few cycles instead of a few hundred. Now, why would recently used data be useful again? Because real programs are not random. They show locality. If you just read one element of an array, you will very likely read its neighbor next, and inside a loop you run the same instructions over and over. Let me give you an example. Consider adding up a large two dimensional table. If you walk across each row in order, you touch memory the way the cache expects, and performance is excellent. However, if you walk down the columns instead, nearly every access lands in a different block, and the cache gives you almost nothing. Same arithmetic, same number of additions, but the second version can run several times slower. So the implication is that on modern hardware, how you arrange your data matters as much as how many operations you do.", "questions": [{"type": "main_idea", "stem": "What is the talk mainly about?", "options": ["How caches reduce the cost of slow memory access", "Why processors have become faster over several decades", "Why arrays are superior to other data structures", "How programmers decide which language to use"], "answer": 0, "explain_ko": "느린 메모리 문제를 캐시가 어떻게 완화하는지가 전체 흐름이야. 언어 선택이나 자료구조 우열은 다루지 않아."}, {"type": "detail", "stem": "According to the professor, why is recently used data likely to be needed again?", "options": ["Because processors automatically repeat failed instructions", "Because real programs show locality in how they access data", "Because caches discard older values at random", "Because memory hardware stores values in alphabetical order"], "answer": 1, "explain_ko": "프로그램 접근이 무작위가 아니라 국소성을 보인다고 설명해. 배열 이웃 원소나 반복문 예시가 그 근거야."}, {"type": "detail", "stem": "What does the professor say happens when a requested value is already in the cache?", "options": ["The cache is cleared and completely refilled.", "The processor still has to check main memory.", "The value is immediately copied back to disk.", "The request is satisfied in just a few cycles."], "answer": 3, "explain_ko": "히트가 나면 수백 사이클 대신 몇 사이클로 끝난다고 했어. 메인 메모리를 다시 볼 필요는 없어."}, {"type": "function", "stem": "Why does the professor compare adding up a table by rows and by columns?", "options": ["To show that the two methods produce different totals", "To argue that loops should generally be avoided", "To explain how large tables are stored on disk", "To show that data layout can change speed without changing the arithmetic"], "answer": 3, "explain_ko": "덧셈 횟수는 같은데 접근 순서만 바뀌어도 몇 배 느려진다는 걸 보여주려는 예야. 계산 결과가 달라진다는 말은 없어."}, {"type": "inference", "stem": "What does the professor suggest about writing efficient programs on modern machines?", "options": ["Caches have made program structure mostly irrelevant.", "Programmers should simply wait for faster memory chips.", "How data is arranged in memory deserves serious attention.", "Cutting the number of operations is all that really matters."], "answer": 2, "explain_ko": "연산 수만큼 데이터 배치도 중요하다고 마무리해. 그래서 메모리 배치를 신경 써야 한다고 추론할 수 있어."}]}, {"id": "tkg2_4", "subject": "Civil Engineering", "speaker": "W", "text": "Now, when engineers design a very tall building, the main danger from wind is usually not collapse. The structure is strong enough for that. The problem is motion. Wind pushes a slender tower back and forth, and the people on the upper floors feel it. They get nauseated, light fixtures sway, and tenants complain. So the engineering question becomes how to absorb that energy rather than how to resist it. One elegant answer is the tuned mass damper. The idea is to hang a very heavy weight near the top of the building, connected through springs and hydraulic cylinders. The system is tuned so that the weight's natural period matches the building's. When the tower starts leaning one way, the weight lags behind and pulls the other way, and that opposing force cancels much of the sway. Let me give you an example. Taipei 101 carries a steel sphere weighing roughly six hundred tons, suspended through several floors and visible to visitors. In strong typhoon winds that sphere can move almost a meter, and it cuts the building's perceived sway substantially. However, the tuning is delicate. A damper calibrated for one frequency does little against motion at a very different frequency, which is why earthquake protection usually demands other strategies. So here is the broader point. Much of structural engineering at this scale is not about making things stiffer. It is about managing how energy moves through a system, and sometimes adding mass does more good than adding steel.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["How engineers measure wind speed at high altitude", "How tall buildings are kept from collapsing in storms", "How a heavy suspended weight controls a building's sway", "Why skyscrapers use steel frames rather than concrete"], "answer": 2, "explain_ko": "상부에 매달린 무거운 질량이 흔들림을 상쇄하는 원리가 중심이야. 붕괴 방지나 재료 선택 얘기는 아니야."}, {"type": "detail", "stem": "According to the professor, what is the main wind related problem in very tall buildings?", "options": ["Damage to the exterior glass panels", "A loss of water pressure in the pipes", "Structural collapse of the upper floors", "Movement that occupants can actually feel"], "answer": 3, "explain_ko": "구조는 충분히 튼튼하고 문제는 사람이 느끼는 움직임이라고 했어. 메스꺼움과 입주자 불만이 그 증거로 나와."}, {"type": "detail", "stem": "What does the professor say about the damper in Taipei 101?", "options": ["It can move almost a meter in strong winds.", "It replaced an earlier system that had failed.", "It was installed many years after construction.", "It is hidden inside a sealed concrete core."], "answer": 0, "explain_ko": "육백 톤쯤 되는 강철 구체가 태풍 바람에 거의 한 미터까지 움직인다고 했어. 방문객이 볼 수 있게 노출돼 있다고도 했지."}, {"type": "function", "stem": "Why does the professor mention earthquakes?", "options": ["To describe how building codes get written", "To point out a limit of tuned mass dampers", "To show that wind and ground motion feel the same", "To explain why Taipei 101 was built so tall"], "answer": 1, "explain_ko": "한 주파수에 맞춘 댐퍼는 다른 주파수 운동에는 약하다는 한계를 말하려고 꺼낸 거야. 그래서 지진은 다른 대책이 필요해."}, {"type": "inference", "stem": "What broader point does the professor make about structural engineering at this scale?", "options": ["Stiffness is the only dependable design goal.", "Computer models have fully replaced physical testing.", "Lighter buildings are always safer in high wind.", "Managing energy can matter more than adding strength."], "answer": 3, "explain_ko": "더 단단하게 만드는 게 아니라 에너지 흐름을 관리하는 문제라고 정리했어. 강재를 더 넣기보다 질량을 더하는 게 나을 수도 있다는 거야."}]}, {"id": "tkg2_5", "subject": "Film Studies", "speaker": "M", "text": "Now, think about how strange film editing really should be. A shot of a woman at a door, then suddenly a completely different image, her face from two meters away. In ordinary life your visual field never jumps like that. Yet audiences almost never notice the cut. So why does editing feel invisible? The answer is a set of conventions worked out in the early twentieth century, usually grouped under the term continuity editing. The goal is to make space and time feel continuous across a cut. Editors keep screen direction consistent, so a character walking right exits right and enters the next shot from the left. They preserve eyeline matches, so if an actor looks off screen, the following shot shows what she would plausibly see. And they cut on movement, because a viewer tracking a gesture is less likely to register the splice. Let me give you an example of the rule being broken on purpose. In some French films of the nineteen sixties, directors used jump cuts, removing a chunk of time from the middle of a continuous shot. The actor's head suddenly shifts position. It feels jarring, and that was precisely the point. The audience is reminded that someone is constructing the film. However, I want to be careful here. Breaking a convention only produces meaning because the convention is already familiar. So the implication is that invisible editing is not natural. It is a learned grammar, shared by filmmakers and audiences, and like any grammar it can be used plainly or violated for effect.", "questions": [{"type": "main_idea", "stem": "What is the talk mainly about?", "options": ["How editing conventions keep cuts from being noticed", "How the arrival of color film changed acting styles", "Why audiences generally prefer long continuous shots", "Why French cinema declined after the nineteen sixties"], "answer": 0, "explain_ko": "컷이 왜 눈에 안 띄는지, 그걸 만드는 관습이 무엇인지가 핵심이야. 색채 영화나 프랑스 영화의 쇠퇴는 주제가 아니야."}, {"type": "detail", "stem": "According to the professor, what is one technique used to keep a cut from being noticed?", "options": ["Repeating the same shot twice in a row", "Fading the image to black between shots", "Keeping the camera completely motionless", "Cutting in the middle of a character's movement"], "answer": 3, "explain_ko": "동작을 따라가는 중에 컷하면 관객이 이어붙인 자리를 알아채기 어렵다고 했어. 시선 일치와 화면 방향 유지도 같은 목적이야."}, {"type": "organization", "stem": "How does the professor organize the talk?", "options": ["By tracing the career of one influential editor", "By comparing two directors who worked together", "By listing technical equipment in order of invention", "By presenting a set of conventions and then a deliberate violation of them"], "answer": 3, "explain_ko": "먼저 연속성 편집 관습을 정리하고 그다음 점프 컷처럼 일부러 어긴 사례를 들어. 인물 전기나 장비 나열 방식은 아니야."}, {"type": "function", "stem": "Why does the professor discuss jump cuts in French films?", "options": ["To show that continuity rules were never widely adopted", "To demonstrate an error that careful editors avoid", "To show how breaking a convention can create meaning", "To explain why those films sold so many tickets"], "answer": 2, "explain_ko": "일부러 어긋나게 잘라서 관객에게 영화가 구성물임을 상기시키는 효과를 설명하려는 예야. 실수가 아니라 의도된 선택이라고 했어."}, {"type": "inference", "stem": "What does the professor imply about invisible editing?", "options": ["It requires unusually expensive editing equipment.", "It mirrors the way human vision naturally works.", "It is no longer used in contemporary filmmaking.", "It depends on conventions that viewers have learned."], "answer": 3, "explain_ko": "보이지 않는 편집은 자연스러운 게 아니고 학습된 문법이라고 못 박았어. 관습을 알기 때문에 위반도 의미를 갖는다는 흐름이야."}]}]}, "sw": {"listen_repeat": [{"id": "lr1", "sentences": ["The library opens at eight today.", "I need to print my essay before class.", "My roommate borrowed the textbook I bought last week.", "The professor moved the deadline to Friday because many students were sick.", "If you want a quiet spot, try the fourth floor of the science library.", "I signed up for the writing workshop that meets on Tuesday evenings in the student center.", "Although the shuttle runs every fifteen minutes, most students still walk to the north dormitories when the weather is warm."]}, {"id": "lr2", "sentences": ["I usually cook dinner at home.", "My bus was late again this morning.", "I bought some fresh vegetables at the corner market.", "My sister called last night to ask about our weekend plans.", "Whenever I have free time, I like to walk along the river near my apartment.", "I finally fixed the kitchen light that had been flickering since I moved into this building.", "Even though I set three alarms every single night, I still oversleep whenever I stay up reading past midnight."]}, {"id": "lrg0_1", "scene": "A teaching assistant giving a first-day orientation in a human anatomy lab.", "sentences": ["Please leave your bags outside.", "Gloves and goggles are required here.", "Every lab table has its own labeled specimen tray.", "The teaching assistant will demonstrate the first dissection this morning.", "You can review the digital anatomy models on the tablets near the back wall.", "Before you handle any tissue, make sure you have recorded the specimen number that appears on your worksheet.", "Although the lab closes at six, students who need more practice can request a weekend session if a supervisor is available."]}, {"id": "lrg0_2", "scene": "A researcher briefing a student volunteer before a psychology experiment on memory and reaction time.", "sentences": ["Thanks for volunteering this afternoon.", "The whole session takes forty minutes.", "You will answer questions on a computer screen.", "Your responses stay anonymous, so please answer as honestly as possible.", "The first part measures how quickly you recognize familiar faces and common words.", "If you feel uncomfortable at any point, you may stop the experiment without losing the credit for your course.", "Because the study examines reaction time, we ask that you avoid caffeine on the morning when your second session is scheduled."]}, {"id": "lrg0_3", "scene": "An economics department adviser leading an information session about summer internships.", "sentences": ["Please take a handout now.", "Today we are discussing summer internship applications.", "Most firms already begin reviewing resumes in early October.", "The career office offers free mock interviews every Thursday afternoon throughout the fall.", "A course in statistics will make your application much stronger than a general economics background alone.", "If you plan to apply to a central bank, remember that the deadline usually falls before winter break.", "Because many of these positions are unpaid, the department set aside a small fund for students who could not otherwise accept them."]}, {"id": "lrg0_4", "scene": "A sociology professor training student interviewers before a neighborhood survey project.", "sentences": ["The interviews start next week.", "Everyone needs a signed consent form.", "Please write down the time of every conversation.", "Our sample includes two neighborhoods on the east side of the city.", "A short pause often gives people enough time to add important details on their own.", "When you transcribe your notes tonight, please replace every real name with the code we assigned earlier today.", "Since response rates drop after dinner, try to finish your visits by early evening unless a resident asks for a later time."]}, {"id": "lrg0_5", "scene": "A nurse explaining the procedure at a campus health center flu vaccination clinic.", "sentences": ["Please check in at reception.", "Bring your student ID and insurance card.", "The nurse will take your temperature before the appointment.", "Most people feel a little sore in the arm for about a day.", "You should stay in the waiting area for fifteen minutes after your shot, just in case.", "If you have ever reacted badly to a vaccine, mention it to the nurse before you sit down.", "Because the clinic gets busy during exam week, book an appointment online so you will not have to wait in line."]}, {"id": "lrg1_1", "sentences": ["Meet beside the geology building.", "Bring your field notebook and safety goggles.", "We will examine volcanic rocks near the old quarry.", "The samples contain minerals that formed during several ancient eruptions.", "Please label each specimen carefully before placing it in the padded storage case.", "Because the trail becomes slippery after rain, we will take the longer route around the eastern ridge.", "When we reach the quarry, compare the dark basalt with the lighter rock that cooled beneath the surface."]}, {"id": "lrg1_2", "sentences": ["The observatory tour starts upstairs.", "Please silence your phone near the telescopes.", "Tonight, we are tracking Jupiter and four of its moons.", "The main telescope uses a curved mirror to collect faint starlight.", "Our guide will explain how astronomers measure the distance between neighboring stars.", "Although clouds may block the horizon, we can still view several bright objects through the smaller telescope.", "If the sky remains clear after sunset, the computer will display images that reveal details invisible to the human eye."]}, {"id": "lrg1_3", "sentences": ["Leave backpacks beside the door.", "Wear protective gloves throughout today's experiment.", "We are testing how temperature affects a reaction's speed.", "The blue solution changes color as the dissolved compound breaks apart.", "Record every measurement immediately so your lab partner can verify the results later.", "Because concentrated acid can damage skin, rinse any accidental spill under running water for at least fifteen minutes.", "After the reaction has completely stopped, place the sealed container in the cabinet that is marked for chemical waste."]}, {"id": "lrg1_4", "sentences": ["Meet inside the campus archive.", "Wash your hands before handling documents.", "Today, we will inspect letters from local factory workers.", "These records describe how the town changed during wartime manufacturing.", "Use a pencil for notes to prevent permanent marks on fragile paper.", "Since several pages have torn edges, support each document with the flat archival board provided.", "When you finish examining a folder, return every photograph to the sleeve that matches its original identification number."]}, {"id": "lrg1_5", "sentences": ["The pottery workshop begins downstairs.", "Choose a tray with labeled fragments.", "We will sort these pieces by texture and color.", "Some fragments preserve painted patterns from an ancient coastal settlement.", "Handle each piece over the foam mat to reduce the risk of damage.", "Although the fragments look similar, their clay composition can indicate where the original vessels were produced.", "Before you propose a reconstruction, compare adjoining edges carefully so that unrelated pieces are not accidentally forced together."]}], "interviews": [{"id": "iv1", "topic": "Travel", "intro": "Hi, thanks for joining me today. I'd like to ask you a few questions about travel and about how people spend their time away from home.", "questions": ["Tell me about a trip you have taken that you still remember well. What made it memorable?", "Some travelers prefer to plan every detail in advance, while others prefer to decide things as they go. Which approach do you think works better, and why?", "Imagine a friend from another country is visiting your city for only two days. What would you advise them to do, and why?", "In recent years, more people have been taking short trips close to home instead of long international vacations. What do you think about this trend?"], "model_answer": "Personally, I think a mix works best, but if I had to choose, I'd go with planning in advance. When I visited Kyoto a few years ago, I booked the temples and the train tickets before I left, and that saved me a lot of stress. Popular places sell out quickly, so showing up without a plan can mean waiting in line for hours. That said, I always leave one afternoon completely open, because some of my best memories came from just wandering around a neighborhood. So planning gives you the structure, and the free time gives you the surprises.", "tips_ko": "질문마다 입장을 한 문장으로 먼저 밝히고 바로 개인 경험 하나를 근거로 붙이세요. 마지막 5초는 결론을 다시 정리해 문장을 끝내고, 시간이 남으면 예외 상황을 한 문장 덧붙이면 좋습니다."}, {"id": "iv2", "topic": "Technology habits", "intro": "Hello, and thanks for taking the time to talk with me. Today I'd like to ask you a few questions about technology and how you use it in your daily life.", "questions": ["Which device or app do you use most often during the day, and what do you use it for?", "Some people prefer reading on paper, while others prefer reading on a screen. Which do you find more effective, and why?", "If a friend told you they wanted to spend less time on their phone, what advice would you give them?", "Many companies now expect employees to be reachable outside of working hours. What is your view on that?"], "model_answer": "For me it really depends on what I'm reading, but for anything serious I prefer paper. When I read a long article on my laptop, I catch myself skimming and clicking on other tabs, so I finish the page without remembering much. With a printed book I can underline things and write notes in the margin, and that helps the information stick. Screens are much more convenient, of course, since I can carry hundreds of books in one bag. So I use my tablet for news and light reading, and I print anything I actually need to understand deeply.", "tips_ko": "비교 질문에서는 두 선택지를 모두 언급한 뒤 자신이 고른 쪽의 이유를 구체적인 상황으로 설명하세요. 상대 선택지의 장점도 한 문장 인정하면 논리가 균형 있게 들립니다."}, {"id": "iv3", "topic": "Work and life balance", "intro": "Hi, thanks for joining. I'd like to ask you a few questions about work, study, and how people balance them with the rest of their lives.", "questions": ["Describe a typical weekday for you. When during the day do you feel most productive?", "Would you rather have a job with fixed hours in an office, or one where you choose your own hours and work from home? Explain your choice.", "Suppose a coworker keeps sending you messages late at night. How would you handle that situation?", "More organizations are experimenting with a four day work week. Do you think this is a good idea?"], "model_answer": "I'd choose flexible hours and working from home, mainly because of how my energy works. I concentrate best early in the morning and again late at night, so being forced to sit at a desk from nine to six wastes some of my best hours. Working from home also saves me almost two hours of commuting, and I can use that time for exercise or studying. The downside is that it's harder to switch off, and I do miss the casual conversations with colleagues. So ideally I'd want two days in the office for meetings, and the rest at home.", "tips_ko": "추상적인 이유보다 시간, 횟수, 거리 같은 숫자를 넣으면 답변이 훨씬 설득력 있게 들립니다. 45초 안에 이유는 두 개까지만 다루고 각각을 충분히 풀어 설명하세요."}, {"id": "ivg0_1", "topic": "Sleep and daily routines", "intro": "Hi, thanks for sitting down with me today. I'd like to ask you a few questions about sleep and about how rest fits into your daily routine.", "questions": ["Tell me about a time when your sleep schedule was badly disrupted. How did it affect you?", "Some people go to bed and wake up at exactly the same time every day, while others sleep whenever their schedule allows. Which habit do you think is better, and why?", "Imagine a classmate tells you they can only fall asleep after scrolling on their phone for an hour. What would you advise them to try, and why?", "Lately a lot of people have started tracking their sleep with watches and apps. What do you think about this trend?"], "model_answer": "I'd go with keeping the same schedule, even on weekends. Our bodies run on an internal clock, and it gets confused when bedtime moves around by two or three hours. I learned that the hard way during my first year of university, when I went to bed at midnight on weekdays and three in the morning on Saturdays. By Monday I felt like I had jet lag. Once I started sleeping at roughly the same time every night, I stopped needing an alarm and my concentration in class improved noticeably. A flexible schedule sounds convenient, but consistency is what actually makes you feel rested.", "tips_ko": "비교 질문은 입장을 먼저 한 문장으로 딱 던지고 바로 경험으로 받쳐줘. 수면 얘기는 집중력이나 기분 같은 결과까지 말해야 설득력이 생겨."}, {"id": "ivg0_2", "topic": "Eating habits and nutrition", "intro": "Hello, thanks for joining me. I'd like to ask you a few questions about food and about the choices people make when they eat.", "questions": ["Tell me about a change you once made to the way you eat. What made you decide to try it?", "Some people prefer cooking most of their meals at home, while others rely on prepared or restaurant food. Which do you think is the better choice, and why?", "Suppose a friend wants to eat healthier but says they have almost no free time. What would you suggest, and why?", "In many countries, plant based meat substitutes are now sold in ordinary supermarkets. What do you think about this trend?"], "model_answer": "Cooking at home is the better choice, mainly because you control what goes into the food. Restaurant meals tend to be heavy on salt, oil, and sugar, since those things make dishes taste better and sell well. When I started cooking three or four dinners a week, I noticed I was eating far more vegetables without even trying, and my grocery bill dropped by about a third. It does take planning, so I prepare ingredients on Sunday to make weeknights easier. Eating out occasionally is completely fine, but if it becomes your default, both your health and your budget take the hit.", "tips_ko": "구체적인 숫자나 변화를 하나 넣으면 답이 훨씬 단단해져. 반대 입장도 한 줄 인정하고 다시 내 결론으로 돌아오면 좋아."}, {"id": "ivg0_3", "topic": "Exercise and physical activity", "intro": "Hi there, thanks for your time. I'd like to ask you a few questions about exercise and about how people stay physically active.", "questions": ["Tell me about a physical activity you have really enjoyed. What kept you coming back to it?", "Some people prefer exercising alone, while others prefer group classes or team sports. Which do you think works better, and why?", "Imagine your younger cousin says exercise is boring and wants to quit entirely. What advice would you give them?", "Many gyms now offer app based workouts that people do at home instead of coming in. What do you think about this trend?"], "model_answer": "I'm much more consistent in a group, so I'd say group classes work better. When I exercise alone, it's easy to tell myself I'll go tomorrow instead. Last winter I joined a swimming class that met twice a week, and just knowing other people expected me there got me out the door even on freezing mornings. There's also a bit of friendly competition that pushes me harder than I would push myself. I understand why some people want quiet time to think, and I do go running alone sometimes. But for building a habit from scratch, having other people around makes a real difference.", "tips_ko": "왜 그 선택이 나한테 맞는지 성격이나 습관으로 설명하면 자연스러워. 마지막에 결론을 다시 한 문장으로 정리하고 끝내.", "_": null}, {"id": "ivg0_4", "topic": "Stress and mental health", "intro": "Hi, I appreciate you talking with me. I'd like to ask you a few questions about stress and about how people take care of their mental health.", "questions": ["Tell me about a period when you felt unusually stressed. How did you deal with it?", "Some people handle stress by talking it through with others, while others prefer to work through it on their own. Which approach do you think is more effective, and why?", "Suppose a coworker clearly seems overwhelmed but insists that everything is fine. What would you do or say, and why?", "Recently, more companies have begun offering employees paid mental health days. What do you think about this development?"], "model_answer": "For me, talking it out is far more effective. When I keep a problem inside my head, it grows, and I start imagining outcomes that aren't realistic at all. During a difficult semester last year, I finally described my whole workload to my roommate, and within ten minutes she pointed out that two of my deadlines were actually flexible. Nothing about the situation changed except my understanding of it, and that was enough to let me sleep again. I do think a little quiet reflection helps first, so you know what you want to say. But handling everything alone usually just delays the relief.", "tips_ko": "감정 얘기는 추상적으로 흐르기 쉬우니까 구체적인 상황 하나로 좁혀. 결과가 어떻게 달라졌는지 한 문장으로 꼭 말해줘."}, {"id": "ivg0_5", "topic": "Personal spending and saving", "intro": "Hello, thanks for making time for this. I'd like to ask you a few questions about money and about how people manage their spending.", "questions": ["Tell me about something you once saved up for over a long period. Was it worth the wait?", "Some people like to budget every single expense carefully, while others simply keep an eye on their overall balance. Which approach do you think is better, and why?", "Imagine a friend has just received their first real paycheck and asks you how to handle it. What would you advise, and why?", "These days many stores let customers split a purchase into four interest free payments. What do you think about this trend?"], "model_answer": "I prefer watching the overall balance, but only if you check it often. Tracking every coffee and bus fare sounds responsible, and I tried a detailed budgeting app for two months, but I quit because updating it felt like a second job. What works for me is a simple rule: a fixed amount moves into savings the day I get paid, and I spend what's left without guilt. That way the important decision happens automatically. For someone carrying debt or earning an irregular income, detailed tracking probably does make sense. For most people, though, a few clear rules beat a complicated spreadsheet.", "tips_ko": "돈 얘기는 규칙을 하나 정해서 말하면 답이 깔끔해져. 예외 상황을 한 줄 인정하면 더 성숙하게 들려."}, {"id": "ivg0_6", "topic": "Learning and memory", "intro": "Hi, thanks for joining me today. I'd like to ask you a few questions about learning and about how people remember what they study.", "questions": ["Tell me about a subject or skill you found genuinely difficult to learn. How did you eventually improve?", "Some learners prefer rereading their notes, while others prefer quizzing themselves without looking. Which method do you think works better, and why?", "Suppose a younger student asks how to prepare for an important exam that is a month away. What would you recommend, and why?", "A lot of people now pick up new skills mainly from short videos online. What do you think about this trend?"], "model_answer": "Quizzing yourself is clearly the stronger method. Rereading notes feels productive because the material looks familiar, but recognizing something isn't the same as being able to produce it. When I was preparing for a biology midterm, I covered my notes and tried to explain each process out loud, and the gaps showed up immediately. It was uncomfortable, honestly, but those were exactly the parts I would have lost points on. I still read through my notes once at the start, just to organize the content in my head. After that, every session is questions, and my scores went up about a full letter grade.", "tips_ko": "공부법 질문은 왜 반대쪽이 착각을 주는지 짚으면 논리가 세져. 내 점수나 변화로 마무리하면 근거가 분명해져."}, {"id": "ivg0_7", "topic": "Volunteering and community involvement", "intro": "Hi, thanks for speaking with me. I'd like to ask you a few questions about volunteering and about how people get involved in their communities.", "questions": ["Tell me about a time you helped out in your community. What did you take away from the experience?", "Some people prefer volunteering regularly with one organization, while others prefer helping occasionally wherever they are needed. Which do you think is more valuable, and why?", "Imagine a neighbor wants to start a small project to improve your street. What would you advise them to do first, and why?", "Some schools now require students to complete a set number of volunteer hours before graduating. What do you think about this policy?"], "model_answer": "Volunteering regularly with one organization is more valuable, I think. Groups spend real time training new people, so if you show up once and disappear, they have barely broken even on you. I tutored at the same community center every Saturday for a year, and the second half was far more useful than the first, because by then I knew the students and exactly where they struggled. Occasional help obviously matters during emergencies, and I'd never discourage anyone from pitching in. But the quiet, ongoing work is what keeps these places running, and that only happens when people commit to a schedule.", "tips_ko": "사회적 주제는 누구에게 어떤 이득인지 관점을 분명히 밝혀. 한 가지 사례만 끝까지 밀고 가면 시간 안에 정리돼."}, {"id": "ivg0_8", "topic": "Aging populations and elder care", "intro": "Hello, thank you for your time today. I'd like to ask you a few questions about older adults and about how societies care for them.", "questions": ["Tell me about an older person you know well. What have you learned from spending time with them?", "Some families prefer that older relatives live with them, while others prefer professional care facilities. Which arrangement do you think works better, and why?", "Suppose a friend suddenly has to care for an aging parent while working full time. What would you advise them to do, and why?", "In many countries the population is aging quickly, and some governments are raising the retirement age. What do you think about this?"], "model_answer": "It depends heavily on health, but in general I lean toward older relatives staying with family. My grandmother lived with us for six years, and the daily contact kept her mentally sharp in a way I doubt a facility would have. She cooked with my mother, argued with me about the news, and genuinely felt useful. That said, once someone needs medical supervision overnight, families often can't provide it safely, and pretending otherwise puts everyone at risk. So my answer is family first, with professional care added gradually as needs grow, rather than treating it as an all or nothing choice.", "tips_ko": "조건을 먼저 깔고 입장을 말하면 어려운 주제도 안정적으로 들려. 가족 사례 하나를 구체적으로 쓰는 게 제일 안전해."}, {"id": "ivg1_1", "topic": "Learning About Volcanoes", "intro": "Hi, thanks for speaking with me today. I'd like to ask you about volcanoes and how people learn about Earth's geological activity.", "questions": ["Tell me about a time when you learned something interesting about a volcano or another powerful natural event.", "Some people prefer to learn about volcanoes through documentaries, while others prefer to visit geological sites in person. Which approach do you prefer, and why?", "Imagine that a friend is planning to visit an active volcanic region. What advice would you give that person?", "Volcano tourism has become increasingly popular in several countries. What is your opinion of this trend?"], "model_answer": "I would prefer to visit a geological site because being physically present makes the subject feel more concrete. A documentary can explain how magma rises, but it cannot fully reproduce the scale of a crater or the texture of cooled lava. During a school trip, I once walked across an old lava field and noticed that plants were gradually returning to the area. That small detail helped me understand how ecosystems recover after an eruption. An in-person visit also gives learners opportunities to question local guides. Of course, safety must come first, so I would choose a well-managed site rather than an unpredictable active zone.", "tips_ko": "두 학습 방식의 차이를 분명히 보여 준 뒤 한쪽을 선택해. 직접 본 장면이나 느낀 점을 근거로 연결하면 답이 생생해져."}, {"id": "ivg1_2", "topic": "Amateur Astronomy", "intro": "Hi, it's great to have you here. I'd like to ask you a few questions about observing the night sky and participating in astronomy.", "questions": ["Tell me about an occasion when you saw something memorable in the night sky.", "Would you rather observe the sky by yourself or join an astronomy club? Explain your preference.", "Suppose a younger student wants to begin stargazing but has no special equipment. What would you suggest?", "Many communities are introducing rules to reduce artificial light at night. What do you think about this trend?"], "model_answer": "I would rather join an astronomy club, especially as a beginner. Although observing alone can be peaceful, a club provides access to knowledge and equipment that would otherwise be difficult to obtain. Experienced members can explain how to locate planets, adjust a telescope, and recognize weather conditions that interfere with visibility. I once attended a public observation event where a volunteer showed me Saturn through a telescope. Without his guidance, I probably would not have realized what I was seeing. Clubs also make long observation sessions more enjoyable because members can exchange ideas. Eventually, I might observe independently, but a group offers a stronger foundation.", "tips_ko": "혼자 할 때와 모임에 참여할 때의 장단점을 짧게 비교해. 선택한 방식이 실제로 어떤 도움을 주는지 구체적인 예로 설명하면 좋아."}, {"id": "ivg1_3", "topic": "Chemistry Experiments in School", "intro": "Hi, thanks for joining me. Today I'd like to hear your thoughts about learning chemistry and conducting experiments in school.", "questions": ["Describe a science experiment that you found memorable or surprising.", "Do students learn chemistry more effectively through hands-on laboratory work or through computer simulations? Why?", "Imagine that your school has a limited science budget. How would you advise it to improve chemistry education?", "More schools are replacing some traditional laboratory activities with virtual experiments. What is your opinion of this trend?"], "model_answer": "I believe hands-on laboratory work is generally more effective because students must deal with real materials and unexpected results. In a simulation, every step is controlled, so learners may not develop the same level of caution or practical judgment. When I performed a simple acid-base experiment, my group added the indicator too quickly and had to determine why our color differed from the expected result. Correcting that mistake taught me more than merely reading the procedure. Laboratory work also makes abstract concepts visible and memorable. Simulations are useful for dangerous or costly reactions, but they should supplement actual experiments rather than replace them entirely.", "tips_ko": "선택한 수업 방식이 어떤 능력을 길러 주는지 먼저 말해. 실험 과정의 실수나 발견을 예로 들면 이유를 더 설득력 있게 만들 수 있어."}, {"id": "ivg1_4", "topic": "The Location of Archaeological Artifacts", "intro": "Hi, I'm glad you're here today. I'd like to ask you about archaeological discoveries and where ancient artifacts should be displayed.", "questions": ["Tell me about an archaeological object or discovery that has captured your attention.", "Should important artifacts remain in museums near the places where they were discovered, or should they be displayed in major national museums? Explain your view.", "Suppose a museum possesses an artifact that another country has requested back. What factors should the museum consider?", "There is growing public pressure for museums to return artifacts acquired during colonial periods. What do you think about this trend?"], "model_answer": "I think important artifacts should usually remain near the places where they were discovered. Their meaning is closely connected to the surrounding landscape, local traditions, and other objects found at the same site. Seeing everything together allows visitors to understand the artifact as part of a culture rather than as an isolated treasure. Local display can also support regional museums by attracting visitors and creating jobs. Major national institutions may offer better security and conservation facilities, but those resources could be shared with smaller museums. Unless an object requires highly specialized protection, keeping it near its original setting provides a richer educational experience and benefits the community most directly.", "tips_ko": "유물의 보존과 지역 사회의 이익을 함께 고려해. 한 가지 원칙을 제시한 뒤 예외가 가능한 조건도 덧붙이면 균형 잡힌 답이 돼."}, {"id": "ivg1_5", "topic": "Historical Reenactments", "intro": "Hi, thanks for taking part. I'd like to ask you about historical reenactments and how people experience events from the past.", "questions": ["Describe a historical performance, festival, or exhibition that you have seen or heard about.", "Would you rather learn about a historical event through a reenactment or through a traditional lecture? Why?", "Imagine that your town wants to organize its first historical reenactment. What advice would you give the organizers?", "Interactive historical events are becoming more popular than conventional museum displays. What is your opinion of this trend?"], "model_answer": "I would rather learn through a reenactment because it reveals practical details that a lecture may overlook. Watching people use period clothing, tools, and forms of transportation helps me imagine the physical conditions of everyday life. For example, a reenactment of an early settlement could demonstrate how long it took to prepare food or communicate across distances. Those details make broader historical developments easier to understand and remember. However, reenactments can oversimplify events or turn suffering into entertainment. I would therefore choose a program led by qualified historians that clearly distinguishes documented facts from creative interpretation. With those safeguards, the experience can be both engaging and intellectually valuable.", "tips_ko": "재미와 정확성이라는 두 기준으로 학습 방식을 비교해. 선택한 방식의 장점을 말한 뒤 한계와 해결책까지 붙이면 답의 깊이가 생겨."}, {"id": "ivg1_6", "topic": "Preparing for Severe Weather", "intro": "Hi, it's nice to meet you. I'd like to ask you about severe weather and how individuals and communities prepare for it.", "questions": ["Tell me about a time when unusual or severe weather affected your plans.", "Is it better to rely on official weather forecasts or on personal observation when making daily plans? Explain your preference.", "Imagine that a family has recently moved to an area where powerful storms are common. What advice would you give them?", "Communities are spending more public money on adapting to extreme weather. What is your opinion of this trend?"], "model_answer": "I prefer to rely on official forecasts because they are based on far more information than one person can gather. Meteorologists combine satellite images, radar measurements, and computer models to track changes that may be invisible from the ground. A clear morning, for instance, does not guarantee that a dangerous storm will not arrive later. I once canceled an afternoon hike after an official warning, even though the weather initially seemed pleasant. Heavy rain began a few hours later, so the forecast probably prevented a risky situation. Personal observation is still useful for noticing immediate conditions, but official forecasts provide the broader evidence needed for responsible decisions.", "tips_ko": "정보의 범위와 신뢰성을 기준으로 두 선택지를 비교해. 실제로 예보 때문에 계획을 바꾼 경험을 넣으면 근거가 자연스러워져."}, {"id": "ivg1_7", "topic": "Robotic and Human Space Missions", "intro": "Hi, thank you for being here. I'd like to ask you about space exploration and the different ways scientists investigate distant worlds.", "questions": ["Tell me about a space mission or astronomical discovery that you found especially interesting.", "Should space agencies give greater priority to robotic missions or missions involving human astronauts? Why?", "Suppose your country could support only one major space project over the next decade. What kind of project would you recommend?", "Private companies are taking a larger role in space exploration. What do you think about this trend?"], "model_answer": "Space agencies should give greater priority to robotic missions because they can explore dangerous environments at a lower financial and human cost. Robots do not require oxygen, food, or protection for a return journey, so a mission can devote more space to scientific instruments. They can also operate on planets where radiation or extreme temperatures would threaten astronauts. The Mars rovers, for example, have traveled across the surface for years while collecting images and rock samples. Human missions can inspire the public and allow quick decisions, but they are enormously complex. For most scientific goals, several focused robotic missions would produce more knowledge than one expensive crewed expedition.", "tips_ko": "비용과 안전, 과학적 성과를 기준으로 우선순위를 정해. 반대 선택지의 장점도 인정한 뒤 왜 네 선택이 더 효율적인지 정리해."}, {"id": "ivg1_8", "topic": "Remembering Difficult History", "intro": "Hi, thanks for talking with me today. I'd like to ask you about public memorials and how societies remember difficult historical events.", "questions": ["Describe a memorial or historical site that made a strong impression on you.", "Do you think a traditional monument or an interactive exhibition is more effective for teaching difficult history? Why?", "Imagine that a school is planning a visit to a memorial connected to a tragic event. How should teachers prepare students?", "Some cities are removing or renaming monuments associated with controversial historical figures. What is your opinion of this trend?"], "model_answer": "I think an interactive exhibition is more effective because it can present difficult history through several perspectives. A traditional monument often communicates one official message, while an exhibition can include photographs, personal testimony, maps, and conflicting interpretations. This variety encourages visitors to examine evidence instead of accepting a simplified narrative. At one museum, I listened to recorded accounts from people who had experienced the same event differently. Their voices made the consequences feel personal without reducing the topic to a single emotional symbol. Interactive features should not make tragedy feel like entertainment, however. When they are designed respectfully, they promote careful reflection and a more complete understanding of the past.", "tips_ko": "어려운 역사를 전달할 때 정보의 다양성과 존중이 왜 중요한지 설명해. 기억에 남은 전시 요소 하나를 예로 들면 답이 구체적이야."}], "build_sentence": [{"id": "bs1", "context": "Did you enjoy the trip to the old city?", "sentence": "I loved it, especially the market near the cathedral.", "chunks": ["I loved", "it,", "especially", "the market", "near", "the", "cathedral."]}, {"id": "bs2", "context": "Are you coming to the study group tonight?", "sentence": "I might be late because my lab session ends at seven.", "chunks": ["I might", "be late", "because", "my lab", "session", "ends", "at seven."]}, {"id": "bs3", "context": "How was the new professor's first lecture?", "sentence": "She explained the main concepts clearly and gave us useful examples.", "chunks": ["She explained", "the main", "concepts", "clearly", "and gave", "us", "useful examples."]}, {"id": "bs4", "context": "I can't find the reading list for this course.", "sentence": "You can download it from the course page after you log in.", "chunks": ["You can", "download it", "from the", "course page", "after", "you log", "in."]}, {"id": "bs5", "context": "Do you want to join the volunteer program with me?", "sentence": "I'd love to, but I need to check my work schedule first.", "chunks": ["I'd love", "to, but", "I need", "to check", "my work", "schedule", "first."]}, {"id": "bs6", "context": "Why did you decide to move off campus?", "sentence": "Rent was cheaper, and I wanted a quieter place to study.", "chunks": ["Rent was", "cheaper,", "and I", "wanted", "a quieter", "place", "to study."]}, {"id": "bs7", "context": "Have you finished the group presentation slides?", "sentence": "Almost, though I still have to add the data from Tuesday.", "chunks": ["Almost,", "though I", "still have", "to add", "the data", "from", "Tuesday."]}, {"id": "bs8", "context": "The library closes early during the holiday, right?", "sentence": "Yes, it shuts at six, so we should get there sooner.", "chunks": ["Yes,", "it shuts", "at six,", "so we", "should get", "there", "sooner."]}, {"id": "bs9", "context": "What did you think of the documentary we watched?", "sentence": "It was interesting, but the second half felt a bit repetitive.", "chunks": ["It was", "interesting,", "but the", "second half", "felt", "a bit", "repetitive."]}, {"id": "bs10", "context": "Could you help me set up the projector before class?", "sentence": fore.", "chunks": ["Not really,", "since", "I had", "already interviewed", "with that bank", "twice", "before."]}, {"id": "bsg0_14", "context": "Which version of the questionnaire worked better?", "sentence": "The shorter one gave us more honest answers than the original did.", "chunks": ["The shorter one", "gave us", "more honest", "answers", "than", "the original", "did."]}, {"id": "bsg0_15", "context": "I need to return these soil samples tonight.", "sentence": "Do you know whether the greenhouse stays open after six on weekends?", "chunks": ["Do you know", "whether", "the greenhouse", "stays open", "after six", "on", "weekends?"]}, {"id": "bsg0_16", "context": "Did the professor approve your interview plan?", "sentence": "He told me to collect consent from every participant before recording anything.", "chunks": ["He told me", "to collect", "consent", "from every", "participant", "before recording", "anything."]}, {"id": "bsg0_17", "context": "I signed up for hospital volunteering next term.", "sentence": "Don't you need a background check before they let you start?", "chunks": ["Don't you", "need", "a background", "check", "before", "they let you", "start?"]}, {"id": "bsg0_18", "context": "Where did you find the unemployment figures?", "sentence": "They come from a database that the labor department updates every month.", "chunks": ["They come", "from", "a database", "that", "the labor department", "updates", "every month."]}, {"id": "bsg0_19", "context": "I missed the second session of the experiment.", "sentence": "If you had emailed the lab, they would have rescheduled you easily.", "chunks": ["If you had", "emailed", "the lab,", "they would", "have rescheduled", "you", "easily."]}, {"id": "bsg0_20", "context": "This nutrition class looks pretty demanding.", "sentence": "It is harder than biology, but the lab work is far more interesting.", "chunks": ["It is", "harder than", "biology,", "but", "the lab work", "is far", "more interesting."]}, {"id": "bsg1_1", "context": "The field report doesn't identify the sampling site.", "sentence": "Do you know where the oldest rock samples were collected?", "chunks": ["Do you know", "where the", "oldest rock", "samples", "were", "collected?"]}, {"id": "bsg1_2", "context": "What was the main result of the stellar survey?", "sentence": "The astronomer who led the survey identified three previously unknown pulsars.", "chunks": ["The astronomer", "who led", "the survey", "identified", "three", "previously unknown", "pulsars."]}, {"id": "bsg1_3", "context": "Why was the meteorite placed in a sealed case?", "sentence": "The meteorite was preserved in nitrogen to prevent further chemical contamination.", "chunks": ["The meteorite", "was preserved", "in nitrogen", "to prevent", "further", "chemical", "contamination."]}, {"id": "bsg1_4", "context": "Did the excavation team document the burial chamber first?", "sentence": "Researchers had mapped the chamber before they removed any artifacts.", "chunks": ["Researchers", "had mapped", "the chamber", "before they", "removed", "any", "artifacts."]}, {"id": "bsg1_5", "context": "What should we do if this mixture changes appearance?", "sentence": "If the solution turns cloudy, we should repeat the entire procedure.", "chunks": ["If", "the solution", "turns cloudy,", "we should", "repeat", "the entire", "procedure."]}, {"id": "bsg1_6", "context": "Are these two geological faults approximately the same age?", "sentence": "This fault is considerably older than the one exposed near campus.", "chunks": ["This fault", "is", "considerably older", "than the one", "exposed", "near", "campus."]}, {"id": "bsg1_7", "context": "When can we observe the comet without special equipment?", "sentence": "Professor Chen said that the comet would be visible before dawn.", "chunks": ["Professor Chen", "said that", "the comet", "would be", "visible", "before", "dawn."]}, {"id": "bsg1_8", "context": "I thought the bronze tablet was from the medieval period.", "sentence" ["Several pieces", "are being", "cleaned before", "the exhibition", "opens next", "month."]}, {"id": "bsg2_11", "context": "You seemed really prepared for the poetry seminar.", "sentence": "I had read the whole collection twice before the discussion even started.", "chunks": ["I had read", "the whole", "collection twice", "before the", "discussion even", "started."]}, {"id": "bsg2_12", "context": "Are you applying for the robotics internship?", "sentence": "I would apply if the posting didn't require two years of experience.", "chunks": ["I would", "apply if", "the posting", "didn't require", "two years", "of experience."]}, {"id": "bsg2_13", "context": "Everyone's complaining about the new campus app.", "sentence": "My roommate told me it tracks your location even when closed.", "chunks": ["My roommate", "told me", "it tracks", "your location", "even when", "closed."]}, {"id": "bsg2_14", "context": "Who's directing the student film this year?", "sentence": "The woman whose short documentary won the festival prize last spring.", "chunks": ["The woman", "whose short", "documentary won", "the festival", "prize", "last spring."]}, {"id": "bsg2_15", "context": "They're going to tear down the old train station.", "sentence": "Isn't that building protected under some kind of heritage law?", "chunks": ["Isn't that", "building protected", "under some", "kind of", "heritage", "law?"]}, {"id": "bsg2_16", "context": "Should I learn Python or C++ first?", "sentence": "Python is easier to start with, though C++ runs much faster.", "chunks": ["Python is", "easier to", "start with,", "though C++", "runs much", "faster."]}, {"id": "bsg2_17", "context": "I need to print a prototype by Thursday.", "sentence": "Do you know how long the printers in the makerspace are booked?", "chunks": ["Do you know", "how long", "the printers", "in the", "makerspace", "are booked?"]}, {"id": "bsg2_18", "context": "I want to read that Japanese novel for class.", "sentence": "It hasn't been translated into English yet, as far as I know.", "chunks": ["It hasn't", "been translated", "into English", "yet,", "as far", "as I know."]}, {"id": "bsg2_19", "context": "How was the concert hall acoustically?", "sentence": "Better than I had expected, especially in the seats behind the stage.", "chunks": ["Better than", "I had", "expected,", "especially in", "the seats", "behind the", "stage."]}, {"id": "bsg2_20", "context": "My professor banned AI tools for the essay draft.", "sentence": "If I were her, I would at least allow it for brainstorming.", "chunks": ["If I", "were her,", "I would", "at least", "allow it", "for brainstorming."]}], "emails": [{"id": "em1", "scenario": "You are the events manager for your university photography club. You ordered three tripods and a portable lighting kit for the club's annual exhibition, but the lighting kit arrived with a cracked panel and will not turn on. The exhibition opens in six days.", "task": "Write an email to the supplier's customer service manager. In your email: (1) explain what you ordered and what arrived damaged, (2) describe how the damage affects your club's event, (3) request a specific solution and state when you need it by.", "recipient": "Ms. Harper, customer service manager at Lumen Studio Supply", "tone": "formal", "sample_answer": "Dear Ms. Harper,\n\nI am writing about order number 4417, which our university photography club received yesterday. The three tripods arrived in good condition, but the portable lighting kit has a cracked front panel and does not switch on at all.\n\nUnfortunately, this equipment is essential for our annual exhibition, which opens in six days. Without working lights, we cannot display the printed photographs properly, and we are expecting more than two hundred visitors over the weekend.\n\nCould you please send a replacement lighting kit so that it arrives by Tuesday? If a replacement cannot reach us in time, I would like to request a full refund instead. I am happy to return the damaged unit and can send photographs of the crack if that would help.\n\nThank you for your prompt attention to this matter.\n\nSincerely,\nJiwon Park", "tips_ko": "격식체 이메일이므로 축약형과 감정적인 표현을 피하고 주문 번호 같은 구체적 정보를 앞부분에 넣으세요. 세 요소를 각각 다른 문단으로 나누고 마지막에 요청 기한을 분명히 밝히면 점수가 안정적으로 올라갑니다."}, {"id": "em2", "scenario": "Your work schedule changed last month, so you can no longer attend the Wednesday evening English conversation club at your local community center. You already paid the fee for the full twelve week term. You would like to move to the Saturday morning group instead.", "task": "Write an email to the program coordinator. In your email: (1) explain why you can no longer attend the Wednesday sessions, (2) ask whether you can move to the Saturday morning group, (3) ask what will happen to the fee you have already paid.", "recipient": "Mr. Novak, program coordinator at the Riverside Community Center", "tone": "semi-formal", "sample_answer": "Dear Mr. Novak,\n\nI hope you are doing well. I have been attending the Wednesday evening conversation club since March, and I have really enjoyed the sessions.\n\nUnfortunately, my company moved me to a later shift last month, and I now finish work at eight, so I can no longer get to the center in time on Wednesdays. I am sorry to miss the group, especially in the middle of the term.\n\nWould it be possible to transfer to the Saturday morning group instead? I am free every Saturday and could start this week if there is space available.\n\nI also wanted to ask about the fee I paid for the full twelve week term. Could it be applied to the Saturday sessions, or would I need to pay again?\n\nThank you for your help.\n\nBest regards,\nJiwon Park", "tips_ko": "준격식체에서는 가벼운 인사말과 정중한 요청 표현을 함께 쓰고 지나치게 딱딱한 어휘는 피하세요. 이유, 변경 요청, 비용 문의를 각각 한 문단으로 처리하고 요청은 의문문 형태로 부드럽게 쓰는 것이 좋습니다."}, {"id": "em3", "scenario": "Your company selected you for a six week training program at an overseas office, starting on October 6. However, you are scheduled to present the results of a client project on October 9, and your team needs you for that presentation. You would like the training to begin two weeks later.", "task": "Write an email to the human resources training coordinator. In your email: (1) thank the company and confirm that you accept the placement, (2) explain the scheduling conflict you have, (3) request a later start date and offer a workable alternative.", "recipient": "Ms. Aliyeva, training coordinator in the Human Resources department", "tone": "formal", "sample_answer": "Dear Ms. Aliyeva,\n\nThank you very much for selecting me for the six week training program at the Singapore office. I am grateful for the opportunity and I would like to confirm that I accept the placement.\n\nI do, however, have one scheduling difficulty. The program begins on October 6, but I am scheduled to present the final results of the Hanbit client project on October 9. My team has been preparing this presentation for three months, and I am the only member familiar with the data analysis.\n\nWould it be possible to begin the training two weeks later, on October 20? I understand that the November group follows the same curriculum, so joining that session would also be acceptable to me.\n\nPlease let me know which option is easier to arrange.\n\nSincerely,\nJiwon Park", "tips_ko": "회사 상대 이메일은 감사 표현으로 시작해 협조적인 태도를 먼저 보여 주고 문제 제기는 그다음에 하세요. 대안을 두 가지 제시하면 요청이 무리하게 들리지 않고 세 요소가 자연스럽게 문단으로 나뉩니다."}, {"id": "emg0_1", "scenario": "You are a second-year psychology major at Fairview College. Your professor mentioned in class that her laboratory studies how sleep affects memory, and you want to join as an undergraduate research assistant. You have strong statistics grades, basic coding skills, and about ten free hours each week.", "task": "Write an email to your professor. In your email: (1) introduce yourself and state why you are writing, (2) describe the skills and background that make you suitable, (3) explain your availability and propose a next step.", "recipient": "Professor Alvarez, cognitive psychology instructor and laboratory director", "tone": "formal", "sample_answer": "Dear Professor Alvarez,\n\nI am a second-year psychology major in your Cognitive Science course, and I am writing to ask whether you need an undergraduate research assistant this semester.\n\nYour lecture on sleep and memory consolidation convinced me that I want hands-on laboratory experience. I have completed Statistics for Behavioral Science with a grade of A, and I can code simple data cleaning scripts in R, so I could help with participant scheduling and dataset preparation.\n\nI am available on Monday and Wednesday afternoons and could commit roughly ten hours each week for the full term.\n\nWould you be free to meet during your office hours next week to discuss this? I have attached my transcript and a short resume for your reference.\n\nThank you for considering my request.\n\nSincerely,\nMinseo Kang", "tips_ko": "교수님께 쓰는 메일이니까 전공과 수강 과목을 먼저 밝히고 가능한 요일까지 구체적으로 적어야 해. 성적이나 기술처럼 증거가 되는 정보를 한 문장에 몰아넣으면 설득력이 올라가."}, {"id": "emg0_2", "scenario": "You rent an apartment and mold has been spreading across your bathroom ceiling for the past three weeks. You have mild asthma, and your symptoms have worsened since the mold appeared. Your doctor has told you the moisture problem needs to be fixed quickly.", "task": "Write an email to your landlord. In your email: (1) identify your apartment and describe the problem in detail, (2) explain how it is affecting your health, (3) request specific repairs and give a deadline.", "recipient": "Mr. Whitaker, the landlord of your apartment building", "tone": "formal", "sample_answer": "Dear Mr. Whitaker,\n\nI am writing about a problem in apartment 3B at 24 Linden Street, where I have rented since last September. Over the past three weeks, dark mold has spread across the bathroom ceiling and along the wall behind the shower, and the room smells damp even when the window stays open.\n\nThis is a health concern for me. I have mild asthma, and since the mold appeared I have been coughing at night and using my inhaler far more often than usual. My doctor has advised me to have the source of the moisture repaired quickly.\n\nCould you please arrange for a contractor to inspect the ventilation fan and remove the mold before the end of next week? I am home most mornings and can let anyone in.\n\nThank you for your help.\n\nSincerely,\nClaire Benson", "tips_ko": "집주인한테는 감정 표현보다 위치와 기간 같은 사실을 먼저 적는 게 효과적이야. 건강 문제는 의사 조언을 한 줄 넣고 수리 기한을 꼭 못 박아."}, {"id": "emg0_3", "scenario": "You work as a junior analyst on a pricing team. A two-day behavioral economics workshop in another city covers price framing and experiment design, which relates directly to a project your team struggled with. You need your manager's approval for the cost and the time away from the office.", "task": "Write an email to your manager. In your email: (1) state what you want approval for, (2) explain how the workshop benefits your team's work, (3) address the cost and how your duties will be covered.", "recipient": "Ms. Okafor, your team manager", "tone": "formal", "sample_answer": "Dear Ms. Okafor,\n\nI would like to request approval to attend the Regional Behavioral Economics Workshop in Chicago on November 12 and 13.\n\nThe workshop focuses on how customers respond to price framing and default options, which is exactly the problem our team faced during the subscription redesign last quarter. Two sessions cover A/B testing methods that I could apply directly to our pricing experiments.\n\nThe registration fee is 340 dollars, and travel and one hotel night would add about 400 dollars. I would be out of the office for two days, but I have already asked Daniel to cover the Thursday client report, and he has agreed.\n\nIf you approve, I would be glad to run a short training session for the team afterward.\n\nThank you for considering this request.\n\nBest regards,\nHaneul Seo", "tips_ko": "상사한테 요청할 때는 비용과 업무 공백 대책을 같이 적어야 통과돼. 회사나 팀에 돌아올 이득을 마지막에 붙이면 훨씬 좋아."}, {"id": "emg0_4", "scenario": "You and a classmate are working on a sociology project about commuting habits and stress. A third group member dropped the course yesterday, leaving the survey design section unassigned, and your draft is due in about two weeks.", "task": "Write an email to your classmate. In your email: (1) explain what has changed with your group, (2) propose how the remaining work should be divided, (3) suggest a time to meet and confirm the plan.", "recipient": "Rebecca, your classmate and project partner", "tone": "semi-formal", "sample_answer": "Hi Rebecca,\n\nI hope your week is going well. I wanted to update you about our sociology project on commuting habits and stress. Jonah dropped the course yesterday, so the section on survey design is now unassigned, and our draft is due on the 21st.\n\nHere is what I suggest. I will take over the survey design and write the methods section, since I already built the question list for our pilot. Could you handle the literature review and the two charts for the results section? That split looks roughly equal to me.\n\nWould Thursday at four work for a quick video call to confirm everything? If that time is bad, send me two options and I will adjust.\n\nThanks a lot,\nDaniel", "tips_ko": "같은 반 친구라도 과제 메일은 반쯤 격식 있게 써야 해. 역할 분담을 항목처럼 분명히 나누고 회의 시간은 하나를 먼저 제안해."}, {"id": "emg0_5", "scenario": "You are the student coordinator of a college nutrition outreach group. A large community health fair is being held next month, and you want your group to run a booth offering free blood pressure checks and information about sodium and heart health.", "task": "Write an email to the fair's organizer. In your email: (1) introduce your group and request a booth, (2) describe the activities you plan to offer, (3) state what facilities you need and ask for a decision by a certain date.", "recipient": "Dr. Lindqvist, organizer of the Riverside Community Health Fair", "tone": "formal", "sample_answer": "Dear Dr. Lindqvist,\n\nI am the student coordinator of the Nutrition Outreach Group at Fairview College, and I am writing to ask whether our group may host a booth at the Riverside Community Health Fair on October 18.\n\nWe would like to offer free blood pressure checks supervised by a registered nurse, along with a short display explaining how sodium intake affects cardiovascular risk. Last spring we ran a similar booth on campus and spoke with more than one hundred and fifty visitors.\n\nWe would need one standard table, two chairs, and access to a power outlet for our monitor. Six trained volunteers would staff the booth from nine until four.\n\nCould you let me know by October 6 whether space is available? I am happy to provide our liability insurance documents.\n\nSincerely,\nAmara Ndiaye", "tips_ko": "행사 주최자에게는 활동 내용과 필요한 설비를 따로 나눠서 적어. 지난 경험과 인원 수를 넣으면 신뢰가 확 생겨."}, {"id": "emg0_6", "scenario": "You subscribe to a statistics software service that you use for your economics thesis. This month you were charged twice within three days, although you hold only one student license. You do not want to cancel the account because your saved datasets are stored there.", "task": "Write an email to the company's customer service team. In your email: (1) identify your account and describe the billing error, (2) explain the evidence you have and why the account matters to you, (3) request a specific remedy and a response deadline.", "recipient": "the customer service team at StatLine Pro", "tone": "formal", "sample_answer": "Dear Customer Service Team,\n\nI am writing about my account, registered under the email a.torres@mailbox.com, for the StatLine Pro statistics subscription. On September 1 and again on September 3, I was charged 29 dollars, although I hold only one annual student license.\n\nMy bank statement shows both payments clearly, and I have attached a screenshot. I use this software for my economics thesis, so I did not want to cancel the account and lose access to my saved datasets while the problem is unresolved.\n\nCould you please refund the duplicate charge of 29 dollars and confirm in writing that only one subscription remains active on my account? I would appreciate a reply within five business days, since my next billing date falls on October 1.\n\nThank you for your assistance.\n\nSincerely,\nAlejandro Torres", "tips_ko": "고객센터 메일은 계정 정보와 결제 날짜를 첫 문단에 다 넣어야 해. 원하는 해결책과 답변 기한을 분명하게 요구해."}, {"id": "emg0_7", "scenario": "You are taking a development economics course and must submit an empirical paper on Friday. Your analysis depends on household income data from a national survey archive, but your access request was approved only this morning after a nine-day delay. The writing is partly done, but the statistical work is not.", "task": "Write an email to your professor. In your email: (1) state what you are requesting, (2) explain the cause of the delay and what you have already completed, (3) propose a new submission date and offer supporting evidence.", "recipient": "Professor Ikeda, your development economics instructor", "tone": "formal", "sample_answer": "Dear Professor Ikeda,\n\nI am writing to request a short extension for the empirical paper due in Development Economics on Friday.\n\nMy analysis relies on household income data from the national survey archive, and my access request was approved only this morning after a nine-day delay. I have finished the literature review and the model specification, but I cannot run the regressions or discuss the results without the dataset.\n\nWould it be possible to submit the paper on Monday, October 13, instead? That would give me the weekend to complete the estimation and revise the discussion section properly. I am happy to forward the confirmation emails from the archive if you would like to see them.\n\nI apologize for the inconvenience and appreciate your understanding.\n\nSincerely,\nElena Sokolov", "tips_ko": "기한 연장 요청은 핑계처럼 들리지 않게 이미 끝낸 부분을 먼저 말해. 새 제출 날짜를 직접 제안하는 게 핵심이야."}, {"id": "emg0_8", "scenario": "Your poster on sleep duration and exam anxiety was accepted for an undergraduate psychology research conference. However, your presentation slot overlaps exactly with a clinical placement interview at a hospital that your department arranged and cannot reschedule.", "task": "Write an email to the conference organizer. In your email: (1) thank the organizer and identify your poster, (2) explain the scheduling conflict and why it cannot be avoided, (3) request an alternative slot and describe your flexibility.", "recipient": "Mr. Castellanos, organizer of the Undergraduate Psychology Research Conference", "tone": "formal", "sample_answer": "Dear Mr. Castellanos,\n\nThank you for accepting my poster, Sleep Duration and Exam Anxiety in First-Year Students, for the Undergraduate Psychology Research Conference on November 7.\n\nI am writing because my poster has been scheduled for the two o'clock session, and I am required to be in a clinical placement interview at the hospital at that exact hour. The interview was arranged by my department and cannot be moved.\n\nWould it be possible to present during the morning session instead, or at any slot before noon? I can arrive as early as eight to set up, and I am flexible about the room.\n\nPlease let me know whether a change is possible, and I will confirm my travel plans immediately afterward.\n\nThank you very much for your help.\n\nSincerely,\nPriya Raghavan", "tips_ko": "일정 변경 요청은 바꿀 수 없는 상황이라는 점을 분명히 밝혀야 해. 대안 시간대를 넓게 제시하면 수락될 확률이 올라가."}, {"id": "emg1_1", "scenario": "You are taking an earth science course that includes required fieldwork. You missed a coastal geology survey because a major train disruption prevented you from reaching campus before the group departed.", "task": "Write an email to your earth science professor. In your email: (1) explain why you missed the field survey, (2) describe why you are concerned about missing the pra
