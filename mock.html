 written.", "Monthly deadlines left no time for editing of any kind.", "The early numbers had already been sold to readers.", "Publishers kept control of the manuscript once it was accepted."], "answer": 2, "explain_ko": "첫 회차가 이미 팔려 나갔기 때문에 앞부분을 고칠 수 없었다고 했어."}, {"type": "inference", "stem": "It can be inferred from the passage that a character whose installments sold poorly was likely to", "options": ["be described in the recapitulations instead", "be given a longer and more detailed history", "be moved into a separate novel of his own", "appear less often in later parts of the novel"], "answer": 3, "explain_ko": "디킨스는 판매 수치를 보고 인기 없는 인물의 비중을 조용히 줄였다고 나와."}, {"type": "purpose", "stem": "Why does the author mention television drama?", "options": ["To explain why Victorian novels are rarely read today", "To contrast visual storytelling with printed fiction", "To show that the serial form answers lasting commercial pressures", "To suggest that padding is unavoidable in long narratives"], "answer": 2, "explain_ko": "텔레비전이 같은 효과를 다시 발견했다는 건 연재가 시대를 넘는 경제적 대응이라는 뜻이야."}]}, {"id": "acg2_3", "title": "Error Correcting Codes", "text": "Every channel that carries digital information corrupts some of it. A scratch on a disc, a burst of static on a radio link, or a cosmic ray striking a memory cell can flip a bit from zero to one, and the receiver has no way of knowing which bits arrived as sent. The obvious remedy, sending each message several times and taking a majority vote, works but is wasteful: tripling the data to catch a single error means two thirds of the channel is spent on insurance.\n\nError correcting codes achieve the same protection far more cheaply by adding structure instead of repetition. In a Hamming code, a block of data bits is accompanied by a handful of parity bits, each computed from an overlapping subset of the data. If one bit changes anywhere in the block, the pattern of failed parity checks points directly to its position, and the receiver simply flips it back. Seven bits can thus protect four bits of information against any single error, a far better ratio than threefold repetition offers.\n\nThe underlying idea is geometric. Valid codewords are spaced far apart in the set of all possible bit strings, so a corrupted word still lies nearer to its original than to any other legal word. That spacing determines how much damage a code can absorb, and designers choose it according to the channel they expect. Deep space probes, which cannot retransmit cheaply, use codes with heavy redundancy, while a wired network that can request a second copy settles for codes that only detect errors.", "questions": [{"type": "vocabulary", "stem": "The word \"wasteful\" in the passage is closest in meaning to", "options": ["unreliable", "inefficient", "complicated", "outdated"], "answer": 1, "explain_ko": "채널의 삼분의 이를 보험에 쓴다는 설명이 뒤따르니까 비효율적이라는 뜻이야."}, {"type": "detail", "stem": "According to the passage, how does a receiver using a Hamming code find a flipped bit?", "options": ["By measuring the distance to the nearest invalid word", "By reading the pattern of parity checks that fail", "By counting how many bits in the block are set to one", "By comparing the block with a second copy of the message"], "answer": 1, "explain_ko": "실패한 패리티 검사들의 패턴이 오류 위치를 바로 가리켜 준다고 했어."}, {"type": "negative_fact", "stem": "According to the passage, all of the following are mentioned as causes of bit errors EXCEPT", "options": ["static on a radio link", "a mistake in computing a parity bit", "a cosmic ray hitting a memory cell", "a scratch on a disc"], "answer": 1, "explain_ko": "패리티 계산 실수는 오류 원인으로 언급되지 않았어."}, {"type": "inference", "stem": "It can be inferred from the passage that a channel on which resending data is cheap and easy", "options": ["requires codewords spaced farther apart", "needs codes with less built in redundancy", "suffers fewer bit errors than other channels", "cannot use parity bits at all"], "answer": 1, "explain_ko": "다시 받기 쉬운 유선망은 교정 없이 탐지만 하는 가벼운 코드로 충분하다고 했어."}, {"type": "purpose", "stem": "Why does the author mention deep space probes?", "options": ["To argue that majority voting remains useful in science", "To show that some channels corrupt almost every bit", "To explain why Hamming codes were originally developed", "To illustrate how the cost of retransmission shapes the choice of code"], "answer": 3, "explain_ko": "재전송이 비싼 환경과 싼 환경을 대비해서 코드 선택 기준을 보여주는 예시야."}]}, {"id": "acg2_4", "title": "Measuring the Sound of a Hall", "text": "Until the end of the nineteenth century, the sound of a concert hall was a matter of luck. Builders copied rooms that happened to please audiences without knowing what made them work, and a hall praised for its warmth might be reproduced in slightly altered proportions with disappointing results. The first measurable account of the problem came from Wallace Sabine, a physicist asked to explain why a new lecture theater at Harvard was nearly unusable. Speech there lingered so long that each syllable overlapped the next.\n\nSabine timed how long an organ pipe remained audible after being silenced, repeating the measurement as he carried seat cushions into the room, and found that reverberation time fell in proportion to the amount of absorbing material present. The resulting formula allowed designers to predict, from a room's volume and surfaces, roughly how long sound would persist. Reverberation turned out to be a compromise rather than a quantity to minimize: a hall dry enough for a spoken lecture sounds thin for an orchestra, while one flattering to a symphony blurs consonants.\n\nModern acoustics has complicated Sabine's picture without replacing it. Listeners judge a hall partly by how quickly sound arrives from the side walls, which is why narrow rectangular rooms often outperform wide fan shaped ones of identical reverberation time. Adjustable panels and movable ceilings now let a single auditorium serve speech and music alike, though many engineers maintain that no mechanism yet matches a shape designed from the start for one purpose.", "questions": [{"type": "vocabulary", "stem": "The word \"lingered\" in the passage is closest in meaning to", "options": ["arrived late", "grew louder", "persisted", "echoed faintly"], "answer": 2, "explain_ko": "소리가 오래 남아서 음절이 겹쳤다는 맥락이니까 persisted가 맞아."}, {"type": "detail", "stem": "According to the passage, what did Sabine do with seat cushions?", "options": ["He brought them into the room while timing how long a sound remained audible.", "He compared halls that used cushions with halls that did not.", "He used them to estimate how many listeners a room could hold.", "He placed them along the side walls to redirect reflections."], "answer": 0, "explain_ko": "쿠션을 들여놓으면서 잔향 시간을 반복 측정해 흡음량과의 관계를 찾아냈어."}, {"type": "negative_fact", "stem": "According to the passage, all of the following influence how a hall sounds EXCEPT", "options": ["the number of performers on the stage", "the amount of absorbing material in it", "the volume of the room", "how soon sound reaches listeners from the side walls"], "answer": 0, "explain_ko": "연주자 수는 언급되지 않았고 부피와 흡음재, 측면 반사만 다루고 있어."}, {"type": "inference", "stem": "It can be inferred from the passage that a room intended mainly for lectures should be designed to have", "options": ["a shorter reverberation time than a symphony hall", "wider fan shaped seating than a symphony hall", "a larger volume than a symphony hall", "fewer absorbing surfaces than a symphony hall"], "answer": 0, "explain_ko": "말소리가 또렷하려면 잔향이 짧아야 하고 오케스트라용은 그 반대라고 했어."}, {"type": "purpose", "stem": "Why does the author mention narrow rectangular rooms?", "options": ["To demonstrate that reverberation time is difficult to measure", "To suggest that movable ceilings are rarely necessary", "To show that Sabine's formula gives an incomplete account of a hall's quality", "To explain why older halls were cheaper to build"], "answer": 2, "explain_ko": "잔향 시간이 같아도 평가가 달라진다는 예라서 사빈 공식만으로는 부족함을 보여줘."}]}, {"id": "acg2_5", "title": "Designing Type for Screens", "text": "A typeface that reads comfortably in a printed book can fail badly on a screen, and for several decades the reason was simple arithmetic. Printing places thousands of ink dots within a single letter, so the thin strokes and sharp corners of a traditional face survive. An early computer display had perhaps a dozen pixels of height for a lowercase letter, and every curve had to be approximated by square cells. Designers responded by drawing faces specifically for that constraint, widening the openings inside letters, flattening curves, and spacing characters more loosely than print convention allowed.\n\nSoftware helped as well. Hinting is a set of instructions attached to a font that tells the rendering engine how to snap outlines onto the pixel grid, so that stems of equal weight do not come out one pixel wide in one letter and two in the next. Hand written hinting was slow and expensive, which is partly why the same handful of screen faces appeared on almost every computer of the 1990s.\n\nDisplays have since grown dense enough that the original problem has largely dissolved, and designers now revive delicate printed faces without penalty. The habits formed under constraint have not disappeared, though. Readers accustomed to open, evenly weighted letterforms tend to find them easier on any medium, and the generous spacing once forced by coarse pixels is now chosen deliberately for small phone screens. Technical limits, it turns out, leave aesthetic preferences behind them long after the limits themselves are gone.", "questions": [{"type": "main_idea", "stem": "Which of the following best expresses the main idea of the passage?", "options": ["Low resolution displays shaped how type was designed, and those choices outlived the limitation.", "Printed typefaces have always been more legible than screen typefaces.", "Hinting software made separate screen typefaces unnecessary.", "Phone screens have reversed the design trends of the 1990s."], "answer": 0, "explain_ko": "저해상도라는 제약이 서체 설계를 바꿨고 그 습관이 제약보다 오래 남았다는 게 핵심이야."}, {"type": "vocabulary", "stem": "The word \"dissolved\" in the passage is closest in meaning to", "options": ["returned", "spread", "disappeared", "worsened"], "answer": 2, "explain_ko": "해상도가 높아져서 원래 문제가 사실상 사라졌다는 뜻이야."}, {"type": "detail", "stem": "According to the passage, what does hinting do?", "options": ["It automatically widens the spaces between characters.", "It increases the number of pixels available for each letter.", "It tells the rendering engine how to align letter outlines with the pixel grid.", "It converts a printed typeface into a screen typeface."], "answer": 2, "explain_ko": "힌팅은 윤곽선을 픽셀 격자에 맞춰 붙이는 방법을 렌더링 엔진에 알려주는 지시야."}, {"type": "inference", "stem": "It can be inferred from the passage that if hinting had been inexpensive to produce, computers of the 1990s would have", "options": ["spaced characters more tightly than they did", "offered a wider selection of screen typefaces", "relied more heavily on printed type designs", "required displays with more pixels per letter"], "answer": 1, "explain_ko": "힌팅 비용 때문에 몇 종류만 쓰였다고 했으니 싸면 선택지가 늘었겠지."}, {"type": "purpose", "stem": "Why does the author mention small phone screens?", "options": ["To give an example of a habit from the past now adopted by choice", "To argue that printed faces are unsuitable for mobile devices", "To show that pixel density still limits type design today", "To explain why hinting is no longer written by hand"], "answer": 0, "explain_ko": "예전엔 어쩔 수 없이 넓혔던 자간을 지금은 일부러 고른다는 예시야."}]}, {"id": "acg3_1", "title": "Biochar and Tropical Soils", "text": "Farmers in humid tropical regions often struggle to maintain fertile soil. Heavy rainfall carries soluble nutrients below the reach of crop roots, while high temperatures accelerate the decomposition of organic matter. Adding ordinary plant material can temporarily improve the soil, but much of it disappears within a few growing seasons. For this reason, researchers have become interested in biochar, a carbon-rich substance produced by heating agricultural waste in an environment with little oxygen.\n\nBiochar is highly porous, and its internal surfaces can retain water and electrically charged nutrients. It may therefore reduce nutrient loss and provide microscopic shelters for fungi and bacteria that support plant growth. However, biochar does not act as a fertilizer by itself because it generally contains limited amounts of essential nutrients. The greatest crop increases usually occur when it is combined with compost or conventional fertilizer. Results also vary according to the material used to make the biochar and the temperature at which it was produced.\n\nEnthusiasm for biochar also reflects its possible role in climate policy. Plants remove carbon dioxide from the atmosphere as they grow, but that carbon normally returns quickly when the plants decay. Converting crop waste into biochar produces a form of carbon that can remain in soil for centuries. Yet large-scale production must be managed carefully. If forests are cleared specifically to supply biochar facilities, the resulting ecological damage may outweigh any climatic benefit. Thus, biochar is best understood not as a universal remedy but as one tool whose value depends on local soils, production methods, and sources of raw material.", "questions": [{"type": "vocabulary", "stem": "The word \"accelerate\" in the passage is closest in meaning to", "options": ["observe", "speed up", "prevent", "measure"], "answer": 1, "explain_ko": "accelerate는 어떤 과정의 속도를 높인다는 뜻이야. 여기서는 높은 온도가 유기물 분해를 빠르게 해."}, {"type": "detail", "stem": "According to the passage, why can biochar help soil retain nutrients?", "options": ["Its essential nutrients are released immediately.", "It prevents crops from absorbing too much water.", "It lowers the temperature of the soil.", "Its porous surfaces can hold electrically charged nutrients."], "answer": 3, "explain_ko": "바이오차의 다공성 표면이 전하를 띤 영양분을 붙잡을 수 있다고 설명해."}, {"type": "negative_fact", "stem": "According to the passage, all of the following influence the effectiveness or environmental value of biochar EXCEPT", "options": ["the production temperature", "the color of the crops grown", "the type of agricultural waste used", "the source of the raw material"], "answer": 1, "explain_ko": "작물의 색은 바이오차의 효과와 관련된 요소로 언급되지 않아."}, {"type": "inference", "stem": "What can be inferred about applying biochar without compost or fertilizer?", "options": ["It may produce smaller crop improvements than a combined treatment.", "It will release more nutrients than crops can absorb.", "It will cause all soil microorganisms to disappear.", "It is effective only in cold and dry regions."], "answer": 0, "explain_ko": "가장 큰 수확량 증가는 퇴비나 비료와 함께 쓸 때 나타나므로 바이오차만 쓰면 효과가 더 작을 수 있어."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Biochar should completely replace conventional fertilizers in tropical agriculture.", "Biochar has potential agricultural and climatic benefits, but its value depends on how and where it is produced and used.", "Most tropical soils became infertile because farmers stopped applying agricultural waste.", "Producing biochar from forests is the fastest way to reduce atmospheric carbon dioxide."], "answer": 1, "explain_ko": "글은 바이오차의 토양 및 기후상 이점과 함께 조건에 따른 한계도 강조해."}]}, {"id": "acg3_2", "title": "Water Sharing on Andean Terraces", "text": "For centuries, farming communities in the Andes have cultivated steep slopes by constructing stone-walled terraces. The walls reduce soil erosion, while the flat surfaces allow water to soak into the ground rather than rush downhill. Many terraces receive water through narrow canals that divert seasonal flows from mountain streams. Maintaining this system requires more than technical knowledge: it also depends on agreements about who may use water, when they may use it, and how they must contribute to repairs.\n\nIn some communities, water turns are assigned according to the location and size of each household's fields. A family may receive access for only a few hours, so farmers must clear blocked channels before their turn begins. Canal cleaning is commonly organized as collective labor. Households that repeatedly fail to participate may lose priority during periods of scarcity. Such rules are not merely punishments; they discourage individuals from enjoying a shared resource without helping to preserve it.\n\nDuring the twentieth century, some development programs replaced community-managed canals with concrete channels and centralized schedules. Concrete reduced leakage, but the new arrangements did not always improve harvests. Water that had leaked from earthen canals had previously supported wetlands, livestock, and springs farther down the slope. In addition, schedules created by distant officials sometimes conflicted with local planting cycles. Recent projects have consequently begun to combine modern engineering with customary institutions. Their experience suggests that an irrigation network is both physical infrastructure and a social system. Improving one part without understanding the other can produce unexpected losses.", "questions": [{"type": "detail", "stem": "According to the passage, how do terraces help conserve soil and water?", "options": ["They eliminate the need for irrigation canals.", "They increase the steepness of cultivated slopes.", "They reduce erosion and give water time to enter the ground.", "They direct all rainfall into mountain streams."], "answer": 2, "explain_ko": "돌벽은 토양 침식을 줄이고 평평한 경작지는 물이 땅속으로 스며들게 해."}, {"type": "vocabulary", "stem": "The word \"scarcity\" in the passage is closest in meaning to", "options": ["celebration", "conflict", "maintenance", "shortage"], "answer": 3, "explain_ko": "scarcity는 필요한 자원이 부족한 상태를 뜻해. 여기서는 물이 부족한 시기를 가리켜."}, {"type": "purpose", "stem": "Why does the author mention wetlands, livestock, and springs farther down the slope?", "options": ["To show why farmers wanted to remove all concrete channels", "To identify resources that had benefited from water leaking out of earthen canals", "To explain why mountain streams flow only during winter", "To list the main causes of soil erosion on terraces"], "answer": 1, "explain_ko": "흙수로의 누수가 주변 생태와 생활 자원에도 도움을 주었다는 점을 보여 주는 사례야."}, {"type": "inference", "stem": "What can be inferred about households that help clean community canals?", "options": ["Their labor helps protect continued access to water.", "They are allowed to establish government schedules.", "They no longer need to wait for an assigned water turn.", "Their fields must be located beside a wetland."], "answer": 0, "explain_ko": "수로 청소에 계속 불참하면 물 사용 우선권을 잃을 수 있으므로 참여는 접근권 유지에 도움이 돼."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["Government officials introduced terrace farming to the Andes during the twentieth century.", "Collective labor is used mainly to construct new wetlands.", "Concrete canals are unsuitable for every mountainous region.", "Andean terrace systems succeed through an interaction of engineering and community rules."], "answer": 3, "explain_ko": "안데스 관개 체계는 물리적 시설뿐 아니라 공동체의 규칙과 협력에도 의존한다는 내용이 중심이야."}]}, {"id": "acg3_3", "title": "How Whistled Languages Carry Speech", "text": "In several mountainous and forested regions, people have developed whistled forms of their spoken languages. These systems are not collections of simple signals like alarms or hunting calls. Instead, they transform important features of ordinary speech into whistles, allowing users to communicate detailed messages across valleys or through dense vegetation. Because a whistle occupies a narrow range of sound frequencies, it loses less energy over distance than many components of the human voice.\n\nThe method of transformation depends on the structure of the local spoken language. In a tonal language, where pitch differences distinguish words, whistlers reproduce the changing pitch patterns of speech. In a nontonal language, they may represent vowel qualities through different whistle pitches and indicate consonants by interrupting or modifying the sound. Context resolves much of the ambiguity that remains. A message about collecting crops, for example, is easier to interpret when listeners already know which fields are being harvested that week.\n\nWhistled speech has often declined after roads, telephones, and formal schooling reduce the situations in which it is useful. Children may also avoid it if they associate it with an old-fashioned rural identity. Nevertheless, some communities have introduced classroom lessons and public competitions to preserve the practice. Linguists value these efforts because whistled speech acts as a natural experiment: it shows which parts of a language can be removed while messages remain understandable. Its study therefore offers insight into human perception as well as into the adaptability of language.", "questions": [{"type": "vocabulary", "stem": "The word \"ambiguity\" in the passage is closest in meaning to", "options": ["uncertainty of meaning", "speed of response", "accuracy of memory", "loudness of sound"], "answer": 0, "explain_ko": "ambiguity는 뜻이 하나로 분명하지 않은 상태야. 문맥이 이런 불확실성을 해결한다고 설명해."}, {"type": "detail", "stem": "According to the passage, how may whistlers represent consonants in a nontonal language?", "options": ["By using gestures together with every whistle", "By repeating the spoken consonants at a lower volume", "By assigning each consonant to a separate valley", "By interrupting or changing the whistled sound"], "answer": 3, "explain_ko": "비성조 언어에서는 휘파람 소리를 끊거나 변형해서 자음을 나타낼 수 있어."}, {"type": "negative_fact", "stem": "According to the passage, all of the following have contributed to the decline of whistled speech EXCEPT", "options": ["the spread of telephones", "negative attitudes toward rural identity", "the construction of roads", "the inability of whistles to cross valleys"], "answer": 3, "explain_ko": "휘파람은 오히려 계곡을 가로질러 멀리 전달되는 데 적합하다고 설명해."}, {"type": "purpose", "stem": "Why does the author give the example of a message about collecting crops?", "options": ["To illustrate how shared circumstances help listeners interpret an unclear message", "To show that whistled languages are used only for agricultural work", "To explain why tonal languages developed in farming regions", "To demonstrate that crop names cannot be expressed by whistles"], "answer": 0, "explain_ko": "공유된 상황 정보가 휘파람 메시지의 모호함을 줄여 주는 방식을 보여 주는 예야."}, {"type": "inference", "stem": "Why are linguists likely to support efforts to preserve whistled speech?", "options": ["It prevents spoken languages from changing their grammar.", "It provides evidence about which speech features are essential for understanding.", "It allows researchers to communicate with no contextual information.", "It proves that all languages originally consisted of whistles."], "answer": 1, "explain_ko": "휘파람 언어는 어떤 언어 요소가 사라져도 의미 전달이 가능한지 보여 주므로 언어 인식 연구에 유용해."}]}, {"id": "acg3_4", "title": "Restoring Oyster Reefs", "text": "Oysters are commonly viewed as seafood, but dense oyster reefs also perform important ecological functions in coastal waters. As oysters feed, they filter tiny particles from the water, sometimes increasing the amount of light that reaches underwater plants. Their shells accumulate into hard, irregular structures that provide shelter for fish, crabs, and other organisms. Reefs can also weaken waves before they strike the shore, reducing erosion during moderate storms.\n\nMany natural reefs declined when oysters were harvested faster than they could reproduce. Older fishing methods often removed not only living oysters but also the shells on which young oysters attach. Pollution and diseases added further pressure. Restoration projects now place cleaned shells, limestone, or specially designed concrete forms on the seafloor. Oyster larvae settle on these materials, and successive generations can gradually build a living reef.\n\nRestoration, however, involves more than placing hard objects in the water. Managers must select sites with suitable salinity, currents, and oxygen levels. A location that receives excessive sediment may soon bury young oysters, while one exposed to powerful waves may lose the newly placed material. Researchers also caution against judging a project solely by the number of oysters present after one year. A reef may require several years to develop a complex structure and attract a diverse animal community. For that reason, long-term monitoring should measure not only oyster survival but also changes in water clarity, shoreline stability, and habitat use. Such measurements reveal whether a constructed reef is becoming a functioning ecosystem rather than merely an oyster bed.", "questions": [{"type": "detail", "stem": "According to the passage, why did some older fishing methods make oyster recovery more difficult?", "options": ["They prevented adult oysters from filtering particles.", "They introduced powerful waves into sheltered areas.", "They removed surfaces needed by young oysters.", "They increased the salinity of coastal waters."], "answer": 2, "explain_ko": "과거 어업은 어린 굴이 붙어 자라는 껍데기까지 제거해서 회복을 어렵게 했어."}, {"type": "vocabulary", "stem": "The word \"successive\" in the passage is closest in meaning to", "options": ["originating in distant places", "remaining unusually small", "competing for limited food", "following one after another"], "answer": 3, "explain_ko": "successive는 차례로 이어지는이라는 뜻이야. 여러 세대가 계속 쌓이며 암초를 만든다는 의미야."}, {"type": "negative_fact", "stem": "According to the passage, all of the following should be considered when selecting a restoration site EXCEPT", "options": ["the market price of seafood", "water movement", "salinity", "oxygen availability"], "answer": 0, "explain_ko": "해산물 시장 가격은 복원 장소를 고르는 환경 조건으로 언급되지 않아."}, {"type": "inference", "stem": "What can be inferred about a restored reef that contains many oysters after one year?", "options": ["It may not yet provide the full range of reef functions.", "It has certainly stopped all coastal erosion.", "It must have been built entirely from natural shells.", "It no longer requires suitable oxygen levels."], "answer": 0, "explain_ko": "복잡한 구조와 다양한 생물 군집이 형성되려면 여러 해가 걸리므로 굴의 수만 많다고 완전한 생태계는 아니야."}, {"type": "purpose", "stem": "Why does the author contrast a functioning ecosystem with merely an oyster bed?", "options": ["To emphasize that restoration success includes broader ecological effects", "To argue that restored oysters should never be harvested", "To show that oyster beds are always harmful to coastal plants", "To explain why concrete cannot be used in restoration"], "answer": 0, "explain_ko": "복원 성공은 굴의 생존뿐 아니라 수질과 해안 안정성 및 서식지 기능까지 포함한다는 점을 강조해."}]}, {"id": "acg3_5", "title": "Food Traces in Ancient Pottery", "text": "Archaeologists once inferred ancient diets mainly from animal bones, charred seeds, and cooking tools. Pottery now provides another source of evidence. During cooking, fats can enter microscopic pores in an unglazed vessel and remain there long after visible food has vanished. Researchers extract these residues and identify molecules associated with particular categories of plants or animals. The method can reveal that a pot held dairy products, for instance, even when no cattle bones survive at the site.\n\nSuch evidence has altered interpretations of early herding communities. At some settlements, the slaughtered animals were mostly old, a pattern suggesting that people kept them for renewable resources rather than primarily for meat. The discovery of dairy fats in pottery supports this interpretation because females could provide milk repeatedly without being killed. Residues have also shown that communities used the same type of vessel differently. One household might prepare meat in a particular pot shape, while another used similar pots for milk.\n\nChemical analysis nevertheless has limitations. Some foods leave stronger molecular traces than others, so their apparent frequency may exaggerate their actual importance. Residues can also enter a vessel from surrounding soil or from conservation materials applied after excavation. Researchers therefore compare samples from pots with samples from nearby sediment and examine several vessels from the same site. They also combine chemical results with evidence from bones, seeds, and vessel wear. When independent sources agree, conclusions about ancient food practices become more convincing. Pottery residues are thus valuable not because they provide a complete menu, but because they add a durable line of evidence to a larger archaeological investigation.", "questions": [{"type": "vocabulary", "stem": "The word \"durable\" in the passage is closest in meaning to", "options": ["inexpensive", "incomplete", "unexpected", "long-lasting"], "answer": 3, "explain_ko": "durable은 오랫동안 남거나 견디는이라는 뜻이야. 지방 성분이 오랜 시간이 지나도 보존될 수 있다는 맥락이야."}, {"type": "detail", "stem": "According to the passage, why can dairy fat remain detectable in ancient pottery?", "options": ["Fat enters microscopic spaces in unglazed vessels.", "Milk changes into bone during burial.", "Dairy products prevent pottery from breaking.", "Ancient people covered every pot with conservation material."], "answer": 0, "explain_ko": "조리 중 지방이 유약을 바르지 않은 그릇의 미세한 구멍으로 들어가 오래 남을 수 있어."}, {"type": "inference", "stem": "What does the combination of old animal bones and dairy residues most strongly suggest?", "options": ["Pottery was used only after animals were slaughtered.", "Herders obtained repeated resources from living animals.", "Young animals were unable to produce milk.", "The community imported all of its meat."], "answer": 1, "explain_ko": "동물을 늙을 때까지 기르고 우유 지방도 발견됐으므로 살아 있는 동물에게서 반복적으로 자원을 얻었다고 볼 수 있어."}, {"type": "purpose", "stem": "Why does the author mention residues that enter pottery from soil or conservation materials?", "options": ["To identify possible sources of misleading chemical evidence", "To argue that excavated vessels should be returned to the ground", "To explain why ancient people buried cooking vessels", "To show that pottery can preserve only plant molecules"], "answer": 0, "explain_ko": "토양이나 보존 재료가 화학 분석을 오염시켜 잘못된 해석을 만들 수 있음을 보여 줘."}, {"type": "main_idea", "stem": "What is the main idea of the passage?", "options": ["All early herding communities used identical pots exclusively for dairy products.", "Ancient pottery provides an exact record of every food consumed at a site.", "Chemical analysis has made animal bones and plant remains unnecessary.", "Pottery residues can contribute valuable dietary evidence, but they must be interpreted with other archaeological data."], "answer": 3, "explain_ko": "토기 잔류물은 중요한 식생활 증거지만 한계가 있으므로 다른 고고학 자료와 함께 해석해야 해."}]}]}, "listening": {"choose_response": [{"id": "cr1", "speaker": "W", "utterance": "Would you mind switching seats with me so I can sit with my group?", "options": ["Not at all. I'll move over here.", "Yes, my group meets on Thursday evenings.", "I'd rather pay for the seat myself.", "Because the lecture starts at ten sharp."], "answer": 0, "explain_ko": "자리를 바꿔 달라는 부탁에 대한 답이므로 흔쾌히 옮기겠다는 대답이 자연스럽다. 나머지는 부탁에 대한 수락이나 거절이 아니라 관련 없는 정보이다."}, {"id": "cr2", "speaker": "M", "utterance": "Sorry I'm late. The bus got stuck in traffic near the stadium.", "options": ["You should return your ticket tomorrow morning.", "The stadium holds forty thousand people.", "No problem. We haven't started yet.", "I drive to campus every single morning."], "answer": 2, "explain_ko": "늦은 것에 대한 사과이므로 괜찮다고 안심시키는 응답이 적절하다. 경기장 규모나 자신의 통학 방식은 사과에 대한 반응이 아니다."}, {"id": "cr3", "speaker": "W", "utterance": "Do you know whether the writing center takes walk ins on Fridays?", "options": ["My essay is about coastal erosion.", "Only in the morning, as far as I know.", "The center hired two new tutors.", "I walked there yesterday for exercise."], "answer": 1, "explain_ko": "예약 없이 방문이 가능한지 묻는 질문이므로 시간대를 알려 주는 응답이 답이다. 다른 선택지는 질문의 초점인 이용 가능 여부를 다루지 않는다."}, {"id": "cr4", "speaker": "M", "utterance": "I can give you a ride to the airport on Saturday if you like.", "options": ["The airport has three terminals now.", "Saturday is my favorite day of the week.", "I've never flown on that airline before.", "That would help a lot. Thank you."], "answer": 3, "explain_ko": "차를 태워 주겠다는 제안이므로 고맙다고 수락하는 응답이 적절하다. 공항 시설이나 항공사에 대한 언급은 제안에 대한 답이 되지 않는다."}, {"id": "cr5", "speaker": "W", "utterance": "This printer keeps jamming. Have you managed to get yours to work?", "options": ["I printed my whole thesis last semester.", "Mine jammed too. Try the one downstairs.", "Paper is usually made from wood pulp.", "I'd rather write the report by hand."], "answer": 1, "explain_ko": "프린터가 작동하는지 묻는 질문이므로 자신의 상황을 말하고 대안을 제시하는 응답이 답이다. 나머지는 현재 문제 해결과 관련이 없다."}, {"id": "cr6", "speaker": "M", "utterance": "Excuse me, is this seat taken, or may I sit here?", "options": ["Go ahead. It's free.", "I sat down about an hour ago.", "These seats were replaced last summer.", "No, I don't take milk in my coffee."], "answer": 0, "explain_ko": "자리에 앉아도 되는지 묻는 질문이라 허락하는 응답이 적절하다. 다른 선택지는 허락이나 거절을 표현하지 않는다."}, {"id": "cr7", "speaker": "W", "utterance": "Could you remind me when the group project proposal is actually due?", "options": ["I'm working with Daniel and Mina.", "The proposal was only three pages long.", "I remind myself with sticky notes.", "Friday at five, according to the syllabus."], "answer": 3, "explain_ko": "마감 시점을 묻는 질문이므로 구체적인 날짜와 시간을 알려 주는 응답이 답이다. 조원 이름이나 분량은 질문에 대한 답이 아니다."}, {"id": "cr8", "speaker": "M", "utterance": "I'm afraid I spilled coffee on the book you lent me. I'm really sorry.", "options": ["I usually drink tea in the afternoon.", "You can borrow another one tomorrow.", "Don't worry about it. It's an old copy.", "The library closes at nine on weekdays."], "answer": 2, "explain_ko": "책을 망친 것에 대한 사과이므로 괜찮다고 하며 부담을 덜어 주는 응답이 자연스럽다. 다른 선택지는 사과를 받아들이는 표현이 아니다."}, {"id": "crg0_1", "speaker": "W", "utterance": "Could you pass me the gloves before I open the specimen jar?", "options": ["Sure, here you go. Be careful with it.", "Yes, the specimens arrived from the field station.", "I'd rather skip the lab safety quiz today.", "The jar was labeled last Tuesday afternoon."], "answer": 0, "explain_ko": "장갑을 건네 달라는 부탁이니까 바로 건네주겠다는 대답이 자연스러워. 나머지는 부탁에 대한 응답이 아니고 단어만 겹치는 엉뚱한 정보야."}, {"id": "crg0_2", "speaker": "M", "utterance": "I can share my notes from the neuroscience lecture if you missed Thursday's class.", "options": ["The lecture hall holds about three hundred students.", "That would help a lot. Thanks so much.", "I missed the bus on Thursday morning too.", "Neuroscience is required for the biology major."], "answer": 1, "explain_ko": "노트를 공유해 주겠다는 제안이라서 고맙다고 받아들이는 대답이 맞아. 나머지는 제안을 수락하거나 거절하는 말이 아니야."}, {"id": "crg0_3", "speaker": "W", "utterance": "Why don't we run the survey online instead of handing out paper forms?", "options": ["The forms were printed on recycled paper.", "I surveyed the hospital staff last semester.", "Good idea. We'd get responses much faster.", "Because the response rate was fifty percent."], "answer": 2, "explain_ko": "온라인으로 하자는 제안이니까 동의하면서 이유를 덧붙이는 대답이 자연스러워. 나머지는 제안에 대한 찬반이 아니라 관련 없는 설명이야."}, {"id": "crg0_4", "speaker": "M", "utterance": "I'm sorry, I mixed up the labels on two of your blood samples.", "options": ["Blood pressure readings are taken twice daily.", "Sure, I'll mix the solution for you.", "The lab opens at eight on weekdays.", "It happens. Let's rerun both of them tomorrow."], "answer": 3, "explain_ko": "실수에 대한 사과라서 괜찮다고 하면서 해결책을 말하는 대답이 어울려. 나머지는 사과를 받아 주는 말이 아니고 단어만 비슷하게 반복해."}, {"id": "crg0_5", "speaker": "W", "utterance": "The reading for economics was ninety pages, and half of it was statistics tables.", "options": ["I know. It took me the whole weekend.", "Statistics is offered in the spring term.", "You can buy the textbook at the campus store.", "Ninety dollars seems expensive for one textbook."], "answer": 0, "explain_ko": "분량이 많다는 불평이니까 공감하면서 비슷한 경험을 말하는 대답이 자연스러워. 나머지는 공감이나 위로가 아니라 숫자와 단어만 따라 쓴 보기야."}, {"id": "crg0_6", "speaker": "M", "utterance": "So the psychology experiment starts at nine, and we meet in the basement lab?", "options": ["Psychology majors need two lab courses.", "That's right, nine sharp in room B12.", "I started the experiment without the consent forms.", "The basement floods whenever it rains hard."], "answer": 1, "explain_ko": "맞는지 확인하는 질문이라서 그렇다고 확인해 주는 대답이 맞아. 나머지는 확인 대신 다른 주제로 넘어가 버려."}, {"id": "crg0_7", "speaker": "W", "utterance": "I'd love to join your study group, but I already committed to tutoring on Tuesdays.", "options": ["Tuesday is the deadline for the problem set.", "The study group meets in the library annex.", "No problem. We'll send you the notes afterward.", "I was tutored in statistics last year."], "answer": 2, "explain_ko": "정중한 거절이니까 이해한다고 하면서 대안을 주는 대답이 자연스러워. 나머지는 거절에 대한 반응이 아니라 단어만 겹쳐."}, {"id": "crg0_8", "speaker": "M", "utterance": "A few of us are going to the public health talk tonight. Want to come?", "options": ["Public health majors graduate in four years.", "I gave a talk about vaccines last night.", "Tonight the cafeteria closes at seven thirty.", "Sure, count me in. What time does it start?"], "answer": 3, "explain_ko": "같이 가자는 초대라서 가겠다고 하면서 시간을 묻는 대답이 어울려. 나머지는 초대를 받아들이거나 사양하는 말이 아니야."}, {"id": "crg0_9", "speaker": "W", "utterance": "Do you happen to know if the clinic requires an appointment for a flu shot?", "options": ["Walk ins are fine, but mornings get crowded.", "I got my flu shot at the pharmacy.", "You should make an appointment with your advisor.", "The clinic hired two new nurses."], "answer": 0, "explain_ko": "예약이 필요한지 묻는 간접 질문이니까 예약 없이도 된다고 정보를 주는 대답이 맞아. 나머지는 질문에 답하지 않고 다른 이야기를 해."}, {"id": "crg0_10", "speaker": "M", "utterance": "Wait, the unemployment rate dropped two full points in a single quarter?", "options": ["I dropped the economics course last quarter.", "I was shocked too. The report came out Friday.", "Unemployment benefits last twenty six weeks.", "You can find the rate in chapter four."], "answer": 1, "explain_ko": "믿기 어렵다는 놀람 표현이라서 나도 놀랐다고 공감하는 대답이 자연스러워. 나머지는 놀람에 대한 반응이 아니고 단어만 반복해."}, {"id": "crg0_11", "speaker": "W", "utterance": "Would you be willing to proofread my abstract on sleep deprivation before Friday?", "options": ["Sleep deprivation badly affects memory consolidation.", "I read about deprivation studies in class.", "Of course. Send it over tonight and I'll look.", "Friday is when conference registration closes."], "answer": 2, "explain_ko": "글을 봐 달라는 부탁이니까 흔쾌히 하겠다고 하면서 방법을 정하는 대답이 맞아. 나머지는 수락도 거절도 아닌 관련 없는 내용이야."}, {"id": "crg0_12", "speaker": "M", "utterance": "If you're struggling with the regression homework, I could walk you through it.", "options": ["Regression requires at least two variables.", "I walked to campus this morning instead.", "The homework is posted on the course site.", "Would you? That would be a huge relief."], "answer": 3, "explain_ko": "도와주겠다는 제안이라서 고맙게 받아들이는 대답이 자연스러워. 나머지는 제안에 대한 응답이 아니라 단어만 따라 쓴 보기야."}, {"id": "crg0_13", "speaker": "W", "utterance": "Maybe we should interview more participants before drawing conclusions about the bias.", "options": ["Agreed. Twenty people isn't nearly enough.", "The interview room is reserved until noon.", "Bias is covered in the second chapter.", "I concluded my presentation with a question."], "answer": 0, "explain_ko": "표본을 더 모으자는 제안이니까 동의하면서 근거를 더하는 대답이 어울려. 나머지는 제안에 찬성하거나 반대하는 말이 아니야."}, {"id": "crg0_14", "speaker": "M", "utterance": "My lab partner never shows up, so I end up doing all the dissections alone.", "options": ["Dissections are scheduled every other week.", "That's rough. Have you told the instructor yet?", "I'd rather partner with someone from my dorm.", "The lab closes at six on Fridays."], "answer": 1, "explain_ko": "힘들다는 불평이라서 공감하고 해결책을 묻는 대답이 자연스러워. 나머지는 위로나 조언이 아니고 사실 정보만 말해."}, {"id": "crg0_15", "speaker": "W", "utterance": "You're saying the therapy only worked for patients who also exercised regularly?", "options": ["Patients were recruited from three clinics.", "Exercise burns about three hundred calories hourly.", "Exactly. Exercise seemed to be the key factor.", "The therapist works Tuesdays and Thursdays."], "answer": 2, "explain_ko": "내용을 다시 확인하는 질문이니까 맞다고 짚어 주는 대답이 맞아. 나머지는 확인 대신 다른 사실을 늘어놓아."}, {"id": "crg0_16", "speaker": "M", "utterance": "I really can't lend you my microscope slides. The professor made me sign for them.", "options": ["Slides should be cleaned with lens paper.", "I signed up for the afternoon section.", "The professor lectures on cell division today.", "That's fair. I'll ask the lab manager instead."], "answer": 3, "explain_ko": "거절이니까 이해한다고 하고 다른 방법을 찾는 대답이 자연스러워. 나머지는 거절에 대한 반응이 아니라 단어만 겹치는 말이야."}, {"id": "crg0_17", "speaker": "W", "utterance": "I wonder whether the market research data covers households outside the city.", "options": ["It does, but only three rural counties.", "Households spend more on housing than food.", "I wondered about the survey design too.", "The city council funded the research."], "answer": 0, "explain_ko": "자료 범위를 궁금해하는 간접 질문이라서 포함 여부를 알려 주는 대답이 맞아. 나머지는 질문에 답하지 않고 주변 정보만 말해."}, {"id": "crg0_18", "speaker": "M", "utterance": "You mean the whole cohort study followed those children for forty years?", "options": ["Children under five were excluded.", "Incredible, isn't it? And almost nobody dropped out.", "I followed the lecturer's argument pretty well.", "Forty students signed up for the seminar."], "answer": 1, "explain_ko": "놀라움을 나타내는 말이니까 같이 놀라면서 정보를 덧붙이는 대답이 자연스러워. 나머지는 놀람에 호응하지 않고 숫자나 단어만 반복해."}, {"id": "crg0_19", "speaker": "W", "utterance": "Sorry, I used up the last of the reagent and forgot to reorder it.", "options": ["Reagents are stored in the cold room.", "I ordered lunch for the whole team.", "No worries. I'll put in a rush order now.", "The order form needs two signatures."], "answer": 2, "explain_ko": "사과에 대한 응답이라서 괜찮다고 하면서 바로 처리하겠다는 대답이 어울려. 나머지는 사과를 받아 주는 말이 아니고 단어만 비슷해."}, {"id": "crg0_20", "speaker": "M", "utterance": "Could you cover my shift at the campus food bank on Sunday afternoon?", "options": ["The food bank serves two hundred families.", "I covered the chapter on poverty already.", "Sunday is when the dining hall reopens.", "I think so. Let me check my schedule tonight."], "answer": 3, "explain_ko": "근무를 대신해 달라는 부탁이니까 가능할 것 같다고 확인해 보겠다는 대답이 자연스러워. 나머지는 부탁에 대한 수락이나 거절이 아니야."}, {"id": "crg1_1", "speaker": "W", "utterance": "Could you label these sediment samples before the geology lab begins?", "options": ["Sure, I'll organize and label them now.", "The sediments formed beneath a shallow lake.", "No, the lab began last September.", "Labels are stored beside the microscope."], "answer": 0, "explain_ko": "표본에 라벨을 붙여 달라는 부탁이므로 바로 하겠다는 답이 자연스러워. 나머지는 부탁을 수락하거나 거절하는 답이 아니야."}, {"id": "crg1_2", "speaker": "M", "utterance": "I can't believe that comet became visible without a telescope last night!", "options": ["The telescope belongs to the astronomy department.", "Neither can I. We were incredibly lucky.", "Comets usually contain frozen gases and dust.", "Last night ended earlier than expected."], "answer": 1, "explain_ko": "혜성을 맨눈으로 본 놀라움을 함께 표현하는 답이 가장 자연스러워. 나머지는 혜성이나 망원경과 관련된 정보만 말해."}, {"id": "crg1_3", "speaker": "W", "utterance": "If you need distilled water, I can bring some from the chemistry stockroom.", "options": ["The stockroom closes during the lunch break.", "Distilled water boils at the same temperature.", "Thanks, that would save me a trip.", "No, I didn't bring my chemistry notes."], "answer": 2, "explain_ko": "증류수를 가져다주겠다는 제안이므로 감사하며 받아들이는 답이 자연스러워. 나머지는 제안에 제대로 반응하지 않아."}, {"id": "crg1_4", "speaker": "M", "utterance": "Do you happen to know when the Bronze Age exhibit closes today?", "options": ["The Bronze Age preceded the Iron Age.", "Yes, the exhibit includes several bronze tools.", "I closed the display case this morning.", "It closes at six, according to the website."], "answer": 3, "explain_ko": "전시관이 몇 시에 닫는지 묻고 있으므로 정확한 폐관 시간을 알려 줘야 해. 나머지는 전시와 관련 있지만 질문에 답하지 않아."}, {"id": "crg1_5", "speaker": "W", "utterance": "I'm sorry I accidentally moved the artifact tags during cataloging.", "options": ["That's all right. We can sort them again.", "The artifacts were found near the river.", "Cataloging begins after the staff meeting.", "Yes, the tags are made of paper."], "answer": 0, "explain_ko": "실수에 대한 사과이므로 괜찮다며 해결 방법을 말하는 답이 자연스러워. 나머지는 사과를 받아들이는 반응이 아니야."}, {"id": "crg1_6", "speaker": "M", "utterance": "The archive's scanner has distorted every map I've digitized this afternoon.", "options": ["Every map shows the same coastal region.", "That's frustrating. Let's adjust the resolution settings.", "I scanned the archive's opening schedule.", "Yes, afternoons are usually less crowded."], "answer": 1, "explain_ko": "스캐너 문제를 불평하고 있으므로 공감하며 해결책을 제시하는 답이 적절해. 나머지는 문제 해결과 관계가 없어."}, {"id": "crg1_7", "speaker": "W", "utterance": "Why don't we compare the ash layers before assigning dates to the eruption?", "options": ["Ash can remain airborne for several days.", "The dates were printed on the sample bags.", "Good idea. That should improve our estimate.", "No, the eruption occurred near the coast."], "answer": 2, "explain_ko": "화산재 층을 먼저 비교하자는 제안이므로 좋은 생각이라며 동의하는 답이 자연스러워. 나머지는 제안에 대한 반응이 아니야."}, {"id": "crg1_8", "speaker": "M", "utterance": "So the observatory tour has been rescheduled for Thursday evening, correct?", "options": ["The observatory has three new telescopes.", "I toured it during my first semester.", "Thursday is named after a Norse god.", "Yes, Thursday at seven is the new time."], "answer": 3, "explain_ko": "관측소 견학 일정이 바뀌었는지 확인하고 있으므로 새 시간을 확인해 주는 답이 맞아. 나머지는 일정 확인에 답하지 않아."}, {"id": "crg1_9", "speaker": "W", "utterance": "I'm afraid I can't translate the Latin inscription before tomorrow's seminar.", "options": ["That's okay. We'll discuss another passage instead.", "Latin was spoken throughout the Roman Empire.", "Tomorrow's seminar meets in the history building.", "The inscription was carved into white marble."], "answer": 0, "explain_ko": "번역을 끝낼 수 없다는 거절이므로 이해하고 대안을 제시하는 답이 자연스러워. 나머지는 라틴어나 세미나에 관한 정보일 뿐이야."}, {"id": "crg1_10", "speaker": "M", "utterance": "Would you like to join our discussion on early alchemical practices after class?", "options": ["Alchemical texts often use symbolic illustrations.", "I'd be glad to. Where are you meeting?", "Our class discussed early metallurgy yesterday.", "After class, the laboratory doors are locked."], "answer": 1, "explain_ko": "수업 후 토론에 초대하고 있으므로 기쁘게 참여하겠다고 답하는 게 자연스러워. 나머지는 초대를 수락하거나 거절하지 않아."}, {"id": "crg1_11", "speaker": "W", "utterance": "Could I borrow your field compass for the fault-mapping exercise tomorrow?", "options": ["Field exercises require sturdy waterproof boots.", "The fault appears on this regional map.", "Of course. Just return it after the exercise.", "Tomorrow's forecast calls for heavy rain."], "answer": 2, "explain_ko": "나침반을 빌려 달라는 부탁이므로 빌려주겠다고 허락하는 답이 맞아. 나머지는 야외 조사와 관련된 정보만 말해."}, {"id": "crg1_12", "speaker": "M", "utterance": "You mean the wooden ship survived underground for nearly two thousand years?", "options": ["Wooden ships carried pottery across the Mediterranean.", "The excavation continued for nearly two years.", "Underground storage protects modern museum collections.", "Apparently so. The wet soil preserved it remarkably well."], "answer": 3, "explain_ko": "고대 목선이 보존됐다는 사실에 놀라며 확인하고 있으므로 사실을 인정하고 이유를 설명하는 답이 자연스러워. 나머지는 놀라움에 직접 반응하지 않아."}, {"id": "crg1_13", "speaker": "W", "utterance": "The blue color indicates copper ions are present in the solution, right?", "options": ["Exactly. That shade is characteristic of copper ions.", "Blue solutions should be stored in glass containers.", "The copper wire is beside the balance.", "No, the solution was prepared yesterday morning."], "answer": 0, "explain_ko": "용액의 색이 구리 이온 때문인지 확인하고 있으므로 맞다고 확인해 주는 답이 적절해. 나머지는 색이나 구리를 언급하지만 확인 질문에 답하지 않아."}, {"id": "crg1_14", "speaker": "M", "utterance": "I apologize for returning your oral-history recorder with a dead battery.", "options": ["The interview lasted almost two hours.", "No problem. I have spare batteries here.", "Oral histories became popular in recent decades.", "The recorder captures background noise quite clearly."], "answer": 1, "explain_ko": "배터리가 방전된 채로 돌려준 것에 대한 사과이므로 괜찮다고 받아 주는 답이 자연스러워. 나머지는 사과와 직접 관련이 없어."}, {"id": "crg1_15", "speaker": "W", "utterance": "We could photograph the lunar crater again when the atmospheric turbulence decreases.", "options": ["Lunar craters were named by several astronomers.", "The photograph is already in the course folder.", "That makes sense. The image should be sharper then.", "No, the atmosphere contains mostly nitrogen."], "answer": 2, "explain_ko": "대기 흔들림이 줄었을 때 다시 촬영하자는 제안이므로 결과가 더 좋아질 거라며 동의하는 답이 맞아. 나머지는 제안의 핵심에 반응하지 않아."}, {"id": "crg1_16", "speaker": "M", "utterance": "Would you check whether this pottery fragment matches the museum's reference collection?", "options": ["Pottery fragments break easily during transportation.", "The museum purchased that collection last year.", "This reference book describes ancient glassware.", "Certainly. I'll compare its pattern with the catalog."], "answer": 3, "explain_ko": "도자기 조각을 비교해 달라는 부탁이므로 확인하겠다는 답이 자연스러워. 나머지는 박물관이나 유물에 관한 정보만 제공해."}, {"id": "crg1_17", "speaker": "W", "utterance": "The lab manual omits the temperature required for this crystallization procedure.", "options": ["You're right. Let's ask the instructor before proceeding.", "The manual has a blue cover.", "Crystals often form geometric structures.", "The temperature dropped outside this morning."], "answer": 0, "explain_ko": "실험서에 필수 정보가 없다는 불평이므로 문제를 인정하고 교수에게 묻자는 답이 적절해. 나머지는 결정이나 온도라는 단어만 연결돼."}, {"id": "crg1_18", "speaker": "M", "utterance": "I can scan the census records while you examine the immigration files.", "options": ["Census records reveal changes in household size.", "That would help. I'll start with these files.", "The scanner was invented in the twentieth century.", "Immigration files are arranged by arrival date."], "answer": 1, "explain_ko": "인구 조사 기록을 대신 스캔하겠다는 제안이므로 도움이 된다며 역할을 나누는 답이 자연스러워. 나머지는 기록에 관한 일반 정보야."}, {"id": "crg1_19", "speaker": "W", "utterance": "Are you interested in attending the lecture on deep-ocean hydrothermal vents?", "options": ["Hydrothermal vents support unusual marine ecosystems.", "The deep ocean receives almost no sunlight.", "Absolutely. I've wanted to learn more about them.", "The lecture hall was renovated last summer."], "answer": 2, "explain_ko": "심해 열수 분출공 강연에 함께 갈지 묻는 초대이므로 관심을 보이며 수락하는 답이 맞아. 나머지는 주제나 강의실 정보만 말해."}, {"id": "crg1_20", "speaker": "M", "utterance": "Any idea why the planetarium canceled tonight's meteorite identification workshop?", "options": ["Meteorites can contain nickel and iron.", "The planetarium opens at nine on weekends.", "I identified that sample during yesterday's workshop.", "Apparently, the presenter missed her connecting flight."], "answer": 3, "explain_ko": "워크숍이 취소된 이유를 묻고 있으므로 발표자의 비행기 문제를 알려 주는 답이 맞아. 나머지는 취소 이유와 관계가 없어."}], "conversations": [{"id": "cv1", "setting": "A student talks to a librarian at the circulation desk", "turns": [{"speaker": "M", "text": "Hi, I need the sociology reader Professor Lang put on reserve. It isn't on the shelf."}, {"speaker": "W", "text": "Reserve books stay behind this desk. Which course is it for?"}, {"speaker": "M", "text": "Sociology two ten. I only need chapter four, and my quiz is tomorrow morning."}, {"speaker": "W", "text": "Here it is. Reserve loans are two hours, and you can't take it out of the building."}, {"speaker": "M", "text": "Two hours is plenty. Actually, could I scan the chapter instead and read it at home?"}, {"speaker": "W", "text": "Of course. The scanner on the second floor is free, and it emails the file to you."}], "questions": [{"stem": "Why does the man come to the desk?", "options": ["To pay a fine on an overdue book", "To get a book that is held on reserve", "To ask the librarian to order a new textbook", "To reserve a group study room for a quiz"], "answer": 1, "explain_ko": "남학생은 교수가 지정 도서로 맡긴 사회학 교재를 찾으러 왔다고 처음에 밝힌다. 벌금이나 스터디룸 이야기는 대화에 나오지 않는다."}, {"stem": "What does the woman say about the scanner?", "options": ["It costs the same as the copy machine.", "It can only be used for two hours.", "It is free and sends the file by email.", "It is located next to the circulation desk."], "answer": 2, "explain_ko": "사서는 이층 스캐너가 무료이며 파일을 이메일로 보내 준다고 말한다. 두 시간 제한은 지정 도서 대출에 적용되는 규정이다."}]}, {"id": "cv2", "setting": "A student visits his chemistry professor during office hours", "turns": [{"speaker": "M", "text": "Professor, may I talk to you about the lab report that's due Thursday?"}, {"speaker": "W", "text": "Of course. Is something wrong with your data?"}, {"speaker": "M", "text": "Two of my samples were contaminated, so I have to run the trial again."}, {"speaker": "W", "text": "Then hand the write up in on Monday. I'd rather see clean data than rushed data."}, {"speaker": "M", "text": "Thank you. Should I mention the contaminated samples in the discussion section?"}, {"speaker": "W", "text": "Yes, briefly. Explaining what went wrong is part of good scientific writing."}], "questions": [{"stem": "What is the main purpose of the man's visit?", "options": ["To ask for more time to finish a lab report", "To find out how the lab report will be graded", "To request a different laboratory partner", "To complain about the equipment in the lab"], "answer": 0, "explain_ko": "학생은 시료가 오염되어 실험을 다시 해야 한다며 목요일 마감인 보고서 문제를 상의하려고 찾아왔다. 채점 기준이나 실험 장비는 논의되지 않는다."}, {"stem": "What can be inferred about the professor's view of the report?", "options": ["She thinks the student should submit partial results.", "She believes accurate data matters more than meeting the original deadline.", "She expects students to avoid mentioning failed trials.", "She considers the discussion section the least important part."], "answer": 1, "explain_ko": "교수는 급하게 쓴 자료보다 정확한 자료를 보고 싶다고 말하며 마감을 월요일로 미뤄 준다. 또한 실패한 실험을 설명하는 것이 좋은 글쓰기라고 강조한다."}]}, {"id": "cv3", "setting": "A student asks a department assistant about a geology field trip", "turns": [{"speaker": "W", "text": "Hi, I signed up for the geology field trip. Where does the van leave from?"}, {"speaker": "M", "text": "Behind the science building, at seven fifteen sharp. It won't wait for latecomers."}, {"speaker": "W", "text": "Seven fifteen. Do I need to bring my own lunch and boots?"}, {"speaker": "M", "text": "Lunch, yes. Boots you can borrow from the equipment room until Friday afternoon."}, {"speaker": "W", "text": "Good. And is there still space for my roommate to come along?"}, {"speaker": "M", "text": "Two seats are open, but she has to sign the safety form first."}], "questions": [{"stem": "What are the speakers mainly discussing?", "options": ["The grading policy for a geology course", "A change in the date of a field trip", "Practical arrangements for an upcoming field trip", "Repairs being made to a department van"], "answer": 2, "explain_ko": "두 사람은 출발 장소와 시간, 점심과 장화 준비, 남은 좌석 같은 실질적인 준비 사항을 이야기한다. 성적이나 날짜 변경은 언급되지 않는다."}, {"stem": "What must the woman's roommate do to join the trip?", "options": ["Sign a safety form", "Buy her own boots", "Pay a small transportation fee", "Speak with the professor in person"], "answer": 0, "explain_ko": "직원은 좌석이 두 개 남았지만 룸메이트가 먼저 안전 서류에 서명해야 한다고 말한다. 장화는 대여할 수 있고 비용 이야기는 나오지 않는다."}]}, {"id": "cvg0_1", "setting": "A student asks a health center staff member about a required flu shot", "turns": [{"speaker": "W", "text": "Hi, I'm volunteering at the campus clinic next month, and they want proof of a flu shot."}, {"speaker": "M", "text": "We can take care of that today. Have you had one this season?"}, {"speaker": "W", "text": "Not yet. Does it cost extra? I already paid the student health fee."}, {"speaker": "M", "text": "It's covered by the fee, and we'll update your immunization record in the portal."}, {"speaker": "W", "text": "Good. How far ahead of the clinic should I get the shot?"}, {"speaker": "M", "text": "About two weeks, so your body has time to build up immunity."}], "questions": [{"stem": "Why does the woman go to the health center?", "options": ["To pay an unpaid student health fee", "To request a copy of her medical history", "To ask about symptoms she has been having", "To get a vaccination required for volunteer work"], "answer": 3, "explain_ko": "여학생은 교내 클리닉 봉사를 하려면 독감 예방주사 증명이 필요하다고 바로 말해. 건강 보험료는 이미 냈다고 언급만 할 뿐이야.", "tips_ko": "대화 첫 두 문장에 방문 목적이 거의 항상 들어 있으니 거기서 답을 잡아."}, {"stem": "Why does the man recommend getting the shot two weeks early?", "options": ["The portal takes two weeks to update records.", "The clinic runs out of doses near the deadline.", "Appointments fill up quickly during flu season.", "Immunity needs time to develop."], "answer": 3, "explain_ko": "직원은 몸이 면역을 만들 시간이 필요해서 이 주 전이 좋다고 설명해. 기록 갱신은 그날 바로 된다고 했어.", "tips_ko": "이유를 묻는 문제는 so나 because 뒤에 붙는 말이 정답 근거일 때가 많아."}]}, {"id": "cvg0_2", "setting": "A student asks a psychology department coordinator about research participation credit", "turns": [{"speaker": "M", "text": "I'm in Intro Psych, and I still need two research credits before the term ends."}, {"speaker": "W", "text": "You sign up through the participant portal. Most studies run about an hour."}, {"speaker": "M", "text": "Is anything open this week? I'd rather not leave it until finals."}, {"speaker": "W", "text": "There's a memory study Thursday, and a survey you can complete online anytime."}, {"speaker": "M", "text": "The online one sounds easier. Does it count for the same credit?"}, {"speaker": "W", "text": "Exactly the same, but read the consent form first. It asks about personal habits."}], "questions": [{"stem": "What does the man need to do?", "options": ["Earn course credit by joining research studies", "Design a study for his psychology class", "Reschedule an exam he is going to miss", "Find a professor to supervise his project"], "answer": 0, "explain_ko": "남학생은 입문 심리학 수업에서 연구 참여 학점 두 개가 아직 필요해. 본인이 연구를 설계하는 건 아니야.", "tips_ko": "need 다음에 오는 말이 그 학생의 과제이자 대화의 목적이야."}, {"stem": "What does the woman say about the online survey?", "options": ["It is only open to psychology majors.", "It must be finished before Thursday.", "It is worth less credit than the lab study.", "It gives equal credit but has a consent form to read."], "answer": 3, "explain_ko": "담당자는 학점은 똑같지만 개인 습관을 묻는 동의서를 먼저 읽으라고 해. 목요일 마감이라는 말은 없어.", "tips_ko": "but 뒤에 나오는 조건이 보통 정답 포인트라 꼭 끝까지 들어."}]}, {"id": "cvg0_3", "setting": "A student asks an economics teaching assistant about a graded problem set", "turns": [{"speaker": "W", "text": "I think question three on my problem set was marked wrong by mistake."}, {"speaker": "M", "text": "Let's look. You set up elasticity correctly, but you used the wrong base price."}, {"speaker": "W", "text": "Oh, I divided by the new price instead of the original one."}, {"speaker": "M", "text": "Right. The method was sound, so I can give you half the points back."}, {"speaker": "W", "text": "Thanks. Will that formula show up on the midterm too?"}, {"speaker": "M", "text": "Almost certainly. Redo the whole set before Friday's review session."}], "questions": [{"stem": "Why does the woman talk to the man?", "options": ["She missed the deadline for the problem set.", "She believes an answer was graded unfairly.", "She wants help choosing a research topic.", "She cannot attend the review session."], "answer": 1, "explain_ko": "여학생은 세 번째 문제가 실수로 오답 처리된 것 같다며 찾아왔어. 제출 기한 문제는 언급되지 않아.", "tips_ko": "by mistake 같은 표현이 나오면 채점이나 실수 관련 불만이 주제라고 보면 돼."}, {"stem": "What does the man agree to do?", "options": ["Drop the question from everyone's score", "Let her submit a corrected version of the set", "Return part of the points for her answer", "Meet her again after the midterm"], "answer": 2, "explain_ko": "조교는 풀이 방식은 맞았으니 점수의 절반을 돌려주겠다고 해. 재제출이나 문항 삭제는 말하지 않았어.", "tips_ko": "partial credit, half the points처럼 부분 점수를 뜻하는 표현을 묶어서 기억해 둬."}]}, {"id": "cvg0_4", "setting": "A student discusses an unpaid internship stipend with a career center advisor", "turns": [{"speaker": "M", "text": "I got the internship at the housing nonprofit, but the position is unpaid."}, {"speaker": "W", "text": "You might qualify for a summer stipend. Is the work tied to your major?"}, {"speaker": "M", "text": "Yes, economics. I'd be analyzing rent data for their policy team."}, {"speaker": "W", "text": "That qualifies. Applications close in two weeks, and we need a supervisor letter."}, {"speaker": "M", "text": "Could I send the offer email instead? My supervisor is traveling until June."}, {"speaker": "W", "text": "Submit the email now and add the letter later. Just don't miss the deadline."}], "questions": [{"stem": "What is the man's problem?", "options": ["The internship does not pay anything.", "His internship offer was withdrawn.", "He has two internship offers at once.", "The internship is unrelated to his major."], "answer": 0, "explain_ko": "남학생이 합격한 비영리단체 인턴십은 무급이라서 상담을 받으러 온 거야. 전공과는 오히려 잘 맞는다고 했어.", "tips_ko": "but 앞은 좋은 소식, 뒤는 문제점이라는 구조를 알면 목적 문제가 쉬워져."}, {"stem": "What does the woman suggest the man do?", "options": ["Apply with the offer email and send the letter afterward", "Change his application to a different program", "Wait until his supervisor returns in June", "Ask the nonprofit to pay him directly"], "answer": 0, "explain_ko": "상담사는 일단 합격 이메일로 지원하고 추천서는 나중에 내라고 조언해. 마감만 놓치지 말라고 강조했어.", "tips_ko": "조언 문제는 명령문 형태 문장을 그대로 답으로 옮기면 거의 맞아."}]}, {"id": "cvg0_5", "setting": "A student asks a lab manager about volunteering in an animal behavior lab", "turns": [{"speaker": "W", "text": "I saw the notice asking for volunteers in the animal behavior lab."}, {"speaker": "M", "text": "We need two people for morning feedings. Could you get here by seven?"}, {"speaker": "W", "text": "Seven works on Tuesdays and Thursdays. Is there training beforehand?"}, {"speaker": "M", "text": "One short handling session, plus a safety form signed at the vet office."}, {"speaker": "W", "text": "Would I ever help with the actual behavior observations?"}, {"speaker": "M", "text": "After about a month. We want volunteers comfortable with the routine first."}], "questions": [{"stem": "What must the woman do before she starts?", "options": ["Attend a handling session and submit a safety form", "Buy her own protective equipment", "Take an introductory biology course", "Interview with the lab's faculty director"], "answer": 0, "explain_ko": "매니저는 짧은 동물 취급 교육과 수의과에서 서명받은 안전 서류가 필요하다고 해. 수업이나 면접 조건은 없어.", "tips_ko": "plus나 and로 두 가지를 이어 말하면 정답도 두 요소를 다 담은 선택지일 가능성이 커."}, {"stem": "What does the man say about the behavior observations?", "options": ["They require a separate application.", "She can join them once she knows the routine.", "They happen at the same time as the feedings.", "Only graduate students are allowed to do them."], "answer": 1, "explain_ko": "한 달쯤 지나 일과에 익숙해지면 관찰에도 참여할 수 있다고 말해. 대학원생 전용이라는 말은 나오지 않아.", "tips_ko": "after a month처럼 시간 조건이 붙은 허락은 나중에 가능이라는 뜻으로 받아들여."}]}, {"id": "cvg0_6", "setting": "A student meets an academic advisor about adding a public health minor", "turns": [{"speaker": "M", "text": "I've decided against medical school, but I still want to study health topics."}, {"speaker": "W", "text": "A public health minor could fit. You finished statistics already, didn't you?"}, {"speaker": "M", "text": "Last spring. What else would the minor require?"}, {"speaker": "W", "text": "Four courses, including epidemiology. Two of your biology credits transfer in."}, {"speaker": "M", "text": "So I could finish without staying an extra semester?"}, {"speaker": "W", "text": "Easily, if you take epidemiology in the fall. It isn't offered in spring."}], "questions": [{"stem": "Why does the man come to the advisor's office?", "options": ["He failed a required premedical course.", "He wants to transfer to another university.", "He has changed his plans after dropping medical school.", "He needs permission to repeat a statistics class."], "answer": 2, "explain_ko": "남학생은 의대 진학을 포기했지만 건강 분야는 계속 공부하고 싶어서 상담을 받는 거야. 낙제나 편입 이야기는 없어.", "tips_ko": "I've decided 같은 표현 뒤에 학생의 새 계획이 나오니 그 부분을 놓치지 마."}, {"stem": "Why does the woman mention epidemiology?", "options": ["It can be replaced by a biology course.", "It is available only in the fall term.", "It is the hardest course in the minor.", "It requires statistics as a prerequisite."], "answer": 1, "explain_ko": "상담사는 역학 수업이 봄에는 열리지 않으니 가을에 들어야 제때 졸업한다고 알려 줘. 난이도는 화제가 아니야.", "tips_ko": "isn't offered 같은 부정 정보는 시험에 자주 나오니 바로 메모해."}]}, {"id": "cvg0_7", "setting": "A student talks to a dining services manager about a gluten allergy", "turns": [{"speaker": "W", "text": "I have celiac disease, and I'm never sure which dishes here are safe."}, {"speaker": "M", "text": "Each station posts its allergens, and the gluten free line is by the window."}, {"speaker": "W", "text": "I used it, but the tongs looked like the ones from the pasta station."}, {"speaker": "M", "text": "That shouldn't happen. I'll remind the staff to keep separate utensils today."}, {"speaker": "W", "text": "Thanks. Could I also talk with someone about planning my meals?"}, {"speaker": "M", "text": "Our dietitian takes appointments on Wednesdays. I'll email you the booking link."}], "questions": [{"stem": "What is the woman concerned about?", "options": ["The gluten free line costs extra money.", "The dining hall closes before she finishes class.", "Serving tools may be shared between stations.", "The allergen labels are written too small."], "answer": 2, "explain_ko": "여학생은 글루텐 프리 코너의 집게가 파스타 코너 것과 같아 보였다고 걱정해. 가격이나 운영 시간은 언급되지 않아.", "tips_ko": "looked like 같은 표현은 학생이 확신은 없지만 문제를 의심한다는 신호야."}, {"stem": "What will the man send the woman?", "options": ["A link for making a dietitian appointment", "A weekly menu for the gluten free line", "A refund form for her meal plan", "A list of every allergen in the dining hall"], "answer": 0, "explain_ko": "매니저는 수요일에 상담하는 영양사 예약 링크를 이메일로 보내 준다고 해. 환불이나 알레르기 목록은 보내지 않아.", "tips_ko": "대화 마지막 제안은 다음에 할 일 문제로 나오기 쉬우니 끝까지 집중해."}]}, {"id": "cvg0_8", "setting": "A student recruits a classmate for a sociology survey outside the student union", "turns": [{"speaker": "M", "text": "Excuse me, do you have five minutes for a sociology survey on commuting?"}, {"speaker": "W", "text": "Maybe. Is it anonymous? I'd rather not put my name on anything."}, {"speaker": "M", "text": "Completely. We only ask your year and how you travel to campus."}, {"speaker": "W", "text": "I bike most days, unless it rains. Then I take the shuttle."}, {"speaker": "M", "text": "That's exactly the kind of pattern we're tracking. Here's the tablet."}, {"speaker": "W", "text": "All right, but my class starts in ten minutes, so I'll be quick."}], "questions": [{"stem": "What does the man ask the woman to do?", "options": ["Join a research team for a sociology course", "Share the shuttle schedule with him", "Sign a petition about campus parking", "Answer a short survey about how she travels"], "answer": 3, "explain_ko": "남학생은 통학 방식에 관한 짧은 사회학 설문에 응답해 달라고 부탁해. 연구팀 가입이나 서명 요청은 아니야.", "tips_ko": "do you have five minutes 같은 말이 들리면 부탁하는 상황이라고 바로 눈치채."}, {"stem": "What does the woman want to know before she agrees?", "options": ["How many students have already responded", "Whether she will be paid for her time", "Whether her answers will stay anonymous", "Who is supervising the research project"], "answer": 2, "explain_ko": "여학생은 이름을 남기고 싶지 않아서 익명인지 먼저 확인해. 보수나 지도교수에 대한 질문은 하지 않아.", "tips_ko": "I'd rather not 뒤에 말하는 내용이 그 사람이 꺼리는 바로 그 지점이야."}]}, {"id": "cvg1_1", "setting": "A student checks on an evening program at the campus observatory", "turns": [{"speaker": "M", "text": "Is tonight's telescope viewing still happening? The forecast looks pretty cloudy."}, {"speaker": "W", "text": "The rooftop portion is canceled, but we're offering an indoor workshop instead."}, {"speaker": "M", "text": "What will you cover without the telescopes?"}, {"speaker": "W", "text": "We'll use archived images to identify variable stars and plot their brightness."}, {"speaker": "M", "text": "That actually sounds useful for my astronomy project. Should I bring anything?"}, {"speaker": "W", "text": "Just a laptop. The software is browser-based, so you won't need to install it."}], "questions": [{"stem": "Why does the man speak with the woman?", "options": ["To reserve a telescope for his astronomy project", "To report a problem with some imaging software", "To submit his observations of variable stars", "To ask whether an observatory event will take place"], "answer": 3, "explain_ko": "남학생은 흐린 날씨 때문에 오늘 관측 행사가 열리는지 확인하려고 해. 망원경을 예약하거나 과제를 제출하려는 게 아니야."}, {"stem": "What does the woman imply about the workshop software?", "options": ["Students need prior experience to operate it.", "It is only available on observatory computers.", "Students must purchase it before the workshop.", "It can be used online without being downloaded."], "answer": 3, "explain_ko": "프로그램이 브라우저 기반이라서 따로 설치할 필요가 없다고 해. 노트북만 가져가면 온라인으로 사용할 수 있어."}]}, {"id": "cvg1_2", "setting": "A student speaks with a collections assistant at the campus archaeology museum", "turns": [{"speaker": "W", "text": "I'm writing about Bronze Age pottery. May I photograph the decorated bowls in that case?"}, {"speaker": "M", "text": "Photography is allowed, but the glass may create reflections."}, {"speaker": "W", "text": "Could someone remove the bowls briefly?"}, {"speaker": "M", "text": "Only trained staff can handle them, and removal requests require a week's notice."}, {"speaker": "W", "text": "My paper is due Friday, so that's too late."}, {"speaker": "M", "text": "Our online catalog has high-resolution images taken from several angles. Those should work."}], "questions": [{"stem": "What problem does the woman encounter?", "options": ["The pottery collection is temporarily closed.", "She cannot arrange to have the objects removed in time.", "She cannot access the museum's online catalog.", "Her camera is not permitted inside the museum."], "answer": 1, "explain_ko": "유물을 꺼내려면 일주일 전에 요청해야 하는데 여학생의 과제는 금요일까지야. 따라서 필요한 시점 전에 유물을 꺼낼 수 없어."}, {"stem": "What does the man recommend that the woman do?", "options": ["Choose artifacts from a different historical period", "Ask her instructor to extend the deadline", "Use photographs available in the online catalog", "Return when a trained staff member is available"], "answer": 2, "explain_ko": "남자는 온라인 목록에 여러 각도에서 촬영한 고해상도 사진이 있다고 알려 줘. 그 사진을 과제에 활용하라고 제안하는 거야."}]}, {"id": "cvg1_3", "setting": "A student asks a laboratory safety coordinator about a missed training session", "turns": [{"speaker": "M", "text": "I missed yesterday's chemical safety training because I was sick. Is there another session?"}, {"speaker": "W", "text": "Not until next month, but you can complete the online module."}, {"speaker": "M", "text": "Will that let me start my lab assignment on Monday?"}, {"speaker": "W", "text": "Almost. After the module, you still need to demonstrate the eyewash station procedure."}, {"speaker": "M", "text": "Could I do that Friday afternoon?"}, {"speaker": "W", "text": "Yes. Email me your completion certificate, and I'll schedule the demonstration."}], "questions": [{"stem": "Why did the man miss the safety training?", "options": ["He was ill on the day of the session.", "He thought the session was scheduled for Friday.", "He was completing another required module.", "He had not registered for the laboratory."], "answer": 0, "explain_ko": "남학생은 아파서 어제 안전 교육에 참석하지 못했다고 직접 말해. 등록이나 일정 착오 때문은 아니야."}, {"stem": "What must the man do before the woman schedules his demonstration?", "options": ["Attend the next in-person training session", "Practice the procedure with another student", "Send her proof that he completed the online module", "Finish his laboratory assignment"], "answer": 2, "explain_ko": "여자는 온라인 교육 이수증을 이메일로 보내면 시범 일정을 잡겠다고 해. 먼저 온라인 교육을 끝냈다는 증명을 보내야 해."}]}, {"id": "cvg1_4", "setting": "A student visits the university archives to examine historical newspapers", "turns": [{"speaker": "W", "text": "I requested newspapers from the 1912 textile strike, but I don't see them on my cart."}, {"speaker": "M", "text": "Those originals are too fragile for regular use, so we don't bring them to the reading room."}, {"speaker": "W", "text": "I need to compare the advertisements as well as the articles."}, {"speaker": "M", "text": "The microfilm includes every page, and the new reader can export images."}, {"speaker": "W", "text": "Great. Can it save them directly to my flash drive?"}, {"speaker": "M", "text": "Yes, or you can send them to your university email account."}], "questions": [{"stem": "Why will the woman not receive the original newspapers?", "options": ["They are being used by another researcher.", "They have not yet been added to the collection.", "They are too delicate to be handled routinely.", "They contain only advertisements."], "answer": 2, "explain_ko": "원본 신문은 너무 약해서 일반 열람용으로 제공하지 않는다고 해. 다른 연구자가 사용 중인 것은 아니야."}, {"stem": "What feature of the microfilm reader is relevant to the woman's work?", "options": ["It can restore sections missing from the originals.", "It automatically organizes articles by subject.", "It can translate old newspaper articles.", "It can export images of complete newspaper pages."], "answer": 3, "explain_ko": "여학생은 기사뿐 아니라 광고도 비교해야 해. 모든 면이 담긴 마이크로필름에서 이미지를 내보낼 수 있어서 작업에 도움이 돼."}]}, {"id": "cvg1_5", "setting": "Two classmates discuss a presentation on coastal erosion", "turns": [{"speaker": "M", "text": "Our shoreline presentation has plenty of maps, but the erosion rates still feel abstract."}, {"speaker": "W", "text": "What if we compare photographs of the same cliff taken ten years apart?"}, {"speaker": "M", "text": "Good idea. Do we have permission to use the county's aerial images?"}, {"speaker": "W", "text": "Yes, if we credit the coastal survey office beneath each one."}, {"speaker": "M", "text": "Then I'll align the images so the retreat is easy to see."}, {"speaker": "W", "text": "Perfect. I'll shorten the section on wave mechanics to make room."}], "questions": [{"stem": "What concern does the man initially express?", "options": ["The maps contain inaccurate erosion rates.", "The county has refused to share its aerial images.", "The presentation lacks a clear way to illustrate the data.", "The section on wave mechanics is too brief."], "answer": 2, "explain_ko": "남학생은 지도는 충분하지만 침식률이 추상적으로 느껴진다고 걱정해. 자료의 의미를 시각적으로 분명히 보여 줄 방법이 필요한 거야."}, {"stem": "What will the woman most likely do next?", "options": ["Reduce the length of part of the presentation", "Request newer maps from the county", "Calculate the cliff's annual erosion rate", "Add more details about wave mechanics"], "answer": 0, "explain_ko": "여학생은 사진을 넣을 시간을 확보하려고 파도 역학 부분을 줄이겠다고 해. 따라서 발표의 한 부분을 짧게 만들 거야."}]}, {"id": "cvg1_6", "setting": "A student speaks with a planetarium manager about a part-time job", "turns": [{"speaker": "W", "text": "I saw the opening for a weekend planetarium guide. Is astronomy coursework required?"}, {"speaker": "M", "text": "One introductory course is preferred, but public-speaking experience matters more."}, {"speaker": "W", "text": "I lead campus tours, although I've never operated projection equipment."}, {"speaker": "M", "text": "That's fine. We train new guides on the system before they host a show."}, {"speaker": "W", "text": "Would I need to create my own presentation?"}, {"speaker": "M", "text": "No, you'll begin with a prepared script and answer questions afterward."}], "questions": [{"stem": "Which qualification does the man consider especially important?", "options": ["Skill in repairing projection equipment", "Advanced coursework in astronomy", "Experience writing educational scripts", "Experience speaking to groups"], "answer": 3, "explain_ko": "남자는 천문학 수업보다 대중 앞에서 말한 경험이 더 중요하다고 해. 여학생의 캠퍼스 안내 경험이 관련 자격이야."}, {"stem": "What does the man say about new planetarium guides?", "options": ["They observe several shows before receiving training.", "They initially deliver material that is already written.", "They design a presentation with another guide.", "They are not expected to answer audience questions."], "answer": 1, "explain_ko": "신입 안내자는 준비된 대본으로 시작한다고 해. 직접 발표 내용을 만들 필요는 없지만 이후 질문에는 답해야 해."}]}, {"id": "cvg1_7", "setting": "A student picks up equipment for an archaeological field school", "turns": [{"speaker": "M", "text": "I'm here for my field kit, but this checklist includes a hand pick. I already own one."}, {"speaker": "W", "text": "You can use yours if the field supervisor approves it at orientation."}, {"speaker": "M", "text": "Should I leave the one from the kit here, then?"}, {"speaker": "W", "text": "Take it for now. If your tool isn't approved, you won't have time to return."}, {"speaker": "M", "text": "That makes sense. When is the borrowed equipment due back?"}, {"speaker": "W", "text": "The Monday after the field school ends, clean and completely dry."}], "questions": [{"stem": "Why does the woman tell the man to take the hand pick?", "options": ["Students must carry two hand picks at the site.", "The field supervisor has asked to inspect the borrowed one.", "His personal tool might not be accepted.", "His personal tool cannot be used during orientation."], "answer": 2, "explain_ko": "남학생의 개인 도구는 현장 책임자의 승인을 받아야 해. 승인되지 않을 경우를 대비해 대여 도구도 가져가라고 한 거야."}, {"stem": "What does the woman emphasize about returning the equipment?", "options": ["It must be returned at the excavation site.", "It should be cleaned and free of moisture.", "It must be returned before the field school ends.", "It should be inspected by the field supervisor."], "answer": 1, "explain_ko": "여자는 장비를 깨끗하게 닦고 완전히 말린 상태로 반납하라고 해. 반납일은 현장 학교가 끝난 뒤 월요일이야."}]}, {"id": "cvg1_8", "setting": "A student asks a peer tutor about unexpected chromatography results", "turns": [{"speaker": "W", "text": "My chromatography plate shows one broad streak instead of separate spots. Did the reaction fail?"}, {"speaker": "M", "text": "Not necessarily. How much sample did you place on the plate?"}, {"speaker": "W", "text": "Three drops. The first one looked too faint, so I added more."}, {"speaker": "M", "text": "That probably overloaded the plate and caused the compounds to smear together."}, {"speaker": "W", "text": "So I should repeat it with a smaller sample?"}, {"speaker": "M", "text": "Exactly. Apply one small drop, let it dry, and then develop the plate."}], "questions": [{"stem": "What does the man think caused the broad streak?", "options": ["The reaction produced only one compound.", "The first drop dried before more sample was added.", "The woman applied too much sample.", "The plate was developed for too little time."], "answer": 2, "explain_ko": "여학생이 시료를 세 방울 떨어뜨려 판에 너무 많은 양을 올렸다고 해. 그 결과 화합물들이 분리되지 않고 번진 거야."}, {"stem": "What does the man recommend?", "options": ["Add the sample after developing the plate.", "Repeat the procedure using a single small drop.", "Combine several faint spots before analyzing them.", "Use a different reaction mixture."], "answer": 1, "explain_ko": "남자는 작은 한 방울만 찍고 말린 다음 판을 전개하라고 조언해. 더 적은 양으로 실험을 반복해야 해."}]}], "announcements": [{"id": "an1", "speaker": "M", "context": "Announcement at the start of the first organic chemistry lab session", "text": "Good morning, and welcome to your first session in the organic chemistry lab. Before we touch any equipment, three rules. First, goggles and a lab coat stay on from the moment you walk in until you leave, no exceptions. Second, your notebook goes on the shelf above the bench, never on the bench itself, because a wet notebook is a useless notebook. Third, if you spill anything at all, don't try to clean it up yourself. Tell me, and I'll decide what we do. Now, find your
