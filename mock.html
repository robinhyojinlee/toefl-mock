ctical experience, (3) request a specific way to complete the requirement.", "recipient": "Professor Alvarez, instructor for Earth Systems Science", "tone": "formal", "sample_answer": "Dear Professor Alvarez,\n\nI am writing to explain why I missed Friday's coastal geology field survey. A signal failure stopped all trains from my neighborhood, and by the time service resumed, the group had already left campus.\n\nI understand that the survey provided essential practice in identifying sediment layers and recording evidence of erosion. I have reviewed the field guide, but I am concerned that reading it alone will not give me equivalent practical experience.\n\nCould I join the Tuesday section instead? If that is not possible, I would appreciate an alternative assignment using the rock samples in the department lab. I can complete either option before next Friday.\n\nI apologize for the inconvenience and have attached the transit alert confirming the disruption. Thank you for considering my request.\n\nSincerely,\nMinseo Kim", "tips_ko": "결석 이유를 객관적으로 설명하고 현장 학습의 중요성을 이해하고 있다는 점을 보여 줘. 가능한 보충 방법과 완료 기한도 구체적으로 제안해."}, {"id": "emg1_2", "scenario": "After several days of heavy rain, a damp patch has appeared on your apartment's bedroom ceiling. The paint is peeling, water has begun dripping near the window, and another storm is expected soon.", "task": "Write an email to your landlord. In your email: (1) describe the signs of the leak, (2) explain your concerns about possible damage, (3) request an inspection and ask what precautions you should take.", "recipient": "Ms. Brooks, owner of your apartment building", "tone": "formal", "sample_answer": "Dear Ms. Brooks,\n\nI am contacting you about a growing damp patch on the bedroom ceiling of apartment 4B. It appeared after Thursday's heavy rain, and small drops began falling near the window last night. The paint is now peeling, and the room has a noticeable musty smell.\n\nI moved my desk and electronics away from the area, but I am worried that continued moisture could damage the flooring or create a mold problem. The forecast predicts another storm this weekend.\n\nCould you please arrange for a maintenance worker to inspect the roof and ceiling by Friday? Please also let me know whether I should stay out of the bedroom until the leak is repaired. I am available tomorrow morning or Thursday after 3:00.\n\nThank you for addressing this promptly.\n\nSincerely,\nHana Lee", "tips_ko": "누수의 위치와 상태를 자세히 쓰고 추가 피해 가능성을 차분하게 설명해. 점검 희망일과 방문 가능한 시간까지 알려 주면 요청이 명확해져."}, {"id": "emg1_3", "scenario": "You work part-time in an undergraduate chemistry laboratory. During an inventory check, you find a bottle in the acid cabinet labeled sodium hydroxide, although its location and hazard symbol suggest that the label may be incorrect.", "task": "Write an email to the laboratory manager. In your email: (1) report what you observed and what action you took, (2) explain the safety risk, (3) request corrective action and offer additional help.", "recipient": "Dr. Patel, undergraduate chemistry laboratory manager", "tone": "formal", "sample_answer": "Dear Dr. Patel,\n\nI am writing to report a labeling problem I noticed during yesterday's inventory check in the undergraduate chemistry laboratory. A bottle stored in the acid cabinet was labeled sodium hydroxide, although its location and hazard symbol suggested that it might contain a different substance. I did not open or move it.\n\nBecause several first-year classes use that cabinet, the unclear label could lead someone to handle the bottle with the wrong precautions. I placed a temporary warning sign on the cabinet and informed the evening supervisor before leaving.\n\nCould you please have the bottle identified and relabeled before Thursday's lab session? I would also be glad to check the remaining cabinet labels with another trained employee. Please let me know whether you need the inventory sheet or a photograph of the bottle.\n\nBest regards,\nDaniel Cho", "tips_ko": "관찰한 사실과 이미 취한 조치를 순서대로 적어. 위험성을 과장하지 말고 필요한 조치와 도울 수 있는 일을 분명히 제시해."}, {"id": "emg1_4", "scenario": "You and a classmate are preparing a presentation about trade in the ancient Mediterranean. A required laboratory practical has been moved to the time when you planned to rehearse together.", "task": "Write an email to your classmate. In your email: (1) explain why you cannot attend the planned rehearsal, (2) update your classmate on the work you have completed, (3) suggest alternative meeting arrangements and request a reply.", "recipient": "Elena García, your archaeology presentation partner", "tone": "semi-formal", "sample_answer": "Hi Elena,\n\nI am writing about our archaeology presentation on trade in the ancient Mediterranean. The professor moved my laboratory practical to Wednesday afternoon, which overlaps with the time we planned to rehearse in the library.\n\nI have finished the map showing major sea routes and drafted my section on amphora evidence. I still need your feedback on two slides, and we should practice the transition between our sections so that the presentation remains within ten minutes.\n\nWould you be available to meet Tuesday at 5:00 p.m. or Thursday at noon instead? If neither time works, we could rehearse online Wednesday evening and exchange comments on the slides beforehand. Please tell me which option you prefer by Monday, since I need to reserve a study room.\n\nThanks for being flexible.\n\nBest,\nNoah", "tips_ko": "일정 변경의 원인을 간단히 밝힌 뒤 네가 끝낸 작업을 알려 줘. 대체 시간을 두 가지 이상 제시하고 답변이 필요한 시점도 써."}, {"id": "emg1_5", "scenario": "Your poster about the atmospheres of distant planets has been accepted for a student astronomy conference. Your assigned presentation period conflicts with a required observation shift at the university telescope.", "task": "Write an email to the conference organizer. In your email: (1) explain the scheduling conflict, (2) describe why both commitments are important, (3) request a different presentation time and provide acceptable alternatives.", "recipient": "Ms. Rivera, coordinator of the Student Astronomy Conference", "tone": "formal", "sample_answer": "Dear Ms. Rivera,\n\nThank you for accepting my poster on atmospheric signals from distant planets for the Student Astronomy Conference. I recently learned that my assigned presentation period, Saturday at 2:00 p.m., conflicts with an observation shift at the university telescope that I am required to complete for my research assistantship.\n\nDuring that shift, I will help collect transit data that cannot be gathered at another time. However, I still hope to present my poster and discuss the project with conference participants.\n\nWould it be possible to move me to the morning poster session or to a period after 5:00 p.m.? I can also exchange times with another presenter if you prefer. Please let me know by October 12, when my observatory schedule becomes final.\n\nI apologize for creating extra work, and I appreciate your consideration.\n\nSincerely,\nAvery Lin", "tips_ko": "두 일정이 겹친다는 사실과 각각의 중요성을 균형 있게 설명해. 원하는 시간뿐 아니라 수용 가능한 다른 선택지도 함께 제시해."}, {"id": "emg1_6", "scenario": "You purchased a motorized telescope mount online for an upcoming public lunar observation event. Its tracking unit repeatedly stops after a few minutes and displays an error even after basic troubleshooting.", "task": "Write an email to the company's customer service department. In your email: (1) identify the product and describe the malfunction, (2) explain why you need working equipment soon, (3) request a replacement or another specific solution.", "recipient": "Customer Support Team at NorthSky Instruments", "tone": "formal", "sample_answer": "Dear Customer Support Team,\n\nI am writing about the StarTrack 80 telescope mount I purchased through your website on September 18. Although the tripod is stable, the motorized tracking unit stops after about three minutes and displays error code E14. I have updated the controller and replaced the batteries, but the problem continues.\n\nI need the mount for a public lunar observation night hosted by my neighborhood science club next Saturday. Without tracking, younger visitors will have difficulty keeping the Moon centered while they take turns using the telescope.\n\nCould you please send a replacement tracking unit by Thursday? If expedited delivery is unavailable, I would prefer a prepaid return label and a full refund. I have attached the receipt and a short video showing the error.\n\nThank you for your prompt assistance.\n\nSincerely,\nMaya Singh", "tips_ko": "제품 정보와 오류 증상을 먼저 쓰고 이미 시도한 해결 방법도 밝혀. 행사 날짜에 맞춘 교환 기한과 대안까지 요청하면 효과적이야."}, {"id": "emg1_7", "scenario": "You are writing a history paper about newspaper coverage during the Great Migration. A library server failure has made several essential primary sources unavailable shortly before the paper's deadline.", "task": "Write an email to your history professor. In your email: (1) explain the research problem, (2) describe your progress and why the missing sources matter, (3) request a brief extension and state how you will finish the research.", "recipient": "Professor Bennett, instructor for Modern American History", "tone": "formal", "sample_answer": "Dear Professor Bennett,\n\nI am writing to request a brief extension on the research paper about newspaper coverage during the Great Migration, currently due Monday. The city library's digital newspaper archive has been unavailable since Wednesday because of a server failure, and several primary sources in my outline are accessible only through that database.\n\nI have completed my introduction and historical background, but I still need to verify quotations from three editorials. Submitting without checking them could result in inaccurate citations and weaken my comparison of regional perspectives.\n\nCould I submit the paper by Thursday instead? If the archive remains offline, I will visit the state library on Tuesday and use its microfilm collection. I can send you my current draft and the library's outage notice today.\n\nThank you for considering this request.\n\nRespectfully,\nEthan Morales", "tips_ko": "자료 접근 문제가 과제의 정확성에 어떤 영향을 주는지 설명해. 현재 진행 상황과 연장 기간 동안의 구체적인 연구 계획을 함께 적어."}, {"id": "emg1_8", "scenario": "You registered for an artifact documentation workshop offered by a local archaeology program, but your confirmation email lists you for an introductory excavation session that you have already completed.", "task": "Write an email to the workshop organizer. In your email: (1) explain the registration error, (2) describe why you need the documentation workshop, (3) request a transfer and suggest alternatives if the session is full.", "recipient": "Mr. Okafor, coordinator of the Community Archaeology Program", "tone": "formal", "sample_answer": "Dear Mr. Okafor,\n\nI am writing about the community archaeology workshop scheduled for November 6. I registered for the artifact documentation session, but my confirmation email lists me for the introductory excavation session instead.\n\nI completed the excavation workshop last spring and signed up specifically to learn cataloging, photography, and condition reporting. These skills are required before I can volunteer in the museum's ceramics collection, so attending the introductory session would not meet my current training needs.\n\nCould you please transfer my registration to the artifact documentation session and confirm whether space is available? If that session is full, I would appreciate a place on the earliest waiting list or the next available date. Please let me know before October 20, when I must finalize my volunteer schedule.\n\nThank you for your help.\n\nBest regards,\nSora Kim", "tips_ko": "등록 오류와 원래 신청한 프로그램을 정확히 구분해서 써. 변경 요청 뒤에 대기 명단이나 다음 일정 같은 대안도 덧붙여."}], "academic_discussion": [{"id": "ad1", "course": "Sociology", "professor": "This week we have been looking at how communities form in large cities. Some sociologists argue that shared physical spaces, such as parks and neighborhood markets, are what turn strangers into neighbors. Others believe that online networks now perform that role just as effectively, and sometimes better. Which of the two do you think matters more for building a sense of community today, and why?", "students": [{"name": "Maya", "text": "I think physical spaces still matter most. It is hard to trust someone you have never stood next to, and the small daily encounters at a bus stop or a corner shop are exactly what build that trust. Online groups feel convenient, but many of them go quiet as soon as people lose interest."}, {"name": "Daniel", "text": "I would argue the opposite. My apartment building has a group chat where neighbors lend each other tools, warn about broken elevators, and organize cleanups, and almost none of that happened before the chat existed. Online platforms let people find each other around real needs instead of relying on chance meetings."}], "sample_answer": "I side with Daniel, although I would add one condition: online networks build community only when they are tied to a specific place. In the apartment complex where my parents live, about sixty households joined a messaging group two years ago. Before that, neighbors barely nodded at each other in the elevator. Once the group existed, one resident posted that the recycling area was constantly overflowing, and within a week the households had organized a rotating cleaning schedule and pushed the management company to add more bins. That kind of coordination would have been nearly impossible through casual encounters alone, because people who happen to meet in a hallway rarely have a way to follow up on anything. So physical proximity may create the shared problem, but the online network is what turns that problem into collective action.", "tips_ko": "입장을 첫 문장에서 분명히 밝히고 동료 이름을 언급해 논의에 참여하는 태도를 보이세요. 이유는 하나만 고르되 숫자와 결과가 들어간 구체적 사례로 끝까지 발전시키는 것이 핵심입니다."}, {"id": "ad2", "course": "Environmental Science", "professor": "We have been discussing how governments can reduce household energy consumption. One approach is to raise the price of electricity and gas so that people naturally use less. A very different approach is to fund public education campaigns and clearer appliance labeling so that people make better informed choices. Which strategy would you support, and what makes it more effective in your view?", "students": [{"name": "Elena", "text": "Pricing works faster and it is much harder to ignore. When my city raised water rates last year, my family repaired a leaking tap within days, something we had postponed for months. Information campaigns are easy to tune out, but a higher bill arrives every month."}, {"name": "Omar", "text": "Higher prices worry me because they fall hardest on low income households. A family that already keeps the heating low has almost nothing left to cut, while wealthier households simply pay more and change nothing at all. I would rather invest in labeling and efficiency programs that help people choose better appliances."}], "sample_answer": "I agree with Omar that price increases on their own are unfair, but I do not think education campaigns are strong enough by themselves either. My preference is a rebate program funded by higher rates charged only to very heavy users. Last winter my landlord finally replaced our twenty year old boiler, and he did it only because the city offered to cover half the cost. No amount of labeling would have persuaded him, since he does not pay the heating bill himself, and better information cannot change that incentive. The subsidy did change it, and our monthly gas use dropped by roughly a third. This example shows why a policy has to reach the person who actually makes the purchasing decision. Information tells people what they should do, but money decides whether they are able to act on it.", "tips_ko": "두 학생 의견을 그대로 반복하지 않고 제3의 절충안을 제시하면 사고의 깊이가 드러납니다. 사례에서 누가 비용을 부담하고 누가 결정하는지처럼 구체적 조건을 짚어 주면 논리가 훨씬 단단해집니다."}, {"id": "ad3", "course": "Business Management", "professor": "Let us turn to hiring decisions for new teams. Some managers prefer candidates with long experience in the same industry, arguing that such people contribute from the first week. Other managers deliberately recruit from unrelated fields, believing that outsiders bring approaches insiders would never consider. If you were building a new team from scratch, which type of candidate would you prioritize, and why?", "students": [{"name": "Hana", "text": "I would prioritize industry experience. A new team is under pressure to produce results quickly, and someone who already understands the customers, the regulations, and the common mistakes can save months of training. Creativity is valuable, but it does not help much if the basics are wrong."}, {"name": "Lucas", "text": "I lean toward hiring outsiders, at least for some of the positions. People who have spent fifteen years in one industry often cannot tell which of their habits are actual requirements and which are simply tradition. A mixed team argues more, but it also questions assumptions that insiders stop noticing."}], "sample_answer": "Hana makes a fair point about speed, but I would still prioritize outsiders for most positions on a brand new team. My reason is that experienced insiders tend to rebuild the processes they already know, and a new team is exactly the place where those processes should be questioned. At the logistics company where I worked, the delivery scheduling team was rebuilt with two engineers who came from hospital operations rather than shipping. Within four months they had replaced a spreadsheet system that everyone else treated as normal, because in their previous field the same sorting problem had already been solved with automated triage. Experienced colleagues had complained about that spreadsheet for years without ever imagining an alternative. I would still hire one or two insiders to handle regulations and client relationships, but the majority of the team should come from outside.", "tips_ko": "상대 의견의 타당한 부분을 한 문장으로 인정한 뒤 자신의 입장을 더 강하게 밀어붙이면 설득력이 높아집니다. 결론에서 조건이나 예외를 하나 붙여 주면 단순한 찬반을 넘어선 답변으로 평가됩니다."}, {"id": "adg0_1", "course": "Public Health", "professor": "Rates of diet-related illness have climbed in most high-income countries over the past thirty years. One camp of researchers insists that the most effective interventions teach individuals to make better choices, through labeling, counseling, and school programs. Another camp argues that only changes to the environment, such as zoning, pricing, and food availability, produce lasting results. Which approach should public health agencies prioritize, and why?", "students": [{"name": "Priya", "text": "Education has to come first. People move, shop in different neighborhoods, and cook for families with very different needs, so no single environmental rule fits everyone. If someone understands why added sugar matters, that knowledge travels with them. Changing the environment without changing understanding just shifts the problem somewhere else."}, {"name": "Owen", "text": "Knowledge is not the bottleneck. Almost everyone I know can name a healthy meal, yet they buy whatever is cheap and five minutes away. When a neighborhood has twelve fast food outlets and no grocery store, telling residents to eat vegetables is close to meaningless. Fix the supply and behavior follows."}], "sample_answer": "Owen's point about supply convinces me, and I would push it further: environmental changes work because they do not depend on willpower that people have already spent at work. My hometown ran a nutrition education campaign in every middle school for three years, complete with posters and cooking demonstrations, and the district's own survey showed almost no change in what students actually ate at lunch. Two years later the city council capped the number of fast food permits near schools and subsidized a weekly farmers market in the same district. Vegetable purchases at that market reached roughly four hundred families within a year, and the school cafeteria began sourcing from it. The education campaign asked families to swim against the current; the zoning change moved the current. That is why agencies should treat environment as the primary lever and education as support.", "tips_ko": "교육이냐 환경이냐 같은 문제에선 한쪽을 고르고 나머지는 보조 역할로 정리해줘. 수치가 들어간 사례 하나만 끝까지 밀고 가면 돼."}, {"id": "adg0_2", "course": "Educational Psychology", "professor": "We have been discussing motivation this week. Some psychologists support reward programs, where children earn points or prizes for the number of books they finish, arguing that the habit comes first and enjoyment follows. Others warn that rewards crowd out intrinsic interest and that children should instead be given more freedom to choose what they read. Which strategy would you recommend to an elementary school, and why?", "students": [{"name": "Elena", "text": "Rewards are the practical choice. Children who have never finished a book cannot discover that they enjoy reading, so something has to get them started. My cousin's school gave out stickers and a pizza party, and reluctant readers suddenly had a reason to try. Interest can grow later, once the habit exists."}, {"name": "Theo", "text": "I worry about what happens when the prizes stop. Point systems also push children toward short, easy books because the goal becomes the count, not the story. Letting students pick their own titles, including comics and nonfiction about sports, respects the fact that interest is what keeps anyone reading for years."}], "sample_answer": "Theo identifies the problem I saw firsthand when I volunteered in a library reading program. In the first term we ran a points chart, and the children competed for the top row. One nine year old finished twenty two books that term, almost all of them thirty page picture books he had already read, because rereading was the fastest way to earn points. When the chart came down in the spring, his borrowing dropped to nearly zero. The following term our coordinator replaced the chart with a shelf of choices, including graphic novels and books about soccer players, and asked each child to describe one thing they liked. The same boy worked through a two hundred page series about a hockey team over two months. Nobody tracked his total. Rewards had taught him to measure reading; choice taught him to want it, and that is the outcome a school should aim for.", "tips_ko": "동료 의견에 동의하면서 내 경험으로 한 단계 더 밀어주는 전개가 깔끔해. 아이 나이나 책 권수처럼 구체적인 숫자를 꼭 넣자."}, {"id": "adg0_3", "course": "Urban Economics", "professor": "Many mid sized cities are now competing for remote workers who can live anywhere. Some economists recommend direct financial incentives, such as relocation grants or tax rebates, because they produce visible results quickly. Others argue the money is better spent on amenities like transit, childcare, and broadband, which determine whether newcomers stay. If you advised a city with a limited budget, which strategy would you choose, and why?", "students": [{"name": "Hana", "text": "I would start with cash grants. A city that nobody has heard of needs attention first, and a relocation payment gets written about in national media. Amenities take years to build and voters lose patience. Once new residents arrive and pay taxes, the city has more money for the slower improvements."}, {"name": "Marcus", "text": "Grants attract people who are shopping for a discount, and those people leave when a better offer appears. What keeps a household in place is whether the daycare has openings and whether the internet works during a video call. Spending on services also benefits residents who already live there, not just newcomers."}], "sample_answer": "Marcus is right that retention, not arrival, is the number that matters. A small city near my university offered ten thousand dollars to remote workers who moved there and stayed one year. Roughly three hundred households took the offer, and local officials celebrated. Two years after the first cohort qualified, a follow up report found that fewer than half were still in the county, and the most common reason given for leaving was the lack of childcare and the hour long drive to the nearest clinic. The same budget, spent on extending the daycare system, would have served the four thousand families already living there and made the city attractive without any advertising. Grants buy a headline; services buy a tax base. A city with limited money cannot afford to pay twice for the same resident, so I would fund the amenities first and let word of mouth do the recruiting.", "tips_ko": "비용 대비 효과를 비교할 때는 장기 결과를 근거로 삼는 게 설득력 있어. 정책이 실패한 사례를 들면 반대 입장을 자연스럽게 반박할 수 있어."}, {"id": "adg0_4", "course": "Science Policy", "professor": "Research budgets are finite, and agencies must decide how to divide them. One position holds that the largest share should go to applied projects aimed at specific diseases, since patients are waiting now. The other holds that basic research into fundamental mechanisms produces the discoveries that later make cures possible, even though its payoff is unpredictable. Where should a national funding agency place its emphasis, and why?", "students": [{"name": "Rosa", "text": "Applied research should come first. Taxpayers fund these agencies, and they reasonably expect treatments for the illnesses in their own families. Targeted programs also have clear milestones, so wasteful projects can be identified and stopped. Basic research is valuable, but private foundations and universities can support curiosity driven work."}, {"name": "Ibrahim", "text": "Applied work can only use tools that basic science has already created. Almost every major therapy of the last decade rests on discoveries nobody made with a disease in mind. If an agency funds only projects with promised outcomes, it quietly stops producing the knowledge that the next generation of treatments will need."}], "sample_answer": "Ibrahim's argument matches the actual history of the tools biologists use every day. Gene editing with CRISPR did not begin as a cure for anything. In the late nineteen eighties, researchers studying salt tolerant bacteria noticed strange repeated sequences in the genome and spent years simply trying to explain what they were for. The answer, a bacterial defense system against viruses, had no obvious medical application at the time, and a funding panel scoring proposals by disease relevance would almost certainly have ranked it low. Roughly twenty five years later that curiosity produced a technique now used in approved therapies for sickle cell disease. No applied program aimed at sickle cell could have invented it, because the necessary knowledge did not exist. That is the asymmetry I would ask an agency to remember: applied research spends scientific capital, and only basic research creates more of it.", "tips_ko": "추상적인 논쟁은 역사적 사례 하나로 바로 구체화하면 점수가 올라가. 과학 분야 이름이나 연도를 넣어서 신뢰감을 주자."}, {"id": "adg0_5", "course": "Health Systems", "professor": "Rural regions in many countries have far fewer physicians per capita than cities. One proposal is to invest in diagnostic technology, including AI assisted imaging and remote monitoring, so that a smaller staff can handle more patients. Another is to spend the same money on recruiting and retaining clinicians through loan forgiveness and housing support. Which investment would improve rural health outcomes more, and why?", "students": [{"name": "Sofia", "text": "Technology scales in a way that people do not. A rural clinic cannot conjure up a radiologist, but it can send images to a system that flags urgent cases in minutes. Recruitment programs have been tried for decades and physicians still leave after their service requirement ends. Tools stay."}, {"name": "Luis", "text": "A flagged scan is not treatment. Someone still has to examine the patient, explain the options, and follow up for months, and in the county where my aunt lives the nearest clinic closed because it had no staff, not because it lacked software. Technology without clinicians just produces results nobody can act on."}], "sample_answer": "Luis puts his finger on the gap between detection and care. My uncle lives in a farming district that received a provincial grant for a tele dermatology system, complete with a camera and an AI screening program for suspicious skin lesions. The equipment worked. Over eighteen months it flagged more than two hundred cases, but the district had one general practitioner for eleven thousand residents and no dermatologist within a three hour drive, so most patients waited five to seven months for the biopsy the software had recommended. Two of them, including a neighbor of my uncle, were diagnosed at a far later stage than necessary. Detection only improves outcomes if someone is available to act on it within weeks. I would therefore spend the money on loan forgiveness and housing for clinicians first, because staff can work without new machines while machines cannot work without staff.", "tips_ko": "기술이냐 사람이냐 문제는 둘 다 필요하다고 끝내지 말고 우선순위를 분명히 해. 대기 기간처럼 눈에 보이는 결과로 이유를 받쳐줘."}, {"id": "adg0_6", "course": "Behavioral Economics", "professor": "Most workers save less for retirement than they say they intend to. One body of research favors default enrollment, where employees are signed up automatically and must opt out, because it changes behavior without requiring any decision. Another favors financial education, arguing that defaults produce passive savers who cannot adjust their plans later. Which policy should a government encourage, and why?", "students": [{"name": "Chloe", "text": "Defaults are the obvious answer. They cost almost nothing, they work immediately, and nobody loses the right to opt out. Education sounds respectful, but a two hour seminar competes with everything else in a person's week, and most of what is taught is forgotten before the next paycheck arrives."}, {"name": "Jonas", "text": "Defaults only decide whether you save, not whether you save enough or in the right fund. Workers enrolled at a low default rate often stay there for twenty years and assume they are fine. Without some understanding of fees and contribution rates, people cannot notice when the automatic setting is working against them."}], "sample_answer": "I agree with Chloe, though the design detail she leaves out is what makes the case decisive. My mother worked for a regional insurance company that switched from voluntary sign up to automatic enrollment at a four percent contribution rate, with a yearly increase of one percent until the rate reached ten. Participation among new hires went from about half the staff to over ninety percent in a single year, and almost nobody opted out. The same firm had offered lunchtime retirement seminars for years; my mother attended two and could not remember a single number afterward. Jonas is right that passive savers may never optimize their fund choice, but a worker contributing ten percent into a mediocre fund still ends up far ahead of one contributing nothing into an excellent one. Defaults change the base rate; education, at best, refines it.", "tips_ko": "상대 의견의 타당한 부분을 인정한 뒤 내 입장이 더 중요한 이유를 대비시켜봐. 참여율 변화 같은 수치가 제일 강한 근거야."}, {"id": "adg0_7", "course": "Developmental Psychology", "professor": "Adolescents are biologically inclined to fall asleep later than children or adults, yet most secondary schools begin before eight in the morning. Some researchers argue that districts should simply push start times later. Others say the real culprit is evening screen use and that schools should teach sleep hygiene instead of rearranging the calendar. Which response would do more for teenage health and learning, and why?", "students": [{"name": "Amara", "text": "Start times should move. The shift in adolescent sleep timing is driven by hormones, not by choice, so asking teenagers to go to bed at nine is asking them to lie awake. A later bell gives every student an extra hour regardless of whether they remember a lesson about screens."}, {"name": "Nikhil", "text": "Moving the bell creates a cascade of problems: bus routes, athletics, and parents who leave for work at seven. And if students simply stay up an hour later playing games, the gain disappears. Teaching them how light and caffeine affect sleep gives them a skill they keep after graduation."}], "sample_answer": "Amara has the stronger case, because a later start changes the one variable students cannot control. My high school moved its first bell from seven twenty to eight thirty-five when I was in eleventh grade, after years of assemblies about screen time that changed nothing I could observe. The difference was immediate. Our homeroom teacher kept attendance records and told us that tardiness in our grade fell by roughly forty percent that term, and the morning calculus class, which had been notorious for sleeping students, became the section with the highest average on the district exam. Nikhil's worry about bedtimes drifting later is reasonable, but our own schedules did not shift much, because practices and homework ended at the same time. A policy that works while teenagers are unconscious beats one that depends on them remembering advice at eleven at night.", "tips_ko": "생물학적 이유처럼 바꿀 수 없는 조건을 근거로 쓰면 논리가 단단해져. 내가 직접 겪은 학교 변화를 결과까지 적어주자."}, {"id": "adg0_8", "course": "Development Economics", "professor": "Governments have traditionally measured progress with gross domestic product. Some economists defend it, noting that it is comparable across countries and closely tied to things people value, such as employment and tax revenue. Others want national dashboards built on wellbeing measures, including health, leisure, and reported life satisfaction. Which should guide policy decisions in the coming decade, and why?", "students": [{"name": "Fatima", "text": "GDP has obvious flaws, but it is measurable and hard to manipulate. Wellbeing surveys depend on how people feel on the day they answer, and governments would be tempted to redesign the questions whenever results looked bad. A rough number everyone can check beats a flattering one nobody can verify."}, {"name": "Desmond", "text": "What we measure is what we chase. GDP counts a traffic jam and a hospital stay as output while ignoring unpaid care work entirely, so policies that raise it can leave people worse off. A dashboard would at least force ministers to explain why growth came with longer hours and dirtier air."}], "sample_answer": "Desmond's point about chasing what we measure persuades me, and one government has already shown what the alternative looks like in practice. New Zealand restructured its 2019 budget around a set of wellbeing indicators and required every ministry to justify new spending against them. The largest single allocation that year went to mental health services, including frontline support in schools and clinics, a category that had lost every previous budget fight because its returns do not appear in output figures for a decade. Under a purely GDP framework, a road widening project would have won that money easily and looked like success. Fatima is right that survey data can be massaged, but the answer is published methodology and independent statistical agencies, not abandoning the measurement. We should keep GDP as one dial on the dashboard rather than treating it as the whole instrument panel.", "tips_ko": "지표 선택 문제는 측정하는 것이 행동을 바꾼다는 틀로 접근하면 쉬워. 실제 정부 예시 하나로 마무리하면 설득력이 생겨."}, {"id": "adg1_1", "course": "Earth Science", "professor": "Coastal communities are increasingly threatened by rising sea levels and stronger storm surges. Some local governments are considering managed retreat, which involves moving buildings away from vulnerable shorelines. Others prefer to defend existing neighborhoods by constructing higher seawalls. Which strategy should coastal communities prioritize, and why?", "students": [{"name": "Elena", "text": "Coastal towns should gradually move homes and public buildings away from the shoreline rather than keep constructing larger seawalls. Barriers are expensive to maintain, and rising seas can eventually overtop them. Restored dunes and wetlands would provide protection while also creating habitat and giving residents a safer future."}, {"name": "Marcus", "text": "I favor stronger seawalls because relocation can destroy communities that have existed for generations. Fishing businesses, historic districts, and tourism all depend on access to the coast. With modern engineering and regular upgrades, barriers can protect both local identity and the investments people have already made."}], "sample_answer": "I agree with Elena that managed retreat is usually the wiser long-term policy for communities facing repeated coastal flooding. My main reason is that barriers can create a false sense of permanence, encouraging further investment in places that remain fundamentally exposed. For example, imagine a town that spends $20 million raising a seawall around its business district. Developers may then build new apartments behind it, assuming the danger has disappeared. Twenty years later, higher seas and a powerful storm could send water over the wall, damaging far more property than existed before the project. By contrast, the same town could buy the most vulnerable lots, help residents move several blocks inland, and convert the cleared land into wetlands that absorb storm water. Although retreat is politically difficult, it reduces future exposure instead of merely postponing the consequences of building beside a changing ocean.", "tips_ko": "해안 방어책의 단기 효과보다 장기 결과에 초점을 맞춰 입장을 정해. 비용과 피해 규모가 드러나는 가상 사례를 넣으면 이유가 더 설득력 있어."}, {"id": "adg1_2", "course": "Astronomy", "professor": "Commercial satellite networks can provide internet service to remote areas, but their reflected light may interfere with astronomical observations. Some researchers want governments to limit the number and brightness of satellites, while others worry that strict rules would slow technological progress. Should governments impose stronger restrictions on commercial satellites?", "students": [{"name": "Priya", "text": "Governments should limit the number and brightness of commercial satellites. Astronomers need dark skies to detect faint objects, and streaks from thousands of satellites can ruin valuable observations. Internet access matters, but companies should redesign satellites and coordinate their orbits before expanding their networks."}, {"name": "Owen", "text": "Strict limits would slow the expansion of affordable internet in rural regions. Satellite networks reach places where laying fiber cables is too costly, and millions of people could benefit. Astronomers can use software to remove many satellite trails or schedule observations around known orbital paths."}], "sample_answer": "I agree with Priya that governments should regulate satellite brightness, even if they do not strictly cap the number launched. The strongest reason is that some astronomical observations cannot simply be repeated after a satellite crosses an image. Suppose a university observatory monitors a faint star for six hours to measure the brief dimming caused by a small exoplanet. If a bright satellite trail saturates the detector during the critical two-minute dip, software may identify the streak but cannot recreate the missing light measurements. The telescope team could wait months or years for the planet to pass in front of the star again. Requiring companies to use darker coatings and share precise orbital data would lower this risk without denying remote communities internet service. Owen is right about connectivity, but basic design standards can protect scientific data while allowing useful satellite networks to grow.", "tips_ko": "두 가치가 모두 중요하다는 점을 인정한 뒤 어느 쪽을 우선할지 분명히 해. 관측이 방해받는 구체적인 순간을 설명하면 주장이 선명해져."}, {"id": "adg1_3", "course": "Chemistry", "professor": "Computer simulations now allow students to conduct virtual chemistry experiments without using physical materials. Some educators believe simulations should replace most introductory laboratory sessions because they are safe and inexpensive. Others argue that students still need hands-on laboratory experience. Which approach do you think is more effective?", "students": [{"name": "Lena", "text": "Introductory students should perform real experiments whenever safety and cost allow. Chemistry is not only a set of equations; it also requires measuring liquids, noticing unexpected changes, and handling imperfect equipment. Those practical skills cannot be developed fully by clicking through a simulation."}, {"name": "Noah", "text": "Simulations should replace most beginner labs because they are safer, cheaper, and easier to repeat. Students can test many conditions in one class period without wasting chemicals or breaking glassware. Once they understand the principles, specialized students can learn physical techniques in advanced courses."}], "sample_answer": "I agree with Lena that introductory chemistry students need some hands-on laboratory work because physical experiments teach them how to recognize and correct procedural errors. A simulation usually provides ideal glassware and exact measurements, so students may finish without understanding why real results vary. For example, a student performing an acid-base titration might rinse a burette with water instead of the solution it will contain. The remaining water dilutes the titrant, and the calculated concentration comes out unexpectedly high. By checking the setup, repeating the trial, and comparing results with classmates, the student learns both the chemical principle and the source of error. That lesson is more durable than selecting the correct tool on a screen. Simulations can still prepare students for dangerous or expensive procedures, but they should supplement experiments rather than replace them, especially when the goal is to develop careful scientific judgment.", "tips_ko": "실제 실험과 가상 실험의 차이를 추상적으로만 설명하지 마. 작은 실수 하나가 결과와 학습에 어떤 영향을 주는지 단계적으로 보여 줘."}, {"id": "adg1_4", "course": "Museum History", "professor": "Many museums possess culturally important objects acquired from other societies during colonial periods. Some historians argue that these objects should be returned to descendant communities, while others believe that major museums should preserve them for an international audience. What should museums generally do with disputed cultural objects?", "students": [{"name": "Amina", "text": "Museums should return sacred or culturally central objects when descendant communities request them. Many were acquired under unequal colonial conditions, so legal ownership does not necessarily mean ethical ownership. Returning an object can help a community restore ceremonies and teach younger generations, while museums can display accurate replicas and explain the history of repatriation."}, {"name": "Lucas", "text": "Major museums should keep such objects if they preserve them well and make them accessible to an international public. Moving fragile works may damage them, and deciding which modern group has the strongest claim can be complicated. Shared collections also let visitors compare civilizations in ways that separate national museums may not."}], "sample_answer": "I support Amina's view that museums should return sacred objects when a living community has a strong cultural claim. The central reason is that access to an original object can be necessary for continuing a tradition, not merely for studying the past. For example, suppose a museum owns a ceremonial mask collected during colonial rule and displays it behind glass for a few weeks each year. In its home community, elders could use that same mask in an annual initiation ceremony and teach younger members the songs, movements, and responsibilities connected with it. A digital model would preserve the mask's appearance, but it could not restore its social role. The museum could receive a detailed replica, research records, and opportunities for collaborative exhibitions in return. As Lucas suggests, broad public education matters; however, education should not depend on permanently separating an object from the people for whom it remains culturally active.", "tips_ko": "법적 소유권과 문화적 역할을 구분해서 논리를 세워. 유물이 실제 공동체에서 어떻게 사용되는지 보여 주는 사례가 효과적이야."}, {"id": "adg1_5", "course": "Archaeology", "professor": "Excavation permanently alters an archaeological site, so researchers often preserve parts of sites for future scholars with better technology. However, some sites face immediate destruction from coastal erosion, development, or armed conflict. When a site is seriously threatened, should archaeologists excavate it now or still try to leave it undisturbed?", "students": [{"name": "Sofia", "text": "Archaeologists should excavate sites that face immediate destruction from erosion, construction, or conflict. Waiting for better technology is pointless if the evidence will soon vanish. Careful rescue excavations can preserve detailed records, samples, and three-dimensional models that future researchers can reanalyze even after the physical site is gone."}, {"name": "Daniel", "text": "Whenever possible, researchers should leave part of a site unexcavated. Digging permanently changes the evidence, and future methods may reveal information that current tools miss. Protective barriers, land purchases, or construction changes can sometimes save threatened sites without sacrificing them, so excavation should remain the final option rather than the automatic response."}], "sample_answer": "I agree with Sofia that archaeologists should excavate a threatened site before it disappears, provided they document each step carefully. My reason is that erosion destroys context, and context cannot be reconstructed from artifacts collected later. Imagine a 3,000-year-old coastal settlement where storms have exposed several hearths. If researchers postpone excavation for better future technology, the next winter could scatter pottery across the beach and wash away the soil layers surrounding each hearth. A controlled rescue project could map the layers, record where animal bones and tools occur, and take sediment samples for later analysis. Future scientists would still be able to study the archived samples and digital models with improved methods. By contrast, leaving the site untouched might preserve it only in theory while nature removes the evidence in no meaningful order. Daniel's concern about destructive excavation is valid, but imminent loss makes careful action the more responsible choice.", "tips_ko": "유물 자체보다 발견 위치와 토양층 같은 맥락이 왜 중요한지 설명해. 시간이 지나면 무엇이 사라지는지 구체적으로 제시하면 좋아."}, {"id": "adg1_6", "course": "Geophysics", "professor": "Geothermal power plants can generate reliable low-carbon electricity in volcanically active regions. However, drilling and injecting water underground may trigger small earthquakes. Should communities near volcanic areas expand geothermal energy despite this risk, or should they invest in other renewable sources instead?", "students": [{"name": "Mateo", "text": "Volcanic regions should consider geothermal power because underground heat can provide reliable electricity with relatively low carbon emissions. The risks from drilling are real, but careful site studies, small pilot wells, and continuous earthquake monitoring can reduce them. Rejecting the resource completely would leave many regions dependent on imported fossil fuels."}, {"name": "Keira", "text": "Communities near active faults should avoid new geothermal drilling. Injecting fluids underground can trigger earthquakes, and even a moderate event could damage homes or weaken public trust. Monitoring detects movement only after it begins, so it does not remove the risk. Solar and wind projects offer safer ways to reduce emissions."}], "sample_answer": "I side with Mateo because geothermal drilling can be appropriate in volcanic regions when projects begin on a limited scale and include strict seismic monitoring. The main reason is that a pilot project can reveal local geological risks before a community commits to a large facility. Consider a town that drills one test well and installs sensors within a ten-kilometer radius. During low-pressure water injection, the sensors detect a cluster of tiny earthquakes near an unmapped fault. Engineers can stop pumping, lower the pressure, and shift the production well away from that fault before any damaging event occurs. Without a staged trial, the same weakness might remain hidden until full operation. Keira is right that induced earthquakes deserve serious concern, but rejecting geothermal energy entirely would also sacrifice a steady source of low-carbon electricity. Careful testing turns uncertainty into measurable information and gives regulators a clear point at which to halt an unsafe project.", "tips_ko": "무조건 찬성하거나 반대하기보다 필요한 안전 조건을 제시해도 돼. 시험 굴착에서 위험을 발견하고 대응하는 과정을 구체적으로 써 봐."}, {"id": "adg1_7", "course": "Planetary Astronomy", "professor": "Governments have limited budgets for protecting Earth from asteroids. They can spend more on survey telescopes that discover potentially dangerous objects, or they can fund spacecraft missions that test ways to change an asteroid's path. Which area should receive the larger share of new planetary-defense funding?", "students": [{"name": "Hana", "text": "The first priority should be better survey telescopes. Scientists cannot protect Earth from an asteroid they have not found, and many smaller objects remain difficult to detect. Discovering a threat decades in advance also gives governments time to confirm its orbit, compare response options, and cooperate internationally."}, {"name": "Ravi", "text": "Funding should focus on testing spacecraft that can alter an asteroid's path. Detection alone does not prevent an impact, and a response system cannot be invented at the last minute. More demonstration missions would show which technologies work and would train engineers before a genuine emergency occurs."}], "sample_answer": "I agree with Hana that detection should receive the larger share of new planetary-defense funding. The effectiveness of every deflection method depends mainly on how much warning time scientists have. For example, suppose a survey telescope discovers a 150-meter asteroid that has a small chance of striking Earth in twenty years. Astronomers would have time to observe several orbits, narrow the predicted path, and launch a relatively modest spacecraft to alter the asteroid's speed by only a few millimeters per second. Over two decades, that tiny change could make the asteroid miss Earth by thousands of kilometers. If the same object were found only two months before impact, even an advanced deflection craft might not be ready to launch. Ravi is correct that tested response technology is essential, but it has little value when dangerous objects remain unknown. Better surveys create the time that makes all other planetary-defense tools practical.", "tips_ko": "발견과 대응 중 무엇이 먼저 필요한지 인과관계를 분명히 해. 경고 시간이 길 때 작은 조치가 큰 결과를 만드는 사례를 활용해."}, {"id": "adg1_8", "course": "Environmental Chemistry", "professor": "Thousands of fluorinated chemicals are used in products because they resist heat, water, and grease, but many remain in the environment for a long time. Some scientists recommend regulating these chemicals as a broad class. Others argue that each compound should be evaluated separately. Which regulatory approach is more appropriate?", "students": [{"name": "Mei", "text": "Regulators should restrict persistent fluorinated chemicals as a broad class instead of evaluating them one by one. Thousands of related compounds exist, and research on each can take years. A class-based policy would prevent companies from replacing a known harmful chemical with a similar, poorly studied substitute that later contaminates water."}, {"name": "Thomas", "text": "Chemical similarity does not prove that every compound has the same toxicity or use. A broad restriction could remove valuable materials from medical devices, electronics, and safety equipment. Regulators should evaluate exposure and harm for each substance, then ban the dangerous ones while permitting compounds whose benefits clearly outweigh their risks."}], "sample_answer": "I agree with Mei that regulators should restrict highly persistent fluorinated chemicals as a class, while allowing exceptions for essential uses. My reason is that regulating one compound at a time encourages manufacturers to replace it with a closely related chemical that may create the same problem. For example, imagine a factory that must remove one banned coating ingredient from food wrappers. If only that molecule is restricted, the company may substitute a slightly shorter fluorinated compound because it repels grease in the same way. Years later, researchers may discover that the substitute also accumulates in groundwater, forcing communities to install another round of costly filters. A class-based rule would push the factory to adopt a genuinely different material, such as a fluorine-free barrier, from the beginning. Thomas is right that compounds can vary in toxicity, so medical or industrial exceptions may be justified. However, extreme environmental persistence is itself a shared hazard that supports broader preventive regulation.", "tips_ko": "화학물질을 하나씩 규제할 때 생길 수 있는 대체 문제를 중심으로 써. 비슷한 물질로 바꾼 뒤 같은 오염이 반복되는 사례를 제시하면 돼."}]}, "vocab": [{"w": "analyze", "pos": "v", "ko": "분석하다, 검토하다", "fam": "-ize", "forms": ["analysis", "analyst", "analytical", "analytically"], "ex": "Economists analyze historical trade data in order to predict how future tariffs will affect ordinary consumers.", "sub": 1}, {"w": "approach", "pos": "n", "ko": "접근법, 접근하다", "fam": "other", "forms": ["approaches", "approachable", "approaching"], "ex": "The author adopts a comparative approach when examining educational reforms in several developing countries.", "sub": 1}, {"w": "area", "pos": "n", "ko": "지역, 분야", "fam": "other", "forms": ["areas", "subarea"], "ex": "Rainfall in the coastal area has increased steadily since detailed records began in 1900.", "sub": 1}, {"w": "assess", "pos": "v", "ko": "평가하다, 가늠하다", "fam": "other", "forms": ["assessment", "assessor", "assessable"], "ex": "Teachers assess student progress using both written examinations and continuous classroom observation throughout the year.", "sub": 1}, {"w": "assume", "pos": "v", "ko": "가정하다, 맡다", "fam": "other", "forms": ["assumption", "assumed", "assuming"], "ex": "Classical economic models assume that consumers always behave rationally when choosing between competing products.", "sub": 1}, {"w": "authority", "pos": "n", "ko": "권한, 당국", "fam": "-ity", "forms": ["authorities", "authorize", "authoritative", "authorization"], "ex": "The local authority must approve any construction project that alters the historic city center.", "sub": 1}, {"w": "available", "pos": "adj", "ko": "이용 가능한, 구할 수 있는", "fam": "-able/-ible", "forms": ["availability", "avail", "unavailable"], "ex": "Detailed census records are available to researchers who submit a formal request to the archive.", "sub": 1}, {"w": "benefit", "pos": "n", "ko": "이익, 혜택", "fam": "other", "forms": ["beneficial", "beneficiary", "benefited"], "ex": "Regular exercise offers a measurable benefit to cardiovascular health as well as psychological well-being.", "sub": 1}, {"w": "concept", "pos": "n", "ko": "개념, 관념", "fam": "other", "forms": ["conceptual", "conception", "conceptualize"], "ex": "The concept of sustainable development links economic growth with careful protection of natural resources.", "sub": 1}, {"w": "consist", "pos": "v", "ko": "구성되다, 이루어져 있다", "fam": "other", "forms": ["consistent", "consistency", "consistently", "inconsistent"], "ex": "Most modern textbooks consist of short thematic units followed by review questions and exercises.", "sub": 1}, {"w": "constitute", "pos": "v", "ko": "구성하다, 이루다", "fam": "-ate", "forms": ["constitution", "constitutional", "constituent"], "ex": "Women constitute nearly half of the paid workforce in most industrialized nations today.", "sub": 1}, {"w": "context", "pos": "n", "ko": "문맥, 상황", "fam": "other", "forms": ["contextual", "contextualize", "contextually"], "ex": "Historians interpret each document within the political context in which it was originally produced.", "sub": 1}, {"w": "contract", "pos": "n", "ko": "계약, 계약서", "fam": "other", "forms": ["contractor", "contractual", "contracted"], "ex": "Every employee must sign a written contract that specifies working hours and annual leave.", "sub": 1}, {"w": "create", "pos": "v", "ko": "창조하다, 만들어내다", "fam": "-ate", "forms": ["creation", "creative", "creativity", "creator"], "ex": "Urban planners create green corridors that allow wildlife to move safely between city parks.", "sub": 1}, {"w": "data", "pos": "n", "ko": "자료, 데이터", "fam": "other", "forms": ["database", "datum"], "ex": "The survey data suggest that household spending declined sharply during the second financial quarter.", "sub": 1}, {"w": "define", "pos": "v", "ko": "정의하다, 규정하다", "fam": "other", "forms": ["definition", "definitive", "definable", "undefined"], "ex": "Scientists must define their terms precisely before comparing results obtained in different laboratories.", "sub": 1}, {"w": "derive", "pos": "v", "ko": "끌어내다, 유래하다", "fam": "other", "forms": ["derivation", "derivative", "derived"], "ex": "Many English medical terms derive from Latin and Greek roots used by early physicians.", "sub": 1}, {"w": "distribute", "pos": "v", "ko": "분배하다, 유통시키다", "fam": "other", "forms": ["distribution", "distributor", "distributive"], "ex": "Aid agencies distribute food and medical supplies to villages affected by the recent flooding.", "sub": 1}, {"w": "economy", "pos": "n", "ko": "경제, 절약", "fam": "other", "forms": ["economic", "economical", "economist", "economics"], "ex": "The national economy expanded steadily once foreign investment returned to the manufacturing sector.", "sub": 1}, {"w": "environment", "pos": "n", "ko": "환경, 주위 상황", "fam": "-ment", "forms": ["environmental", "environmentalist", "environmentally"], "ex": "Industrial waste continues to damage the marine environment along densely populated tropical coastlines.", "sub": 1}, {"w": "establish", "pos": "v", "ko": "설립하다, 확립하다", "fam": "other", "forms": ["establishment", "established", "establishing"], "ex": "The university plans to establish a research center devoted entirely to renewable energy technologies.", "sub": 1}, {"w": "estimate", "pos": "v", "ko": "추정하다, 추산하다", "fam": "-ate", "forms": ["estimation", "estimated", "overestimate", "underestimate"], "ex": "Demographers estimate that the world population will reach ten billion before the year 2060.", "sub": 1}, {"w": "evident", "pos": "adj", "ko": "분명한, 명백한", "fam": "-ent/-ant", "forms": ["evidence", "evidently", "evidential"], "ex": "The connection between smoking and lung disease became evident after decades of careful research.", "sub": 1}, {"w": "export", "pos": "v", "ko": "수출하다, 수출", "fam": "other", "forms": ["exporter", "exportation", "exported"], "ex": "Several African nations export raw minerals while importing the finished goods manufactured from them.", "sub": 1}, {"w": "factor", "pos": "n", "ko": "요인, 요소", "fam": "-er/-or", "forms": ["factors", "factorial", "factoring"], "ex": "Poverty remains the single most important factor limiting access to higher education worldwide.", "sub": 1}, {"w": "finance", "pos": "n", "ko": "재정, 자금", "fam": "other", "forms": ["financial", "financially", "financier"], "ex": "The ministry of finance published a detailed report on public debt and future taxation.", "sub": 1}, {"w": "formula", "pos": "n", "ko": "공식, 화학식", "fam": "other", "forms": ["formulate", "formulation", "formulas"], "ex": "Students must memorize the chemical formula for each compound discussed in this laboratory manual.", "sub": 1}, {"w": "function", "pos": "n", "ko": "기능, 작용", "fam": "other", "forms": ["functional", "functionally", "malfunction"], "ex": "The primary function of the kidney is to remove waste products from the bloodstream.", "sub": 1}, {"w": "identify", "pos": "v", "ko": "확인하다, 식별하다", "fam": "-ify", "forms": ["identification", "identity", "identifiable", "identical"], "ex": "Biologists identify species by comparing genetic sequences rather than relying on outward appearance alone.", "sub": 1}, {"w": "income", "pos": "n", "ko": "소득, 수입", "fam": "other", "forms": ["incomes", "low-income"], "ex": "Families with a low annual income spend a far larger proportion of it on food.", "sub": 1}, {"w": "indicate", "pos": "v", "ko": "나타내다, 가리키다", "fam": "-ate", "forms": ["indication", "indicator", "indicative"], "ex": "Recent findings indicate that early childhood nutrition strongly influences later academic performance.", "sub": 1}, {"w": "individual", "pos": "adj", "ko": "개인의, 개별의", "fam": "-al/-ical", "forms": ["individually", "individualism", "individuality"], "ex": "Each individual student receives written feedback describing specific strengths and remaining weaknesses.", "sub": 1}, {"w": "interpret", "pos": "v", "ko": "해석하다, 통역하다", "fam": "other", "forms": ["interpretation", "interpreter", "interpretive"], "ex": "Archaeologists interpret ancient burial sites in light of what surviving written records reveal.", "sub": 1}, {"w": "involve", "pos": "v", "ko": "포함하다, 관련시키다", "fam": "other", "forms": ["involvement", "involved", "involving"], "ex": "The experiment will involve two hundred volunteers drawn from three quite different age groups.", "sub": 1}, {"w": "issue", "pos": "n", "ko": "문제, 사안", "fam": "other", "forms": ["issues", "issued", "issuance"], "ex": "Water scarcity has become a pressing political issue throughout the Middle East in recent decades.", "sub": 1} /* ---------- speech synthesis ---------- */
const TTS = {
  voices: [],
  load(){ this.voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); },
  pickVoice(gender){
    const pref = gender==='M' ? settings.voiceM : settings.voiceW;
    if (pref){ const v=this.voices.find(v=>v.name===pref); if (v) return v; }
    const maleNames = /alex|daniel|fred|aaron|evan|tom|arthur|oliver|male|guy|david|mark/i;
    const femaleNames = /samantha|karen|moira|ava|allison|zoe|nicky|susan|female|zira|jenny|aria|google us english|google uk english female/i;
    const us = this.voices.filter(v=>/en[-_]US/i.test(v.lang));
    const pool = us.length? us : this.voices;
    const rx = gender==='M'? maleNames : femaleNames;
    return pool.find(v=>rx.test(v.name)) || this.voices.find(v=>rx.test(v.name)) || pool[0] || this.voices[0] || null;
  },
  speakOne(text, gender, opts){
    return new Promise(res=>{
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pickVoice(gender); if (v) u.voice = v;
      u.rate = opts.rate ?? settings.rate; u.pitch = v && /alex|daniel|fred|aaron|evan|tom|arthur|oliver|male|guy|david|mark/i.test(v.name) ? 1 : (gender==='M'? 0.8 : 1.05);
      u.lang = 'en-US';
      let done=false; const finish=()=>{ if(!done){done=true;res();} };
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
      setTimeout(finish, Math.max(3000, text.length*110/u.rate));
    });
  },
  async speak(text, gender='W', opts={}){
    if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성 합성을 지원하지 않는다. Chrome 또는 Safari를 사용.'); return; }
    // Chrome cuts long utterances after about 15 seconds, so speak sentence by sentence.
    const parts = text.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [text];
    for (const part of parts){ if (this.cancelled) return; const t=part.trim(); if (t) await this.speakOne(t, gender, opts); }
  },
  async speakTurns(turns, onProgress){
    for (let i=0;i<turns.length;i++){ if (this.cancelled) break; onProgress && onProgress(i, turns.length); await this.speak(turns[i].text, turns[i].speaker); await wait(350); }
  },
  stop(){ this.cancelled=true; speechSynthesis.cancel(); setTimeout(()=>this.cancelled=false, 50); }
};
if ('speechSynthesis' in window){ TTS.load(); speechSynthesis.onvoiceschanged = ()=>TTS.load(); }
const wait = ms => new Promise(r=>setTimeout(r,ms));
function beep(freq=880, ms=180){ try{ const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)()); const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=freq; g.gain.value=0.15; o.connect(g); g.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(), ms);}catch(e){} }

/* ---------- recorder ---------- */
const REC = {
  stream:null,
  async ensure(){ if (this.stream) return true; try{ this.stream = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }catch(e){ alert('마이크 권한이 필요하다. 브라우저 주소창의 권한 설정에서 마이크를 허용한 뒤 다시 시도.'); return false; } },
  record(seconds, onTick, ctrl={}){
    return new Promise(async res=>{
      if (!(await this.ensure())) return res({blob:null, text:''});
      const chunks=[]; let mr;
      try { mr = new MediaRecorder(this.stream); } catch(e){ return res({blob:null,text:''}); }
      mr.ondataavailable = e=>{ if (e.data.size) chunks.push(e.data); };
      let recog=null, text='';
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR){ try{ recog = new SR(); recog.lang='en-US'; recog.continuous=true; recog.interimResults=false; recog.onresult = e=>{ for (let i=e.resultIndex;i<e.results.length;i++){ if (e.results[i].isFinal) text += ' ' + e.results[i][0].transcript; } }; recog.onerror=()=>{}; recog.start(); }catch(e){ recog=null; } }
      let left=seconds; onTick && onTick(left);
      const iv = setInterval(()=>{ left--; onTick && onTick(left); if (left<=0) stop(); },1000);
      let stopped=false;
      const stop = ()=>{ if (stopped) return; stopped=true; clearInterval(iv); try{ mr.stop(); }catch(e){} if (recog){ try{ recog.stop(); }catch(e){} } };
      ctrl.stop = stop;
      mr.onstop = async ()=>{ await wait(600); const blob = new Blob(chunks, {type: mr.mimeType||'audio/webm'}); res({blob, text:text.trim()}); };
      mr.start();
    });
  }
};

/* ---------- timer ---------- */
function makeTimer(seconds, node, onEnd){
  let left=seconds, iv=null, paused=false;
  const draw=()=>{ node.textContent = fmt(Math.max(0,left)); node.classList.toggle('low', left<=60); };
  draw();
  const t = {
    start(){ if (iv) return; iv=setInterval(()=>{ if (paused) return; left--; draw(); if (left<=0){ t.stop(); onEnd && onEnd(); } },1000); },
    stop(){ clearInterval(iv); iv=null; },
    pause(){ paused=true; }, resume(){ paused=false; },
    left(){ return left; }, used(){ return seconds-left; }
  };
  return t;
}

/* ---------- MCQ helper ---------- */
function renderQuestions(questions, opts, prefixId){
  const wrap = el('div');
  const groups = questions.map((q,qi)=>{
    const name = `${prefixId}-q${qi}`;
    const qn = el('div',{class:'q'});
    qn.append(el('div',{class:'stem'}, `${qi+1}. ${q.stem}`));
    const opts_ = q.options.map((o,oi)=>{
      const inp = el('input',{type:'radio',name,value:oi});
      const lab = el('label',{class:'opt'}, inp, el('span',{}, `${LETTERS[oi]}. ${o}`));
      return lab;
    });
    opts_.forEach(o=>qn.append(o));
    wrap.append(qn);
    return {q, qn, opts_, name};
  });
  return {
    node: wrap,
    grade(){
      let correct=0; const details=[];
      groups.forEach(g=>{
        const sel = wrap.querySelector(`input[name="${g.name}"]:checked`);
        const chosen = sel? +sel.value : null;
        const ok = chosen===g.q.answer; if (ok) correct++;
        details.push({chosen, answer:g.q.answer, ok});
        g.opts_.forEach((o,oi)=>{ o.querySelector('input').disabled=true; if (oi===g.q.answer) o.classList.add('correct'); else if (oi===chosen) o.classList.add('wrong'); });
        if (g.q.explain_ko) g.qn.append(el('div',{class:'explain'}, (ok?'정답. ':'오답. 정답은 '+LETTERS[g.q.answer]+'. ')+g.q.explain_ko));
      });
      return {correct, total:groups.length, details};
    },
    answered(){ return groups.filter(g=>wrap.querySelector(`input[name="${g.name}"]:checked`)).length; }
  };
}

function taskCTW(item, opts){
  const node = el('div');
  node.append(el('div',{class:'sub'}, `Complete the Words · ${item.topic}`));
  node.append(el('p',{class:'small'}, '문단을 읽고 잘려 나간 단어의 뒷부분을 입력. 앞부분은 주어져 있다. (실제 시험: 문단당 10개, 약 90초)'));
  const p = el('div',{class:'passage'});
  const inputs=[];
  const re=/([A-Za-z'-]+)\{([A-Za-z'-]+)\}/g; let last=0, m;
  while((m=re.exec(item.text))){
    p.append(document.createTextNode(item.text.slice(last, m.index)));
    const inp = el('input',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false',size:Math.max(3,m[2].length), 'aria-label':'missing letters'});
    inp.style.width = (m[2].length*0.72+0.6)+'em';
    inputs.push({inp, hidden:m[2], shown:m[1]});
    p.append(el('span',{class:'gap'}, m[1], inp));
    last = re.lastIndex;
  }
  p.append(document.createTextNode(item.text.slice(last)));
  node.append(p);
  inputs.forEach((g,i)=>{ g.inp.addEventListener('keydown',e=>{ if (e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){ if (inputs[i+1]){ e.preventDefault(); inputs[i+1].inp.focus(); } } }); });
  return {
    node, kind:'reading', label:`Complete the Words: ${item.topic}`,
    grade(){ let c=0; inputs.forEach(g=>{ const ok = norm(g.inp.value)===norm(g.hidden); if (ok) c++; g.inp.disabled=true; g.inp.classList.add(ok?'ok':'ng'); if(!ok) g.inp.parentNode.append(el('span',{class:'ans'}, `→ ${g.shown}${g.hidden}`)); }); return {correct:c,total:inputs.length}; }
  };
}

function audioPanel(turns, opts, label){
  // turns: [{speaker,text}]
  const st = el('span',{class:'st'}, label||'재생 준비');
  const bar = el('i');
  const btn = el('button',{class:'btn'}, '▶ 재생');
  let plays=0, playing=false;
  const panel = el('div',{class:'audio'}, btn, el('div',{class:'wave'}, bar), st);
  const api = { node:panel, onEnd:null, played:false };
  btn.addEventListener('click', async ()=>{
    if (playing) return;
    if (!opts.practice && plays>=1) return;
    playing=true; plays++; btn.disabled=true; st.textContent='재생 중';
    await TTS.speakTurns(turns, (i,n)=>{ bar.style.width = Math.round(((i+1)/n)*100)+'%'; });
    bar.style.width='100%'; playing=false; api.played=true;
    st.textContent = opts.practice? '재생 완료 (연습 모드: 다시 들을 수 있음)' : '재생 완료 (실전: 1회만)';
    if (opts.practice) btn.disabled=false; else btn.textContent='재생됨';
    api.onEnd && api.onEnd();
  });
  api.stop = ()=>TTS.stop();
  return api;
}

      order.forEach((ci,pos)=>{ ans.append(el('span',{class:'chunk', onclick:()=>{ if (locked) return; order.splice(pos,1); render(); }}, it.chunks[ci])); });
      const remaining = shuffled.filter(ci=>!order.includes(ci));

function similarity(a,b){
  const A=norm(a).split(' ').filter(Boolean), B=norm(b).split(' ').filter(Boolean);
  if (!A.length||!B.length) return 0;
  const m = new Map(); B.forEach(w=>m.set(w,(m.get(w)||0)+1));
  let hit=0; A.forEach(w=>{ if (m.get(w)>0){ hit++; m.set(w,m.get(w)-1);} });
  return hit/Math.max(A.length,B.length);
}

function taskListenRepeat(set, opts){
  const node = el('div');
  node.append(el('div',{class:'sub'}, 'Listen and Repeat · 7문장'));
  node.append(el('p',{class:'small'}, '문장을 한 번 듣고 삐 소리 뒤 10초 안에 들은 대로 말한다. 문장은 화면에 나오지 않는다. 마이크 권한 필요. 자동 전사가 되는 브라우저(Chrome, Safari)에서는 일치율을 계산한다.'));
  const status = el('div',{class:'tile'}, el('div',{class:'big'}, '준비'), el('div',{class:'lab'}, '시작을 누르면 7문장이 연속 진행된다'));
  const start = el('button',{class:'btn'}, '▶ 시작');
  const stopBtn = el('button',{class:'btn sec'}, '이 문장 답변 끝');
  stopBtn.disabled=true;
  node.append(el('div',{class:'row mt'}, start, stopBtn), el('div',{class:'mt'}, status));
  const review = el('div',{class:'mt hidden'});
  node.append(review);
  const results=[]; let done=false;
  start.addEventListener('click', async ()=>{
    if (!(await REC.ensure())) return; start.disabled=true;
    for (let i=0;i<set.sentences.length;i++){
      const s = set.sentences[i];
      status.innerHTML=''; status.append(el('div',{class:'big'}, `문장 ${i+1} / 7`), el('div',{class:'lab'}, '듣는 중'));
      await TTS.speak(s, i%2? 'M':'W'); await wait(250); beep();
      const ctrl={};
      stopBtn.disabled=false; stopBtn.onclick=()=>ctrl.stop&&ctrl.stop();
      const r = await REC.record(10, left=>{ status.innerHTML=''; status.append(el('div',{class:'big rec'}, el('i',{class:'dot'}), ` ${left}s`), el('div',{class:'lab'}, `문장 ${i+1} 따라 말하기`)); }, ctrl);
      stopBtn.disabled=true;
      results.push({sentence:s, blob:r.blob, text:r.text});
      await wait(400);
    }
    done=true; status.innerHTML=''; status.append(el('div',{class:'big'}, '완료'), el('div',{class:'lab'}, '아래에서 내 녹음과 원문을 비교'));
    review.classList.remove('hidden');

const VOCAB = (BANK.vocab||[]).slice();
const FAMS = ['-tion/-sion','-ment','-ity','-ness','-ance/-ence','-al/-ical','-ive','-ous','-able/-ible','-ly','-ate','-ize','-ify','-er/-or','-ism','-ent/-ant','other'];
const INTERVALS = [0,1,2,4,8,16,32];
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
const vstate = { get(){ return store.get('vocab',{}); }, set(v){ store.set('vocab',v); } };
function vinfo(st,w){ return st[w] || {box:0,due:null,seen:0,wrong:0}; }
function vGrade(w, ok){
  const st=vstate.get(); const r=vinfo(st,w); r.seen++;
  if (ok){ r.box=Math.min(6,(r.box||0)+1); r.due=addDays(today(), INTERVALS[r.box]); }
  else { r.box=0; r.wrong++; r.due=today(); }
  st[w]=r; vstate.set(st);
}
function vStats(){
  const st=vstate.get(); const t=today();
  const studied = VOCAB.filter(x=>st[x.w]); const due = studied.filter(x=>st[x.w].due && st[x.w].due<=t);
  const newLeft = VOCAB.filter(x=>!st[x.w]);
  const boxes=[0,0,0,0,0,0,0]; studied.forEach(x=>boxes[Math.min(6,st[x.w].box||0)]++);
  return {studied, due, newLeft, boxes, mastered: studied.filter(x=>(st[x.w].box||0)>=4).length};
}
function hlWord(ex, w){
  const re = new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
  const m = ex.match(re); if (!m) return el('span',{}, ex);
  return el('span',{}, ex.slice(0,m.index), el('b',{}, m[1]), ex.slice(m.index+m[1].length));
}
function famExplain(f){ return {'-tion/-sion':'동사 → 명사 (행위·결과). 관사 뒤, 동사 앞 자리.','-ment':'동사 → 명사. the ~ment of 꼴이 흔함.','-ity':'형용사 → 추상명사.','-ness':'형용사 → 상태 명사.','-ance/-ence':'동사 → 명사. -ant/-ent 형용사와 짝.','-al/-ical':'명사 → 형용사. 명사 앞 또는 be 뒤.','-ive':'동사 → 형용사 (성질).','-ous':'명사 → 형용사 (가득한).','-able/-ible':'동사 → 형용사 (가능). -able이 다수, 라틴 어근은 -ible.','-ly':'형용사 → 부사. 동사·형용사·문장 앞.','-ate':'동사(또는 형용사). 조동사·to 뒤.','-ize':'명사·형용사 → 동사 (되게 하다).','-ify':'동사 (만들다).','-er/-or':'행위자 명사.','-ism':'사상·체계 명사.','-ent/-ant':'형용사 또는 행위자 명사. -ence/-ance 명사와 짝.','other':'접미사 규칙이 없는 기본어. 그대로 외운다.'}[f]||''; }

function runCards(queue, area, onDone){
  let i=0, again=[]; const total=queue.length; let known=0;
  const prog = el('div',{class:'progress'}, el('i',{style:'width:0%'}));
  const holder = el('div');
  area.innerHTML=''; area.append(prog, holder);
  const show=()=>{
    if (i>=queue.length){
      if (again.length){ queue=again; again=[]; i=0; holder.innerHTML=''; holder.append(el('div',{class:'notice'}, `몰랐던 ${queue.length}개를 다시 본다.`)); setTimeout(show,900); return; }
      holder.innerHTML=''; holder.append(el('div',{class:'result good'}, `세션 완료. ${total}장 중 첫 시도에 ${known}장 알았다.`), el('button',{class:'btn mt', onclick:onDone}, '돌아가기')); return;
    }
    const x=queue[i]; prog.firstChild.style.width=Math.round((i/queue.length)*100)+'%';
    const card = el('div',{class:'flash'});
    const st=vstate.get(); const inf=vinfo(st,x.w);
    card.append(el('div',{class:'pos'}, `${x.pos} · ${x.fam} · AWL ${x.sub} · ${inf.seen? '복습 '+inf.seen+'회' : '새 단어'}`));
    card.append(el('div',{class:'word'}, x.w));
    const back = el('div',{class:'hidden'});
    back.append(el('div',{class:'ko'}, x.ko));
    if (x.forms&&x.forms.length) back.append(el('div',{class:'forms'}, '파생: '+x.forms.join(', ')));
    back.append(el('div',{class:'ex'}, hlWord(x.ex, x.w)));
    card.append(back);
    const flip = el('button',{class:'btn sec'}, '뜻 보기');
    const spk = el('button',{class:'btn ghost', onclick:()=>TTS.speak(x.w,'W',{rate:0.9})}, '🔊');
    const yes = el('button',{class:'btn hidden'}, '알아요');
    const no = el('button',{class:'btn sec hidden'}, '몰라요');
    flip.onclick=()=>{ back.classList.remove('hidden'); flip.classList.add('hidden'); yes.classList.remove('hidden'); no.classList.remove('hidden'); };
    yes.onclick=()=>{ vGrade(x.w,true); if (!x._again) known++; i++; show(); };
    no.onclick=()=>{ vGrade(x.w,false); x._again=true; again.push(x); i++; show(); };
    card.append(el('div',{class:'row',style:'justify-content:center;margin-top:8px'}, spk, flip, no, yes));
    holder.innerHTML=''; holder.append(card, el('p',{class:'small center mt'}, `${i+1} / ${queue.length}`));
    const key=e=>{ if (e.key===' '&&!flip.classList.contains('hidden')){ e.preventDefault(); flip.click(); } else if (e.key==='1'&&!no.classList.contains('hidden')) no.click(); else if (e.key==='2'&&!yes.classList.contains('hidden')) yes.click(); };
    document.onkeydown=key;
  };
  show();
}

function sectionSummary(kind, results){
  if (kind==='reading'||kind==='listening'){
    const c = results.reduce((a,r)=>a+r.correct,0), t = results.reduce((a,r)=>a+r.total,0);
    const p = t? c/t : 0; return {raw:`${c}/${t}`, pct:p, band:pctToBand(p)};
  }
  if (kind==='writing'){
    const bs = results.find(r=>!r.self); const selfs = results.filter(r=>r.self);
    const bsP = bs? bs.correct/bs.total : 0; const selfP = selfs.length? selfs.reduce((a,r)=>a+r.correct,0)/selfs.length : 0;
    const p = bs? bsP*0.4 + selfP*0.6 : selfP; return {raw:`문장 ${bs? bs.correct+'/'+bs.total : '-'} · 자기채점 ${Math.round(selfP*100)}%`, pct:p, band:pctToBand(p)};
  }
  if (kind==='speaking'){
    const done = results.filter(r=>!r.skipped); const p = done.length? done.reduce((a,r)=>a+r.correct,0)/done.length : 0;
    return {raw: done.length? `자기채점 ${Math.round(p*100)}%` : '미실시', pct:p, band: done.length? pctToBand(p) : null};
  }
}

  const s = el('div',{class:'card'}, el('h2',{}, '설정'));
  const voices = TTS.voices;
  const mkSel = (key, label)=>{ const sel=el('select'); sel.append(el('option',{value:''}, '자동')); voices.forEach(v=>sel.append(el('option',{value:v.name, selected: settings[key]===v.name? '' : null}, `${v.name} (${v.lang})`))); sel.onchange=()=>{ settings[key]=sel.value; saveSettings(); }; return el('div',{class:'row mt'}, el('span',{style:'width:120px'}, label), sel, el('button',{class:'btn ghost', onclick:()=>TTS.speak('This is a sample sentence for the listening section.', key==='voiceM'?'M':'W')}, '들어보기')); };
  s.append(mkSel('voiceW','여성 화자 음성'), mkSel('voiceM','남성 화자 음성'));
  const rate = el('input',{type:'range',min:'0.8',max:'1.2',step:'0.05',value:settings.rate}); const rl = el('span',{}, `속도 ${settings.rate}`);
  rate.oninput=()=>{ settings.rate=+rate.value; rl.textContent=`속도 ${settings.rate}`; saveSettings(); };
  s.append(el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '재생 속도'), rate, rl));
  const d1 = el('input',{type:'date',value:settings.test1}); d1.onchange=()=>{ settings.test1=d1.value; saveSettings(); };
  const d2 = el('input',{type:'date',value:settings.test2}); d2.onchange=()=>{ settings.test2=d2.value; saveSettings(); };
  s.append(el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '1차 시험일'), d1), el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '2차 시험일'), d2));
  s.append(el('p',{class:'small mt'}, voices.length? `영어 음성 ${voices.length}개 감지됨.` : '영어 음성이 아직 로드되지 않았다. 탭을 다시 열거나 시스템 음성을 설치.'));
  root.append(s);
};

go(location.hash==='#full'?'full':'home');
</script>
