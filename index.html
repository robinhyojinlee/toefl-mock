function practiceCard(task){
  const card = el('div',{class:'card'});
  card.append(task.node);
  const res = el('div');
  const btn = el('button',{class:'btn mt', onclick:()=>{ const r=task.grade(); btn.disabled=true; if (r.self){ res.append(el('div',{class:'result mid'}, r.words!=null? `${r.words} words 작성. 루브릭에 체크한 뒤 모범 답안과 비교.` : '위 루브릭으로 자기 평가.')); } else { const p=r.correct/r.total; res.append(el('div',{class:'result '+(p>=0.85?'good':p>=0.65?'mid':'poor')}, `${r.correct} / ${r.total} 정답 (${Math.round(p*100)}%) · 추정 밴드 ${pctToBand(p).toFixed(1)}`)); } markDone(task.label); }}, task.kind==='speaking'? '자기 평가 반영' : task.kind==='writing' && task.reveal ? '제출하고 모범 답안 보기' : '채점');
  card.append(btn, res);
  return card;
}
function markDone(label){ const d=store.get('done',{}); d[label]=new Date().toISOString().slice(0,10); store.set('done',d); }

function sectionView(kind, title, desc, builders){
  const done = store.get('done',{});
  root.append(el('div',{class:'card'}, el('h2',{}, title), el('p',{class:'sub'}, desc)));
  const menu = el('div',{class:'menu'});
  const area = el('div');
  builders.forEach(b=>{
    const btn = el('button',{class: done[b.label]? 'done':'', onclick:()=>{ TTS.stop(); area.innerHTML=''; const t=b.make({practice:true}); area.append(practiceCard(t)); area.scrollIntoView({behavior:'smooth'}); }}, el('b',{}, b.type), b.label + (done[b.label]? ` · ${done[b.label]}` : ''));
    menu.append(btn);
  });
  root.append(el('div',{class:'card'}, menu), area);
}

    el('button',{class:rmode==='vocab'?'active':'', onclick:()=>{ store.set('readingMode','vocab'); go('reading'); }}, '단어 공부 (AWL 570)'),
    el('button',{class:rmode==='items'?'active':'', onclick:()=>{ store.set('readingMode','items'); go('reading'); }}, '문항 연습'));
  root.append(el('div',{class:'card'}, el('h2',{}, 'Reading'), el('p',{class:'sub'}, '어휘가 Reading 점수의 절반이다. Complete the Words는 형태와 철자까지 맞아야 1점. 단어 공부는 접미사 묶음 + 간격 반복 + 빈칸 드릴 세 가지로 돈다.'), bar));
  if (rmode==='vocab'){ root.append(el('div',{class:'card'}, vocabPanel())); return; }
  const B=[];

  BANK.reading.daily_life.forEach(it=>B.push({type:'Read in Daily Life', label:`Read in Daily Life: ${it.title||it.kind}`, make:o=>taskReadMCQ(it,o,'Read in Daily Life · '+it.kind)}));
  BANK.reading.academic.forEach(it=>B.push({type:'Academic Passage', label:`Academic Passage: ${it.title}`, make:o=>taskReadMCQ(it,o,'Read an Academic Passage · 5문항')}));
  sectionView('reading','문항 연습','Complete the Words는 품사 자리를 먼저 판단하고 접미사로 복원. Academic은 문단마다 한 문장 요약. 정답률 85%가 밴드 5.5 선.',B);
};
VIEWS.listening = ()=>{
  const B=[];
  B.push({type:'Choose a Response', label:'Listen and Choose a Response', make:o=>taskChooseResponse(BANK.listening.choose_response,o)});

  BANK.listening.announcements.forEach(it=>B.push({type:'Announcement', label:`Announcement: ${it.context}`, make:o=>taskListenMCQ(it,o,'Listen to an Announcement · 2문항')}));
  BANK.listening.talks.forEach(it=>B.push({type:'Academic Talk', label:`Academic Talk: ${it.subject}`, make:o=>taskListenMCQ(it,o,'Listen to an Academic Talk · 5문항')}));
  sectionView('listening','Listening 연습','첫 두 문장에서 주제와 목적을 잡는다. Choose a Response는 발화의 기능(요청·제안·사과·확인)을 분류. 연습 모드는 반복 재생 가능, 실전은 1회.',B);
};
VIEWS.writing = ()=>{
  const B=[];
  B.push({type:'Build a Sentence', label:'Build a Sentence', make:o=>taskBuildSentence(BANK.sw.build_sentence,o)});
  BANK.sw.emails.forEach((it,i)=>B.push({type:'Write an Email', label:`Email ${i+1}: ${it.recipient}`, make:o=>withTimer(taskEmail(it,o), 7*60)}));
  BANK.sw.academic_discussion.forEach(it=>B.push({type:'Academic Discussion', label:`Discussion: ${it.course}`, make:o=>withTimer(taskDiscussion(it,o), 10*60)}));
  sectionView('writing','Writing 연습','이메일은 4문단 템플릿(인사+목적 / 상황 / 요청 / 마무리)을 7분 안에. 토론 응답은 입장 → 동료 언급 → 이유 하나를 예시로 깊게.',B);
};
VIEWS.speaking = ()=>{
  const B=[];
  BANK.sw.listen_repeat.forEach((it,i)=>B.push({type:'Listen and Repeat', label:`Listen and Repeat 세트 ${i+1}`, make:o=>taskListenRepeat(it,o)}));
  BANK.sw.interviews.forEach(it=>B.push({type:'Take an Interview', label:`Interview: ${it.topic}`, make:o=>taskInterview(it,o)}));
  sectionView('speaking','Speaking 연습','Listen and Repeat은 의미 단위 3~4개로 기억. Interview는 45초 약 100단어, 첫 문장 패턴을 자동화. 녹음을 전사해 문법 오류를 표시하고 같은 문항을 재녹음.',B);
};

function withTimer(task, seconds){
  const tnode = el('span',{class:'timer'});
  const bar = el('div',{class:'row'}, el('span',{class:'small'}, '타이머'), tnode, el('button',{class:'btn ghost', onclick:()=>{ t.start(); }}, '시작'));
  const t = makeTimer(seconds, tnode, ()=>{ beep(440,400); alert('시간 종료. 제출하고 모범 답안과 비교.'); });
  const wrap = el('div', {}, bar, task.node);
  const origGrade = task.grade.bind(task);
  return Object.assign(task, {node:wrap, grade(){ t.stop(); return origGrade(); }});
}


VIEWS.guide = ()=>{
  const tpl = document.getElementById('guide');
  const body = el('div',{class:'card guide'});
  body.append(tpl.content.cloneNode(true));
  body.querySelectorAll('table').forEach(t=>{ const w=el('div',{class:'tablewrap'}); t.replaceWith(w); w.append(t); });
  const toc = el('nav',{class:'card toc'});
  body.querySelectorAll('h2').forEach((h,i)=>{ h.id='g'+i; toc.append(el('a',{href:'#g'+i, onclick:e=>{ e.preventDefault(); h.scrollIntoView({behavior:'smooth',block:'start'}); }}, h.textContent)); });
  toc.append(el('a',{href:'#', onclick:e=>{ e.preventDefault(); go('full'); }}, '→ 풀 모의고사로'));
  root.append(el('div',{class:'guidewrap'}, toc, body));
};

/* ---------- full test ---------- */
VIEWS.full = ()=>{
  root.append(el('div',{class:'card'},
    el('h2',{}, '풀 모의고사'),
    el('p',{class:'sub'}, 'Reading 30분 → Listening 22분 → Writing 24분(7+7+10) → Speaking 약 8분. 중간에 멈추지 않고 통으로 본다. 듣기는 1회 재생. 끝나면 밴드 추정을 기록에 저장한다.'),
    el('div',{class:'notice'}, '시작 전: 헤드폰 착용, 마이크 권한 허용, 조용한 공간, 종이와 펜. 약 85분 확보.'),
    el('div',{class:'row mt'}, el('button',{class:'btn', onclick:startFull}, '시작'), el('button',{class:'btn sec', onclick:()=>go('home')}, '돌아가기'))
  ));
};

function startFull(){
  const o={practice:false};
  const R = BANK.reading, L=BANK.listening, S=BANK.sw;
  const sections = [
    {kind:'reading', title:'Reading', seconds:30*60, make:()=>[
      ...R.complete_the_words.map(it=>taskCTW(it,o)),
      ...R.daily_life.map(it=>taskReadMCQ(it,o,'Read in Daily Life · '+it.kind)),
      ...R.academic.map(it=>taskReadMCQ(it,o,'Read an Academic Passage · 5문항'))
    ]},
    {kind:'listening', title:'Listening', seconds:22*60, make:()=>[
      taskChooseResponse(L.choose_response,o),
      ...L.conversations.map(it=>taskListenMCQ(it,o,'Listen to a Conversation · 2문항')),
      ...L.announcements.map(it=>taskListenMCQ(it,o,'Listen to an Announcement · 2문항')),
      ...L.talks.map(it=>taskListenMCQ(it,o,'Listen to an Academic Talk · 5문항'))
    ]},
    {kind:'writing', title:'Writing', seconds:24*60, make:()=>[
      taskBuildSentence(pick(S.build_sentence,10),o),
      taskEmail(pick(S.emails,1)[0],o),
      taskDiscussion(pick(S.academic_discussion,1)[0],o)
    ]},
    {kind:'speaking', title:'Speaking', seconds:12*60, make:()=>[
      taskListenRepeat(pick(S.listen_repeat,1)[0],o),
      taskInterview(pick(S.interviews,1)[0],o)
    ]}
  ];
  const report = {date:new Date().toISOString().slice(0,10), sections:{}};
  let idx=0;
  const runSection = ()=>{
    root.innerHTML=''; TTS.stop();
    if (idx>=sections.length) return finish();
    const sec = sections[idx]; const tasks = sec.make();
    const tnode = el('span',{class:'timer'});
    const head = el('div',{class:'card',style:'position:sticky;top:58px;z-index:10'}, el('div',{class:'row'}, el('h2',{style:'margin:0'}, `${idx+1}/4 ${sec.title}`), el('span',{class:'tag'}, sec.kind==='listening'?'1회 재생':sec.kind==='speaking'?'녹음':'실전'), el('span',{style:'margin-left:auto'}, tnode)));
    root.append(head);
    tasks.forEach((t,i)=>root.append(el('div',{class:'card'}, el('div',{class:'small'}, `Task ${i+1} / ${tasks.length}`), t.node)));
    const endSection = ()=>{
      timer.stop(); TTS.stop();
      const results = tasks.map(t=>t.grade());
      report.sections[sec.kind] = Object.assign({title:sec.title, used:timer.used()}, sectionSummary(sec.kind, results));
      idx++; runSection();
    };
    const timer = makeTimer(sec.seconds, tnode, ()=>{ beep(440,500); endSection(); });
    timer.start();
    root.append(el('div',{class:'card center'}, el('button',{class:'btn', onclick:()=>{ if (confirm(`${sec.title} 영역을 끝내고 다음으로 넘어갈까?`)) endSection(); }}, idx<3? '이 영역 제출 → 다음 영역' : '제출하고 결과 보기')));
  };
  const finish = ()=>{
    const bands = Object.values(report.sections).map(s=>s.band).filter(b=>b!=null);
    const overall = bands.length? roundHalf(bands.reduce((a,b)=>a+b,0)/bands.length) : 0;
    report.overall = overall;
    const hist = store.get('history',[]); hist.push({date:report.date, overall, bands:Object.fromEntries(Object.entries(report.sections).map(([k,v])=>[k,v.band]))}); store.set('history',hist);
    root.innerHTML='';
    const card = el('div',{class:'card'}, el('h2',{}, '결과'), el('div',{class:'row'}, el('span',{class:'band'}, overall.toFixed(1)), el('span',{class:'sub'}, `추정 총점 밴드 · 구 척도 약 ${bandToOld[overall]||'-'} · 목표 5.5`)));
    const tb = el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'영역'), el('th',{},'원점수'), el('th',{},'추정 밴드'), el('th',{},'사용 시간'))), el('tbody',{}, ...Object.values(report.sections).map(s=>el('tr',{}, el('td',{},s.title), el('td',{},s.raw), el('td',{}, s.band!=null? s.band.toFixed(1) : '-'), el('td',{}, fmt(s.used))))));
    card.append(el('div',{class:'mt'}, tb));
    const gap = 5.5 - overall;
    card.append(el('div',{class:'result '+(overall>=5.5?'good':overall>=4.5?'mid':'poor')}, overall>=5.5? '목표선 도달. 실전에서 1단계 정확도만 유지하면 된다.' : `목표까지 ${gap.toFixed(1)} 밴드. 가장 낮은 영역에 이번 주 학습의 70%를 배정.`));
    card.append(el('p',{class:'small mt'}, 'Speaking·Writing 밴드는 자기 채점 기준의 추정값. 녹음 전사와 에세이를 Claude에 붙여 실제 피드백을 받을 것. 위 채점 화면은 뒤로 가기로 돌아갈 수 없으니 필요하면 지금 캡처.'));
    card.append(el('div',{class:'row mt'}, el('button',{class:'btn', onclick:()=>go('history')}, '기록 보기'), el('button',{class:'btn sec', onclick:()=>go('home')}, '홈')));
    root.append(card);
  };
  runSection();
}

/* ---------- history & settings ---------- */
VIEWS.history = ()=>{
  const hist = store.get('history',[]);
  const card = el('div',{class:'card'}, el('h2',{}, '모의고사 기록'));
  if (!hist.length) card.append(el('p',{class:'sub'}, '아직 기록 없음. 풀 모의고사를 마치면 여기에 쌓인다.'));
  else {
    card.append(el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'날짜'), el('th',{},'총점'), el('th',{},'R'), el('th',{},'L'), el('th',{},'W'), el('th',{},'S'))), el('tbody',{}, ...hist.map(h=>el('tr',{}, el('td',{},h.date), el('td',{}, el('b',{}, h.overall.toFixed(1))), ...['reading','listening','writing','speaking'].map(k=>el('td',{}, h.bands[k]!=null? h.bands[k].toFixed(1) : '-')))))));
    card.append(el('button',{class:'btn ghost mt', onclick:()=>{ if (confirm('기록을 모두 지울까?')){ store.set('history',[]); go('history'); } }}, '기록 초기화'));
  }
  root.append(card);
  const done = store.get('done',{});
  root.append(el('div',{class:'card'}, el('h2',{}, '연습 완료 항목'), el('p',{class:'sub'}, `${Object.keys(done).length}개 완료`), el('button',{class:'btn ghost', onclick:()=>{ store.set('done',{}); go('history'); }}, '완료 표시 초기화')));
  // settings
  const s = el('div',{class:'card'}, el('h2',{}, '설정'));
  const voices = TTS.voices;
  const mkSel = (key, label)=>{ const sel=el('select'); sel.append(el('option',{value:''}, '자동')); voices.forEach(v=>sel.append(el('option',{value:v.name, selected: settings[key]===v.name? '' : null}, `${v.name} (${v.lang})`))); sel.onchange=()=>{ settings[key]=sel.value; saveSettings(); }; return el('div',{class:'row mt'}, el('span',{style:'width:120px'}, label), sel, el('button',{class:'btn ghost', onclick:()=>TTS.speak('This is a sample sentence for the listening section.', key==='voiceM'?'M':'W')}, '들어보기')); };
  s.append(mkSel('voiceW','여성 화자 음성'), mkSel('voiceM','남성 화자 음성'));
  const rate = el('input',{type:'range',min:'0.8',max:'1.2',step:'0.05',value:settings.rate}); const rl = el('span',{}, `속도 ${settings.rate}`);
  rate.oninput=()=>{ settings.rate=+rate.value; rl.textContent=`속도 ${settings.rate}`; saveSettings(); };
  s.append(el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '재생 속도'), rate, rl));
  const d1 = el('input',{type:'date',value:settings.test1}); d1.onchange=()=>{ settings.test1=d1.value; saveSettings(); };
  const d2 = el('input',{type:'date',value:settings.test2}); d2.onchange=()=>{ settings.test2=d2.value; saveSettings(); };
  s.append(el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '1차 시험일'), d1), el('div',{class:'row mt'}, el('span',{style:'width:120px'}, '2차 시험일'), d2));
  s.append(el('p',{class:'small mt'}, voices.length? `영어 음성 ${voices.length}개 감지됨.` : '영어 음성이 아직 로드되지 않았다. 탭을 다시 열거나 시스템 음성을 설치.'));
  root.append(s);
};

go('home');
