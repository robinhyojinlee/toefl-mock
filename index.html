<script id="bank" type="application/json">{"reading": {"complete_the_words": [{"id": "ctw1", "topic": "Coral reefs and algae", "text": "Coral reefs depend on a partnership between animals and algae. The algae live inside coral tissue and sup{ply} most of the energy the polyps req{uire}. When water temperatures rise, this relati{onship} breaks down and the algae are expe{lled}, leaving the coral pale. Bleached colonies can rec{over} if cooler conditions ret{urn} quickly, but prol{onged} heat usually proves fatal. Because reefs shelter thou{sands} of species, their coll{apse} would reduce marine biodiv{ersity} across entire ocean basins and weaken coastal protection."}, {"id": "ctw2", "topic": "Printing and literacy in Europe", "text": "The spread of printing in fifteenth century Europe changed how knowledge circulated. Manuscripts had been copied by hand, so each volume was expe{nsive} and often contained errors intro{duced} by tired scribes. Printed editions were cheaper and more unif{orm}, which allowed schol{ars} in distant cities to disc{uss} the same page of the same text. Demand for books in local lang{uages} grew steadily, and printers respo{nded} by publishing gram{mars}, almanacs and pamphlets. Within two gener{ations}, literacy had beco{me} an ordinary expectation among urban merchants."}, {"id": "ctw3", "topic": "Ice cores as climate records", "text": "Ice sheets preserve a detailed record of the atmosphere. Snow that falls on Greenland traps tiny bub{bles} of air, and each annual layer is comp{ressed} by the weight of later snowfall. Drilling a core there allows resear{chers} to meas{ure} carbon dioxide concen{trations} from thousands of years ago. Volcanic erup{tions} appear as thin bands of sulfate, which help scientists assign accu{rate} dates to deeper sect{ions}. Because the deepest layers are stret{ched} and folded, however, the oldest part of the record remains diffi{cult} to interpret."}], "daily_life": [{"id": "dl1", "kind": "notice", "title": "Temporary Closure of the Third Floor Reading Room", "text": "The third floor reading room will be closed from Monday, March 9 to Friday, March 20 for ceiling repairs.\nStudy carrels on the second floor will remain open until midnight during this period.\nReserved textbooks normally shelved on the third floor may be collected at the ground floor service desk.\nGroup study rooms must be booked online.", "questions": [{"stem": "Why will the reading room be closed?", "options": ["To install new shelving", "To repair the ceiling", "To add more seats", "To replace the computers"], "answer": 1, "explain_ko": "첫 문장에서 천장 수리 때문에 폐쇄한다고 명시한다. 서가 교체나 좌석 확장은 언급되지 않는다."}, {"stem": "Where can students pick up reserved textbooks during the closure?", "options": ["From the second floor study carrels", "By reserving a group study room online", "At the service desk on the ground floor", "From a cart outside the reading room"], "answer": 2, "explain_ko": "지정 도서는 1층 서비스 데스크에서 받으라고 안내한다. 2층은 열람석만 이용할 수 있다."}]}, {"id": "dl2", "kind": "email", "title": "Water shutoff and laundry room relocation", "text": "From: Daniel Ortiz, Housing Office\nTo: All residents of Maple Hall\nSubject: Water shutoff and laundry room relocation\n\nDear residents,\n\nWater will be shut off in Maple Hall on Thursday, April 16, between 8:00 a.m. and 4:00 p.m. so that the building's aging pipes can be replaced. Please fill a container with drinking water the night before, as no water will be available on any floor during those hours.\n\nThe basement laundry room will stay closed for an additional day while the machines are reconnected. Residents may use the laundry facilities in Birch Hall free of charge on Thursday and Friday; simply show your student card at the entrance.\n\nIf the work finishes early, I will post an update on the lobby bulletin board rather than sending a second email.\n\nDaniel", "questions": [{"stem": "What is the main purpose of this email?", "options": ["To announce a water shutoff and explain temporary laundry arrangements", "To ask residents to help pay for the new pipes", "To tell Maple Hall residents that they must move to Birch Hall", "To remind residents of the rules for using washing machines"], "answer": 0, "explain_ko": "단수 공사 안내와 임시 세탁 시설 이용 방법이 본문의 핵심이다. 비용 부담이나 이사 요구는 없다."}, {"stem": "What does the writer ask residents to do before Thursday?", "options": ["Turn off the taps in their rooms", "Move their laundry to the basement", "Store some drinking water", "Collect a free pass for Birch Hall"], "answer": 2, "explain_ko": "전날 밤에 마실 물을 미리 받아 두라고 요청한다. 공사 시간에는 어느 층에서도 물이 나오지 않는다."}, {"stem": "How will residents find out if the repairs finish ahead of schedule?", "options": ["They will receive a second email from the housing office.", "They will see a notice on the lobby bulletin board.", "They will be told by staff at the Birch Hall entrance.", "They will have to telephone Daniel Ortiz."], "answer": 1, "explain_ko": "작업이 일찍 끝나면 추가 이메일 대신 로비 게시판에 알린다고 했다."}]}, {"id": "dl3", "kind": "message", "title": "Career fair tomorrow", "text": "Jisoo: Are you going to the career fair tomorrow? I heard the engineering firms only stay until noon.\nMarco: I have a lab report due at two, so I was planning to skip it.\nJisoo: Bring your resume anyway. Two companies are taking applications on the spot.\nMarco: Fine. Meet me at the north entrance at nine.", "questions": [{"stem": "Why did Marco plan not to attend the career fair?", "options": ["He has already sent his resume to the firms.", "He believes the engineering firms will not come.", "He has to work at his part time job in the morning.", "He must finish a lab report due that afternoon."], "answer": 3, "explain_ko": "마르코는 두 시에 제출할 실험 보고서 때문에 가지 않을 계획이었다고 말한다."}, {"stem": "What do the two speakers finally agree to do?", "options": ["Apply online instead of attending the fair", "Meet after Marco submits his report", "Meet at the north entrance at nine o'clock", "Print copies of Marco's resume together"], "answer": 2, "explain_ko": "마지막 줄에서 아홉 시에 북쪽 입구에서 만나기로 정한다."}]}, {"id": "dl4", "kind": "schedule", "title": "Volunteer Orientation Schedule, Saturday, October 4", "text": "9:00 Check in at Room 214 and collect a name badge\n9:30 Introduction to the food bank's sorting system\n10:15 Safety training, required before any warehouse shift\n11:00 Choose a weekly time slot with the coordinator\n11:30 Optional tour of the delivery center\nLunch is not provided; the cafeteria closes at eleven on Saturdays.", "questions": [{"stem": "Which part of the orientation is optional?", "options": ["Collecting a name badge", "The safety training", "Choosing a weekly time slot", "The tour of the delivery center"], "answer": 3, "explain_ko": "배송 센터 견학만 선택 사항으로 표시되어 있다. 안전 교육은 필수라고 명시된다."}, {"stem": "What must volunteers do before taking a shift in the warehouse?", "options": ["Buy lunch in the cafeteria", "Complete the safety training", "Visit the delivery center", "Sign in with the coordinator at eleven thirty"], "answer": 1, "explain_ko": "창고 근무 전에 안전 교육을 반드시 이수해야 한다고 적혀 있다."}]}], "academic": [{"id": "ac1", "title": "Seed Dispersal by Ants", "text": "Many plants rely on animals to move their seeds, and in dry woodlands a surprising share of that work is done by ants. Thousands of plant species produce seeds bearing a small, fleshy appendage called an elaiosome, which is rich in fats and amino acids. Foraging ants carry these seeds back to their nests, feed the appendage to their larvae, and then discard the seed itself, usually undamaged, in a refuse chamber or just outside the entrance.\n\nThe arrangement appears to benefit the plant in several ways. Seeds left on the surface are exposed to rodents and to fire, whereas seeds buried a few centimetres below ground survive both. Nest soil is also unusually loose and enriched with nitrogen from discarded food and waste, so seedlings that germinate there often grow faster than their neighbours. Because individual ants travel only a metre or two, however, dispersal distances are short, and populations of ant dispersed plants tend to spread slowly across a landscape.\n\nThat limitation has become important in fragmented habitats. Where forests are divided by roads and farmland, plants that depend on ants cannot readily colonize new patches, and botanists have documented local declines even where suitable soil remains. Invasive ants complicate the picture further: some aggressive species drive out native dispersers but handle seeds carelessly, stripping the elaiosome where the seed lies rather than carrying it away. The seed then receives no burial and no fertile soil. Studies of such invasions provide a useful reminder that a mutualism is not simply a service performed by any available partner, but a relationship tuned to the behaviour of particular species.", "questions": [{"type": "vocabulary", "stem": "The word \"discard\" in the passage is closest in meaning to", "options": ["examine closely", "throw away", "break open", "carry off"], "answer": 1, "explain_ko": "discard는 필요 없는 것을 버린다는 뜻이므로 throw away가 가장 가깝다."}, {"type": "factual", "stem": "According to the passage, what do foraging ants do with the elaiosome?", "options": ["They use it to line the walls of the refuse chamber.", "They leave it attached to the buried seed.", "They feed it to their larvae.", "They mix it into the soil at the nest entrance."], "answer": 2, "explain_ko": "개미는 씨앗의 부속물을 애벌레에게 먹이고 씨앗 자체는 버린다고 설명한다."}, {"type": "negative_factual", "stem": "According to the passage, all of the following are benefits that ant dispersal provides to plants EXCEPT", "options": ["protection of seeds from fire", "shelter from seed eating rodents", "soil that has been enriched with nitrogen", "movement of seeds over long distances"], "answer": 3, "explain_ko": "개미는 한두 미터만 이동하므로 장거리 운반은 이점이 아니라 한계로 제시된다."}, {"type": "inference", "stem": "It can be inferred from the passage that in a woodland where aggressive invasive ants have replaced native ants, seeds bearing elaiosomes are most likely to", "options": ["remain on the ground surface with their appendages removed", "be carried farther from the parent plant than before", "germinate in soil that is unusually rich in nitrogen", "stop producing appendages within a few generations"], "answer": 0, "explain_ko": "침입성 개미는 씨앗을 옮기지 않고 그 자리에서 부속물만 떼어내므로 씨앗은 지표에 그대로 남는다."}, {"type": "purpose", "stem": "Why does the author mention roads and farmland?", "options": ["To explain why elaiosomes contain fats and amino acids", "To show that native ants prefer recently disturbed ground", "To illustrate the kind of barrier that short distance dispersal cannot easily overcome", "To argue that agriculture is the main cause of invasive ant spread"], "answer": 2, "explain_ko": "도로와 농지는 짧은 산포 거리로는 넘기 어려운 장벽의 예로 제시된다."}]}, {"id": "ac2", "title": "Railways and the Making of Standard Time", "text": "Until the late nineteenth century, most towns kept their own local time, set by the moment the sun stood highest overhead. A clock in one city might differ from a clock a hundred kilometres to the east by several minutes, and nobody found this inconvenient. Travel was slow enough that such differences never had to be reconciled.\n\nRailways changed the calculation. A single line could pass through dozens of towns in a day, and a timetable printed in local times was both confusing and dangerous, since trains sharing a track relied on scheduled positions to avoid collisions. British companies solved the problem early by running their services on Greenwich time, coordinated through the Railway Clearing House from 1847, decades before Parliament made that time legal for civil purposes. In North America, where distances were far greater, the railways agreed among themselves in 1883 to divide the continent into broad zones, each differing from its neighbour by exactly one hour. Cities adjusted their public clocks over the following days, sometimes with protest from clergy and newspaper editors who regarded solar noon as a natural fact rather than a convention.\n\nThe reform is often described as a triumph of scientific reasoning, but it was mainly a commercial decision, taken by private firms and only later ratified by governments. Its lasting significance lies in what it accustomed people to accept: a measure of time that came from an institution rather than from the sky. Later standards, from international shipping schedules to the electrical frequency of national power grids, depended on the same habit of trusting a distant authority.", "questions": [{"type": "vocabulary", "stem": "The word \"ratified\" in the passage is closest in meaning to", "options": ["formally approved", "quietly ignored", "sharply limited", "publicly explained"], "answer": 0, "explain_ko": "ratified는 정부가 공식적으로 승인했다는 의미이다."}, {"type": "factual", "stem": "According to the passage, why were timetables printed in local times dangerous?", "options": ["Printers frequently made errors when setting local times.", "Passengers had no way of knowing when the sun was highest.", "Clocks in different towns ran at slightly different speeds.", "Trains sharing one track depended on being where the schedule said they were."], "answer": 3, "explain_ko": "같은 선로를 쓰는 열차가 예정된 위치에 의존해 충돌을 피했기 때문에 위험했다."}, {"type": "negative_factual", "stem": "The passage mentions all of the following as part of the move toward standard time EXCEPT", "options": ["the use of Greenwich time by British railway companies", "the division of North America into zones one hour apart", "objections raised by clergy and newspaper editors", "a plan drawn up by national governments before the railways acted"], "answer": 3, "explain_ko": "표준 시간대는 철도 회사들이 먼저 합의했고 정부는 나중에 승인했다."}, {"type": "inference", "stem": "What can be inferred about the decision of Parliament to make Greenwich time legal for civil purposes?", "options": ["It was intended mainly to help the Railway Clearing House expand.", "It confirmed a practice that private companies had already adopted.", "It was resisted by railway companies that preferred local time.", "It was a response to the North American agreement of 1883."], "answer": 1, "explain_ko": "영국 철도는 1847년부터 그리니치 시간을 사용했고 의회의 법제화는 수십 년 뒤였다."}, {"type": "purpose", "stem": "Why does the author mention the electrical frequency of national power grids?", "options": ["To show that railways eventually lost their influence over technology", "To offer a later example of the public accepting a standard set by a remote institution", "To explain how electricity made accurate public clocks possible", "To suggest that time zones should follow the boundaries of power grids"], "answer": 1, "explain_ko": "전력망 주파수는 멀리 있는 기관이 정한 기준을 사람들이 받아들인 후대의 사례로 언급된다."}]}, {"id": "ac3", "title": "From Tempera to Oil in European Painting", "text": "Before the fifteenth century, most European panel paintings were made with egg tempera, a paint in which ground pigment is bound in egg yolk thinned with water. Tempera dries within minutes, so colours cannot be blended on the panel; a painter builds up flesh or drapery from hundreds of fine parallel strokes, each laid beside the last. The result is luminous and precise, but transitions of light are necessarily somewhat abrupt.\n\nOil paint behaves differently. Pigment mixed with linseed or walnut oil stays workable for hours or days, which allows edges to be softened and one tone to be pulled gradually into another. Oil is also more transparent, so a painter can lay thin glazes over a dried layer and produce deep shadows that still seem to contain light. Netherlandish artists of the early fifteenth century, Jan van Eyck among them, did not invent the medium, as an older story held, but they refined its preparation to the point where it could carry the fine detail previously reserved for tempera.\n\nItalian workshops took up oil during the second half of the century, and the change altered more than surface texture. Because oil films remain flexible, they can be applied to canvas, which is lighter and can be made far larger than a wooden panel; Venetian painters exploited this freedom in enormous canvases for churches and government halls. Slow drying also made revision possible, and X-ray examination of such paintings frequently reveals arms, heads, and whole figures shifted or removed while the work was under way, a practice that a tempera painter could scarcely have attempted.", "questions": [{"type": "vocabulary", "stem": "The word \"workable\" in the passage is closest in meaning to", "options": ["safe to handle", "soft enough to be manipulated", "inexpensive to prepare", "resistant to fading"], "answer": 1, "explain_ko": "workable은 아직 굳지 않아 다룰 수 있는 상태를 뜻한다."}, {"type": "factual", "stem": "According to the passage, why does a tempera painter build up a form from many fine parallel strokes?", "options": ["The paint dries too quickly for colours to be blended on the panel.", "Egg yolk is too thick to be spread over broad areas.", "Thin strokes keep the wooden support from cracking.", "Pigments were costly and had to be used sparingly."], "answer": 0, "explain_ko": "템페라는 몇 분 안에 말라 패널 위에서 색을 섞을 수 없기 때문이다."}, {"type": "negative_factual", "stem": "According to the passage, oil paint has all of the following characteristics EXCEPT", "options": ["It stays usable for hours or days.", "It can be applied as a thin transparent glaze.", "It forms a flexible film suited to canvas.", "It hardens quickly enough to prevent later changes."], "answer": 3, "explain_ko": "유화는 천천히 말라 나중에 수정이 가능했으므로 변경을 막는다는 설명은 본문과 반대이다."}, {"type": "inference", "stem": "What can be inferred about the older claim that Jan van Eyck invented oil painting?", "options": ["It rested on X-ray evidence that was later misread.", "It is true of Italy but not of the Netherlands.", "It overstates his role, since his achievement was to improve an existing medium.", "It was spread by Venetian painters who wanted to promote canvas."], "answer": 2, "explain_ko": "본문은 그가 매체를 발명한 것이 아니라 준비 방식을 개선했다고 밝힌다."}, {"type": "purpose", "stem": "Why does the author mention X-ray examination of Italian paintings?", "options": ["To provide evidence that painters altered their compositions while working", "To show that oil paintings are more fragile than tempera panels", "To explain how large canvases were attached to wooden frames", "To date the arrival of oil painting in Venice"], "answer": 0, "explain_ko": "엑스레이 조사는 작업 중에 구도를 고쳤다는 증거로 제시된다."}]}]}, "listening": {"choose_response": [{"id": "cr1", "speaker": "W", "utterance": "Would you mind switching seats with me so I can sit with my group?", "options": ["Not at all. I'll move over here.", "Yes, my group meets on Thursday evenings.", "I'd rather pay for the seat myself.", "Because the lecture starts at ten sharp."], "answer": 0, "explain_ko": "자리를 바꿔 달라는 부탁에 대한 답이므로 흔쾌히 옮기겠다는 대답이 자연스럽다. 나머지는 부탁에 대한 수락이나 거절이 아니라 관련 없는 정보이다."}, {"id": "cr2", "speaker": "M", "utterance": "Sorry I'm late. The bus got stuck in traffic near the stadium.", "options": ["You should return your ticket tomorrow morning.", "The stadium holds forty thousand people.", "No problem. We haven't started yet.", "I drive to campus every single morning."], "answer": 2, "explain_ko": "늦은 것에 대한 사과이므로 괜찮다고 안심시키는 응답이 적절하다. 경기장 규모나 자신의 통학 방식은 사과에 대한 반응이 아니다."}, {"id": "cr3", "speaker": "W", "utterance": "Do you know whether the writing center takes walk ins on Fridays?", "options": ["My essay is about coastal erosion.", "Only in the morning, as far as I know.", "The center hired two new tutors.", "I walked there yesterday for exercise."], "answer": 1, "explain_ko": "예약 없이 방문이 가능한지 묻는 질문이므로 시간대를 알려 주는 응답이 답이다. 다른 선택지는 질문의 초점인 이용 가능 여부를 다루지 않는다."}, {"id": "cr4", "speaker": "M", "utterance": "I can give you a ride to the airport on Saturday if you like.", "options": ["The airport has three terminals now.", "Saturday is my favorite day of the week.", "I've never flown on that airline before.", "That would help a lot. Thank you."], "answer": 3, "explain_ko": "차를 태워 주겠다는 제안이므로 고맙다고 수락하는 응답이 적절하다. 공항 시설이나 항공사에 대한 언급은 제안에 대한 답이 되지 않는다."}, {"id": "cr5", "speaker": "W", "utterance": "This printer keeps jamming. Have you managed to get yours to work?", "options": ["I printed my whole thesis last semester.", "Mine jammed too. Try the one downstairs.", "Paper is usually made from wood pulp.", "I'd rather write the report by hand."], "answer": 1, "explain_ko": "프린터가 작동하는지 묻는 질문이므로 자신의 상황을 말하고 대안을 제시하는 응답이 답이다. 나머지는 현재 문제 해결과 관련이 없다."}, {"id": "cr6", "speaker": "M", "utterance": "Excuse me, is this seat taken, or may I sit here?", "options": ["Go ahead. It's free.", "I sat down about an hour ago.", "These seats were replaced last summer.", "No, I don't take milk in my coffee."], "answer": 0, "explain_ko": "자리에 앉아도 되는지 묻는 질문이라 허락하는 응답이 적절하다. 다른 선택지는 허락이나 거절을 표현하지 않는다."}, {"id": "cr7", "speaker": "W", "utterance": "Could you remind me when the group project proposal is actually due?", "options": ["I'm working with Daniel and Mina.", "The proposal was only three pages long.", "I remind myself with sticky notes.", "Friday at five, according to the syllabus."], "answer": 3, "explain_ko": "마감 시점을 묻는 질문이므로 구체적인 날짜와 시간을 알려 주는 응답이 답이다. 조원 이름이나 분량은 질문에 대한 답이 아니다."}, {"id": "cr8", "speaker": "M", "utterance": "I'm afraid I spilled coffee on the book you lent me. I'm really sorry.", "options": ["I usually drink tea in the afternoon.", "You can borrow another one tomorrow.", "Don't worry about it. It's an old copy.", "The library closes at nine on weekdays."], "answer": 2, "explain_ko": "책을 망친 것에 대한 사과이므로 괜찮다고 하며 부담을 덜어 주는 응답이 자연스럽다. 다른 선택지는 사과를 받아들이는 표현이 아니다."}], "conversations": [{"id": "cv1", "setting": "A student talks to a librarian at the circulation desk", "turns": [{"speaker": "M", "text": "Hi, I need the sociology reader Professor Lang put on reserve. It isn't on the shelf."}, {"speaker": "W", "text": "Reserve books stay behind this desk. Which course is it for?"}, {"speaker": "M", "text": "Sociology two ten. I only need chapter four, and my quiz is tomorrow morning."}, {"speaker": "W", "text": "Here it is. Reserve loans are two hours, and you can't take it out of the building."}, {"speaker": "M", "text": "Two hours is plenty. Actually, could I scan the chapter instead and read it at home?"}, {"speaker": "W", "text": "Of course. The scanner on the second floor is free, and it emails the file to you."}], "questions": [{"stem": "Why does the man come to the desk?", "options": ["To pay a fine on an overdue book", "To get a book that is held on reserve", "To ask the librarian to order a new textbook", "To reserve a group study room for a quiz"], "answer": 1, "explain_ko": "남학생은 교수가 지정 도서로 맡긴 사회학 교재를 찾으러 왔다고 처음에 밝힌다. 벌금이나 스터디룸 이야기는 대화에 나오지 않는다."}, {"stem": "What does the woman say about the scanner?", "options": ["It costs the same as the copy machine.", "It can only be used for two hours.", "It is free and sends the file by email.", "It is located next to the circulation desk."], "answer": 2, "explain_ko": "사서는 이층 스캐너가 무료이며 파일을 이메일로 보내 준다고 말한다. 두 시간 제한은 지정 도서 대출에 적용되는 규정이다."}]}, {"id": "cv2", "setting": "A student visits his chemistry professor during office hours", "turns": [{"speaker": "M", "text": "Professor, may I talk to you about the lab report that's due Thursday?"}, {"speaker": "W", "text": "Of course. Is something wrong with your data?"}, {"speaker": "M", "text": "Two of my samples were contaminated, so I have to run the trial again."}, {"speaker": "W", "text": "Then hand the write up in on Monday. I'd rather see clean data than rushed data."}, {"speaker": "M", "text": "Thank you. Should I mention the contaminated samples in the discussion section?"}, {"speaker": "W", "text": "Yes, briefly. Explaining what went wrong is part of good scientific writing."}], "questions": [{"stem": "What is the main purpose of the man's visit?", "options": ["To ask for more time to finish a lab report", "To find out how the lab report will be graded", "To request a different laboratory partner", "To complain about the equipment in the lab"], "answer": 0, "explain_ko": "학생은 시료가 오염되어 실험을 다시 해야 한다며 목요일 마감인 보고서 문제를 상의하려고 찾아왔다. 채점 기준이나 실험 장비는 논의되지 않는다."}, {"stem": "What can be inferred about the professor's view of the report?", "options": ["She thinks the student should submit partial results.", "She believes accurate data matters more than meeting the original deadline.", "She expects students to avoid mentioning failed trials.", "She considers the discussion section the least important part."], "answer": 1, "explain_ko": "교수는 급하게 쓴 자료보다 정확한 자료를 보고 싶다고 말하며 마감을 월요일로 미뤄 준다. 또한 실패한 실험을 설명하는 것이 좋은 글쓰기라고 강조한다."}]}, {"id": "cv3", "setting": "A student asks a department assistant about a geology field trip", "turns": [{"speaker": "W", "text": "Hi, I signed up for the geology field trip. Where does the van leave from?"}, {"speaker": "M", "text": "Behind the science building, at seven fifteen sharp. It won't wait for latecomers."}, {"speaker": "W", "text": "Seven fifteen. Do I need to bring my own lunch and boots?"}, {"speaker": "M", "text": "Lunch, yes. Boots you can borrow from the equipment room until Friday afternoon."}, {"speaker": "W", "text": "Good. And is there still space for my roommate to come along?"}, {"speaker": "M", "text": "Two seats are open, but she has to sign the safety form first."}], "questions": [{"stem": "What are the speakers mainly discussing?", "options": ["The grading policy for a geology course", "A change in the date of a field trip", "Practical arrangements for an upcoming field trip", "Repairs being made to a department van"], "answer": 2, "explain_ko": "두 사람은 출발 장소와 시간, 점심과 장화 준비, 남은 좌석 같은 실질적인 준비 사항을 이야기한다. 성적이나 날짜 변경은 언급되지 않는다."}, {"stem": "What must the woman's roommate do to join the trip?", "options": ["Sign a safety form", "Buy her own boots", "Pay a small transportation fee", "Speak with the professor in person"], "answer": 0, "explain_ko": "직원은 좌석이 두 개 남았지만 룸메이트가 먼저 안전 서류에 서명해야 한다고 말한다. 장화는 대여할 수 있고 비용 이야기는 나오지 않는다."}]}], "announcements": [{"id": "an1", "speaker": "M", "context": "Announcement at the start of the first organic chemistry lab session", "text": "Good morning, and welcome to your first session in the organic chemistry lab. Before we touch any equipment, three rules. First, goggles and a lab coat stay on from the moment you walk in until you leave, no exceptions. Second, your notebook goes on the shelf above the bench, never on the bench itself, because a wet notebook is a useless notebook. Third, if you spill anything at all, don't try to clean it up yourself. Tell me, and I'll decide what we do. Now, find your assigned station. Your partner's name is taped to the drawer.", "questions": [{"stem": "What is the main purpose of the announcement?", "options": ["To review the results of an earlier experiment", "To explain safety and work rules before the lab begins", "To assign topics for a final research project", "To describe how lab reports will be graded"], "answer": 1, "explain_ko": "화자는 장비를 만지기 전에 지켜야 할 세 가지 규칙을 설명한다. 실험 결과나 보고서 채점은 다루지 않는다."}, {"stem": "What should students do if they spill a substance?", "options": ["Wipe it up with paper from the shelf", "Move to a different station immediately", "Write the incident in their notebook", "Report it to the instructor"], "answer": 3, "explain_ko": "화자는 무엇이든 흘리면 직접 치우지 말고 자신에게 알리라고 지시한다. 처리 방법은 강사가 결정한다고 말한다."}]}, {"id": "an2", "speaker": "W", "context": "Announcement to visitors before a guided museum tour", "text": "Hello everyone, and thank you for joining the two o'clock tour of the textile gallery. A few notes before we start. Photography is allowed, but please switch off your flash, since the dyes in these fabrics fade under bright light. The tour runs about fifty minutes and covers three rooms. Bags larger than a notebook have to go in the lockers by the entrance, and the lockers are free today. Finally, the last room is being rearranged, so if you hear drilling, now you know why. Please stay together, and stop me any time you have a question.", "questions": [{"stem": "Why does the speaker ask visitors to turn off their flash?", "options": ["Bright light damages the colors in the fabrics.", "The flash disturbs other tour groups nearby.", "Photographs of the textiles are sold in the shop.", "The gallery lighting is already too strong."], "answer": 0, "explain_ko": "화자는 강한 빛에 직물의 염료가 바래기 때문이라고 이유를 밝힌다. 다른 관람객이나 상점 판매는 언급되지 않는다."}, {"stem": "What does the speaker say about large bags?", "options": ["They may be carried through the first room only.", "They must be left in lockers, which cost nothing today.", "They should be checked at the end of the tour.", "They are allowed if they are smaller than a notebook."], "answer": 1, "explain_ko": "노트보다 큰 가방은 입구 사물함에 넣어야 하며 오늘은 사물함이 무료라고 안내한다. 노트보다 작은 가방만 허용된다는 조건은 반대로 설명된 것이다."}]}, {"id": "an3", "speaker": "M", "context": "Announcement about a temporary closure in the university library", "text": "Attention, students. This is a reminder that the third floor reading room closes for renovation this Friday at six. It should reopen in late March with new wiring and, finally, more power outlets. Until then, the quiet study seats move down to the basement, room B twelve. Group study rooms are not affected. If you have books checked out to a carrel on the third floor, please empty that carrel before Friday, because anything left behind will be sent to the lost and found desk. Construction noise will be limited to weekday mornings.", "questions": [{"stem": "What is the announcement mainly about?", "options": ["A new policy for borrowing library books", "The closing of a study area and where to study instead", "An increase in the number of group study rooms", "A change in the library's daily opening hours"], "answer": 1, "explain_ko": "공지는 삼층 열람실이 공사로 닫히고 조용한 좌석이 지하 비십이호실로 이동한다는 내용이다. 대출 규정이나 개관 시간 변경은 언급되지 않는다."}, {"stem": "What will happen to items left in a third floor carrel after Friday?", "options": ["They will be moved to the basement study area.", "They will be returned to the students by mail.", "They will be taken to the lost and found desk.", "They will be shelved with the rest of the collection."], "answer": 2, "explain_ko": "금요일 전에 캐럴을 비우지 않으면 남은 물건은 분실물 보관소로 옮겨진다고 안내한다. 지하로 옮겨지는 것은 조용한 좌석이다."}]}], "talks": [{"id": "tk1", "subject": "Astronomy", "speaker": "W", "text": "Now, when you look up at the Moon, you always see the same face. The near side, with its dark plains, never turns away from us. Students often take that to mean the Moon doesn't rotate at all. That isn't right. The Moon does rotate, but its rotation period matches its orbital period almost exactly. Both take about twenty seven days. We call this synchronous rotation, or tidal locking. So how does a moon get locked this way? Think about gravity. Earth pulls a little harder on the near side of the Moon than on the far side, and that difference in pull stretches the Moon slightly. It becomes very slightly egg shaped, with the long axis pointing toward us. Now, if the Moon were spinning faster than it orbited, that bulge would be dragged out of alignment, and Earth's gravity would keep tugging it back. Over millions of years, that tugging acts like a brake. The spin slows down until the bulge stays pointed at Earth, and then the braking stops. Let me give you an example from farther out. Most of Jupiter's large moons are tidally locked to Jupiter. So is Pluto's moon Charon, and in that case the locking went both ways, because Charon is unusually large compared with Pluto. The two now keep the same faces toward each other permanently. Here is what I want you to take away. Tidal locking is not some rare accident. It is the expected end state for a small body orbiting close to a much larger one, given enough time.", "questions": [{"type": "main_idea", "stem": "What is the lecture mainly about?", "options": ["Why the Moon has dark plains on one side", "How the length of a day on Jupiter was measured", "Why a small orbiting body ends up showing one face", "How astronomers calculate the age of the Moon"], "answer": 2, "explain_ko": "강의는 조석 고정이 어떻게 생기며 왜 작은 천체가 큰 천체에 한쪽 면만 보이게 되는지를 설명한다. 어두운 평원이나 나이 측정은 주제가 아니다."}, {"type": "detail", "stem": "According to the professor, what is true about the Moon's rotation?", "options": ["It stopped completely millions of years ago.", "It takes about the same time as one orbit.", "It is gradually speeding up over time.", "It changes direction every twenty seven days."], "answer": 1, "explain_ko": "교수는 달이 자전을 하며 그 주기가 공전 주기와 거의 같아 둘 다 약 이십칠일이라고 말한다. 자전이 멈췄다는 것은 학생들이 흔히 하는 오해로 제시된다."}, {"type": "detail", "stem": "What does the professor say Earth's gravity does to the shape of the Moon?", "options": ["It flattens the Moon at the poles.", "It stretches the Moon slightly into an egg shape.", "It pulls the dark plains toward the far side.", "It has no measurable effect on the Moon's shape."], "answer": 1, "explain_ko": "지구가 달의 가까운 쪽을 더 강하게 당겨 달이 약간 달걀 모양으로 늘어난다고 설명한다. 이 돌출부가 조석 고정의 핵심 원인이다."}, {"type": "function", "stem": "Why does the professor mention Pluto and Charon?", "options": ["To show that tidal locking can work in both directions", "To argue that Charon is not really a moon", "To explain why Pluto was reclassified as a dwarf planet", "To compare the age of Charon with that of the Moon"], "answer": 0, "explain_ko": "샤론이 명왕성에 비해 크기 때문에 두 천체가 서로에게 같은 면을 향하는 양방향 고정 사례로 제시된다. 명왕성의 분류 변경은 언급되지 않는다."}, {"type": "inference", "stem": "What does the professor imply about tidally locked moons in the solar system?", "options": ["They are unusual and hard to explain.", "They must all have formed at the same time.", "They are likely to be common rather than exceptional.", "They will eventually begin to rotate faster again."], "answer": 2, "explain_ko": "마지막에 조석 고정은 드문 우연이 아니라 충분한 시간이 주어지면 예상되는 결과라고 말한다. 따라서 그러한 위성이 흔할 것이라고 추론할 수 있다."}]}, {"id": "tk2", "subject": "Economics", "speaker": "M", "text": "So far we've talked about markets where serving more customers means higher costs. Today I want to look at the opposite situation. Some products become more valuable to each user as more people use them. Economists call this a network effect. Now, the classic example is the telephone. One telephone is a paperweight. Two telephones give you exactly one connection. But add a third, and suddenly you have three possible connections, and the number of possible connections grows much faster than the number of phones. So each new subscriber makes the service better for everyone already on it, and the company doesn't have to do anything at all. Let me give you an example that's a little less obvious. Think about a language. Nobody owns English, but the more speakers it has, the more useful it is to learn, and that usefulness attracts more learners. That's a network effect too. Here's why this matters for competition. In an ordinary market, the better product usually wins. In a market with strong network effects, the product that gets big first can win even if it isn't the best one, because switching would mean leaving your contacts behind. Economists call that lock in. And notice the flip side. These markets can tip very suddenly. A small early lead grows into an enormous one. That is why firms in these industries so often give the product away at the beginning. They are not being generous. They are buying the network.", "questions": [{"type": "main_idea", "stem": "What is the main idea of the lecture?", "options": ["Costs always rise as a company serves more customers.", "A product can gain value for users as its user base grows.", "Languages spread mainly because governments promote them.", "Companies lose money whenever they give products away."], "answer": 1, "explain_ko": "강의는 사용자가 늘수록 각 사용자에게 제품 가치가 커지는 네트워크 효과를 중심으로 전개된다. 비용 증가는 도입부에서 대비를 위해 언급된 개념이다."}, {"type": "detail", "stem": "What point does the professor make with the telephone example?", "options": ["Possible connections increase faster than the number of users.", "Early telephones were too expensive for most households.", "Telephone companies needed government support to grow.", "Two users are enough to make a network profitable."], "answer": 0, "explain_ko": "전화기 수보다 가능한 연결 수가 훨씬 빠르게 늘어난다는 점을 강조한다. 가격이나 정부 지원은 언급되지 않는다."}, {"type": "detail", "stem": "According to the professor, why do firms in these industries often give their product away at first?", "options": ["To meet legal requirements in new markets", "To test the product before charging for it", "To build up a user base quickly", "To reduce the cost of customer service"], "answer": 2, "explain_ko": "교수는 기업이 관대해서가 아니라 네트워크를 사기 위해 초기에 제품을 무료로 준다고 말한다. 즉 사용자 기반을 빨리 확보하려는 전략이다."}, {"type": "function", "stem": "Why does the professor say that one telephone is a paperweight?", "options": ["To show that early technology was poorly designed", "To emphasize that the device is useless without other users", "To suggest that telephones were once luxury objects", "To explain why manufacturing costs were so high"], "answer": 1, "explain_ko": "혼자 쓰는 전화기는 아무 소용이 없다는 점을 과장해 표현하여 사용자 수가 가치를 만든다는 개념을 강조한다. 설계 결함이나 제조 비용과는 무관하다."}, {"type": "inference", "stem": "What can be inferred about markets with strong network effects?", "options": ["Competitors with better products may still fail.", "Prices in them stay stable over long periods.", "They usually contain many equally sized firms.", "Customers switch providers more easily than elsewhere."], "answer": 0, "explain_ko": "먼저 규모를 키운 제품이 최고가 아니어도 승리할 수 있고 이용자는 잠김 현상 때문에 옮기기 어렵다고 설명한다. 따라서 더 좋은 제품도 실패할 수 있다고 추론된다."}]}, {"id": "tk3", "subject": "Art History", "speaker": "W", "text": "Now, let's turn to a change in materials that changed what paintings could look like. Before the fifteenth century, most panel paintings in Europe used egg tempera. You grind your pigment, you mix it with egg yolk, and you paint. Tempera has one big problem. It dries in minutes. So you cannot blend two colors together on the panel. Instead you build up tone with thousands of tiny parallel strokes, which is one reason tempera figures often look crisp and a little flat. Then painters in the Netherlands, and Jan van Eyck is the name you will see most often, developed oil as their main medium. Pigment ground in linseed oil dries slowly, over hours or even days. So now you can blend edges directly on the surface. And here is the more important part. Oil is more transparent than egg, so you can lay down thin translucent layers, called glazes, one over another. Light passes through those layers, bounces off the pale ground underneath, and comes back out to your eye. That is why the reds in a van Eyck robe seem to glow from inside rather than sit on the surface. Now, let me be careful about one thing. Van Eyck did not invent oil paint. Oil binders show up in European recipes centuries earlier. What he and his contemporaries worked out was how to control the material, how many layers, how thin, how long to wait. So the story here is not a single invention. It is the slow mastery of a difficult medium.", "questions": [{"type": "main_idea", "stem": "What does the lecture mainly discuss?", "options": ["How a shift in painting materials changed visual effects", "How panel paintings were restored in the Netherlands", "Why religious subjects dominated fifteenth century art", "How pigments were transported across medieval Europe"], "answer": 0, "explain_ko": "강의는 계란 템페라에서 유화로 재료가 바뀌면서 그림의 표현 방식이 달라진 과정을 설명한다. 복원이나 주제 선택은 다루지 않는다."}, {"type": "detail", "stem": "Why did tempera painters use many small parallel strokes?", "options": ["Egg yolk was too expensive to apply thickly.", "The paint dried too quickly to blend on the panel.", "Wooden panels absorbed thick layers of paint.", "Patrons preferred a highly detailed surface."], "answer": 1, "explain_ko": "템페라는 몇 분 안에 마르기 때문에 화판 위에서 색을 섞을 수 없어 잔선을 겹쳐 명암을 만든다고 설명한다. 재료 가격이나 후원자의 취향은 이유로 제시되지 않는다."}, {"type": "detail", "stem": "According to the professor, what makes colors in an oil painting appear to glow?", "options": ["The pigments are ground much more finely than in tempera.", "Light reflects off the pale ground through translucent layers.", "The panel is polished before any paint is applied.", "Bright colors are painted directly over dark ones."], "answer": 1, "explain_ko": "빛이 얇고 반투명한 글레이즈 층을 통과해 밝은 바탕에서 반사되어 나오기 때문에 색이 안에서 빛나는 것처럼 보인다고 말한다. 안료의 입자 크기는 언급되지 않는다."}, {"type": "function", "stem": "Why does the professor point out that van Eyck did not invent oil paint?", "options": ["To correct a common but inaccurate belief", "To question whether van Eyck painted the works himself", "To argue that tempera remained the superior medium", "To show that recipes for paint were kept secret"], "answer": 0, "explain_ko": "교수는 유성 전색제가 수세기 전 기록에도 나온다고 지적하며 발명가라는 통념을 바로잡는다. 템페라가 더 우수하다는 주장은 하지 않는다."}, {"type": "inference", "stem": "What does the professor suggest about technical progress in painting?", "options": ["It usually depends on the discovery of new pigments.", "It advances through gradual refinement of technique rather than sudden invention.", "It has little effect on how finished paintings look.", "It happens fastest when artists work in isolation."], "answer": 1, "explain_ko": "마지막에 이 이야기는 단일한 발명이 아니라 어려운 재료를 천천히 숙달한 과정이라고 정리한다. 따라서 기술 발전은 점진적인 숙련을 통해 이루어진다고 추론된다."}]}]}, "sw": {"listen_repeat": [{"id": "lr1", "sentences": ["The library opens at eight today.", "I need to print my essay before class.", "My roommate borrowed the textbook I bought last week.", "The professor moved the deadline to Friday because many students were sick.", "If you want a quiet spot, try the fourth floor of the science library.", "I signed up for the writing workshop that meets on Tuesday evenings in the student center.", "Although the shuttle runs every fifteen minutes, most students still walk to the north dormitories when the weather is warm."]}, {"id": "lr2", "sentences": ["I usually cook dinner at home.", "My bus was late again this morning.", "I bought some fresh vegetables at the corner market.", "My sister called last night to ask about our weekend plans.", "Whenever I have free time, I like to walk along the river near my apartment.", "I finally fixed the kitchen light that had been flickering since I moved into this building.", "Even though I set three alarms every single night, I still oversleep whenever I stay up reading past midnight."]}], "interviews": [{"id": "iv1", "topic": "Travel", "intro": "Hi, thanks for joining me today. I'd like to ask you a few questions about travel and about how people spend their time away from home.", "questions": ["Tell me about a trip you have taken that you still remember well. What made it memorable?", "Some travelers prefer to plan every detail in advance, while others prefer to decide things as they go. Which approach do you think works better, and why?", "Imagine a friend from another country is visiting your city for only two days. What would you advise them to do, and why?", "In recent years, more people have been taking short trips close to home instead of long international vacations. What do you think about this trend?"], "model_answer": "Personally, I think a mix works best, but if I had to choose, I'd go with planning in advance. When I visited Kyoto a few years ago, I booked the temples and the train tickets before I left, and that saved me a lot of stress. Popular places sell out quickly, so showing up without a plan can mean waiting in line for hours. That said, I always leave one afternoon completely open, because some of my best memories came from just wandering around a neighborhood. So planning gives you the structure, and the free time gives you the surprises.", "tips_ko": "질문마다 입장을 한 문장으로 먼저 밝히고 바로 개인 경험 하나를 근거로 붙이세요. 마지막 5초는 결론을 다시 정리해 문장을 끝내고, 시간이 남으면 예외 상황을 한 문장 덧붙이면 좋습니다."}, {"id": "iv2", "topic": "Technology habits", "intro": "Hello, and thanks for taking the time to talk with me. Today I'd like to ask you a few questions about technology and how you use it in your daily life.", "questions": ["Which device or app do you use most often during the day, and what do you use it for?", "Some people prefer reading on paper, while others prefer reading on a screen. Which do you find more effective, and why?", "If a friend told you they wanted to spend less time on their phone, what advice would you give them?", "Many companies now expect employees to be reachable outside of working hours. What is your view on that?"], "model_answer": "For me it really depends on what I'm reading, but for anything serious I prefer paper. When I read a long article on my laptop, I catch myself skimming and clicking on other tabs, so I finish the page without remembering much. With a printed book I can underline things and write notes in the margin, and that helps the information stick. Screens are much more convenient, of course, since I can carry hundreds of books in one bag. So I use my tablet for news and light reading, and I print anything I actually need to understand deeply.", "tips_ko": "비교 질문에서는 두 선택지를 모두 언급한 뒤 자신이 고른 쪽의 이유를 구체적인 상황으로 설명하세요. 상대 선택지의 장점도 한 문장 인정하면 논리가 균형 있게 들립니다."}, {"id": "iv3", "topic": "Work and life balance", "intro": "Hi, thanks for joining. I'd like to ask you a few questions about work, study, and how people balance them with the rest of their lives.", "questions": ["Describe a typical weekday for you. When during the day do you feel most productive?", "Would you rather have a job with fixed hours in an office, or one where you choose your own hours and work from home? Explain your choice.", "Suppose a coworker keeps sending you messages late at night. How would you handle that situation?", "More organizations are experimenting with a four day work week. Do you think this is a good idea?"], "model_answer": "I'd choose flexible hours and working from home, mainly because of how my energy works. I concentrate best early in the morning and again late at night, so being forced to sit at a desk from nine to six wastes some of my best hours. Working from home also saves me almost two hours of commuting, and I can use that time for exercise or studying. The downside is that it's harder to switch off, and I do miss the casual conversations with colleagues. So ideally I'd want two days in the office for meetings, and the rest at home.", "tips_ko": "추상적인 이유보다 시간, 횟수, 거리 같은 숫자를 넣으면 답변이 훨씬 설득력 있게 들립니다. 45초 안에 이유는 두 개까지만 다루고 각각을 충분히 풀어 설명하세요."}], "build_sentence": [{"id": "bs1", "context": "Did you enjoy the trip to the old city?", "sentence": "I loved it, especially the market near the cathedral.", "chunks": ["I loved", "it,", "especially", "the market", "near", "the", "cathedral."]}, {"id": "bs2", "context": "Are you coming to the study group tonight?", "sentence": "I might be late because my lab session ends at seven.", "chunks": ["I might", "be late", "because", "my lab", "session", "ends", "at seven."]}, {"id": "bs3", "context": "How was the new professor's first lecture?", "sentence": "She explained the main concepts clearly and gave us useful examples.", "chunks": ["She explained", "the main", "concepts", "clearly", "and gave", "us", "useful examples."]}, {"id": "bs4", "context": "I can't find the reading list for this course.", "sentence": "You can download it from the course page after you log in.", "chunks": ["You can", "download it", "from the", "course page", "after", "you log", "in."]}, {"id": "bs5", "context": "Do you want to join the volunteer program with me?", "sentence": "I'd love to, but I need to check my work schedule first.", "chunks": ["I'd love", "to, but", "I need", "to check", "my work", "schedule", "first."]}, {"id": "bs6", "context": "Why did you decide to move off campus?", "sentence": "Rent was cheaper, and I wanted a quieter place to study.", "chunks": ["Rent was", "cheaper,", "and I", "wanted", "a quieter", "place", "to study."]}, {"id": "bs7", "context": "Have you finished the group presentation slides?", "sentence": "Almost, though I still have to add the data from Tuesday.", "chunks": ["Almost,", "though I", "still have", "to add", "the data", "from", "Tuesday."]}, {"id": "bs8", "context": "The library closes early during the holiday, right?", "sentence": "Yes, it shuts at six, so we should get there sooner.", "chunks": ["Yes,", "it shuts", "at six,", "so we", "should get", "there", "sooner."]}, {"id": "bs9", "context": "What did you think of the documentary we watched?", "sentence": "It was interesting, but the second half felt a bit repetitive.", "chunks": ["It was", "interesting,", "but the", "second half", "felt", "a bit", "repetitive."]}, {"id": "bs10", "context": "Could you help me set up the projector before class?", "sentence": "Sure, I'll come by the room ten minutes before it starts.", "chunks": ["Sure,", "I'll come", "by the", "room", "ten minutes", "before", "it starts."]}, {"id": "bs11", "context": "Did you tell the coordinator about the schedule conflict?", "sentence": "Not yet, but I plan to email her later this afternoon.", "chunks": ["Not yet,", "but I", "plan to", "email her", "later", "this", "afternoon."]}, {"id": "bs12", "context": "How do you usually get to campus in the morning?", "sentence": "I take the subway, unless the weather is nice enough to walk.", "chunks": ["I take", "the subway,", "unless", "the weather", "is nice", "enough", "to walk."]}], "emails": [{"id": "em1", "scenario": "You are the events manager for your university photography club. You ordered three tripods and a portable lighting kit for the club's annual exhibition, but the lighting kit arrived with a cracked panel and will not turn on. The exhibition opens in six days.", "task": "Write an email to the supplier's customer service manager. In your email: (1) explain what you ordered and what arrived damaged, (2) describe how the damage affects your club's event, (3) request a specific solution and state when you need it by.", "recipient": "Ms. Harper, customer service manager at Lumen Studio Supply", "tone": "formal", "sample_answer": "Dear Ms. Harper,\n\nI am writing about order number 4417, which our university photography club received yesterday. The three tripods arrived in good condition, but the portable lighting kit has a cracked front panel and does not switch on at all.\n\nUnfortunately, this equipment is essential for our annual exhibition, which opens in six days. Without working lights, we cannot display the printed photographs properly, and we are expecting more than two hundred visitors over the weekend.\n\nCould you please send a replacement lighting kit so that it arrives by Tuesday? If a replacement cannot reach us in time, I would like to request a full refund instead. I am happy to return the damaged unit and can send photographs of the crack if that would help.\n\nThank you for your prompt attention to this matter.\n\nSincerely,\nJiwon Park", "tips_ko": "격식체 이메일이므로 축약형과 감정적인 표현을 피하고 주문 번호 같은 구체적 정보를 앞부분에 넣으세요. 세 요소를 각각 다른 문단으로 나누고 마지막에 요청 기한을 분명히 밝히면 점수가 안정적으로 올라갑니다."}, {"id": "em2", "scenario": "Your work schedule changed last month, so you can no longer attend the Wednesday evening English conversation club at your local community center. You already paid the fee for the full twelve week term. You would like to move to the Saturday morning group instead.", "task": "Write an email to the program coordinator. In your email: (1) explain why you can no longer attend the Wednesday sessions, (2) ask whether you can move to the Saturday morning group, (3) ask what will happen to the fee you have already paid.", "recipient": "Mr. Novak, program coordinator at the Riverside Community Center", "tone": "semi-formal", "sample_answer": "Dear Mr. Novak,\n\nI hope you are doing well. I have been attending the Wednesday evening conversation club since March, and I have really enjoyed the sessions.\n\nUnfortunately, my company moved me to a later shift last month, and I now finish work at eight, so I can no longer get to the center in time on Wednesdays. I am sorry to miss the group, especially in the middle of the term.\n\nWould it be possible to transfer to the Saturday morning group instead? I am free every Saturday and could start this week if there is space available.\n\nI also wanted to ask about the fee I paid for the full twelve week term. Could it be applied to the Saturday sessions, or would I need to pay again?\n\nThank you for your help.\n\nBest regards,\nJiwon Park", "tips_ko": "준격식체에서는 가벼운 인사말과 정중한 요청 표현을 함께 쓰고 지나치게 딱딱한 어휘는 피하세요. 이유, 변경 요청, 비용 문의를 각각 한 문단으로 처리하고 요청은 의문문 형태로 부드럽게 쓰는 것이 좋습니다."}, {"id": "em3", "scenario": "Your company selected you for a six week training program at an overseas office, starting on October 6. However, you are scheduled to present the results of a client project on October 9, and your team needs you for that presentation. You would like the training to begin two weeks later.", "task": "Write an email to the human resources training coordinator. In your email: (1) thank the company and confirm that you accept the placement, (2) explain the scheduling conflict you have, (3) request a later start date and offer a workable alternative.", "recipient": "Ms. Aliyeva, training coordinator in the Human Resources department", "tone": "formal", "sample_answer": "Dear Ms. Aliyeva,\n\nThank you very much for selecting me for the six week training program at the Singapore office. I am grateful for the opportunity and I would like to confirm that I accept the placement.\n\nI do, however, have one scheduling difficulty. The program begins on October 6, but I am scheduled to present the final results of the Hanbit client project on October 9. My team has been preparing this presentation for three months, and I am the only member familiar with the data analysis.\n\nWould it be possible to begin the training two weeks later, on October 20? I understand that the November group follows the same curriculum, so joining that session would also be acceptable to me.\n\nPlease let me know which option is easier to arrange.\n\nSincerely,\nJiwon Park", "tips_ko": "회사 상대 이메일은 감사 표현으로 시작해 협조적인 태도를 먼저 보여 주고 문제 제기는 그다음에 하세요. 대안을 두 가지 제시하면 요청이 무리하게 들리지 않고 세 요소가 자연스럽게 문단으로 나뉩니다."}], "academic_discussion": [{"id": "ad1", "course": "Sociology", "professor": "This week we have been looking at how communities form in large cities. Some sociologists argue that shared physical spaces, such as parks and neighborhood markets, are what turn strangers into neighbors. Others believe that online networks now perform that role just as effectively, and sometimes better. Which of the two do you think matters more for building a sense of community today, and why?", "students": [{"name": "Maya", "text": "I think physical spaces still matter most. It is hard to trust someone you have never stood next to, and the small daily encounters at a bus stop or a corner shop are exactly what build that trust. Online groups feel convenient, but many of them go quiet as soon as people lose interest."}, {"name": "Daniel", "text": "I would argue the opposite. My apartment building has a group chat where neighbors lend each other tools, warn about broken elevators, and organize cleanups, and almost none of that happened before the chat existed. Online platforms let people find each other around real needs instead of relying on chance meetings."}], "sample_answer": "I side with Daniel, although I would add one condition: online networks build community only when they are tied to a specific place. In the apartment complex where my parents live, about sixty households joined a messaging group two years ago. Before that, neighbors barely nodded at each other in the elevator. Once the group existed, one resident posted that the recycling area was constantly overflowing, and within a week the households had organized a rotating cleaning schedule and pushed the management company to add more bins. That kind of coordination would have been nearly impossible through casual encounters alone, because people who happen to meet in a hallway rarely have a way to follow up on anything. So physical proximity may create the shared problem, but the online network is what turns that problem into collective action.", "tips_ko": "입장을 첫 문장에서 분명히 밝히고 동료 이름을 언급해 논의에 참여하는 태도를 보이세요. 이유는 하나만 고르되 숫자와 결과가 들어간 구체적 사례로 끝까지 발전시키는 것이 핵심입니다."}, {"id": "ad2", "course": "Environmental Science", "professor": "We have been discussing how governments can reduce household energy consumption. One approach is to raise the price of electricity and gas so that people naturally use less. A very different approach is to fund public education campaigns and clearer appliance labeling so that people make better informed choices. Which strategy would you support, and what makes it more effective in your view?", "students": [{"name": "Elena", "text": "Pricing works faster and it is much harder to ignore. When my city raised water rates last year, my family repaired a leaking tap within days, something we had postponed for months. Information campaigns are easy to tune out, but a higher bill arrives every month."}, {"name": "Omar", "text": "Higher prices worry me because they fall hardest on low income households. A family that already keeps the heating low has almost nothing left to cut, while wealthier households simply pay more and change nothing at all. I would rather invest in labeling and efficiency programs that help people choose better appliances."}], "sample_answer": "I agree with Omar that price increases on their own are unfair, but I do not think education campaigns are strong enough by themselves either. My preference is a rebate program funded by higher rates charged only to very heavy users. Last winter my landlord finally replaced our twenty year old boiler, and he did it only because the city offered to cover half the cost. No amount of labeling would have persuaded him, since he does not pay the heating bill himself, and better information cannot change that incentive. The subsidy did change it, and our monthly gas use dropped by roughly a third. This example shows why a policy has to reach the person who actually makes the purchasing decision. Information tells people what they should do, but money decides whether they are able to act on it.", "tips_ko": "두 학생 의견을 그대로 반복하지 않고 제3의 절충안을 제시하면 사고의 깊이가 드러납니다. 사례에서 누가 비용을 부담하고 누가 결정하는지처럼 구체적 조건을 짚어 주면 논리가 훨씬 단단해집니다."}, {"id": "ad3", "course": "Business Management", "professor": "Let us turn to hiring decisions for new teams. Some managers prefer candidates with long experience in the same industry, arguing that such people contribute from the first week. Other managers deliberately recruit from unrelated fields, believing that outsiders bring approaches insiders would never consider. If you were building a new team from scratch, which type of candidate would you prioritize, and why?", "students": [{"name": "Hana", "text": "I would prioritize industry experience. A new team is under pressure to produce results quickly, and someone who already understands the customers, the regulations, and the common mistakes can save months of training. Creativity is valuable, but it does not help much if the basics are wrong."}, {"name": "Lucas", "text": "I lean toward hiring outsiders, at least for some of the positions. People who have spent fifteen years in one industry often cannot tell which of their habits are actual requirements and which are simply tradition. A mixed team argues more, but it also questions assumptions that insiders stop noticing."}], "sample_answer": "Hana makes a fair point about speed, but I would still prioritize outsiders for most positions on a brand new team. My reason is that experienced insiders tend to rebuild the processes they already know, and a new team is exactly the place where those processes should be questioned. At the logistics company where I worked, the delivery scheduling team was rebuilt with two engineers who came from hospital operations rather than shipping. Within four months they had replaced a spreadsheet system that everyone else treated as normal, because in their previous field the same sorting problem had already been solved with automated triage. Experienced colleagues had complained about that spreadsheet for years without ever imagining an alternative. I would still hire one or two insiders to handle regulations and client relationships, but the majority of the team should come from outside.", "tips_ko": "상대 의견의 타당한 부분을 한 문장으로 인정한 뒤 자신의 입장을 더 강하게 밀어붙이면 설득력이 높아집니다. 결론에서 조건이나 예외를 하나 붙여 주면 단순한 찬반을 넘어선 답변으로 평가됩니다."}]}, "vocab": [{"w": "analyze", "pos": "v", "ko": "분석하다, 검토하다", "fam": "-ize", "forms": ["analysis", "analyst", "analytical", "analytically"], "ex": "Economists analyze historical trade data in order to predict how future tariffs will affect ordinary consumers.", "sub": 1}, {"w": "approach", "pos": "n", "ko": "접근법, 접근하다", "fam": "other", "forms": ["approaches", "approachable", "approaching"], "ex": "The author adopts a comparative approach when examining educational reforms in several developing countries.", "sub": 1}, {"w": "area", "pos": "n", "ko": "지역, 분야", "fam": "other", "forms": ["areas", "subarea"], "ex": "Rainfall in the coastal area has increased steadily since detailed records began in 1900.", "sub": 1}, {"w": "assess", "pos": "v", "ko": "평가하다, 가늠하다", "fam": "other", "forms": ["assessment", "assessor", "assessable"], "ex": "Teachers assess student progress using both written examinations and continuous classroom observation throughout the year.", "sub": 1}, {"w": "assume", "pos": "v", "ko": "가정하다, 맡다", "fam": "other", "forms": ["assumption", "assumed", "assuming"], "ex": "Classical economic models assume that consumers always behave rationally when choosing between competing products.", "sub": 1}, {"w": "authority", "pos": "n", "ko": "권한, 당국", "fam": "-ity", "forms": ["authorities", "authorize", "authoritative", "authorization"], "ex": "The local authority must approve any construction project that alters the historic city center.", "sub": 1}, {"w": "avail orms": ["individually", "individualism", "individuality"], "ex": "Each individual student receives written feedback describing specific strengths and remaining weaknesses.", "sub": 1}, {"w": "interpret", "pos": "v", "ko": "해석하다, 통역하다", "fam": "other", "forms": ["interpretation", "interpreter", "interpretive"], "ex": "Archaeologists interpret ancient burial sites in light of what surviving written records reveal.", "sub": 1}, {"w": "involve", "pos": "v", "ko": "포함하다, 관련시키다", "fam": "other", "forms": ["involvement", "involved", "involving"], "ex": "The experiment will involve two hundred volunteers drawn from three quite different age groups.", "sub": 1}, {"w": "issue", "pos": "n", "ko": "문제, 사안", "fam": "other", "forms": ["issues", "issued", "issuance"], "ex": "Water scarcity has become a pressing political issue throughout the Middle East in recent decades.", "sub": 1}, {"w": "labor", "pos": "n", "ko": "노동, 노동력", "fam": "other", "forms": ["laborer", "laborious", "laboring"], "ex": "Cheap manual labor attracted foreign factories to the coastal region during the 1980s.", "sub": 1}, {"w": "legal", "pos": "adj", "ko": "법률의, 합법적인", "fam": "-al/-ical", "forms": ["legally", "legality", "illegal", "legalize"], "ex": "Immigrants often need legal assistance when applying for permanent residence in another country.", "sub": 1}, {"w": "legislate", "pos": "v", "ko": "법률을 제정하다", "fam": "-ate", "forms": ["legislation", "legislative", "legislature", "legislator"], "ex": "Parliament may legislate against misleading advertising if consumer complaints continue to increase.", "sub": 1}, {"w": "major", "pos": "adj", "ko": "주요한, 중대한", "fam": "other", "forms": ["majority", "majors", "majored"], "ex": "Deforestation is a major cause of species loss in the tropical regions of South America.", "sub": 1}, {"w": "method", "pos": "n", "ko": "방법, 방식", "fam": "other", "forms": ["methodology", "methodical", "methodically"], "ex": "The researchers describe their sampling method in enough detail for <script>
'use strict';
const BANK = JSON.parse(document.getElementById('bank').textContent);

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==='class') n.className=v;
    else if (k==='html') n.innerHTML=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v!==null && v!==undefined) n.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k===null||k===undefined) continue; n.append(k.nodeType? k : document.createTextNode(String(k))); }
  return n;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (arr, n) => shuffle(arr).slice(0,n);
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const wordCount = t => (t.trim().match(/\S+/g)||[]).length;
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const LETTERS = 'ABCD';
const store = {
  get(k,d){ try{ const v=localStorage.getItem('toefl:'+k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('toefl:'+k, JSON.stringify(v)); }catch(e){} }
};
const settings = Object.assign({rate:1.0, voiceM:'', voiceW:'', test1:'2026-10-24', test2:'2026-11-14'}, store.get('settings',{}));
const saveSettings = () => store.set('settings', settings);

function pctToBand(p){
  if (p>=0.92) return 6.0; if (p>=0.84) return 5.5; if (p>=0.74) return 5.0; if (p>=0.64) return 4.5;
  if (p>=0.54) return 4.0; if (p>=0.44) return 3.5; if (p>=0.34) return 3.0; return 2.5;
}
const bandToOld = {6:'115~120',5.5:'107~114',5:'95~106',4.5:'85~94',4:'75~84',3.5:'65~74',3:'55~64',2.5:'45~54'};
function roundHalf(x){ return Math.round(x*2)/2; }

/* ---------- speech synthesis ---------- */
const TTS = {
  voices: [],
  load(){ this.voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); },
  pickVoice(gender){
    const pref = gender==='M' ? settings.voiceM : settings.voiceW;
    if (pref){ const v=this.voices.find(v=>v.name===pref); if (v) return v; }
    const maleNames = /alex|daniel|fred|aaron|evan|tom|arthur|oliver|male|guy|david|mark/i;
    const femaleNames = /samantha|karen|moira|ava|allison|zoe|nicky|susan|female|zira|jenny|aria|google us english|google uk english female/i;
    const us = this.voices.filter(v=>/en[-_]US/i.test(v.lang));
    const pool = us.length? us : this.voices;
    const rx = gender==='M'? maleNames : femaleNames;
    return pool.find(v=>rx.test(v.name)) || this.voices.find(v=>rx.test(v.name)) || pool[0] || this.voices[0] || null;
  },
  speakOne(text, gender, opts){
    return new Promise(res=>{
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pickVoice(gender); if (v) u.voice = v;
      u.rate = opts.rate ?? settings.rate; u.pitch = v && /alex|daniel|fred|aaron|evan|tom|arthur|oliver|male|guy|david|mark/i.test(v.name) ? 1 : (gender==='M'? 0.8 : 1.05);
      u.lang = 'en-US';
      let done=false; const finish=()=>{ if(!done){done=true;res();} };
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
      setTimeout(finish, Math.max(3000, text.length*110/u.rate));
    });
  },
  async speak(text, gender='W', opts={}){
    if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성 합성을 지원하지 않는다. Chrome 또는 Safari를 사용.'); return; }
    // Chrome cuts long utterances after about 15 seconds, so speak sentence by sentence.
    const parts = text.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [text];
    for (const part of parts){ if (this.cancelled) return; const t=part.trim(); if (t) await this.speakOne(t, gender, opts); }
  },
  async speakTurns(turns, onProgress){
    for (let i=0;i<turns.length;i++){ if (this.cancelled) break; onProgress && onProgress(i, turns.length); await this.speak(turns[i].text, turns[i].speaker); await wait(350); }
  },
  stop(){ this.cancelled=true; speechSynthesis.cancel(); setTimeout(()=>this.cancelled=false, 50); }
};
if ('speechSynthesis' in window){ TTS.load(); speechSynthesis.onvoiceschanged = ()=>TTS.load(); }
const wait = ms => new Promise(r=>setTimeout(r,ms));
function beep(freq=880, ms=180){ try{ const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)()); const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=freq; g.gain.value=0.15; o.connect(g); g.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(), ms);}catch(e){} }

/* ---------- recorder ---------- */
const REC = {
  stream:null,
  async ensure(){ if (this.stream) return true; try{ this.stream = await navigator.mediaDevices.getUserMedia({audio:true}); return true; }catch(e){ alert('마이크 권한이 필요하다. 브라우저 주소창의 권한 설정에서 마이크를 허용한 뒤 다시 시도.'); return false; } },
  record(seconds, onTick, ctrl={}){
    return new Promise(async res=>{
      if (!(await this.ensure())) return res({blob:null, text:''});
      const chunks=[]; let mr;
      try { mr = new MediaRecorder(this.stream); } catch(e){ return res({blob:null,text:''}); }
      mr.ondataavailable = e=>{ if (e.data.size) chunks.push(e.data); };
      let recog=null, text='';
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR){ try{ recog = new SR(); recog.lang='en-US'; recog.continuous=true; recog.interimResults=false; recog.onresult = e=>{ for (let i=e.resultIndex;i<e.results.length;i++){ if (e.results[i].isFinal) text += ' ' + e.results[i][0].transcript; } }; recog.onerror=()=>{}; recog.start(); }catch(e){ recog=null; } }
      let left=seconds; onTick && onTick(left);
      const iv = setInterval(()=>{ left--; onTick && onTick(left); if (left<=0) stop(); },1000);
      let stopped=false;
      const stop = ()=>{ if (stopped) return; stopped=true; clearInterval(iv); try{ mr.stop(); }catch(e){} if (recog){ try{ recog.stop(); }catch(e){} } };
      ctrl.stop = stop;
      mr.onstop = async ()=>{ await wait(600); const blob = new Blob(chunks, {type: mr.mimeType||'audio/webm'}); res({blob, text:text.trim()}); };
      mr.start();
    });
  }
};

/* ---------- timer ---------- */
function makeTimer(seconds, node, onEnd){
  let left=seconds, iv=null, paused=false;
  const draw=()=>{ node.textContent = fmt(Math.max(0,left)); node.classList.toggle('low', left<=60); };
  draw();
  const t = {
    start(){ if (iv) return; iv=setInterval(()=>{ if (paused) return; left--; draw(); if (left<=0){ t.stop(); onEnd && onEnd(); } },1000); },
    stop(){ clearInterval(iv); iv=null; },
    pause(){ paused=true; }, resume(){ paused=false; },
    left(){ return left; }, used(){ return seconds-left; }
  };
  return t;
}

/* ---------- MCQ helper ---------- */
function renderQuestions(questions, opts, prefixId){
  const wrap = el('div');
  const groups = questions.map((q,qi)=>{
    const name = `${prefixId}-q${qi}`;
    const qn = el('div',{class:'q'});
    qn.append(el('div',{class:'stem'}, `${qi+1}. ${q.stem}`));
    const opts_ = q.options.map((o,oi)=>{
      const inp = el('input',{type:'radio',name,value:oi});
      const lab = el('label',{class:'opt'}, inp, el('span',{}, `${LETTERS[oi]}. ${o}`));
      return lab;
    });
    opts_.forEach(o=>qn.append(o));
    wrap.append(qn);
    return {q, qn, opts_, name};
  });
  return {
    node: wrap,
    grade(){
      let correct=0; const details=[];
      groups.forEach(g=>{
        const sel = wrap.querySelector(`input[name="${g.name}"]:checked`);
        const chosen = sel? +sel.value : null;
        const ok = chosen===g.q.answer; if (ok) correct++;
        details.push({chosen, answer:g.q.answer, ok});
        g.opts_.forEach((o,oi)=>{ o.querySelector('input').disabled=true; if (oi===g.q.answer) o.classList.add('correct'); else if (oi===chosen) o.classList.add('wrong'); });
        if (g.q.explain_ko) g.qn.append(el('div',{class:'explain'}, (ok?'정답. ':'오답. 정답은 '+LETTERS[g.q.answer]+'. ')+g.q.explain_ko));
      });
      return {correct, total:groups.length, details};
    },
    answered(){ return groups.filter(g=>wrap.querySelector(`input[name="${g.name}"]:checked`)).length; }
  };
}

function taskCTW(item, opts){
  const node = el('div');
  node.append(el('div',{class:'sub'}, `Complete the Words · ${item.topic}`));
  node.append(el('p',{class:'small'}, '문단을 읽고 잘려 나간 단어의 뒷부분을 입력. 앞부분은 주어져 있다. (실제 시험: 문단당 10개, 약 90초)'));
  const p = el('div',{class:'passage'});
  const inputs=[];
  const re=/([A-Za-z'-]+)\{([A-Za-z'-]+)\}/g; let last=0, m;
  while((m=re.exec(item.text))){
    p.append(document.createTextNode(item.text.slice(last, m.index)));
    const inp = el('input',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false',size:Math.max(3,m[2].length), 'aria-label':'missing letters'});
    inp.style.width = (m[2].length*0.72+0.6)+'em';
    inputs.push({inp, hidden:m[2], shown:m[1]});
    p.append(el('span',{class:'gap'}, m[1], inp));
    last = re.lastIndex;
  }
  p.append(document.createTextNode(item.text.slice(last)));
  node.append(p);
  inputs.forEach((g,i)=>{ g.inp.addEventListener('keydown',e=>{ if (e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){ if (inputs[i+1]){ e.preventDefault(); inputs[i+1].inp.focus(); } } }); });
  return {
    node, kind:'reading', label:`Complete the Words: ${item.topic}`,
    grade(){ let c=0; inputs.forEach(g=>{ const ok = norm(g.inp.value)===norm(g.hidden); if (ok) c++; g.inp.disabled=true; g.inp.classList.add(ok?'ok':'ng'); if(!ok) g.inp.parentNode.append(el('span',{class:'ans'}, `→ ${g.shown}${g.hidden}`)); }); return {correct:c,total:inputs.length}; }
  };
}

function similarity(a,b){
  const A=norm(a).split(' ').filter(Boolean), B=norm(b).split(' ').filter(Boolean);
  if (!A.length||!B.length) return 0;
  const m = new Map(); B.forEach(w=>m.set(w,(m.get(w)||0)+1));
  let hit=0; A.forEach(w=>{ if (m.get(w)>0){ hit++; m.set(w,m.get(w)-1);} });
  return hit/Math.max(A.length,B.length);
}

/* ---------- vocabulary (AWL) ---------- */
const VOCAB = (BANK.vocab||[]).slice();
const FAMS = ['-tion/-sion','-ment','-ity','-ness','-ance/-ence','-al/-ical','-ive','-ous','-able/-ible','-ly','-ate','-ize','-ify','-er/-or','-ism','-ent/-ant','other'];
const INTERVALS = [0,1,2,4,8,16,32];
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
const vstate = { get(){ return store.get('vocab',{}); }, set(v){ store.set('vocab',v); } };
function vinfo(st,w){ return st[w] || {box:0,due:null,seen:0,wrong:0}; }
function vGrade(w, ok){
  const st=vstate.get(); const r=vinfo(st,w); r.seen++;
  if (ok){ r.box=Math.min(6,(r.box||0)+1); r.due=addDays(today(), INTERVALS[r.box]); }
  else { r.box=0; r.wrong++; r.due=today(); }
  st[w]=r; vstate.set(st);
}
function vStats(){
  const st=vstate.get(); const t=today();
  const studied = VOCAB.filter(x=>st[x.w]); const due = studied.filter(x=>st[x.w].due && st[x.w].due<=t);
  const newLeft = VOCAB.filter(x=>!st[x.w]);
  const boxes=[0,0,0,0,0,0,0]; studied.forEach(x=>boxes[Math.min(6,st[x.w].box||0)]++);
  return {studied, due, newLeft, boxes, mastered: studied.filter(x=>(st[x.w].box||0)>=4).length};
}
function hlWord(ex, w){
  const re = new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');

}
function famExplain(f){ return {'-tion/-sion':'동사 → 명사 (행위·결과). 관사 뒤, 동사 앞 자리.','-ment':'동사 → 명사. the ~ment of 꼴이 흔함.','-ity':'형용사 → 추상명사.','-ness':'형용사 → 상태 명사.','-ance/-ence':'동사 → 명사. -ant/-ent 형용사와 짝.','-al/-ical':'명사 → 형용사. 명사 앞 또는 be 뒤.','-ive':'동사 → 형용사 (성질).','-ous':'명사 → 형용사 (가득한).','-able/-ible':'동사 → 형용사 (가능). -able이 다수, 라틴 어근은 -ible.','-ly':'형용사 → 부사. 동사·형용사·문장 앞.','-ate':'동사(또는 형용사). 조동사·to 뒤.','-ize':'명사·형용사 → 동사 (되게 하다).','-ify':'동사 (만들다).','-er/-or':'행위자 명사.','-ism':'사상·체계 명사.','-ent/-ant':'형용사 또는 행위자 명사. -ence/-ance 명사와 짝.','other':'접미사 규칙이 없는 기본어. 그대로 외운다.'}[f]||''; }

function runCards(queue, area, onDone){
  let i=0, again=[]; const total=queue.length; let known=0;
  const prog = el('div',{class:'progress'}, el('i',{style:'width:0%'}));
  const holder = el('div');
  area.innerHTML=''; area.append(prog, holder);
  const show=()=>{
    if (i>=queue.length){
      if (again.length){ queue=again; again=[]; i=0; holder.innerHTML=''; holder.append(el('div',{class:'notice'}, `몰랐던 ${queue.length}개를 다시 본다.`)); setTimeout(show,900); return; }
      holder.innerHTML=''; holder.append(el('div',{class:'result good'}, `세션 완료. ${total}장 중 첫 시도에 ${known}장 알았다.`), el('button',{class:'btn mt', onclick:onDone}, '돌아가기')); return;
    }
    const x=queue[i]; prog.firstChild.style.width=Math.round((i/queue.length)*100)+'%';
    const card = el('div',{class:'flash'});
    const st=vstate.get(); const inf=vinfo(st,x.w);
    card.append(el('div',{class:'pos'}, `${x.pos} · ${x.fam} · AWL ${x.sub} · ${inf.seen? '복습 '+inf.seen+'회' : '새 단어'}`));
    card.append(el('div',{class:'word'}, x.w));
    const back = el('div',{class:'hidden'});
    back.append(el('div',{class:'ko'}, x.ko));
    if (x.forms&&x.forms.length) back.append(el('div',{class:'forms'}, '파생: '+x.forms.join(', ')));
    back.append(el('div',{class:'ex'}, hlWord(x.ex, x.w)));
    card.append(back);
    const flip = el('button',{class:'btn sec'}, '뜻 보기');
    const spk = el('button',{class:'btn ghost', onclick:()=>TTS.speak(x.w,'W',{rate:0.9})}, '🔊');
    const yes = el('button',{class:'btn hidden'}, '알아요');
    const no = el('button',{class:'btn sec hidden'}, '몰라요');
    flip.onclick=()=>{ back.classList.remove('hidden'); flip.classList.add('hidden'); yes.classList.remove('hidden'); no.classList.remove('hidden'); };
    yes.onclick=()=>{ vGrade(x.w,true); if (!x._again) known++; i++; show(); };
    no.onclick=()=>{ vGrade(x.w,false); x._again=true; again.push(x); i++; show(); };
    card.append(el('div',{class:'row',style:'justify-content:center;margin-top:8px'}, spk, flip, no, yes));
    holder.innerHTML=''; holder.append(card, el('p',{class:'small center mt'}, `${i+1} / ${queue.length}`));
    const key=e=>{ if (e.key===' '&&!flip.classList.contains('hidden')){ e.preventDefault(); flip.click(); } else if (e.key==='1'&&!no.classList.contains('hidden')) no.click(); else if (e.key==='2'&&!yes.classList.contains('hidden')) yes.click(); };
    document.onkeydown=key;
  };
  show();
}

/* ---------- section band computation ---------- */
function sectionSummary(kind, results){
  if (kind==='reading'||kind==='listening'){
    const c = results.reduce((a,r)=>a+r.correct,0), t = results.reduce((a,r)=>a+r.total,0);
    const p = t? c/t : 0; return {raw:`${c}/${t}`, pct:p, band:pctToBand(p)};
  }
  if (kind==='writing'){
    const bs = results.find(r=>!r.self); const selfs = results.filter(r=>r.self);
    const bsP = bs? bs.correct/bs.total : 0; const selfP = selfs.length? selfs.reduce((a,r)=>a+r.correct,0)/selfs.length : 0;
    const p = bs? bsP*0.4 + selfP*0.6 : selfP; return {raw:`문장 ${bs? bs.correct+'/'+bs.total : '-'} · 자기채점 ${Math.round(selfP*100)}%`, pct:p, band:pctToBand(p)};
  }
  if (kind==='speaking'){
    const done = results.filter(r=>!r.skipped); const p = done.length? done.reduce((a,r)=>a+r.correct,0)/done.length : 0;
    return {raw: done.length? `자기채점 ${Math.round(p*100)}%` : '미실시', pct:p, band: done.length? pctToBand(p) : null};
  }
}
